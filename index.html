        class DBRepository {
            static load() {
                try {
                    const rawData = localStorage.getItem(STORAGE_KEY);
                    if (!rawData) return DEFAULT_DATA;
                    const parsed = JSON.parse(rawData);
                    if (!parsed.patrimonio) parsed.patrimonio = DEFAULT_DATA.patrimonio;
                    if (!parsed.estoque) parsed.estoque = DEFAULT_DATA.estoque;
                    if (!parsed.financeiro) parsed.financeiro = DEFAULT_DATA.financeiro;
                    if (!parsed.moradores) parsed.moradores = DEFAULT_DATA.moradores;
                    if (!parsed.fornecedores) parsed.fornecedores = DEFAULT_DATA.fornecedores;
                    if (!parsed.documentos) parsed.documentos = DEFAULT_DATA.documentos;
                    return parsed;
                } catch (e) { return DEFAULT_DATA; }
            }

            static save(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    return true;
                } catch (e) {
                    alert('Aviso: Limite de armazenamento excedido.');
                    return false;

        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function salvarDados(data) { DBRepository.save(data); }

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) {
                tabsState.openTabs.push(moduloId);
            }
            tabsState.activeTab = moduloId;
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;

            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) {
                tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            }
            renderApp();
        }

        function setDashPreset(preset) {
            dashFiltros.preset = preset;
            const hoje = new Date();

            if (preset === 'hoje') {
                const str = hoje.toISOString().split('T')[0];
                dashFiltros.dtIni = str;
                dashFiltros.dtFim = str;
            } else if (preset === 'semana') {
                const diaSemana = hoje.getDay();
                const primeiroDia = new Date(hoje);
                primeiroDia.setDate(hoje.getDate() - diaSemana);
                const ultimoDia = new Date(hoje);
                ultimoDia.setDate(hoje.getDate() + (6 - diaSemana));
                dashFiltros.dtIni = primeiroDia.toISOString().split('T')[0];
                dashFiltros.dtFim = ultimoDia.toISOString().split('T')[0];
            } else if (preset === 'mes') {
                const primeiroDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
                const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
                dashFiltros.dtIni = primeiroDia.toISOString().split('T')[0];
                dashFiltros.dtFim = ultimoDia.toISOString().split('T')[0];
            } else if (preset === 'ano') {
                dashFiltros.dtIni = `${hoje.getFullYear()}-01-01`;
                dashFiltros.dtFim = `${hoje.getFullYear()}-12-31`;
            } else {
                dashFiltros.dtIni = '';
                dashFiltros.dtFim = '';
            }
            renderApp();
        }

        function processarUploadBase64(event, targetImgId, callbackBase64Name) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                if (file.type.startsWith('image/')) {
                    comprimirImagem(e.target.result, 800, 0.7, (compressedBase64) => {
                        tempBase64 = compressedBase64;
                        if (targetImgId) {
                            const imgEl = document.getElementById(targetImgId);
                            if (imgEl) { imgEl.src = tempBase64; imgEl.classList.remove('hidden'); }
                        }
                    });
                } else {
                    tempBase64 = e.target.result;
                    if (callbackBase64Name) {
                        const lbl = document.getElementById(callbackBase64Name);
                        if (lbl) lbl.innerText = file.name;
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function comprimirImagem(base64Str, maxWidth, quality, callback) {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        }

            const pendenteReceber = finLista.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((acc, c) => acc + Number(c.valor), 0);

        function renderDashboardCharts() {
            const ctxFluxo = document.getElementById('chartFluxo');
            const ctxDespesas = document.getElementById('chartDespesas');

            if (chartFluxoInstance) chartFluxoInstance.destroy();
            if (chartDespesasInstance) chartDespesasInstance.destroy();

            let finLista = db.financeiro || [];

            if (dashFiltros.dtIni) finLista = finLista.filter(f => f.vencimento >= dashFiltros.dtIni);
            if (dashFiltros.dtFim) finLista = finLista.filter(f => f.vencimento <= dashFiltros.dtFim);

            const recVal = finLista.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((a, b) => a + Number(b.valor), 0);
            const despVal = finLista.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((a, b) => a + Number(b.valor), 0);

            if (ctxFluxo) {
                chartFluxoInstance = new Chart(ctxFluxo, {
                    type: 'line',
                    data: {
                        labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
                        datasets: [
                            { label: 'Receitas (R$)', data: [recVal * 0.3, recVal * 0.6, recVal * 0.8, recVal || 1000], borderColor: '#0d9488', backgroundColor: 'rgba(13, 148, 136, 0.1)', tension: 0.4, fill: true, borderWidth: 3 },
                            { label: 'Despesas (R$)', data: [despVal * 0.2, despVal * 0.5, despVal * 0.7, despVal || 500], borderColor: '#e11d48', backgroundColor: 'rgba(225, 29, 72, 0.05)', tension: 0.4, fill: true, borderWidth: 3 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });
            }

            if (ctxDespesas) {
                chartDespesasInstance = new Chart(ctxDespesas, {
                    type: 'doughnut',
                    data: {
                        labels: ['Manutenção Elevadores', 'Energia Elétrica', 'Limpeza & Piscina', 'Outros'],
                        datasets: [{ data: [despVal * 0.4 || 3200, despVal * 0.3 || 4150, despVal * 0.2 || 1800, despVal * 0.1 || 1200], backgroundColor: ['#0f766e', '#f59e0b', '#0284c7', '#64748b'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });
            }
        }

                        </div>
                        <form onsubmit="salvarEstoqueForm(event, '${itemId || ''}')" class="p-6 space-y-3">
                            <div><label class="block text-xs font-bold uppercase mb-1">Nome do Produto</label><input type="text" id="est_item" required value="${e ? escapeHTML(e.item) : ''}" placeholder="Ex: Lâmpada LED 18W" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Código de Barras</label>
                                <div class="flex gap-2">
                                    <input type="text" id="est_barcode" value="${e ? escapeHTML(e.codigoBarras || '') : ''}" placeholder="EAN / Código..." class="w-full p-2.5 border rounded-xl text-xs font-bold font-mono">
                                    <button type="button" onclick="abrirModalScannerBarcode('est_barcode')" class="px-3 py-2 bg-slate-800 text-teal-400 rounded-xl font-bold text-xs"><i class="fa-solid fa-barcode"></i> Câmera</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-bold uppercase mb-1">Qtd Atual</label><input type="number" id="est_qtd" required value="${e ? e.qtd : 10}" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                                <div><label class="block text-xs font-bold uppercase mb-1">Qtd Mínima</label><input type="number" id="est_min" required value="${e ? e.minimo : 5}" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_est')" class="px-3 py-2 bg-slate-200 rounded-xl text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold shadow">Salvar Produto</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarEstoqueForm(ev, itemId = '') {
            ev.preventDefault();
            const item = document.getElementById('est_item').value.trim();
            const codigoBarras = document.getElementById('est_barcode').value.trim();
            const qtd = parseInt(document.getElementById('est_qtd').value) || 0;
            const min = parseInt(document.getElementById('est_min').value) || 0;

            if (itemId) {
                const e = db.estoque.find(x => x.id === itemId);
                if (e) { e.item = item; e.codigoBarras = codigoBarras; e.qtd = qtd; e.minimo = min; }
            } else {
                db.estoque.push({ id: 'est_' + Date.now(), item, codigoBarras, categoria: 'Geral', qtd, minimo: min });
            }

            salvarDados(db); fecharModal('modal_est'); renderApp();
        }

        function renderModalPatrimonio(patId = null) {
            const p = patId ? db.patrimonio.find(x => x.id === patId) : null;
            const html = `
                <div id="modal_pat" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm"><i class="fa-solid fa-couch text-teal-400 mr-2"></i> ${p ? 'Editar Bem' : 'Inserir Novo Bem Patrimonial'}</h3>
                            <button onclick="fecharModal('modal_pat')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarPatrimonioForm(event, '${patId || ''}')" class="p-6 space-y-3">
                            <div><label class="block text-xs font-bold uppercase mb-1">Cód. Tombamento</label><input type="text" id="pat_tomb" required value="${p ? escapeHTML(p.tombamento) : 'PAT-' + Math.floor(100 + Math.random() * 900)}" class="w-full p-2.5 border rounded-xl text-xs font-bold font-mono"></div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Nome do Bem</label><input type="text" id="pat_nome" required value="${p ? escapeHTML(p.nome) : ''}" placeholder="Ex: Sofá Hall de Entrada" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Localização</label><input type="text" id="pat_loc" required value="${p ? escapeHTML(p.localizacao) : ''}" placeholder="Ex: Salão de Festas" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_pat')" class="px-3 py-2 bg-slate-200 rounded-xl text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold shadow">Salvar Bem</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarPatrimonioForm(e, patId = '') {
            e.preventDefault();
            const tombamento = document.getElementById('pat_tomb').value.trim();
            const nome = document.getElementById('pat_nome').value.trim();
            const localizacao = document.getElementById('pat_loc').value.trim();

            if (patId) {
                const p = db.patrimonio.find(x => x.id === patId);
                if (p) { p.tombamento = tombamento; p.nome = nome; p.localizacao = localizacao; }
            } else {
                db.patrimonio.push({ id: 'pat_' + Date.now(), tombamento, conservacao: 'Bom', nome, localizacao });
            }

            salvarDados(db); fecharModal('modal_pat'); renderApp();
        }

        function renderModalDocumento() {
            tempBase64 = '';
            const html = `
                <div id="modal_doc" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm"><i class="fa-solid fa-file-arrow-up text-teal-400 mr-2"></i> Inserir Novo Documento</h3>
                            <button onclick="fecharModal('modal_doc')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarDocumentoForm(event)" class="p-6 space-y-3">
                            <div><label class="block text-xs font-bold uppercase mb-1">Título do Documento</label><input type="text" id="doc_titulo" required placeholder="Ex: Ata de Assembleia Geral 2026" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Pasta / Categoria</label>
                                <select id="doc_pasta" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-white">
                                    <option value="Atas de Assembleia">Atas de Assembleia</option>
                                    <option value="Contratos & Prestadores">Contratos & Prestadores</option>
                                    <option value="Convenção & Regimento">Convenção & Regimento</option>
                                    <option value="Financeiro & Balancetes">Financeiro & Balancetes</option>
                                </select>
                            </div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Data</label><input type="date" id="doc_data" required value="${new Date().toISOString().split('T')[0]}" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Observações</label><input type="text" id="doc_obs" placeholder="Observações adicionais..." class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_doc')" class="px-3 py-2 bg-slate-200 rounded-xl text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold shadow">Salvar Documento</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarDocumentoForm(e) {
            e.preventDefault();
            const titulo = document.getElementById('doc_titulo').value.trim();
            const pasta = document.getElementById('doc_pasta').value;
            const data = document.getElementById('doc_data').value;
            const observacao = document.getElementById('doc_obs').value.trim();

            db.documentos.push({ id: 'doc_' + Date.now(), titulo, pasta, data, observacao });
            salvarDados(db); fecharModal('modal_doc'); renderApp();
        }

        function excluirDocumento(id) {
            if (confirm('Deseja excluir este documento?')) {
                db.documentos = db.documentos.filter(x => x.id !== id);
                salvarDados(db); renderApp();
            }
        }

        function renderModalMorador() {
            const html = `
                <div id="modal_mor" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm"><i class="fa-solid fa-user-plus text-teal-400 mr-2"></i> Inserir Novo Morador</h3>
                            <button onclick="fecharModal('modal_mor')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarMoradorForm(event)" class="p-6 space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-bold uppercase mb-1">Bloco</label><input type="text" id="mor_bloco" required placeholder="A" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                                <div><label class="block text-xs font-bold uppercase mb-1">Apartamento</label><input type="text" id="mor_apto" required placeholder="101" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            </div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Nome do Residente</label><input type="text" id="mor_nome" required placeholder="Ex: Carlos Eduardo" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Telefone / WhatsApp</label><input type="text" id="mor_tel" required placeholder="(41) 99999-0000" class="w-full p-2.5 border rounded-xl text-xs font-bold"></div>
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Tipo de Residente</label>
                                <select id="mor_tipo" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-white">
                                    <option value="Proprietário">Proprietário</option>
                                    <option value="Inquilino">Inquilino</option>
                                </select>
                            </div>
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_mor')" class="px-3 py-2 bg-slate-200 rounded-xl text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold shadow">Salvar Morador</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarMoradorForm(e) {
            e.preventDefault();
            const bloco = document.getElementById('mor_bloco').value.trim();
            const apartamento = document.getElementById('mor_apto').value.trim();
            const nome = document.getElementById('mor_nome').value.trim();
            const telefone = document.getElementById('mor_tel').value.trim();
            const tipo = document.getElementById('mor_tipo').value;

            db.moradores.push({ id: 'mor_' + Date.now(), bloco, apartamento, nome, telefone, tipo });
            salvarDados(db); fecharModal('modal_mor'); renderApp();
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function iniciarAplicacao() { renderApp(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarAplicacao);
        else iniciarAplicacao();
    </script>
</body>
</html>
