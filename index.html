        async function carregarDadosDaNuvem() {
            const elStatus = document.getElementById('status-nuvem');
            try {
                const { data, error } = await supabaseClient
                    .from('condominio_dados')
                    .select('payload')
                    .eq('id', 'principal')
                    .maybeSingle();

                if (data && data.payload) {
                    db = data.payload;
                    if (!db.plano_contas) db.plano_contas = DEFAULT_DATA.plano_contas;
                    if (!db.acertos_estoque) db.acertos_estoque = [];
                    if (!db.formas_monetarias) db.formas_monetarias = DEFAULT_DATA.formas_monetarias;
                    if (!db.contas_bancarias) db.contas_bancarias = DEFAULT_DATA.contas_bancarias;
                    if (!db.categorias) db.categorias = DEFAULT_DATA.categorias;
                    if (!db.conselheiros) db.conselheiros = [];
                    localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));
                    if (elStatus) {
                        elStatus.className = "bg-emerald-600 text-white text-[10px] sm:text-xs font-bold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 shadow-inner";
                        elStatus.innerHTML = `<i class="fa-solid fa-cloud-arrow-down"></i> Sincronizado com o Supabase com Sucesso!`;
                    }
                } else {
                    await salvarDadosNaNuvem(db);
                }

                supabaseClient
                    .channel('mudancas-condominio')
                    .on(
                        'postgres_changes',
                        { event: '*', schema: 'public', table: 'condominio_dados', filter: 'id=eq.principal' },
                        (payload) => {
                            if (payload.new && payload.new.payload) {
                                db = payload.new.payload;
                                if (!db.plano_contas) db.plano_contas = DEFAULT_DATA.plano_contas;
                                if (!db.acertos_estoque) db.acertos_estoque = [];
                                localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));
                                renderMainOnly();
                            }
                        }
                    )
                    .subscribe();
            } catch (err) {
                if (elStatus) {
                    elStatus.className = "bg-amber-600 text-white text-[10px] sm:text-xs font-bold py-1.5 px-4 text-center no-print shadow-inner";
                    elStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> A utilizar armazenamento local.`;
                }
            }
            renderApp();
        }

        async function salvarDadosNaNuvem(dataObj) {
            db = dataObj;
            localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));

            const elStatus = document.getElementById('status-nuvem');
            if (elStatus) {
                elStatus.className = "bg-teal-500 text-white text-[10px] sm:text-xs font-bold py-1.5 px-4 text-center no-print animate-pulse shadow-inner";
                elStatus.innerHTML = `<i class="fa-solid fa-rotate fa-spin"></i> A guardar na nuvem...`;
            }

            try {
                const { error } = await supabaseClient
                    .from('condominio_dados')
                    .upsert({ id: 'principal', payload: db, atualizado_em: new Date() });

                if (error) throw error;

                if (elStatus) {
                    elStatus.className = "bg-emerald-600 text-white text-[10px] sm:text-xs font-bold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 shadow-inner";
                    elStatus.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Sincronizado com a Nuvem em Tempo Real`;
                }
            } catch (err) {
                if (elStatus) {
                    elStatus.className = "bg-amber-600 text-white text-[10px] sm:text-xs font-bold py-1.5 px-4 text-center no-print shadow-inner";
                    elStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Guardado localmente (Erro na nuvem)`;
                }
            }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) { alert('Não há dados disponíveis.'); return; }
            const keys = Object.keys(dados[0]);
            let csvContent = '\uFEFF' + keys.join(',') + '\n';
            dados.forEach(row => {
                const values = keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`);
                csvContent += values.join(',') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function restaurarBackupGeralJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && parsed.condominio) {
                        db = parsed;
                        salvarDados(db);
                        alert('Backup restaurado com sucesso!');
                        renderApp();
                    } else { alert('Ficheiro de backup inválido.'); }
                } catch (err) { alert('Erro ao ler o ficheiro.'); }
            };
            reader.readAsText(file);
        }

        function importarPlanilhaMoradores(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const texto = e.target.result;
                    const linhas = texto.split(/\r\n|\n/);
                    if (linhas.length < 2) { alert('A planilha está vazia.'); return; }

                    const cabecalho = linhas[0].split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim().toLowerCase());
                    const idxBloco = cabecalho.findIndex(h => h.includes('bloco') || h.includes('bl'));
                    const idxAp = cabecalho.findIndex(h => h.includes('ap') || h.includes('unidade') || h.includes('casa'));
                    const idxNome = cabecalho.findIndex(h => h.includes('nome') || h.includes('morador'));
                    const idxEmail = cabecalho.findIndex(h => h.includes('email'));
                    const idxTel = cabecalho.findIndex(h => h.includes('tel') || h.includes('cel') || h.includes('fone'));
                    const idxCpf = cabecalho.findIndex(h => h.includes('cpf'));
                    const idxPet = cabecalho.findIndex(h => h.includes('pet'));
                    const idxVaga = cabecalho.findIndex(h => h.includes('vaga') || h.includes('garagem'));

                    let importados = 0;
                    if (!db.moradores) db.moradores = [];

                    for (let i = 1; i < linhas.length; i++) {
                        const linha = linhas[i].trim();
                        if (!linha) continue;
                        const cols = linha.split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim());
                        db.moradores.push({
                            id: 'mor_imp_' + Date.now() + '_' + i,
                            bloco: idxBloco !== -1 ? (cols[idxBloco] || '1') : '1',
                            apartamento: idxAp !== -1 ? (cols[idxAp] || '') : '',
                            nome: idxNome !== -1 ? (cols[idxNome] || 'Sem Nome') : 'Sem Nome',
                            email: idxEmail !== -1 ? (cols[idxEmail] || '') : '',
                            telefone: idxTel !== -1 ? (cols[idxTel] || '') : '',
                            cpf: idxCpf !== -1 ? (cols[idxCpf] || '') : '',
                            petNome: idxPet !== -1 ? (cols[idxPet] || '') : '',
                            vagaGaragem: idxVaga !== -1 ? (cols[idxVaga] || '') : ''
                        });
                        importados++;
                    }
                    if (importados > 0) {
                        salvarDados(db);
                        alert(`${importados} moradores importados com sucesso!`);
                        renderMainOnly();
                    }
                } catch (err) { alert('Erro ao processar planilha.'); }
            };
            reader.readAsText(file);
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim().toLowerCase();
            const senhaInput = document.getElementById('login_pass').value;
            
            const userFound = (db.usuarios || []).find(u => 
                (u.usuario && u.usuario.toLowerCase() === userInput) || 
                (u.email && u.email.toLowerCase() === userInput)
            );

            if (userFound && userFound.senhaHash === senhaInput) {
                if (userFound.status === 'Inativo') { alert('Utilizador inativo.'); return; }
                if (userFound.primeiroAcesso) {
                    usuarioPendentePrimeiroAcesso = userFound;
                    renderApp();
                    return;
                }
                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                renderApp();
            } else { alert('Credenciais incorretas!'); }
        }

        function concluirPrimeiroAcesso(e) {
            e.preventDefault();
            const s1 = document.getElementById('prim_senha_nova').value;
            const s2 = document.getElementById('prim_senha_conf').value;
            if (s1.length < 6) { alert('A palavra-passe deve ter pelo menos 6 caracteres.'); return; }
            if (s1 !== s2) { alert('As palavras-passe não coincidem.'); return; }

            const userIndex = (db.usuarios || []).findIndex(u => u.id === usuarioPendentePrimeiroAcesso.id);
            if (userIndex !== -1) {
                db.usuarios[userIndex].senhaHash = s1;
                db.usuarios[userIndex].primeiroAcesso = false;
                salvarDados(db);
                sessao.usuarioLogado = db.usuarios[userIndex];
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(sessao.usuarioLogado)); } catch (err) {}
                usuarioPendentePrimeiroAcesso = null;
                alert('Palavra-passe alterada com sucesso!');
                renderApp();
            }
        }

        function initDashboardCharts() {
            const ctx1 = document.getElementById('chartReceitaDespesa');

            let totalReceber = 0, totalPagar = 0;
            finList.forEach(f => {
                const val = parseFloat(f.valor) || 0;
                if (f.tipo === 'Receber') totalReceber += val; else totalPagar += val;
            });
            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['A Receber', 'A Pagar', 'Saldo Líquido'],
                    datasets: [{ data: [totalReceber, totalPagar, totalReceber - totalPagar], backgroundColor: ['#0d9488', '#f43f5e', '#3b82f6'], borderRadius: 10 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

            moradoresSelecionados = source.checked ? moradoresFiltrados.map(m => m.id) : [];
            renderMainOnly();

            const idx = moradoresSelecionados.indexOf(id);

            renderMainOnly();
        }

            if (moradoresSelecionados.length === 0 || !confirm(`Excluir ${moradoresSelecionados.length} moradores?`)) return;
            db.moradores = (db.moradores || []).filter(m => !moradoresSelecionados.includes(m.id));

            salvarDados(db); renderMainOnly();

            abrirModalContainer(`<div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4"><h3 class="font-bold text-lg text-slate-800">Novo Fornecedor</h3><form onsubmit="event.preventDefault(); db.fornecedores.push({id:'for_'+Date.now(), cnpj:document.getElementById('f_cnpj').value, razaoSocial:document.getElementById('f_rz').value}); salvarDados(db); fecharModalContainer(); renderMainOnly();" class="space-y-3 text-xs"><div><label class="block font-bold uppercase text-slate-600 mb-1">CNPJ</label><input type="text" id="f_cnpj" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div><label class="block font-bold uppercase text-slate-600 mb-1">Razão Social</label><input type="text" id="f_rz" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl font-bold">Salvar</button></div></form></div></div>`);

        }
        function renderModalCategoria() {
            abrirModalContainer(`<div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4"><h3 class="font-bold text-lg text-slate-800">Nova Pasta</h3><form onsubmit="event.preventDefault(); db.categorias.push({id:'cat_'+Date.now(), nome:document.getElementById('cat_nome').value}); salvarDados(db); fecharModalContainer(); renderMainOnly();" class="space-y-3 text-xs"><div><label class="block font-bold uppercase text-slate-600 mb-1">Nome</label><input type="text" id="cat_nome" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl font-bold">Salvar</button></div></form></div></div>`);
        }

        function renderEstoqueView() {
            const list = db.estoque || [];
            return `<div class="bg-white rounded-2xl border shadow-sm overflow-x-auto w-full"><table class="w-full text-left text-xs"><thead class="bg-slate-800 text-white"><tr><th class="p-3">Etiqueta</th><th class="p-3">Item</th><th class="p-3">Qtd Atual</th><th class="p-3 text-center">Ações</th></tr></thead><tbody class="divide-y">${list.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-slate-400">Nenhum item em estoque.</td></tr>` : list.map(st => `<tr><td class="p-3 font-mono">${escapeHTML(st.etiqueta||'-')}</td><td class="p-3 font-bold">${escapeHTML(st.item)}</td><td class="p-3 font-mono font-bold">${st.quantidade||0}</td><td class="p-3 text-center"><button onclick="excluirRegistro('estoque','${st.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        }
        function renderModalEstoque() {
            abrirModalContainer(`<div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4"><h3 class="font-bold text-lg text-slate-800">Novo Item no Estoque</h3><form onsubmit="event.preventDefault(); db.estoque.push({id:'est_'+Date.now(), etiqueta:document.getElementById('est_etiq').value, item:document.getElementById('est_item').value, quantidade:parseInt(document.getElementById('est_qtd').value)||0}); salvarDados(db); fecharModalContainer(); renderMainOnly();" class="space-y-3 text-xs"><div><label class="block font-bold uppercase text-slate-600 mb-1">Etiqueta</label><input type="text" id="est_etiq" class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div><label class="block font-bold uppercase text-slate-600 mb-1">Descrição</label><input type="text" id="est_item" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div><label class="block font-bold uppercase text-slate-600 mb-1">Quantidade</label><input type="number" id="est_qtd" required value="1" class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl font-bold">Salvar</button></div></form></div></div>`);
        }

        function renderAcertoEstoqueView() {
            const list = db.acertos_estoque || [];
            return `<div class="bg-white rounded-2xl border shadow-sm overflow-x-auto w-full"><table class="w-full text-left text-xs"><thead class="bg-slate-800 text-white"><tr><th class="p-3">Data</th><th class="p-3">Tipo</th><th class="p-3">Item</th><th class="p-3">Qtd</th><th class="p-3">Motivo</th></tr></thead><tbody class="divide-y">${list.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhum acerto de estoque.</td></tr>` : list.slice().reverse().map(ac => `<tr><td class="p-3 font-mono">${escapeHTML(ac.data)}</td><td class="p-3"><span class="px-2 py-0.5 rounded font-bold ${ac.tipo==='Entrada'?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}">${escapeHTML(ac.tipo)}</span></td><td class="p-3 font-bold">${escapeHTML(ac.nomeItem)}</td><td class="p-3 font-mono font-bold">${ac.quantidade}</td><td class="p-3 font-semibold text-teal-700">${escapeHTML(ac.motivo)}</td></tr>`).join('')}</tbody></table></div>`;
        }
        function renderModalAcertoEstoque() {
            const estoqueList = db.estoque || [];
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-bold text-lg text-slate-800">Novo Acerto de Estoque</h3>
                        <form onsubmit="salvarAcertoEstoque(event)" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Produto</label><select id="m_ac_itemId" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"><option value="">[ Selecione ]</option>${estoqueList.map(st => `<option value="${st.id}">${escapeHTML(st.item)} (Atual: ${st.quantidade||0})</option>`).join('')}</select></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Tipo</label><select id="m_ac_tipo" class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"><option value="Entrada">Entrada (+)</option><option value="Saída">Saída (-)</option></select></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Quantidade</label><input type="number" min="1" id="m_ac_qtd" required value="1" class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Motivo</label><input type="text" id="m_ac_motivo" required placeholder="Ex: Inventário, Avaria..." class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div>
                            <div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl font-bold">Confirmar</button></div>
                        </form>
                    </div>
                </div>
            `);
        }
        function salvarAcertoEstoque(e) {
            e.preventDefault();
            const itemId = document.getElementById('m_ac_itemId').value;
            const tipo = document.getElementById('m_ac_tipo').value;
            const quantidade = parseInt(document.getElementById('m_ac_qtd').value) || 0;
            const motivo = document.getElementById('m_ac_motivo').value.trim();
            const itemEstoque = (db.estoque || []).find(x => x.id === itemId);
            if (!itemEstoque) { alert('Selecione um produto.'); return; }

            let qtdAtual = parseInt(itemEstoque.quantidade || 0);
            if (tipo === 'Entrada') qtdAtual += quantidade;
            else {
                if (quantidade > qtdAtual) { alert('Quantidade superior ao estoque atual.'); return; }
                qtdAtual -= quantidade;
            }
            itemEstoque.quantidade = qtdAtual;
            if (!db.acertos_estoque) db.acertos_estoque = [];
            db.acertos_estoque.push({ id: 'ac_' + Date.now(), data: new Date().toLocaleString('pt-BR'), itemId: itemEstoque.id, nomeItem: itemEstoque.item, tipo, quantidade, motivo });
            salvarDados(db); fecharModalContainer(); alert('Acerto realizado com sucesso!'); renderMainOnly();
        }

        // =========================================================================
        // DOCUMENTOS & UTILIZADORES
        // =========================================================================
        function renderDocumentosView() {
            const docs = db.documentos || [];
            return `<div class="bg-white rounded-2xl border shadow-sm overflow-x-auto w-full"><table class="w-full text-left text-xs"><thead class="bg-slate-800 text-white"><tr><th class="p-3">Título</th><th class="p-3">Ficheiro</th><th class="p-3 text-center">Ações</th></tr></thead><tbody class="divide-y">${docs.length === 0 ? `<tr><td colspan="3" class="p-6 text-center text-slate-400">Nenhum documento.</td></tr>` : docs.map(d => `<tr><td class="p-3 font-bold">${escapeHTML(d.titulo)}</td><td class="p-3 font-mono">${escapeHTML(d.nomeArquivo)}</td><td class="p-3 text-center"><button onclick="excluirRegistro('documentos','${d.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        }
        function renderModalDocumento() {
            abrirModalContainer(`<div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4"><h3 class="font-bold text-lg text-slate-800">Inserir Documento</h3><form onsubmit="event.preventDefault(); db.documentos.push({id:'doc_'+Date.now(), titulo:document.getElementById('doc_titulo').value, nomeArquivo:'documento.pdf'}); salvarDados(db); fecharModalContainer(); renderMainOnly();" class="space-y-3 text-xs"><div><label class="block font-bold uppercase text-slate-600 mb-1">Título</label><input type="text" id="doc_titulo" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl font-bold">Salvar</button></div></form></div></div>`);
        }

        function renderUsuariosView() {
            const users = db.usuarios || [];
            return `<div class="bg-white rounded-2xl border shadow-sm overflow-x-auto w-full"><table class="w-full text-left text-xs"><thead class="bg-slate-800 text-white"><tr><th class="p-3">Utilizador / Nome</th><th class="p-3">Cargo</th><th class="p-3 text-center">Ações</th></tr></thead><tbody class="divide-y">${users.map(u => `<tr><td class="p-3 font-bold">${escapeHTML(u.usuario)} (${escapeHTML(u.nome)})</td><td class="p-3">${escapeHTML(u.cargo||u.perfil)}</td><td class="p-3 text-center"><button onclick="excluirRegistro('usuarios','${u.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        }
        function renderModalUsuario() {
            abrirModalContainer(`<div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4"><h3 class="font-bold text-lg text-slate-800">Novo Utilizador</h3><form onsubmit="event.preventDefault(); db.usuarios.push({id:'usr_'+Date.now(), usuario:document.getElementById('u_user').value, nome:document.getElementById('u_nome').value, cargo:'Operador', senhaHash:'123456', primeiroAcesso:true, status:'Ativo'}); salvarDados(db); fecharModalContainer(); renderMainOnly();" class="space-y-3 text-xs"><div><label class="block font-bold uppercase text-slate-600 mb-1">Login</label><input type="text" id="u_user" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div><label class="block font-bold uppercase text-slate-600 mb-1">Nome</label><input type="text" id="u_nome" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50"></div><div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 rounded-xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl font-bold">Salvar</button></div></form></div></div>`);
        }

        function renderRelatoriosCentralView() {
            return `<div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4"><h3 class="font-black text-slate-800 text-lg uppercase"><i class="fa-solid fa-file-invoice-dollar mr-2 text-teal-600"></i> Demonstrativo do Resultado (DRE Dinâmico)</h3><p class="text-xs text-slate-600">Os relatórios calculam os saldos automaticamente com base nas Contas a Pagar/Receber registadas.</p></div>`;
        }

        function excluirRegistro(col, id) {
            if (!confirm('Deseja eliminar este registo?')) return;
            if (db[col]) {
                db[col] = db[col].filter(x => x.id !== id);
                salvarDados(db); renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
