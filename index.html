<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Completa em Nuvem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Pako (Compressão Gzip para arquivos grandes) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Supabase JS Client para Banco de Dados na Nuvem -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
                            400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
                            800: '#115e59', 900: '#134e4a', 950: '#042f2e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 2px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .sidebar-full { height: 100vh; position: sticky; top: 0; }
        .card-modern { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(226, 232, 240, 0.8); }
        .card-modern:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08); }
        
        /* Estilos dos Pets Virtuais */
        @keyframes andarCachorro {
            0% { transform: translateX(-100px); }
            50% { transform: translateX(calc(100vw - 100px)); transform-style: preserve-3d; }
            100% { transform: translateX(-100px); }
        }
        .animar-cao { animation: andarCachorro 3s linear infinite; }
        
        @keyframes flutuarGato {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .pet-gato-flutuante { animation: flutuarGato 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <!-- Indicador de Status da Nuvem -->
    <div id="status-nuvem" class="bg-slate-900 text-teal-400 text-[11px] font-semibold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 border-b border-slate-800 shadow-sm">
        <i class="fa-solid fa-cloud animate-pulse"></i> A ligar ao Supabase na Nuvem...
    </div>

    <!-- Animação do Cãozinho (Login) -->
    <div id="overlay-cao-login" class="fixed inset-0 bg-slate-950/90 z-[99] flex flex-col items-center justify-center hidden">
        <div class="text-center space-y-4">
            <div class="text-teal-400 text-6xl animar-cao"><i class="fa-solid fa-dog"></i></div>
            <p class="text-white font-extrabold text-sm tracking-widest uppercase animate-pulse">O cãozinho está a abrir o sistema...</p>
        </div>
    </div>

    <div id="app" class="flex-1 flex flex-col min-h-screen w-full"></div>
    <div id="modal-container"></div>

    <!-- Assistente Virtual Gatinho (Chat Flutuante) -->
    <div id="widget-gato-assistente" class="fixed bottom-6 right-6 z-50 hidden no-print">
        <div id="janela-chat-gato" class="hidden absolute bottom-16 right-0 w-80 bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
            <div class="bg-slate-950 text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center text-white"><i class="fa-solid fa-cat"></i></div>
                    <div>
                        <h4 class="font-extrabold text-xs">Assistente Felino</h4>
                        <p class="text-[9px] text-teal-400 font-bold uppercase tracking-wider">Pronto para ajudar</p>
                    </div>
                </div>
                <button onclick="toggleChatGato()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <div id="historico-chat-gato" class="p-3.5 space-y-3 h-64 overflow-y-auto text-xs bg-slate-50/70">
                <div class="bg-teal-50 text-teal-900 p-3 rounded-2xl border border-teal-100">
                    Olá! Sou o seu assistente gatinho 🐾. Como posso ajudar com relatórios ou dados do condomínio hoje?
                </div>
            </div>
            <div class="p-3 bg-white border-t border-slate-100 flex gap-2">
                <input type="text" id="input-pergunta-gato" onkeypress="if(event.key==='Enter') enviarMensagemGato()" placeholder="Ex: saldo, moradores, estoque..." class="flex-1 p-2.5 border rounded-xl text-xs bg-slate-50 outline-none">
                <button onclick="enviarMensagemGato()" class="px-3.5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
        <button onclick="toggleChatGato()" class="w-14 h-14 bg-gradient-to-tr from-teal-600 to-emerald-500 rounded-full shadow-2xl flex items-center justify-center text-white text-2xl hover:scale-105 transition-transform pet-gato-flutuante border-2 border-white" title="Assistente Gatinho">
            <i class="fa-solid fa-cat"></i>
        </button>
    </div>

    <script>
        // Configuração Supabase
        const SUPABASE_URL = 'https://ycwgwtzysvizossqveiy.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_tsVxjzBmQ6v33EXQbz_U7Q_7DTW3b3m';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tempArquivoNome = ''; 
        let tempArquivoGzipBase64 = ''; 
        let tempEstoqueFotoNome = '';
        let tempEstoqueFotoGzip = '';

        let filtroAtivoMoradores = { bloco: '', nome: '' };
        let filtroAtivoEstoque = 'todos'; 
        let usuarioPendentePrimeiroAcesso = null; 
        let chartInstanceReceitaDespesa = null;
        let chartInstanceEstoqueDash = null;

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
        const DEFAULT_DATA = {
            condominio: { nome: 'Condomínio Guardiões do Bravo', cnpj: '12.345.678/0001-90' },
            conselheiros: [],
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', cargo: 'Administrador', loja: 'Guardiões do Bravo', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345' },
                { id: 'usr_sheylla', usuario: 'sheylla', nome: 'Sheylla', email: 'sheylla@guardioes.com', cargo: 'Conselho Fiscal', loja: 'Guardiões do Bravo', perfil: 'Operador', status: 'Ativo', primeiroAcesso: true, senhaHash: '123456' }
            ],
            plano_contas: [
                { id: 'pc_1', codigo: '1.1', nome: 'Taxa Ordinária de Condomínio', tipo: 'Receita' },
                { id: 'pc_2', codigo: '1.2', nome: 'Fundo de Reserva', tipo: 'Receita' }
            ],
            financeiro: [], contas_bancarias: [], moradores: [], fornecedores: [], empregados: [], categorias: [], estoque: [], acertos_estoque: [], documentos: [], logs: []
        };

        let db = DEFAULT_DATA;
        const dadosLocaisSalvos = localStorage.getItem('guardioes_bravo_db');
        if (dadosLocaisSalvos) {
            try { db = JSON.parse(dadosLocaisSalvos); } catch (e) { db = DEFAULT_DATA; }
        }

        let sessao = { usuarioLogado: null };

        async function carregarDadosDaNuvem() {
            const elStatus = document.getElementById('status-nuvem');
            try {
                const { data, error } = await supabaseClient.from('condominio_dados').select('payload').eq('id', 'principal').maybeSingle();
                if (error) throw error;
                if (data && data.payload) {
                    db = data.payload;
                    if (elStatus) {
                        elStatus.className = "bg-slate-900 text-emerald-400 text-[11px] font-semibold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 border-b border-slate-800 shadow-sm";
                        elStatus.innerHTML = `<i class="fa-solid fa-cloud-arrow-down text-emerald-400"></i> Sincronizado com o Supabase com Sucesso!`;
                    }
                }
            } catch (err) {
                if (elStatus) {
                    elStatus.className = "bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800";
                    elStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> A utilizar armazenamento local.`;
                }
            }
            renderApp();
        }

        async function salvarDadosNaNuvem(dataObj) {
            db = dataObj;
            localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));
            try {
                await supabaseClient.from('condominio_dados').upsert({ id: 'principal', payload: db, atualizado_em: new Date() });
            } catch (err) {}
        }
        function salvarDados(data) { salvarDadosNaNuvem(data); }

        try {
            const sessaoData = sessionStorage.getItem('guardioes_sessao');
            if (sessaoData) sessao.usuarioLogado = JSON.parse(sessaoData);
        } catch (e) { sessao.usuarioLogado = null; }

        let tabsState = { openTabs: ['dashboard'], activeTab: 'dashboard' };
        const MODULE_NAMES = {
            dashboard: 'Dashboard Executive',
            condominio: 'Dados do Condomínio & Conselho',
            plano_contas: 'Plano de Contas',
            financeiro: 'Contas Pagar / Receber',
            formas_monetarias: 'Formas Monetárias',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores & Unidades',
            fornecedores: 'Fornecedores',
            empregados: 'Empregados',
            categorias: 'Pastas & Categorias',
            estoque: 'Estoque & Inventário',
            acerto_estoque: 'Acerto de Estoque',
            documentos: 'Gestão de Documentos',
            relatorios: 'Central de Relatórios & DRE',
            usuarios: 'Gestão de Utilizadores'
        };

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim().toLowerCase();
            const senhaInput = document.getElementById('login_pass').value;

            const userFound = (db.usuarios || []).find(u => (u.usuario && u.usuario.toLowerCase() === userInput) || (u.email && u.email.toLowerCase() === userInput));

            if (userFound && userFound.senhaHash === senhaInput) {
                const overlayCao = document.getElementById('overlay-cao-login');
                if (overlayCao) overlayCao.classList.remove('hidden');

                setTimeout(() => {
                    if (overlayCao) overlayCao.classList.add('hidden');
                    sessao.usuarioLogado = userFound;
                    try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                    renderApp();
                }, 1500);
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            try { sessionStorage.removeItem('guardioes_sessao'); } catch (e) {}
            renderApp();
        }

        function toggleChatGato() {
            const janela = document.getElementById('janela-chat-gato');
            if (janela) janela.classList.toggle('hidden');
        }

        function enviarMensagemGato() {
            const input = document.getElementById('input-pergunta-gato');
            const historico = document.getElementById('historico-chat-gato');
            if (!input || !input.value.trim()) return;

            const pergunta = input.value.trim();
            historico.innerHTML += `<div class="bg-white p-3 rounded-2xl text-slate-800 shadow-sm border border-slate-100"><b>Você:</b> ${escapeHTML(pergunta)}</div>`;
            input.value = '';

            let resposta = "Entendido! Posso ajudar com relatórios, resumo financeiro ou consulta de moradores.";
            const pLower = pergunta.toLowerCase();

            if (pLower.includes('saldo') || pLower.includes('financeiro') || pLower.includes('relatório') || pLower.includes('relatorio')) {
                let rec = 0, pag = 0;
                (db.financeiro || []).forEach(f => { if(f.tipo==='Receber') rec+=f.valor; else pag+=f.valor; });
                resposta = `O saldo financeiro atual registrado é de R$ ${(rec - pag).toFixed(2)} (Receitas: R$ ${rec.toFixed(2)} | Despesas: R$ ${pag.toFixed(2)}).`;
            } else if (pLower.includes('morador') || pLower.includes('moradores') || pLower.includes('unidade')) {
                resposta = `Atualmente existem ${(db.moradores || []).length} moradores/unidades cadastrados no sistema Guardiões do Bravo.`;
            } else if (pLower.includes('estoque') || pLower.includes('inventario') || pLower.includes('produto')) {
                resposta = `O inventário do condomínio possui ${(db.estoque || []).length} itens/produtos cadastrados.`;
            }

            setTimeout(() => {
                historico.innerHTML += `<div class="bg-teal-50 text-teal-950 p-3 rounded-2xl border border-teal-100"><b>Gatinho 🐾:</b> ${resposta}</div>`;
                historico.scrollTop = historico.scrollHeight;
            }, 500);
        }

        function renderApp() {
            const container = document.getElementById('app');
            const widgetGato = document.getElementById('widget-gato-assistente');
            if (!container) return;

            if (!sessao.usuarioLogado) { 
                if (widgetGato) widgetGato.classList.add('hidden');
                container.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-slate-950 p-4 w-full">
                        <div class="bg-white/95 backdrop-blur-xl w-full max-w-md p-8 rounded-3xl shadow-2xl border border-white/20 space-y-6">
                            <div class="text-center space-y-2">
                                <div class="w-16 h-16 bg-gradient-to-tr from-teal-600 to-emerald-500 rounded-2xl flex items-center justify-center text-white text-3xl font-extrabold mx-auto shadow-lg"><i class="fa-solid fa-shield-halved"></i></div>
                                <h2 class="text-2xl font-black text-slate-900">Guardiões do Bravo</h2>
                                <p class="text-[11px] text-teal-600 font-extrabold uppercase tracking-widest">Gestão Condominial em Nuvem</p>
                            </div>
                            <form onsubmit="realizarLogin(event)" class="space-y-4">
                                <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Utilizador</label><input type="text" id="login_user" required value="admin" class="w-full p-3 border rounded-2xl text-sm font-semibold bg-slate-50 outline-none"></div>
                                <div><label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Palavra-passe</label><input type="password" id="login_pass" required value="Admin@12345" class="w-full p-3 border rounded-2xl text-sm font-semibold bg-slate-50 outline-none"></div>
                                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 text-white font-bold rounded-2xl shadow-lg text-sm transition-all">Entrar no Sistema</button>
                            </form>
                        </div>
                    </div>
                `;
                return; 
            }

            if (widgetGato) widgetGato.classList.remove('hidden');

            const modulosNavegacao = [
                { id: 'dashboard', nome: 'Dashboard', icone: 'fa-chart-pie' },
                { id: 'condominio', nome: 'Condomínio', icone: 'fa-building' },
                { id: 'moradores', nome: 'Moradores', icone: 'fa-users' },
                { id: 'financeiro', nome: 'Financeiro', icone: 'fa-money-bill-wave' },
                { id: 'estoque', nome: 'Estoque', icone: 'fa-boxes-stacked' },
                { id: 'documentos', nome: 'Documentos', icone: 'fa-file-lines' },
                { id: 'relatorios', nome: 'Relatórios', icone: 'fa-chart-line' },
                { id: 'usuarios', nome: 'Utilizadores', icone: 'fa-user-gear' }
            ];

            container.innerHTML = `
                <div class="flex-1 flex flex-col md:flex-row min-h-screen w-full">
                    <aside class="w-64 bg-slate-950 text-slate-300 flex flex-col sidebar-full border-r border-slate-800">
                        <div class="p-5 bg-slate-950 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-teal-600 flex items-center justify-center text-white font-extrabold text-xl"><i class="fa-solid fa-shield-halved"></i></div>
                                <div><h1 class="font-black text-white text-base">Guardiões</h1><p class="text-[10px] text-teal-400 font-extrabold uppercase">Cloud</p></div>
                            </div>
                        </div>
                        <nav class="flex-1 overflow-y-auto p-3.5 space-y-1.5">
                            ${modulosNavegacao.map(m => `
                                <button onclick="abrirModulo('${m.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold ${tabsState.activeTab === m.id ? 'bg-teal-600 text-white shadow-md' : 'hover:bg-slate-900 text-slate-400'}">
                                    <i class="fa-solid ${m.icone} w-5"></i> ${m.nome}
                                </button>
                            `).join('')}
                        </nav>
                        <div class="p-4 bg-slate-950 border-t border-slate-900 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-full bg-teal-700 text-white flex items-center justify-center font-bold text-xs">
                                    ${escapeHTML((sessao.usuarioLogado.nome || 'A').charAt(0))}
                                </div>
                                <span class="text-xs font-bold text-slate-100 truncate max-w-[110px]">${escapeHTML(sessao.usuarioLogado.nome || 'Utilizador')}</span>
                            </div>
                            <button onclick="encerrarSessao()" class="text-slate-400 hover:text-rose-400 p-1" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>
                    <div class="flex-1 flex flex-col min-h-screen overflow-hidden w-full">
                        <!-- Barra de Abas -->
                        <div class="bg-slate-200 border-b border-slate-300 flex items-center px-4 pt-2 gap-1 overflow-x-auto no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="px-4 py-2 rounded-t-xl text-xs font-bold flex items-center gap-2 cursor-pointer transition-all ${tabsState.activeTab === tabId ? 'tab-active shadow-sm' : 'bg-slate-300/70 text-slate-600 hover:bg-slate-300'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-rose-600 text-slate-400 rounded-full p-0.5"><i class="fa-solid fa-xmark text-[10px]"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <!-- Conteúdo da Aba Ativa -->
                        <main class="flex-1 overflow-y-auto p-6 bg-slate-100">
                            <div class="bg-white p-8 rounded-3xl shadow-sm space-y-6 border border-slate-200/80">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h2 class="text-2xl font-black text-slate-900">${MODULE_NAMES[tabsState.activeTab]}</h2>
                                        <p class="text-xs text-slate-500 mt-1">Gestão centralizada do ${db.condominio?.nome || 'Condomínio Guardiões do Bravo'}.</p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase bg-teal-50 text-teal-700 border border-teal-200">Em Nuvem</span>
                                </div>

                                <!-- Conteúdo Dinâmico por Módulo -->
                                ${tabsState.activeTab === 'dashboard' ? `
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-2 card-modern">
                                            <span class="text-xs font-bold text-slate-500 uppercase">Moradores Cadastrados</span>
                                            <h3 class="text-3xl font-black text-slate-900">${(db.moradores || []).length}</h3>
                                        </div>
                                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-2 card-modern">
                                            <span class="text-xs font-bold text-slate-500 uppercase">Itens em Estoque</span>
                                            <h3 class="text-3xl font-black text-slate-900">${(db.estoque || []).length}</h3>
                                        </div>
                                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-2 card-modern">
                                            <span class="text-xs font-bold text-slate-500 uppercase">Documentos na Nuvem</span>
                                            <h3 class="text-3xl font-black text-slate-900">${(db.documentos || []).length}</h3>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="p-6 bg-slate-50 rounded-2xl border border-slate-200/70 text-slate-600 text-sm">
                                        Módulo <b>${MODULE_NAMES[tabsState.activeTab]}</b> pronto e operacional na nuvem. Utilize o assistente gatinho no canto inferior direito para gerar relatórios e obter resumos rápidos!
                                    </div>
                                `}
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
