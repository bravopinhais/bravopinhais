        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Máscaras Dinâmicas de Entrada
        function mascaraCPF(e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 11) v = v.substring(0, 11);
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = v;
        }

        function mascaraTelefone(e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 11) v = v.substring(0, 11);
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            e.target.value = v;
        }

        async function carregarDadosDaNuvem() {
            const elStatus = document.getElementById('status-nuvem');

                const { data, error } = await supabaseClient

                    .select('payload')

                    .maybeSingle();

            db = dataObj;

        // =========================================================================
        // IMPORTAÇÃO INTELIGENTE DE PLANILHA (MAPEAMENTO AUTOMÁTICO DE COLUNAS)
        // =========================================================================
        function importarPlanilhaMoradores(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const texto = e.target.result;
                    const linhas = texto.split(/\r\n|\n/);
                    if (linhas.length < 2) { alert('A planilha parece estar vazia.'); return; }

                    // Ler cabeçalho para descobrir a posição de cada coluna
                    const cabecalho = linhas[0].split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim().toLowerCase());
                    
                    const idxBloco = cabecalho.findIndex(h => h.includes('bloco') || h.includes('bl'));
                    const idxAp = cabecalho.findIndex(h => h.includes('ap') || h.includes('unidade') || h.includes('casa'));
                    const idxNome = cabecalho.findIndex(h => h.includes('nome') || h.includes('morador') || h.includes('proprietario'));
                    const idxEmail = cabecalho.findIndex(h => h.includes('email') || h.includes('e-mail'));
                    const idxTel = cabecalho.findIndex(h => h.includes('tel') || h.includes('cel') || h.includes('whatsapp') || h.includes('fone'));
                    const idxCpf = cabecalho.findIndex(h => h.includes('cpf') || h.includes('documento') || h.includes('rg'));

                    let importados = 0;
                    if (!db.moradores) db.moradores = [];

                    for (let i = 1; i < linhas.length; i++) {
                        const linha = linhas[i].trim();
                        if (!linha) continue;
                        const cols = linha.split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim());
                        
                        db.moradores.push({
                            id: 'mor_imp_' + Date.now() + '_' + i,
                            bloco: idxBloco !== -1 ? (cols[idxBloco] || '1') : (cols[0] || '1'),
                            apartamento: idxAp !== -1 ? (cols[idxAp] || '') : (cols[1] || ''),
                            nome: idxNome !== -1 ? (cols[idxNome] || 'Sem Nome') : (cols[2] || 'Sem Nome'),
                            email: idxEmail !== -1 ? (cols[idxEmail] || '') : '',
                            telefone: idxTel !== -1 ? (cols[idxTel] || '') : '',
                            cpf: idxCpf !== -1 ? (cols[idxCpf] || '') : ''
                        });
                        importados++;
                    }

                    if (importados > 0) {
                        salvarDados(db);
                        alert(`${importados} moradores importados com sucesso com mapeamento inteligente!`);
                        renderMainOnly();
                    } else {
                        alert('Nenhum morador válido encontrado na planilha.');
                    }
                } catch (err) {
                    alert('Erro ao processar o arquivo CSV.');
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        function gerarListaComandos(query) {

                { id: 'usuarios', nome: 'Ir para Gestão de Utilizadores', icon: 'fa-user-gear' }

            const filtrados = comandos.filter(c => c.nome.toLowerCase().includes(query.toLowerCase()));
            if (filtrados.length === 0) return `<div class="p-4 text-center text-xs text-slate-400">Nenhum comando encontrado.</div>`;

                        <i class="fa-solid ${c.icon} text-teal-600 dark:text-teal-400 w-5 text-center"></i>
                        <span>${c.nome}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] opacity-40"></i>
                </button>
            `).join('');
        }

                        <div class="bg-slate-200 dark:bg-slate-900/60 border-b border-slate-300 dark:border-slate-800 flex items-center overflow-x-auto px-2 pt-2 gap-1.5 no-print w-full">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3.5 py-2 rounded-t-xl text-xs font-semibold cursor-pointer whitespace-nowrap ${tabsState.activeTab === tabId ? 'bg-white dark:bg-slate-950 text-teal-700 dark:text-teal-400 font-bold shadow-sm' : 'bg-slate-300/70 dark:bg-slate-800/50 text-slate-600 dark:text-slate-400'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-red-600 ml-1"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-100 dark:bg-slate-950 w-full">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;
            if (tabsState.activeTab === 'dashboard') {
                setTimeout(() => { initDashboardCharts(); initDashboardEstoqueChart(); }, 50);
            }
        }

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            let btnImportar = '';

            if (moduloId === 'moradores') {
                btnImportar = `
                    <label class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs cursor-pointer flex items-center gap-1.5 shadow-sm transition-all whitespace-nowrap">
                        <i class="fa-solid fa-file-arrow-up"></i> Importar Planilha <input type="file" accept=".csv, .txt" onchange="importarPlanilhaMoradores(event)" class="hidden">
                    </label>
                `;
                btnNovoHtml = `<button onclick="window.renderModalMorador()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            }

            const inputBuscaInstantanea = ['moradores'].includes(moduloId) ? `
                <div class="relative flex-1 max-w-xs">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" value="${escapeHTML(termoBuscaGlobal)}" oninput="termoBuscaGlobal = this.value; renderMainOnly();" placeholder="Pesquisa instantânea..." class="w-full pl-8 pr-3 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold outline-none text-slate-800 dark:text-white">
                </div>
            ` : '';

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                    <div><h2 class="text-xl md:text-2xl font-black text-slate-800 dark:text-white">${MODULE_NAMES[moduloId]}</h2></div>
                    <div class="flex flex-wrap items-center gap-2.5 no-print">${inputBuscaInstantanea} ${btnImportar} ${btnNovoHtml}</div>
                </div>
            `;

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'moradores': return headerGlobal + renderMoradoresView();
                default: return headerGlobal + `<div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800">Módulo Ativo.</div>`;
            }
        }

        function abrirModalContainer(html) { document.getElementById('modal-container').innerHTML = html; }
        function fecharModalContainer() { document.getElementById('modal-container').innerHTML = ''; }

        function renderDashboardView() {
            return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm"><h3 class="font-bold text-slate-800 dark:text-white">Dashboard Ativo</h3></div>`;
        }

        function initDashboardCharts() {}
        function initDashboardEstoqueChart() {}

        function renderMoradoresView() {
            let moradores = db.moradores || [];
            if (termoBuscaGlobal) {
                const t = termoBuscaGlobal.toLowerCase();
                moradores = moradores.filter(m => (m.nome||'').toLowerCase().includes(t) || (m.apartamento||'').toLowerCase().includes(t));
            }

            return `
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 overflow-x-auto shadow-sm">
                    <table class="w-full text-left text-xs min-w-[700px]">
                        <thead class="bg-slate-800 text-white">
                            <tr><th class="p-4">Bloco/Ap</th><th class="p-4">Nome</th><th class="p-4">CPF</th><th class="p-4">Telefone</th><th class="p-4 text-center">Ações</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-slate-800 dark:text-slate-200">
                            ${moradores.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhum morador encontrado. Clique em "Importar Planilha" ou "Novo Morador".</td></tr>` : moradores.map(m => `
                                <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                    <td class="p-4 font-bold">Bloco ${escapeHTML(m.bloco)} - Ap ${escapeHTML(m.apartamento)}</td>
                                    <td class="p-4 font-bold">${escapeHTML(m.nome)}</td>
                                    <td class="p-4 font-mono">${escapeHTML(m.cpf || '-')}</td>
                                    <td class="p-4 font-mono">${escapeHTML(m.telefone || '-')}</td>
                                    <td class="p-4 text-center">
                                        <button onclick="window.renderModalMorador('${m.id}')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl mr-1"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="excluirRegistro('moradores','${m.id}')" class="p-2 bg-rose-50 text-rose-600 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalMorador = function(id = null) {
            const m = id ? (db.moradores||[]).find(x => x.id === id) : { id: '', bloco: '1', apartamento: '', nome: '', email: '', telefone: '', cpf: '' };
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800">
                        <div class="flex justify-between items-center border-b dark:border-slate-800 pb-3">
                            <h3 class="font-bold text-lg text-slate-800 dark:text-white">${id ? 'Editar Morador' : 'Novo Morador'}</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="salvarModalMorador(event, '${id}')" class="space-y-3 text-xs">
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block font-bold uppercase text-slate-500 mb-1">Bloco</label><input type="text" id="m_m_bloco" required value="${escapeHTML(m.bloco)}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:text-white"></div>
                                <div><label class="block font-bold uppercase text-slate-500 mb-1">Apartamento</label><input type="text" id="m_m_ap" required value="${escapeHTML(m.apartamento)}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:text-white"></div>
                            </div>
                            <div><label class="block font-bold uppercase text-slate-500 mb-1">Nome Completo</label><input type="text" id="m_m_nome" required value="${escapeHTML(m.nome)}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:text-white"></div>
                            <div><label class="block font-bold uppercase text-slate-500 mb-1">CPF</label><input type="text" id="m_m_cpf" oninput="mascaraCPF(event)" value="${escapeHTML(m.cpf || '')}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:text-white"></div>
                            <div><label class="block font-bold uppercase text-slate-500 mb-1">Telefone</label><input type="text" id="m_m_tel" oninput="mascaraTelefone(event)" value="${escapeHTML(m.telefone || '')}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:text-white"></div>
                            <div class="flex justify-end gap-2 pt-3 border-t dark:border-slate-800">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-sm">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.salvarModalMorador = function(e, id) {
            e.preventDefault();
            if(!db.moradores) db.moradores = [];
            const obj = {
                id: id && id !== 'null' ? id : 'mor_' + Date.now(),
                bloco: document.getElementById('m_m_bloco').value,
                apartamento: document.getElementById('m_m_ap').value,
                nome: document.getElementById('m_m_nome').value,
                cpf: document.getElementById('m_m_cpf').value,
                telefone: document.getElementById('m_m_tel').value
            };
            const idx = db.moradores.findIndex(x => x.id === obj.id);
            if(idx !== -1) db.moradores[idx] = obj; else db.moradores.push(obj);
            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        function excluirRegistro(col, id) {
            if(!confirm('Deseja eliminar este registo?')) return;
            if(db[col]) {
                db[col] = db[col].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
