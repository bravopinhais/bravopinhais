<!DOCTYPE html>

<head>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 2px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sidebar-full { height: 100vh; position: sticky; top: 0; }
        .card-modern { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(226, 232, 240, 0.8); }
        .card-modern:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        @media print {
            aside, header, .no-print, button, .actions-col { display: none !important; }
            body { background: white !important; color: black !important; }
            main { padding: 0 !important; }
            .print-break { page-break-before: always; }

<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <div id="status-nuvem" class="bg-slate-900 text-teal-400 text-[11px] font-semibold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 border-b border-slate-800 shadow-sm">
        <i class="fa-solid fa-cloud animate-pulse"></i> A ligar ao Supabase na Nuvem...
    </div>

    <div id="app" class="flex-1 flex flex-col min-h-screen w-full"></div>
    <div id="modal-container"></div>

    <script>
        const SUPABASE_URL = 'https://ycwgwtzysvizossqveiy.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_tsVxjzBmQ6v33EXQbz_U7Q_7DTW3b3m';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tempArquivoNome = ''; 
        let tempArquivoGzipBase64 = ''; 
        let tempEstoqueFotoNome = '';
        let tempEstoqueFotoGzip = '';

        let filtroAtivoMoradores = { bloco: '', nome: '' };
        let filtroAtivoEstoque = 'todos'; 
        let usuarioPendentePrimeiroAcesso = null; 
        let chartInstanceReceitaDespesa = null;
        let chartInstanceOcupacao = null;
        let chartInstanceEstoque = null;
        let chartInstanceEstoqueDash = null;

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // --- TODAS AS SUAS FUNÇÕES DE GZIP, BACKUP E BANCO ---
        // (carregarDadosDaNuvem, salvarDadosNaNuvem, etc.)

        const MODULE_NAMES = {
            dashboard: 'Dashboard Executive',
            ia: 'IA Assistente Conversacional', // <--- Módulo da IA registrado
            condominio: 'Dados do Condomínio & Conselho',
            plano_contas: 'Plano de Contas',
            financeiro: 'Contas Pagar / Receber',
            formas_monetarias: 'Formas Monetárias',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores & Unidades',
            fornecedores: 'Fornecedores',
            empregados: 'Empregados',
            categorias: 'Pastas & Categorias',
            estoque: 'Estoque & Inventário',
            acerto_estoque: 'Acerto de Estoque',
            documentos: 'Gestão de Documentos',
            relatorios: 'Central de Relatórios & DRE',
            usuarios: 'Gestão de Utilizadores'
        };

        // --- SEUS MÓDULOS ANTIGOS (renderMoradores, renderEstoque, etc.) ---

        // =========================================================================
        // MÓDULO DE INTELIGÊNCIA ARTIFICIAL E ASSISTENTE EXECUTIVO
        // =========================================================================
        let historicoChatIA = [
            { autor: 'ia', mensagem: 'Olá! Sou o assistente inteligente do Guardiões do Bravo. Como posso ajudar? Você pode me pedir para cadastrar moradores, dar baixa em estoque, criar produtos ou tirar dúvidas.' }
        ];

        async function processarComandoIA(textoComando) {
            if (!textoComando || !textoComando.trim()) return;

            const cmd = textoComando.trim();
            historicoChatIA.push({ autor: 'usuario', mensagem: cmd });
            renderMainOnly();

            const cmdLower = cmd.toLowerCase();
            let respostaIA = "";

            if (cmdLower.includes('cadastrar morador') || cmdLower.includes('adicionar morador')) {
                const blocoMatch = cmd.match(/bloco\s*(\w+)/i);
                const apMatch = cmd.match(/(?:ap|apartamento)\s*(\d+)/i);
                const nomeMatch = cmd.match(/(?:morador|adicionar)\s+([A-Za-zÀ-ÖØ-öø-ÿ\s]+?)(?=\s+bloco|\s+ap|\s+email|\s+tel|$)/i);

                const bloco = blocoMatch ? blocoMatch[1] : '1';
                const ap = apMatch ? apMatch[1] : '';
                const nome = nomeMatch ? nomeMatch[1].trim() : 'Novo Morador';

                if (!db.moradores) db.moradores = [];
                
                db.moradores.push({
                    id: 'mor_ia_' + Date.now(),
                    bloco: bloco,
                    apartamento: ap,
                    nome: nome,
                    email: '', telefone: '', cpf: '', petNome: '', vagaGaragem: ''
                });

                salvarDados(db);
                respostaIA = `Morador **${nome}** (Bloco ${bloco}, Ap ${ap}) cadastrado com sucesso!`;
            }
            else if (cmdLower.includes('dar baixa') || cmdLower.includes('saida') || cmdLower.includes('remover do estoque')) {
                const qtdMatch = cmd.match(/\d+/);
                const qtd = qtdMatch ? parseInt(qtdMatch[0]) : 1;
                
                const itemEncontrado = (db.estoque || []).find(item => cmdLower.includes(item.nome.toLowerCase()));

                if (itemEncontrado) {
                    const qtdAtual = parseFloat(itemEncontrado.quantidade || 0);
                    if (qtdAtual >= qtd) {
                        itemEncontrado.quantidade = qtdAtual - qtd;
                        if (!db.acertos_estoque) db.acertos_estoque = [];
                        db.acertos_estoque.push({
                            id: 'act_ia_' + Date.now(),
                            data: new Date().toISOString().split('T')[0],
                            produtoId: itemEncontrado.id,
                            produtoNome: itemEncontrado.nome,
                            tipo: 'Saída', quantidade: qtd,
                            motivo: 'Saída via IA Assistant',
                            usuario: sessao.usuarioLogado ? sessao.usuarioLogado.nome : 'IA Assistant'
                        });
                        salvarDados(db);
                        respostaIA = `Baixa de **${qtd} un** do item **${itemEncontrado.nome}** efetuada com sucesso. Restam: ${itemEncontrado.quantidade}.`;
                    } else {
                        respostaIA = `Estoque insuficiente para **${itemEncontrado.nome}**. Quantidade atual: ${qtdAtual}.`;
                    }
                } else {
                    respostaIA = `Não consegui identificar o produto no estoque para dar baixa. Certifique-se de usar o nome exato do item.`;
                }
            }
            else if (cmdLower.includes('cadastrar produto') || cmdLower.includes('adicionar produto')) {
                const qtdMatch = cmd.match(/quantidade\s*(\d+)/i) || cmd.match(/qtd\s*(\d+)/i);
                const valorMatch = cmd.match(/valor\s*([\d\.,]+)/i) || cmd.match(/preco\s*([\d\.,]+)/i);
                const nomeMatch = cmd.match(/(?:produto|adicionar)\s+([A-Za-zÀ-ÖØ-öø-ÿ0-9\s]+?)(?=\s+quantidade|\s+qtd|\s+valor|\s+preco|$)/i);

                const qtd = qtdMatch ? parseInt(qtdMatch[1]) : 1;
                const valor = valorMatch ? parseFloat(valorMatch[1].replace(',', '.')) : 0;
                const nome = nomeMatch ? nomeMatch[1].trim() : 'Novo Produto';

                if (!db.estoque) db.estoque = [];

                db.estoque.push({
                    id: 'est_ia_' + Date.now(),
                    nome: nome, categoria: 'Geral', quantidade: qtd, qtdMinima: 2, valorUnitario: valor, localizacao: 'Almoxarifado'
                });

                salvarDados(db);
                respostaIA = `Produto **${nome}** (Qtd: ${qtd}, R$ ${valor.toFixed(2)}) cadastrado no estoque com sucesso!`;
            }
            else if (cmdLower.includes('total moradores') || cmdLower.includes('quantos moradores')) {
                respostaIA = `Atualmente o condomínio possui **${(db.moradores || []).length} moradores** cadastrados.`;
            } 
            else if (cmdLower.includes('resumo financeiro') || cmdLower.includes('saldo')) {
                let totalReceitas = (db.financeiro || []).filter(f => f.tipo === 'Receita').reduce((a, b) => a + Number(b.valor || 0), 0);
                let totalDespesas = (db.financeiro || []).filter(f => f.tipo === 'Despesa').reduce((a, b) => a + Number(b.valor || 0), 0);
                respostaIA = `Resumo Financeiro:\n- **Receitas:** R$ ${totalReceitas.toFixed(2)}\n- **Despesas:** R$ ${totalDespesas.toFixed(2)}\n- **Saldo:** R$ ${(totalReceitas - totalDespesas).toFixed(2)}`;
            } 
            else {
                respostaIA = `Comando recebido: "${cmd}". Tente comandos como:\n- *Cadastrar morador João Silva Bloco 1 Ap 102*\n- *Cadastrar produto Lâmpada quantidade 10 valor 12.50*\n- *Dar baixa em 2 Lâmpada*\n- *Resumo financeiro*`;
            }

            historicoChatIA.push({ autor: 'ia', mensagem: respostaIA });
            renderMainOnly();
        }

        function renderModuloIA() {
            const mensagensHTML = historicoChatIA.map(msg => {
                const isUser = msg.autor === 'usuario';
                return `
                    <div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-3">
                        <div class="max-w-[80%] p-3.5 rounded-2xl text-xs font-medium leading-relaxed ${
                            isUser ? 'bg-teal-600 text-white rounded-br-none shadow-md' : 'bg-slate-200 text-slate-800 rounded-bl-none border border-slate-300'
                        }">
                            ${escapeHTML(msg.mensagem).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="p-6 max-w-4xl mx-auto space-y-4">
                    <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-teal-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-teal-600/20">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div>
                                <h2 class="text-base font-bold text-slate-900">IA Assistente Executiva</h2>
                                <p class="text-[11px] font-semibold text-teal-600">Comandos de texto, ações diretas e relatórios</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-3xl border border-slate-200 h-[420px] overflow-y-auto flex flex-col justify-between shadow-inner" id="box-chat-ia">
                        <div class="space-y-1">${mensagensHTML}</div>
                    </div>

                    <form onsubmit="event.preventDefault(); const input = document.getElementById('input_cmd_ia'); processarComandoIA(input.value); input.value = '';" class="flex gap-2">
                        <input type="text" id="input_cmd_ia" placeholder="Digite uma ação..." class="flex-1 p-3.5 border border-slate-300 rounded-2xl text-xs font-semibold bg-white focus:ring-2 focus:ring-teal-500 outline-none shadow-sm">
                        <button type="submit" class="px-6 py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-2xl text-xs shadow-md shadow-teal-600/20 transition-all flex items-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> Enviar
                        </button>
                    </form>
                </div>
            `;
        }

        function renderMainOnly() {
            const containerMain = document.getElementById('conteudo-principal');
            if (!containerMain) return;

            if (tabsState.activeTab === 'ia') {
                containerMain.innerHTML = renderModuloIA();
                const box = document.getElementById('box-chat-ia');
                if (box) box.scrollTop = box.scrollHeight;
                return;
            }

            // --- AQUI FICAM OS SEUS IFs / SWITCH ORIGINAIS ---
            // (ex: if (tabsState.activeTab === 'moradores') containerMain.innerHTML = renderMoradores();)
        }

        window.onload = function() {
            carregarDadosDaNuvem();
        };
    </script>
</body>
</html>
