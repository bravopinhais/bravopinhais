<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

    <!-- ECRÃ DE LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4 bg-slate-950">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600/20 text-blue-500 mb-4">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-wide">Guardiões do Bravo</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Gestão Condominial Integrada</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); fazerLogin();" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Utilizador / E-mail</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="loginUser" required placeholder="Digite seu usuário" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Palavra-passe</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Entrar no Sistema</span>
                </button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (DASHBOARD) -->
    <div id="mainDashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
            <div>
                <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-white leading-tight">Guardiões do Bravo</h2>
                        <span class="text-[10px] text-blue-400 font-medium uppercase tracking-wider">Condomínio</span>
                    </div>
                </div>

                <nav class="p-4 space-y-1">
                    <button onclick="navegarPara('dashboard')" id="nav-dashboard" class="nav-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-blue-400 bg-blue-600/10 border border-blue-500/20">
                        <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                    </button>
                    <button onclick="navegarPara('financeiro')" id="nav-financeiro" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-wallet w-5"></i> Financeiro
                    </button>
                    <button onclick="navegarPara('moradores')" id="nav-moradores" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-users w-5"></i> Moradores & Unidades
                    </button>
                    <button onclick="navegarPara('fornecedores')" id="nav-fornecedores" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-truck-field w-5"></i> Fornecedores
                    </button>
                    <button onclick="navegarPara('estoque')" id="nav-estoque" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-boxes-stacked w-5"></i> Estoque
                    </button>
                    <button onclick="navegarPara('documentos')" id="nav-documentos" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-folder-open w-5"></i> Documentos
                    </button>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-800">
                <button onclick="fazerLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                    <i class="fa-solid fa-right-from-bracket w-5"></i> Terminar Sessão
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-slate-900 p-6 md:p-8 overflow-y-auto">
            <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-800 mb-8">
                <div>
                    <h1 id="pageTitle" class="text-2xl font-bold text-white">Visão Geral</h1>
                    <p class="text-xs text-slate-400 mt-1">Sistema inicializado e pronto para novos cadastros</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Banco Prontos para Cadastros
                    </span>
                </div>
            </header>

            <!-- CONTEÚDO DINÂMICO -->
            <div id="contentArea"></div>
        </main>
    </div>

    <script>
        // ESTADO ZERADO (LIMPO)
        let dadosSistema = {
            financeiro: [],
            moradores: [],
            fornecedores: [],
            estoque: [],
            documentos: []
        };

        function fazerLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (user === 'admin' && pass === '12345678') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                carregarDashboard();
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function fazerLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function navegarPara(pagina) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active', 'text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
                el.classList.add('text-slate-400');
            });

            const currentNav = document.getElementById('nav-' + pagina);
            if(currentNav) {
                currentNav.classList.add('active', 'text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
            }

            const title = document.getElementById('pageTitle');

            if(pagina === 'dashboard') {
                title.innerText = 'Visão Geral';
                carregarDashboard();
            } else if(pagina === 'moradores') {
                title.innerText = 'Moradores & Unidades';
                carregarMoradores();
            } else if(pagina === 'fornecedores') {
                title.innerText = 'Cadastro de Fornecedores';
                carregarFornecedores();
            } else if(pagina === 'financeiro') {
                title.innerText = 'Módulo Financeiro';
                carregarFinanceiro();
            } else {
                title.innerText = pagina.toUpperCase();
                document.getElementById('contentArea').innerHTML = `
                    <div class="bg-slate-950 p-12 rounded-2xl border border-slate-800 text-center">
                        <i class="fa-solid fa-folder-plus text-4xl text-slate-600 mb-4"></i>
                        <h3 class="text-lg font-bold text-white mb-1">Nenhum registro encontrado</h3>
                        <p class="text-sm text-slate-400">Módulo limpo e pronto para novos lançamentos.</p>
                    </div>
                `;
            }
        }

        function carregarDashboard() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Saldo em Conta</span>
                        <h3 class="text-2xl font-bold text-emerald-400 mt-2">R$ 0,00</h3>
                        <p class="text-xs text-slate-500 mt-1">Aguardando lançamentos</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Total Moradores</span>
                        <h3 class="text-2xl font-bold text-blue-400 mt-2">${dadosSistema.moradores.length} Unidades</h3>
                        <p class="text-xs text-slate-500 mt-1">Cadastros ativos</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Fornecedores</span>
                        <h3 class="text-2xl font-bold text-indigo-400 mt-2">${dadosSistema.fornecedores.length} Cadastrados</h3>
                        <p class="text-xs text-slate-500 mt-1">Empresas e parceiros</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Contas Pendentes</span>
                        <h3 class="text-2xl font-bold text-amber-400 mt-2">0 Títulos</h3>
                        <p class="text-xs text-slate-500 mt-1">A pagar / A receber</p>
                    </div>
                </div>

                <div class="bg-slate-950 p-8 rounded-2xl border border-slate-800 text-center">
                    <i class="fa-solid fa-circle-check text-5xl text-emerald-500 mb-4"></i>
                    <h2 class="text-xl font-bold text-white mb-2">Sistema Resetado com Sucesso!</h2>
                    <p class="text-sm text-slate-400 max-w-md mx-auto mb-6">Todos os dados de demonstração foram removidos. Utilize o menu lateral para iniciar o cadastro dos moradores, fornecedores e contas do condomínio.</p>
                    <button onclick="navegarPara('moradores')" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-blue-600/20 inline-flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Cadastrar Primeiros Moradores</span>
                    </button>
                </div>
            `;
        }

        function carregarMoradores() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Lista de Moradores & Unidades</h3>
                    <button onclick="adicionarMorador()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Novo Morador
                    </button>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden p-8 text-center" id="tabelaMoradores">
                    ${dadosSistema.moradores.length === 0 ? `
                        <i class="fa-solid fa-users-slash text-4xl text-slate-700 mb-3"></i>
                        <p class="text-slate-400 text-sm">Nenhum morador cadastrado até ao momento.</p>
                    ` : ''}
                </div>
            `;
        }

        function adicionarMorador() {
            const nome = prompt("Nome completo do morador:");
            const bloco = prompt("Bloco (ex: Bloco A, Torre 1):");
            const ap = prompt("Número do Apartamento/Unidade (ex: 101):");

            if(nome && bloco && ap) {
                dadosSistema.moradores.push({ nome, bloco, ap });
                alert("Morador cadastrado com sucesso!");
                carregarMoradores();
            }
        }

        function carregarFornecedores() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Fornecedores Cadastrados</h3>
                    <button onclick="adicionarFornecedor()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                        <i class="fa-solid fa-building-circle-check"></i> Novo Fornecedor
                    </button>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden p-8 text-center">
                    ${dadosSistema.fornecedores.length === 0 ? `
                        <i class="fa-solid fa-truck-ramp-box text-4xl text-slate-700 mb-3"></i>
                        <p class="text-slate-400 text-sm">Nenhum fornecedor cadastrado até ao momento.</p>
                    ` : ''}
                </div>
            `;
        }

        function adicionarFornecedor() {
            const razao = prompt("Razão Social / Nome da Empresa:");
            const cnpj = prompt("CNPJ / CPF:");
            const servico = prompt("Serviço / Categoria (ex: Elevadores, Jardinagem):");

            if(razao && cnpj) {
                dadosSistema.fornecedores.push({ razao, cnpj, servico });
                alert("Fornecedor cadastrado com sucesso!");
                carregarFornecedores();
            }
        }

        function carregarFinanceiro() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Contas a Pagar e Receber</h3>
                    <button onclick="alert('Cadastre moradores e fornecedores primeiro para associar os títulos!')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                        <i class="fa-solid fa-file-circle-plus"></i> Novo Lançamento
                    </button>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden p-8 text-center">
                    <i class="fa-solid fa-receipt text-4xl text-slate-700 mb-3"></i>
                    <p class="text-slate-400 text-sm">Nenhum título financeiro em aberto.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
