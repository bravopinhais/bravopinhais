name: Publicar Bravo Shadow no GitHub Pages

on:
  push:
    branches:
      - bravo-shadow
    paths:
      - "bravo-shadow/frontend/**"
      - ".github/workflows/bravo-shadow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bravo-shadow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp -R bravo-shadow/frontend/. _site/
          touch _site/.nojekyll

      - name: Validar arquivos e proteções do preview
        run: |
          test -s _site/index.html
          grep -q 'function usuariosView' _site/index.html
          grep -q 'const IS_STATIC_PREVIEW=location.hostname.endsWith("github.io")' _site/index.html
          grep -q 'if(IS_STATIC_PREVIEW)throw new Error' _site/index.html
          grep -q 'if(IS_STATIC_PREVIEW){view.innerHTML=' _site/index.html
          grep -q 'Indicadores aguardando autenticação' _site/index.html
          grep -q 'href="#main-content"' _site/index.html
          grep -q 'id="main-content" tabindex="-1"' _site/index.html
          grep -q 'id="view" aria-live="polite" aria-atomic="true"' _site/index.html
          grep -q 'id="formas-status" role="status" aria-live="polite" aria-atomic="true"' _site/index.html
          grep -q '<caption>Formas monetárias cadastradas</caption>' _site/index.html
          grep -q '<th scope="col">Forma monetária</th>' _site/index.html
          grep -q '<th scope="col">Multa (%)</th>' _site/index.html
          grep -q '<th scope="col">Ações</th>' _site/index.html
          grep -q 'aria-label="Editar ${escapeHTML(item.nome)}"' _site/index.html
          grep -q 'aria-label="Excluir ${escapeHTML(item.nome)}"' _site/index.html
          grep -q 'id="forma-multa" name="multaPct" type="number" min="0" max="100" step="0.01" value="2" required' _site/index.html
          grep -q 'button.textContent="Salvando..."' _site/index.html
          grep -q 'return true}' _site/index.html
          grep -q 'return false}' _site/index.html
          grep -q 'const listaAtualizada=await carregarFormas()' _site/index.html
          grep -q 'Registro salvo, mas a lista não foi atualizada. Use Atualizar para tentar novamente.' _site/index.html
          grep -q 'id="forma-cancel-edit" data-action="cancel-edit" hidden' _site/index.html
          grep -q 'if(action.dataset.action==="cancel-edit")' _site/index.html
          grep -q 'function formasView(){' _site/index.html
          grep -q '// A view is rebuilt on entry; never carry an edit ID into a fresh form.' _site/index.html
          grep -q 'form?.getAttribute("aria-busy")==="true")return;resetFormaForm();setFormasStatus("Edição cancelada; nenhuma alteração foi enviada.");document.getElementById("forma-nome")?.focus()' _site/index.html
          grep -q 'event.key!=="Escape"||!formaEmEdicao' _site/index.html
          grep -q 'Edição cancelada pelo teclado; nenhuma alteração foi enviada.' _site/index.html
          grep -q 'cancel.hidden=false' _site/index.html
          grep -q 'if(cancel)cancel.hidden=true' _site/index.html
          grep -q 'if(form.getAttribute("aria-busy")==="true")return' _site/index.html
          grep -q 'form.setAttribute("aria-busy","true")' _site/index.html
          grep -q 'form.removeAttribute("aria-busy")' _site/index.html
          grep -q 'aria-label="Atualizar formas monetárias"' _site/index.html
          grep -q 'action.textContent="Atualizando..."' _site/index.html
          grep -q 'action.setAttribute("aria-busy","true")' _site/index.html
          grep -q 'action.removeAttribute("aria-busy")' _site/index.html
          grep -q 'action.textContent="Excluindo..."' _site/index.html
          grep -q 'action.removeAttribute("aria-busy")' _site/index.html
          grep -q 'window.addEventListener("hashchange"' _site/index.html
          grep -q '<h1 id="page-title" tabindex="-1">' _site/index.html
          grep -q 'getElementById("page-title").focus({preventScroll:true})' _site/index.html
          grep -q 'history.replaceState(null,"",location.pathname+location.search)' _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
