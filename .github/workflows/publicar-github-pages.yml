name: Publicar Bravo Pinhais no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy_attempt_1.outputs.page_url || steps.deploy_attempt_2.outputs.page_url || steps.deploy_attempt_3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos do sistema
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site (tentativa 1)
        id: deploy_attempt_1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes da segunda tentativa
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 10

      - name: Publicar site (tentativa 2)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes da terceira tentativa
        if: steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 20

      - name: Publicar site (tentativa 3)
        id: deploy_attempt_3
        if: steps.deploy_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Confirmar publicação
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure'
        run: exit 1

# Publicação automática habilitada para o repositório Bravo Pinhais.
