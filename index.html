<!-- Etapa 26 — padronização de formulários, filtros e tabelas -->
<style id="bravo-padroes-formularios-filtros-tabelas-etapa-26">
/* Campos: fundo branco, texto escuro e contorno discreto */
#app main :is(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),select,textarea){
 background-color:#fff!important;background-image:none!important;color:#262626!important;
 border:1px solid #dcdcdc!important;border-radius:9px!important;box-shadow:none!important;
}
#app main :is(input,select,textarea)::placeholder{color:#a3a3a3!important;opacity:1!important}
#app main :is(input,select,textarea):hover{border-color:#b8b8b8!important}
#app main :is(input,select,textarea):focus{
 outline:none!important;border-color:#737373!important;
 box-shadow:0 0 0 3px rgba(23,23,23,.07)!important;
}
#app main label{color:#525252!important}
#app main input[type="checkbox"],#app main input[type="radio"]{accent-color:#171717!important}
/* Filtros, pesquisa e agrupadores */
#app main :is([class*="filter"],[class*="filtro"],[class*="search"],[class*="pesquisa"]):not(input):not(button){
 border-color:#e5e5e5!important;
}
#app main :is(.filter-chip,.filtro-chip,[data-filter],.tab-active){
 background:#f5f5f5!important;background-image:none!important;color:#262626!important;
 border-color:#dcdcdc!important;box-shadow:none!important;
}
#app main .tab-active{background:#171717!important;color:#fff!important;border-color:#171717!important}
/* Tabelas e listas de dados */
#app main table{width:100%;border-collapse:separate;border-spacing:0}
#app main table thead th{
 background:#f5f5f5!important;color:#525252!important;font-weight:600!important;
 border-bottom:1px solid #e5e5e5!important;
}
#app main table tbody td{background:#fff!important;color:#404040!important;border-bottom:1px solid #ededed!important}
#app main table tbody tr:hover td{background:#fafafa!important}
#app main table :is(button,a){box-shadow:none!important}
#app main :is(.overflow-x-auto,.table-responsive){border:1px solid #e5e5e5!important;border-radius:12px!important}
/* Botões neutros e estados de interação, preservando alertas semânticos */
#app main button:not([class*="bg-red-"]):not([class*="bg-rose-"]):not([class*="bg-amber-"]):not([class*="bg-yellow-"]){
 box-shadow:none!important;
}
#app main button:focus-visible,#app main a:focus-visible{
 outline:2px solid #a3a3a3!important;outline-offset:2px!important;
}
#app main :is(button,a)[disabled],#app main :is(button,a)[aria-disabled="true"]{
 opacity:.55!important;cursor:not-allowed!important;
}
</style>
