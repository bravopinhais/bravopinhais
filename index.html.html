<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .will-change-transform { will-change: transform; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 3px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .tech-mode { background-color: #030712 !important; color: #22d3ee !important; }
        .tech-card {
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid #06b6d4 !important;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3) !important;
            backdrop-filter: blur(8px);
        }
        .tech-input { background-color: #020617 !important; border-color: #0891b2 !important; color: #22d3ee !important; }

        @media print {
            aside, header, .no-print, button { display: none !important; }
            body { background: white !important; color: black !important; }
            main { padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        window.imagemAnexadaBase64 = '';
        let isTechMode = true;
        let matrixInterval = null;

        let tourState = { ativo: false, passoAtual: 0 };

        const TOUR_STEPS = [
            { modulo: 'dashboard', titulo: '1. Bem-vindo!', texto: 'Sistema completo de gestão condominial e financeira.' },
            { modulo: 'dashboard', titulo: '2. Dashboard Analytic', texto: 'Acompanhe fluxos de caixa e métricas dinâmicas.' },
            { modulo: 'financeiro', titulo: '3. Financeiro & Baixa Parcial', texto: 'Lançamentos, baixas totais e parciais com criação de títulos residuais automatizada.' },
            { modulo: 'formas_monetarias', titulo: '4. Formas Monetárias', texto: 'Cadastre meios de pagamento com liquidação imediata e vínculo bancário.' },
            { modulo: 'relatorios', titulo: '5. DRE Condominial', texto: 'Demonstrativo contábil inteligente com fórmulas editáveis.' }
        ];

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function validarSenhaForte(senha) {
            return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&*!_\-]).{8,}$/.test(senha);
        }

        const DEFAULT_DATA = {
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345' }
            ],
            financeiro: [
                { id: 'fin_1', tipo: 'Receber', historico: 'Taxa Condominial Ordinária - Ap 101', valor: 650.00, vencimento: '2026-11-10', competencia: '11/2026', formaMonetariaId: 'fm_1', fornecedor: 'Carlos Eduardo', status: 'Aberto' },
                { id: 'fin_2', tipo: 'Pagar', historico: 'Manutenção Preventiva Elevadores', valor: 1200.00, vencimento: '2026-11-05', competencia: '11/2026', formaMonetariaId: 'fm_2', fornecedor: 'Otis Elevadores', status: 'Baixado' }
            ],
            formas_monetarias: [
                { id: 'fm_1', nome: 'Pix QR Code / Chave', contaId: 'cb_1', baixaAutomatica: true, status: 'Ativo' },
                { id: 'fm_2', nome: 'Boleto Bancário registrado', contaId: 'cb_1', baixaAutomatica: false, status: 'Ativo' },
                { id: 'fm_3', nome: 'Dinheiro / Espécie', contaId: 'cb_2', baixaAutomatica: true, status: 'Ativo' }
            ],
            contas_bancarias: [
                { id: 'cb_1', banco: 'Banco do Brasil', agencia: '1234-5', conta: '98765-4', saldo: 45800.00 },
                { id: 'cb_2', banco: 'Caixa Interno Condomínio', agencia: 'Interno', conta: 'Caixa', saldo: 1250.00 }
            ],
            moradores: [
                { id: 'mor_1', bloco: 'A', apartamento: '101', nome: 'Carlos Eduardo', email: 'carlos@email.com', telefone: '(41) 99999-1111', tipo: 'Proprietário', taxaMudanca: 'N/A' },
                { id: 'mor_2', bloco: 'B', apartamento: '304', nome: 'Mariana Silva', email: 'mariana@email.com', telefone: '(41) 98888-2222', tipo: 'Inquilino', taxaMudanca: 'Sim' }
            ],
            estoque: [
                { id: 'est_1', item: 'Lâmpada LED 12W', categoria: 'Elétrica', qtd: 4, minimo: 10, maximo: 50, localizacao: 'Almoxarifado' }
            ],
            dre_config: [
                { id: 'A', codigo: 'REC_BRUTA', label: '(+) RECEITA OPERACIONAL BRUTA', tipo: 'direto', operacao: 'somar_receitas' },
                { id: 'B', codigo: 'INADIMP', label: '(-) INADIMPLÊNCIA / ABATIMENTOS', tipo: 'direto', operacao: 'somar_pendencias' },
                { id: 'C', codigo: 'REC_LIQ', label: '(=) RECEITA OPERACIONAL LÍQUIDA', tipo: 'formula', formula: 'A - B' },
                { id: 'D', codigo: 'DESP_OP', label: '(-) DESPESAS OPERACIONAIS & MANUTENÇÃO', tipo: 'direto', operacao: 'somar_despesas' },
                { id: 'E', codigo: 'RES_LIQ', label: '(=) RESULTADO OPERACIONAL (SUPERÁVIT/DEFICIT)', tipo: 'formula', formula: 'C - D' }
            ],
            logs: []
        };

        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (!data) return DEFAULT_DATA;
                const parsed = JSON.parse(data);
                if (!parsed.formas_monetarias) parsed.formas_monetarias = DEFAULT_DATA.formas_monetarias;
                if (!parsed.dre_config) parsed.dre_config = DEFAULT_DATA.dre_config;
                return parsed;
            } catch (e) {
                return DEFAULT_DATA;
            }
        }

        function salvarDados(data) {
            try { localStorage.setItem('guardioes_bravo_db', JSON.stringify(data)); } catch (e) {}
        }

        let db = carregarDados();
        let sessao = { usuarioLogado: JSON.parse(sessionStorage.getItem('guardioes_sessao')) || null };
        let tabsState = { openTabs: ['dashboard'], activeTab: 'dashboard' };
        let finFiltros = { competencia: '', status: 'Todos', tipo: 'Todos', busca: '' };

        const MODULE_NAMES = {
            dashboard: 'Dashboard',
            financeiro: 'Contas Pagar/Receber',
            formas_monetarias: 'Formas Monetárias',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores / Unidades',
            estoque: 'Estoque de Produtos',
            relatorios: 'Relatórios Consolidados & DRE',
            usuarios: 'Gestão de Usuários',
            audit_log: 'Log de Auditoria'
        };

        function registrarLog(modulo, acao, detalhe) {
            const user = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            db.logs.unshift({ id: 'log_' + Date.now(), dataHora: new Date().toLocaleString('pt-BR'), modulo, acao, usuario: user, detalhe });
            salvarDados(db);
        }

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const userFound = db.usuarios.find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                if (matrixInterval) clearInterval(matrixInterval);
                sessao.usuarioLogado = userFound;
                sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound));
                registrarLog('Segurança', 'Login Sucesso', `Usuário ${userFound.usuario} logou.`);
                renderApp();
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            sessionStorage.removeItem('guardioes_sessao');
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById('app');

            if (!sessao.usuarioLogado) {
                container.innerHTML = renderTelaLogin();
                if (isTechMode) setTimeout(iniciarAnimacaoMatrix, 50);
                return;
            }

            container.innerHTML = `
                <div class="flex-1 flex overflow-hidden">
                    <aside id="sidebar-menu" class="w-64 bg-slate-900 text-slate-300 flex flex-col h-full border-r border-slate-800">
                        <div class="p-4 bg-slate-950 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold text-xl"><i class="fa-solid fa-shield-halved"></i></div>
                                <div><h1 class="font-bold text-white text-base leading-tight">Guardiões</h1><p class="text-xs text-teal-400">Gestão Condominial</p></div>
                            </div>
                        </div>

                        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase">Módulos Principais</p>
                            <button onclick="abrirModulo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</button>
                            <button onclick="abrirModulo('financeiro')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'financeiro' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-receipt w-5"></i> Contas Pagar/Receber</button>
                            <button onclick="abrirModulo('formas_monetarias')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'formas_monetarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-money-bill-transfer w-5"></i> Formas Monetárias</button>
                            <button onclick="abrirModulo('contas_bancarias')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'contas_bancarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-building-columns w-5"></i> Contas Bancárias / Caixa</button>
                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-users w-5"></i> Moradores</button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-boxes-stacked w-5"></i> Estoque</button>
                            <button onclick="abrirModulo('relatorios')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'relatorios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Relatórios & DRE</button>
                        </nav>

                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-200">${escapeHTML(sessao.usuarioLogado.nome)}</span>
                            <button onclick="encerrarSessao()" class="p-2 text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div class="bg-slate-200 border-b border-slate-300 flex items-center overflow-x-auto px-2 pt-2 gap-1 no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer ${tabsState.activeTab === tabId ? 'tab-active shadow-sm' : 'bg-slate-300 text-slate-600'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;

            if (tabsState.activeTab === 'dashboard') setTimeout(renderDashboardCharts, 100);
        }

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            if (moduloId === 'financeiro') btnNovoHtml = `<button onclick="renderModalNovoTitulo()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Título</button>`;
            else if (moduloId === 'formas_monetarias') btnNovoHtml = `<button onclick="renderModalFormaMonetaria()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Nova Forma Monetária</button>`;

            const headerGlobal = `
                <div class="flex items-center justify-between mb-6">
                    <div><h2 class="text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2><p class="text-xs text-slate-500">Módulo Ativo</p></div>
                    <div class="flex items-center gap-2">${btnNovoHtml}</div>
                </div>
            `;

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'financeiro': return headerGlobal + renderFinanceiroView();
                case 'formas_monetarias': return headerGlobal + renderFormasMonetariasView();
                case 'relatorios': return headerGlobal + renderRelatoriosView();
                default: return headerGlobal + `<div class="bg-white p-6 rounded-xl border">Módulo em execução normal.</div>`;
            }
        }

        // ==========================================
        // FINANCEIRO & BAIXAS (TOTAL / PARCIAL)
        // ==========================================
        function renderFinanceiroView() {
            let lista = db.financeiro || [];

            if (finFiltros.competencia.trim() !== '') {
                lista = lista.filter(f => (f.competencia || '').toLowerCase().includes(finFiltros.competencia.trim().toLowerCase()));
            }
            if (finFiltros.status !== 'Todos') lista = lista.filter(f => f.status === finFiltros.status);
            if (finFiltros.tipo !== 'Todos') lista = lista.filter(f => f.tipo === finFiltros.tipo);

            return `
                <div class="space-y-4">
                    <div class="bg-white p-3.5 rounded-xl shadow-sm border grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Competência (MM/AAAA)</label>
                            <input type="text" id="flt_comp" value="${escapeHTML(finFiltros.competencia)}" placeholder="Ex: 11/2026" oninput="atualizarFiltrosFinanceiros()" class="w-full p-2 border rounded text-xs font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Status</label>
                            <select id="flt_status" onchange="atualizarFiltrosFinanceiros()" class="w-full p-2 border rounded text-xs font-bold">
                                <option value="Todos" ${finFiltros.status === 'Todos' ? 'selected' : ''}>Todos os Status</option>
                                <option value="Aberto" ${finFiltros.status === 'Aberto' ? 'selected' : ''}>Aberto</option>
                                <option value="Baixado" ${finFiltros.status === 'Baixado' ? 'selected' : ''}>Baixado</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tipo</label>
                            <select id="flt_tipo" onchange="atualizarFiltrosFinanceiros()" class="w-full p-2 border rounded text-xs font-bold">
                                <option value="Todos" ${finFiltros.tipo === 'Todos' ? 'selected' : ''}>Todos os Tipos</option>
                                <option value="Receber" ${finFiltros.tipo === 'Receber' ? 'selected' : ''}>A Receber</option>
                                <option value="Pagar" ${finFiltros.tipo === 'Pagar' ? 'selected' : ''}>A Pagar</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-100 font-bold uppercase border-b">
                                <tr>
                                    <th class="p-3">Tipo</th>
                                    <th class="p-3">Descrição / Histórico</th>
                                    <th class="p-3">Competência</th>
                                    <th class="p-3">Vencimento</th>
                                    <th class="p-3">Valor</th>
                                    <th class="p-3">Status</th>
                                    <th class="p-3 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${lista.map(f => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${f.tipo === 'Receber' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${escapeHTML(f.tipo)}</span></td>
                                        <td class="p-3 font-bold text-slate-800">${escapeHTML(f.historico)}</td>
                                        <td class="p-3">${escapeHTML(f.competencia || 'N/A')}</td>
                                        <td class="p-3">${escapeHTML(f.vencimento)}</td>
                                        <td class="p-3 font-bold">R$ ${Number(f.valor).toFixed(2)}</td>
                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${f.status === 'Baixado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${escapeHTML(f.status)}</span></td>
                                        <td class="p-3 text-right space-x-1">
                                            <button onclick="abrirModalBaixaTitulo('${f.id}')" title="Liquidar / Baixar" class="p-1.5 text-emerald-600 hover:bg-emerald-50 rounded"><i class="fa-solid fa-circle-check"></i></button>
                                            <button onclick="excluirItemGenerico('financeiro', '${f.id}')" title="Excluir" class="p-1.5 text-red-600 hover:bg-red-50 rounded"><i class="fa-solid fa-trash-can"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function atualizarFiltrosFinanceiros() {
            finFiltros.competencia = document.getElementById('flt_comp').value;
            finFiltros.status = document.getElementById('flt_status').value;
            finFiltros.tipo = document.getElementById('flt_tipo').value;
            renderApp();
        }

        function abrirModalBaixaTitulo(id) {
            const f = db.financeiro.find(x => x.id === id);
            if (!f) return;

            const html = `
                <div id="modal_baixa" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">Liquidar / Baixar Título</h3>
                            <button onclick="fecharModal('modal_baixa')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="executarBaixaTitulo(event, '${f.id}')" class="p-6 space-y-4">
                            <p class="text-xs font-bold text-slate-800">${escapeHTML(f.historico)} - Valor Original: <span class="text-teal-700">R$ ${f.valor.toFixed(2)}</span></p>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tipo de Baixa</label>
                                <select id="bx_modalidade" onchange="toggleValorParcial()" class="w-full p-2 border rounded text-xs font-bold">
                                    <option value="total">Baixa Total (Integral)</option>
                                    <option value="parcial">Baixa Parcial (Gerar Título de Resíduo)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Valor Pago / Liquidado (R$)</label>
                                <input type="number" step="0.01" id="bx_valor" value="${f.valor}" readonly required class="w-full p-2 border rounded text-xs font-bold bg-slate-100">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Forma Monetária de Pagamento</label>
                                <select id="bx_forma" class="w-full p-2 border rounded text-xs font-bold">
                                    ${db.formas_monetarias.filter(m => m.status === 'Ativo').map(m => `<option value="${m.id}">${escapeHTML(m.nome)}</option>`).join('')}
                                </select>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_baixa')" class="px-3 py-1.5 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white rounded text-xs font-bold">Confirmar Liquidação</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function toggleValorParcial() {
            const mod = document.getElementById('bx_modalidade').value;
            const inputVal = document.getElementById('bx_valor');
            if (mod === 'parcial') {
                inputVal.removeAttribute('readonly');
                inputVal.classList.remove('bg-slate-100');
            } else {
                inputVal.setAttribute('readonly', 'true');
                inputVal.classList.add('bg-slate-100');
            }
        }

        function executarBaixaTitulo(e, id) {
            e.preventDefault();
            const f = db.financeiro.find(x => x.id === id);
            if (!f) return;

            const mod = document.getElementById('bx_modalidade').value;
            const valPago = parseFloat(document.getElementById('bx_valor').value) || 0;
            const formaId = document.getElementById('bx_forma').value;

            if (valPago <= 0 || valPago > f.valor) {
                alert('Valor pago inválido!');
                return;
            }

            if (mod === 'parcial' && valPago < f.valor) {
                const residuo = f.valor - valPago;
                f.valor = valPago;
                f.status = 'Baixado';
                f.formaMonetariaId = formaId;

                db.financeiro.push({
                    id: 'fin_' + Date.now(),
                    tipo: f.tipo,
                    historico: `${f.historico} (Resíduo)`,
                    valor: residuo,
                    vencimento: f.vencimento,
                    competencia: f.competencia,
                    fornecedor: f.fornecedor,
                    status: 'Aberto'
                });

                registrarLog('Financeiro', 'Baixa Parcial', `Título "${f.historico}" baixado em R$ ${valPago}. Criado resíduo de R$ ${residuo}.`);
            } else {
                f.status = 'Baixado';
                f.formaMonetariaId = formaId;
                registrarLog('Financeiro', 'Baixa Total', `Título "${f.historico}" liquidado totalmente.`);
            }

            salvarDados(db);
            fecharModal('modal_baixa');
            renderApp();
        }

        // ==========================================
        // MÓDULO FORMAS MONETÁRIAS
        // ==========================================
        function renderFormasMonetariasView() {
            return `
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left text-xs">

                                <th class="p-3">Conta Bancária Vinculada</th>

                                <th class="p-3">Status</th>
                                <th class="p-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${db.formas_monetarias.map(m => {

                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.baixaAutomatica ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">${m.baixaAutomatica ? 'Sim (Liquida na hora)' : 'Não (Compensação Pendente)'}</span></td>
                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.status === 'Ativo' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${m.status}</span></td>
                                        <td class="p-3 text-right space-x-1">
                                            <button onclick="toggleStatusForma('${m.id}')" class="p-1.5 text-amber-600 hover:bg-amber-50 rounded" title="Alternar Status"><i class="fa-solid fa-ban"></i></button>
                                            <button onclick="excluirItemGenerico('formas_monetarias', '${m.id}')" class="p-1.5 text-red-600 hover:bg-red-50 rounded" title="Excluir"><i class="fa-solid fa-trash-can"></i></button>

                                    </tr>
                                `;

                    </table>

        }

        function renderModalFormaMonetaria() {
            const html = `
                <div id="modal_fm" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">Nova Forma Monetária</h3>
                            <button onclick="fecharModal('modal_fm')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarFormaMonetaria(event)" class="p-6 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome do Meio / Forma</label>
                                <input type="text" id="fm_nome" required placeholder="Ex: Cartão de Débito" class="w-full p-2 border rounded text-xs font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Conta Bancária / Caixa de Destino</label>
                                <select id="fm_conta" class="w-full p-2 border rounded text-xs font-bold">
                                    ${db.contas_bancarias.map(c => `<option value="${c.id}">${escapeHTML(c.banco)}</option>`).join('')}
                                </select>
                            </div>
                            <label class="flex items-center gap-2 cursor-pointer pt-2 font-bold text-xs text-teal-800">
                                <input type="checkbox" id="fm_baixa" checked class="rounded text-teal-600 w-4 h-4">
                                Liquidar e baixar automaticamente ao selecionar
                            </label>
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_fm')" class="px-3 py-1.5 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-3 py-1.5 bg-teal-600 text-white rounded text-xs font-bold">Salvar Forma</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarFormaMonetaria(e) {
            e.preventDefault();
            const nome = document.getElementById('fm_nome').value.trim();
            const contaId = document.getElementById('fm_conta').value;
            const baixa = document.getElementById('fm_baixa').checked;

            db.formas_monetarias.push({ id: 'fm_' + Date.now(), nome, contaId, baixaAutomatica: baixa, status: 'Ativo' });
            salvarDados(db);
            fecharModal('modal_fm');
            renderApp();
        }

        function toggleStatusForma(id) {
            const m = db.formas_monetarias.find(x => x.id === id);
            if (m) {
                m.status = m.status === 'Ativo' ? 'Inativo' : 'Ativo';
                salvarDados(db);
                renderApp();
            }
        }

        // ==========================================
        // DRE & DEMAIS COMPONENTES
        // ==========================================
        function renderRelatoriosView() {
            const recTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pagTotal = db.financeiro.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pendTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((a, b) => a + b.valor, 0);

            const calculosDRE = { A: recTotal, B: pendTotal, C: recTotal - pendTotal, D: pagTotal, E: (recTotal - pendTotal) - pagTotal };

            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-base text-slate-800">Demonstração do Resultado do Exercício (DRE)</h3>
                            <span class="px-3 py-1 rounded-full text-xs font-extrabold ${calculosDRE.E >= 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${calculosDRE.E >= 0 ? 'SUPERÁVIT' : 'DEFICIT'}: R$ ${Math.abs(calculosDRE.E).toFixed(2)}
                            </span>
                        </div>
                        <table class="w-full text-left text-xs">
                            <tbody class="divide-y">
                                ${(db.dre_config || []).map(row => `
                                    <tr class="${row.tipo === 'formula' ? 'bg-slate-50 font-bold' : ''}">
                                        <td class="p-3 font-extrabold text-teal-700">${row.id}</td>
                                        <td class="p-3">${escapeHTML(row.label)}</td>
                                        <td class="p-3 text-right font-bold">R$ ${(calculosDRE[row.id] || 0).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderDashboardView() {
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl border"><p class="text-xs font-bold text-slate-500 uppercase">Receitas em Aberto</p><h3 class="text-xl font-extrabold text-emerald-600">R$ ${db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0).toFixed(2)}</h3></div>
                    <div class="bg-white p-4 rounded-xl border"><p class="text-xs font-bold text-slate-500 uppercase">Despesas em Aberto</p><h3 class="text-xl font-extrabold text-rose-600">R$ ${db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0).toFixed(2)}</h3></div>
                    <div class="bg-white p-4 rounded-xl border"><p class="text-xs font-bold text-slate-500 uppercase">Total de Moradores</p><h3 class="text-xl font-extrabold text-slate-800">${db.moradores.length}</h3></div>
                </div>
            `;
        }

        function renderDashboardCharts() {}

        function renderTelaLogin() {
            return `
                <div class="min-h-screen relative overflow-hidden tech-mode flex items-center justify-center p-4">
                    <canvas id="matrixCanvas" class="absolute inset-0 pointer-events-none opacity-40 z-0"></canvas>
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden relative z-10 tech-card">
                        <div class="p-8 text-center bg-slate-950 text-cyan-400 border-b border-cyan-800">

                            <h2 class="text-2xl font-bold tracking-wide">Guardiões do Bravo</h2>

                            <div><label class="block text-xs font-bold uppercase mb-1">Senha</label><input type="password" id="login_pass" required class="w-full p-2.5 rounded text-sm font-bold tech-input"></div>

            `;
        }

        function iniciarAnimacaoMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '0123456789ABCDEFGUARDIOSBRAVO';
            const drops = Array(Math.floor(canvas.width / 14)).fill(1);
            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(() => {
                ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#06b6d4';
                ctx.font = '14px monospace';
                drops.forEach((y, i) => {
                    ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * 14, y * 14);
                    if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }, 33);
        }

        function excluirItemGenerico(modKey, itemId) {
            if (confirm('Deseja excluir este registro?')) {
                db[modKey] = db[modKey].filter(x => x.id !== itemId);
                salvarDados(db);
                renderApp();
            }
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        window.addEventListener('DOMContentLoaded', () => { renderApp(); });
    </script>
