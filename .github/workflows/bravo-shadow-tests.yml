name: Bravo Shadow — testes automatizados

on:
  push:
    branches:
      - bravo-shadow
    paths:
      - "bravo-shadow/README.md"
      - "bravo-shadow/docs/plano-integrado-aceleracao-entrega.md"
      - "bravo-shadow/backend/**"
      - "bravo-shadow/frontend/**"
      - "bravo-shadow/Dockerfile"
      - "main.py"
      - "requirements.txt"
      - "bravo-shadow/.dockerignore"
      - "bravo-shadow/docs/verificar-privilegios-rls-somente-leitura.sql"
      - "bravo-shadow/docs/contrato-pacote-evidencias-preparacao.md"
      - "bravo-shadow/docs/catalogo-dominios-legado-e-status-contratos.md"
      - "bravo-shadow/supabase/**"
      - "bravo-shadow/scripts/homologar-local.sh"
      - "bravo-shadow/scripts/validar-catalogo-local.sql"
      - ".github/workflows/bravo-shadow-tests.yml"
  pull_request:
    paths:
      - "bravo-shadow/backend/**"
      - "bravo-shadow/frontend/**"
      - "bravo-shadow/Dockerfile"
      - "bravo-shadow/.dockerignore"
      - "bravo-shadow/docs/verificar-privilegios-rls-somente-leitura.sql"
      - "bravo-shadow/docs/contrato-pacote-evidencias-preparacao.md"
      - "bravo-shadow/docs/catalogo-dominios-legado-e-status-contratos.md"
      - "bravo-shadow/supabase/**"
      - "bravo-shadow/scripts/homologar-local.sh"
      - "bravo-shadow/scripts/validar-catalogo-local.sql"
      - ".github/workflows/bravo-shadow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bravo-shadow-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  container-build:
    name: Docker / build de demonstração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Construir imagem portátil
        run: docker build -f bravo-shadow/Dockerfile -t bravo-shadow:ci ./bravo-shadow

      - name: Iniciar contêiner para smoke test
        run: >-
          docker run -d --name bravo-shadow-smoke -p 8000:8000
          -e BRAVO_STORAGE_BACKEND=postgres
          -e BRAVO_DATABASE_URL=postgresql://bravo_ci:bravo_ci@127.0.0.1:5432/bravo_ci_unused
          -e GOOGLE_CLIENT_ID=000000000000-bravo-shadow-ci.apps.googleusercontent.com
          bravo-shadow:ci

      - name: Validar interface e API dentro do contêiner
        run: |
          trap 'docker rm -f bravo-shadow-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/health > /tmp/bravo-health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/bravo-health.json
          curl --fail --silent http://localhost:8000/ | grep -q 'Bravo Shadow'
          curl --fail --silent http://localhost:8000/docs >/dev/null

  backend-unit-tests:
    name: Backend / testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bravo-shadow/backend
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bravo-shadow/backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes sem dependência de PostgreSQL real
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -v --durations=20 -ra
          -o faulthandler_timeout=120
          --ignore=tests/test_postgres_inventory_integration.py
          --ignore=tests/test_migration_review_postgres_integration.py
          --ignore=tests/test_usuarios_admin_postgres_integration.py
          --ignore=tests/test_google_identity_postgres_integration.py

  backend-postgres-integration:
    name: Backend / integrações PostgreSQL descartável
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bravo_test
          POSTGRES_PASSWORD: bravo_test
          POSTGRES_DB: bravo_shadow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bravo_test -d bravo_shadow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: bravo-shadow/backend
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bravo-shadow/backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Aplicar migrations e auditar schema no PostgreSQL descartável
        env:
          BRAVO_SHADOW_TEST_DATABASE_URL: postgresql://bravo_test:bravo_test@127.0.0.1:5432/bravo_shadow_test
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          root = Path("..")
          migrations = sorted((root / "supabase" / "migrations").glob("*.sql"))
          if len(migrations) != 7:
              raise SystemExit(f"Esperadas 7 migrations; encontradas {len(migrations)}.")

          with psycopg.connect(
              os.environ["BRAVO_SHADOW_TEST_DATABASE_URL"],
              autocommit=True,
          ) as connection:
              for role in ("anon", "authenticated", "service_role"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_roles WHERE rolname = %s", (role,)
                  ).fetchone()
                  if exists is None:
                      connection.execute(f'CREATE ROLE "{role}" NOLOGIN')

              for migration in migrations:
                  print(f"Aplicando {migration.name}")
                  connection.execute(
                      migration.read_text(encoding="utf-8"), prepare=False
                  )

              audit = root / "scripts" / "validar-catalogo-local.sql"
              print(f"Auditando catálogo: {audit.name}")
              connection.execute(audit.read_text(encoding="utf-8"), prepare=False)

          print("Sete migrations aplicadas e auditoria do catálogo concluída.")
          PY

      - name: Executar inspeção SQL somente leitura no PostgreSQL descartável
        env:
          BRAVO_SHADOW_TEST_DATABASE_URL: postgresql://bravo_test:bravo_test@127.0.0.1:5432/bravo_shadow_test
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          script = Path("../docs/verificar-privilegios-rls-somente-leitura.sql")
          sql = script.read_text(encoding="utf-8")
          with psycopg.connect(
              os.environ["BRAVO_SHADOW_TEST_DATABASE_URL"],
              autocommit=True,
          ) as connection:
              connection.execute(sql, prepare=False)
          print("Inspeção de catálogo concluída em PostgreSQL descartável; somente leitura.")
          PY

      - name: Executar integrações PostgreSQL
        env:
          PYTHONPATH: .
          BRAVO_SHADOW_TEST_DATABASE_URL: postgresql://bravo_test:bravo_test@127.0.0.1:5432/bravo_shadow_test
          BRAVO_SHADOW_ALLOW_DESTRUCTIVE_TEST_DATABASE: "1"
        run: >-
          python -m pytest -v --durations=20 -ra
          -o faulthandler_timeout=120
          tests/test_postgres_inventory_integration.py
          tests/test_migration_review_postgres_integration.py
          tests/test_usuarios_admin_postgres_integration.py
          tests/test_google_identity_postgres_integration.py
