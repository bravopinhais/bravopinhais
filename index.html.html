<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Segura</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 3px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .tech-mode { background-color: #030712 !important; color: #22d3ee !important; }
        .tech-card {
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid #06b6d4 !important;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3) !important;
            backdrop-filter: blur(8px);
        }
        .tech-input { background-color: #020617 !important; border-color: #0891b2 !important; color: #22d3ee !important; }

        .sidebar-full {
            height: 100vh;
            position: sticky;
            top: 0;
        }

        @media print {
            aside, header, .no-print, button { display: none !important; }
            body { background: white !important; color: black !important; }
            main { padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        window.imagemAnexadaBase64 = '';
        let isTechMode = true;
        let matrixInterval = null;

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        const DEFAULT_DATA = {
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345' },
                { id: 'usr_sindico', usuario: 'sindico', nome: 'João da Silva', email: 'sindico@guardioes.com', perfil: 'Síndico', status: 'Ativo', primeiroAcesso: false, senhaHash: '123456' }
            ],
            financeiro: [
                { id: 'fin_1', tipo: 'Receber', historico: 'Taxa Condominial Ordinária - Ap 101', valor: 2500.00, vencimento: '2026-10-15', competencia: '10/2026', formaMonetariaId: 'fm_1', fornecedor: 'Carlos Eduardo', status: 'Aberto' },
                { id: 'fin_2', tipo: 'Pagar', historico: 'Manutenção Preventiva Elevadores', valor: 1200.00, vencimento: '2026-11-05', competencia: '11/2026', formaMonetariaId: 'fm_2', fornecedor: 'Otis Elevadores', status: 'Baixado' }
            ],
            formas_monetarias: [
                { id: 'fm_1', nome: '4, MOVIMENTO BANCARIO', contaId: 'cb_1', multaPct: 2.0, jurosDiaPct: 0.033, baixaAutomatica: true, status: 'Ativo' },
                { id: 'fm_2', nome: 'BOLETO BANCARIO', contaId: 'cb_1', multaPct: 2.0, jurosDiaPct: 0.033, baixaAutomatica: false, status: 'Ativo' },
                { id: 'fm_3', nome: 'ESPECIE / CAIXA', contaId: 'cb_2', multaPct: 0.0, jurosDiaPct: 0.0, baixaAutomatica: true, status: 'Ativo' }
            ],
            contas_bancarias: [
                { id: 'cb_1', banco: '1, CAIXA BARAO', agencia: '1234-5', conta: '98765-4', saldo: 45800.00 },
                { id: 'cb_2', banco: 'CAIXA INTERNO', agencia: 'Interno', conta: 'Caixa', saldo: 1250.00 }
            ],
            moradores: [
                { id: 'mor_1', bloco: 'A', apartamento: '101', nome: 'Carlos Eduardo', email: 'carlos@email.com', telefone: '(41) 99999-1111', tipo: 'Proprietário', taxaMudanca: 'N/A' },
                { id: 'mor_2', bloco: 'B', apartamento: '304', nome: 'Mariana Silva', email: 'mariana@email.com', telefone: '(41) 98888-2222', tipo: 'Inquilino', taxaMudanca: 'Sim' }
            ],
            estoque: [
                { id: 'est_1', item: 'Lâmpada LED 12W', categoria: 'Elétrica', qtd: 4, minimo: 10, maximo: 50, localizacao: 'Almoxarifado Central', proximoBalanco: '2026-10-20' },
                { id: 'est_2', item: 'Cloro Granulado 10kg', categoria: 'Piscina', qtd: 15, minimo: 5, maximo: 30, localizacao: 'DML Piscina', proximoBalanco: '2026-11-15' }
            ],
            dre_config: [
                { id: 'A', codigo: 'REC_BRUTA', label: '(+) RECEITA OPERACIONAL BRUTA', tipo: 'direto', operacao: 'somar_receitas' },
                { id: 'B', codigo: 'INADIMP', label: '(-) INADIMPLÊNCIA / ABATIMENTOS', tipo: 'direto', operacao: 'somar_pendencias' },
                { id: 'C', codigo: 'REC_LIQ', label: '(=) RECEITA OPERACIONAL LÍQUIDA', tipo: 'formula', formula: 'A - B' },
                { id: 'D', codigo: 'DESP_OP', label: '(-) DESPESAS OPERACIONAIS & MANUTENÇÃO', tipo: 'direto', operacao: 'somar_despesas' },
                { id: 'E', codigo: 'RES_LIQ', label: '(=) RESULTADO OPERACIONAL (SUPERÁVIT/DEFICIT)', tipo: 'formula', formula: 'C - D' }
            ],
            logs: []
        };

        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (!data) return DEFAULT_DATA;
                const parsed = JSON.parse(data);
                if (!parsed.formas_monetarias) parsed.formas_monetarias = DEFAULT_DATA.formas_monetarias;
                if (!parsed.usuarios) parsed.usuarios = DEFAULT_DATA.usuarios;
                if (!parsed.dre_config) parsed.dre_config = DEFAULT_DATA.dre_config;
                return parsed;
            } catch (e) {
                return DEFAULT_DATA;
            }
        }

        function salvarDados(data) {
            try { localStorage.setItem('guardioes_bravo_db', JSON.stringify(data)); } catch (e) {}
        }

        let db = carregarDados();
        let sessao = { usuarioLogado: JSON.parse(sessionStorage.getItem('guardioes_sessao')) || null };
        let tabsState = { openTabs: ['dashboard'], activeTab: 'dashboard' };
        let finFiltros = { competencia: '', status: 'Todos', tipo: 'Todos', busca: '' };
        let itensGridBaixa = [];

        const MODULE_NAMES = {
            dashboard: 'Dashboard',
            financeiro: 'Contas Pagar/Receber',
            formas_monetarias: 'Formas Monetárias',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores / Unidades',
            estoque: 'Estoque de Produtos',
            relatorios: 'Relatórios Consolidados & DRE',
            usuarios: 'Gestão de Usuários',
            audit_log: 'Log de Auditoria'
        };

        function registrarLog(modulo, acao, detalhe) {
            const user = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            db.logs.unshift({ id: 'log_' + Date.now(), dataHora: new Date().toLocaleString('pt-BR'), modulo, acao, usuario: user, detalhe });
            salvarDados(db);
        }

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            fecharMenuMobile();
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
        }

        function toggleMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        function fecharMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const lembrar = document.getElementById('login_remember').checked;
            const userFound = db.usuarios.find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                if (matrixInterval) clearInterval(matrixInterval);
                sessao.usuarioLogado = userFound;
                sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound));

                if (lembrar) {
                    localStorage.setItem('guardioes_remember_user', userInput);
                } else {
                    localStorage.removeItem('guardioes_remember_user');
                }

                registrarLog('Segurança', 'Login Sucesso', `Usuário ${userFound.usuario} logou.`);
                renderApp();
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            sessionStorage.removeItem('guardioes_sessao');
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById('app');

            if (!sessao.usuarioLogado) {
                container.innerHTML = renderTelaLogin();
                const savedUser = localStorage.getItem('guardioes_remember_user');
                if (savedUser && document.getElementById('login_user')) {
                    document.getElementById('login_user').value = savedUser;
                    document.getElementById('login_remember').checked = true;
                }
                if (isTechMode) setTimeout(iniciarAnimacaoMatrix, 50);
                return;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col md:flex-row min-h-screen">
                    <div id="sidebar-backdrop" onclick="fecharMenuMobile()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden"></div>

                    <aside id="sidebar-menu" class="fixed md:sticky top-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col sidebar-full border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
                        <div class="p-4 bg-slate-950 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold text-xl shadow"><i class="fa-solid fa-shield-halved"></i></div>
                                <div><h1 class="font-bold text-white text-base leading-tight">Guardiões</h1><p class="text-xs text-teal-400">Gestão Condominial</p></div>
                            </div>
                            <button onclick="fecharMenuMobile()" class="md:hidden text-slate-400 hover:text-white p-2">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos Principais</p>
                            <button onclick="abrirModulo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</button>
                            <button onclick="abrirModulo('financeiro')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'financeiro' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-receipt w-5 text-center"></i> Contas Pagar/Receber</button>
                            <button onclick="abrirModulo('formas_monetarias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'formas_monetarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-money-bill-transfer w-5 text-center"></i> Formas Monetárias</button>
                            <button onclick="abrirModulo('contas_bancarias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'contas_bancarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-building-columns w-5 text-center"></i> Contas Bancárias / Caixa</button>
                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-users w-5 text-center"></i> Moradores</button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Estoque & Inventário</button>
                            <button onclick="abrirModulo('relatorios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'relatorios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Relatórios & DRE</button>
                            <button onclick="abrirModulo('usuarios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'usuarios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-gear w-5 text-center"></i> Gestão de Usuários</button>
                        </nav>

                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-200 truncate pr-2">${escapeHTML(sessao.usuarioLogado.nome)}</span>
                            <button onclick="encerrarSessao()" title="Sair" class="p-2 text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
                        <header class="bg-slate-900 text-white p-3 flex md:hidden items-center justify-between border-b border-slate-800 no-print">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleMenuMobile()" class="p-2 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700">
                                    <i class="fa-solid fa-bars text-lg"></i>
                                </button>
                                <span class="font-bold text-sm">Guardiões do Bravo</span>
                            </div>
                            <button onclick="encerrarSessao()" class="text-xs bg-red-600/20 text-red-400 px-2.5 py-1.5 rounded-md font-bold">Sair</button>
                        </header>

                        <div class="bg-slate-200 border-b border-slate-300 flex items-center overflow-x-auto px-2 pt-2 gap-1 no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer ${tabsState.activeTab === tabId ? 'tab-active shadow-sm' : 'bg-slate-300 text-slate-600'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;

            if (tabsState.activeTab === 'dashboard') setTimeout(renderDashboardCharts, 100);
        }

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            if (moduloId === 'financeiro') btnNovoHtml = `<button onclick="renderModalNovoTitulo()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-plus"></i> Novo Título</button>`;
            else if (moduloId === 'formas_monetarias') btnNovoHtml = `<button onclick="renderModalFormaMonetaria()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-plus"></i> Nova Forma Monetária</button>`;
            else if (moduloId === 'moradores') btnNovoHtml = `<button onclick="renderModalMorador()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            else if (moduloId === 'contas_bancarias') btnNovoHtml = `<button onclick="renderModalContaBancaria()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-plus"></i> Nova Conta Bancária</button>`;
            else if (moduloId === 'estoque') btnNovoHtml = `<button onclick="renderModalEstoque()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-plus"></i> Novo Item no Estoque</button>`;
            else if (moduloId === 'usuarios') btnNovoHtml = `<button onclick="renderModalUsuario()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm"><i class="fa-solid fa-user-plus"></i> Novo Usuário</button>`;

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                    <div><h2 class="text-xl md:text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2><p class="text-xs text-slate-500">Módulo Ativo</p></div>
                    <div class="flex items-center gap-2">${btnNovoHtml}</div>
                </div>
            `;

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'financeiro': return headerGlobal + renderFinanceiroView();
                case 'formas_monetarias': return headerGlobal + renderFormasMonetariasView();
                case 'moradores': return headerGlobal + renderMoradoresView();
                case 'contas_bancarias': return headerGlobal + renderContasBancariasView();
                case 'estoque': return headerGlobal + renderEstoqueView();
                case 'relatorios': return headerGlobal + renderRelatoriosView();
                case 'usuarios': return headerGlobal + renderUsuariosView();
                default: return headerGlobal + `<div class="bg-white p-6 rounded-xl border">Módulo em execução normal.</div>`;
            }
        }

        // ==========================================
        // DASHBOARD COM GRÁFICOS
        // ==========================================
        function renderDashboardView() {
            const recAberto = db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0);
            const pagAberto = db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs font-bold text-slate-500 uppercase">A Receber em Aberto</p><h3 class="text-xl font-extrabold text-emerald-600">R$ ${recAberto.toFixed(2)}</h3></div>
                        <div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs font-bold text-slate-500 uppercase">A Pagar em Aberto</p><h3 class="text-xl font-extrabold text-rose-600">R$ ${pagAberto.toFixed(2)}</h3></div>
                        <div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs font-bold text-slate-500 uppercase">Itens no Estoque</p><h3 class="text-xl font-extrabold text-slate-800">${db.estoque.length}</h3></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-5 rounded-xl border shadow-sm">
                            <h4 class="font-bold text-xs uppercase text-slate-500 mb-4">Composição Financeira (Entradas vs Saídas)</h4>
                            <div class="h-64 flex items-center justify-center">
                                <canvas id="chartDonut"></canvas>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border shadow-sm">
                            <h4 class="font-bold text-xs uppercase text-slate-500 mb-4">Fluxo de Caixa Operacional</h4>
                            <div class="h-64 flex items-center justify-center">
                                <canvas id="chartBar"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboardCharts() {
            const ctxDonut = document.getElementById('chartDonut');
            const ctxBar = document.getElementById('chartBar');

            if (ctxDonut) {
                const recQuat = db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Baixado').reduce((a,b)=>a+b.valor,0);
                const pagQuat = db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Baixado').reduce((a,b)=>a+b.valor,0);

                new Chart(ctxDonut, {
                    type: 'doughnut',
                    data: {
                        labels: ['Receitas Quitadas', 'Despesas Quitadas'],
                        datasets: [{ data: [recQuat || 1, pagQuat || 1], backgroundColor: ['#059669', '#e11d48'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            if (ctxBar) {
                new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: ['Receber Aberto', 'Receber Baixado', 'Pagar Aberto', 'Pagar Baixado'],
                        datasets: [{
                            label: 'Valores (R$)',
                            data: [
                                db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0),
                                db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Baixado').reduce((a,b)=>a+b.valor,0),
                                db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0),
                                db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Baixado').reduce((a,b)=>a+b.valor,0)
                            ],
                            backgroundColor: ['#34d399', '#059669', '#f87171', '#e11d48']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        // ==========================================
        // MÓDULO GESTÃO DE USUÁRIOS
        // ==========================================

        // ==========================================

        // ==========================================
        function renderRelatoriosView() {
            const recTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pagTotal = db.financeiro.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pendTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((a, b) => a + b.valor, 0);

            const calculosDRE = { A: recTotal, B: pendTotal, C: recTotal - pendTotal, D: pagTotal, E: (recTotal - pendTotal) - pagTotal };

            return `
                <div class="space-y-6">
                    <div class="flex justify-end no-print">
                        <button onclick="window.print()" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold flex items-center gap-2 shadow">
                            <i class="fa-solid fa-print"></i> Imprimir / Exportar PDF
                        </button>

                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-base text-slate-800">Demonstração do Resultado do Exercício (DRE)</h3>
                            <span class="px-3 py-1 rounded-full text-xs font-extrabold ${calculosDRE.E >= 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${calculosDRE.E >= 0 ? 'SUPERÁVIT' : 'DEFICIT'}: R$ ${Math.abs(calculosDRE.E).toFixed(2)}
                            </span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <tbody class="divide-y">
                                    ${(db.dre_config || []).map(row => `
                                        <tr class="${row.tipo === 'formula' ? 'bg-slate-50 font-bold' : ''}">

                                            <td class="p-3 text-right font-bold">R$ ${(calculosDRE[row.id] || 0).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function recalcularValoresBaixa(tituloId) {
            const f = db.financeiro.find(x => x.id === tituloId);
            if (!f) return;

            const formaId = document.getElementById('bx_forma_sel').value;
            const forma = db.formas_monetarias.find(m => m.id === formaId);
            const dataComp = document.getElementById('bx_data_comp').value;

            let multa = 0;
            let juros = 0;

            if (forma && f.vencimento && dataComp > f.vencimento) {
                const diffMs = new Date(dataComp) - new Date(f.vencimento);
                const diasAtraso = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

                if (diasAtraso > 0) {
                    multa = (f.valor * (forma.multaPct || 0)) / 100;
                    juros = f.valor * ((forma.jurosDiaPct || 0) / 100) * diasAtraso;
                }
            }

            document.getElementById('bx_multa').value = multa.toFixed(2);
            document.getElementById('bx_juros').value = juros.toFixed(2);
            recalcularValoresBaixaManualmente();
        }

        function recalcularValoresBaixaManualmente() {
            const bruto = parseFloat(document.getElementById('bx_val_bruto').value) || 0;
            const multa = parseFloat(document.getElementById('bx_multa').value) || 0;
            const juros = parseFloat(document.getElementById('bx_juros').value) || 0;
            const taxa = parseFloat(document.getElementById('bx_taxa').value) || 0;
            const desconto = parseFloat(document.getElementById('bx_desconto').value) || 0;

            const liquido = bruto + multa + juros + taxa - desconto;
            document.getElementById('bx_val_liquido').value = liquido.toFixed(2);
        }

        function adicionarItemNaGrelhaBaixa() {
            const formaText = document.getElementById('bx_forma_sel').options[document.getElementById('bx_forma_sel').selectedIndex].text;

            const multa = parseFloat(document.getElementById('bx_multa').value) || 0;
            const juros = parseFloat(document.getElementById('bx_juros').value) || 0;
            const taxa = parseFloat(document.getElementById('bx_taxa').value) || 0;
            const desconto = parseFloat(document.getElementById('bx_desconto').value) || 0;
            const liquido = parseFloat(document.getElementById('bx_val_liquido').value) || 0;

            itensGridBaixa.push({ forma: formaText, bruto, multa, juros, taxa, desconto, liquido });

            const tbody = document.getElementById('tbl_body_grid_baixa');
            tbody.innerHTML = itensGridBaixa.map(i => `
                <tr class="font-bold">
                    <td class="p-2.5">${escapeHTML(i.forma)}</td>
                    <td class="p-2.5">R$ ${i.bruto.toFixed(2)}</td>

                    <td class="p-2.5 text-teal-800">R$ ${i.liquido.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        function confirmarEFinalizarBaixa(id) {
            const f = db.financeiro.find(x => x.id === id);
            if (!f) return;

            const valBaixa = parseFloat(document.getElementById('bx_val_baixa').value) || 0;
            const formaId = document.getElementById('bx_forma_sel').value;

            if (valBaixa <= 0) {
                alert('Informe um valor de baixa válido!');
                return;
            }

            if (valBaixa < f.valor) {
                const residuo = f.valor - valBaixa;
                f.valor = valBaixa;
                f.status = 'Baixado';
                f.formaMonetariaId = formaId;

                db.financeiro.push({
                    id: 'fin_' + Date.now(),
                    tipo: f.tipo,
                    historico: `${f.historico} (Resíduo)`,
                    valor: residuo,
                    vencimento: f.vencimento,
                    competencia: f.competencia,
                    fornecedor: f.fornecedor,
                    status: 'Aberto'
                });

                registrarLog('Financeiro', 'Baixa Parcial', `Título "${f.historico}" liquidado em R$ ${valBaixa}. Gerado resíduo automático de R$ ${residuo.toFixed(2)}.`);
            } else {
                f.status = 'Baixado';
                f.formaMonetariaId = formaId;
                registrarLog('Financeiro', 'Baixa Total', `Título "${f.historico}" liquidado integralmente.`);
            }

            salvarDados(db);
            fecharModal('modal_pagar_parcial');
            renderApp();
        }

                                            <td class="p-3 font-bold text-slate-800">${escapeHTML(m.nome)}</td>
                                            <td class="p-3 font-bold text-slate-700">${(m.multaPct || 0).toFixed(2)}%</td>
                                            <td class="p-3 font-bold text-slate-700">${(m.jurosDiaPct || 0).toFixed(3)}%</td>
                                            <td class="p-3 font-semibold text-teal-700">${conta ? escapeHTML(conta.banco) : 'Caixa Interno'}</td>
                                            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.status === 'Ativo' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${m.status}</span></td>
                                            <td class="p-3 text-right space-x-1">
                                                <button onclick="renderModalFormaMonetaria('${m.id}')" title="Editar Forma" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded"><i class="fa-solid fa-pen-to-square"></i></button>
                                                <button onclick="excluirItemGenerico('formas_monetarias', '${m.id}')" class="p-1.5 text-red-600 hover:bg-red-50 rounded" title="Excluir"><i class="fa-solid fa-trash-can"></i></button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderModalFormaMonetaria(formaId = null) {
            const m = formaId ? db.formas_monetarias.find(x => x.id === formaId) : null;
            const html = `
                <div id="modal_fm" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">${m ? 'Editar Forma Monetária' : 'Nova Forma Monetária'}</h3>
                            <button onclick="fecharModal('modal_fm')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarFormaMonetaria(event, '${formaId || ''}')" class="p-6 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome do Meio / Forma</label>
                                <input type="text" id="fm_nome" required value="${m ? escapeHTML(m.nome) : ''}" placeholder="Ex: PIX ONLINE" class="w-full p-2 border rounded text-xs font-bold">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Multa Atraso (%)</label>
                                    <input type="number" step="0.01" id="fm_multa" value="${m ? m.multaPct : 2.00}" class="w-full p-2 border rounded text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Juros ao Dia (%)</label>
                                    <input type="number" step="0.001" id="fm_juros" value="${m ? m.jurosDiaPct : 0.033}" class="w-full p-2 border rounded text-xs font-bold">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Conta Bancária Destino</label>
                                <select id="fm_conta" class="w-full p-2 border rounded text-xs font-bold">
                                    ${db.contas_bancarias.map(c => `<option value="${c.id}" ${m && m.contaId === c.id ? 'selected' : ''}>${escapeHTML(c.banco)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_fm')" class="px-3 py-1.5 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-3 py-1.5 bg-teal-600 text-white rounded text-xs font-bold">Salvar Forma</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarFormaMonetaria(e, formaId = '') {
            e.preventDefault();
            const nome = document.getElementById('fm_nome').value.trim();
            const multaPct = parseFloat(document.getElementById('fm_multa').value) || 0;
            const jurosDiaPct = parseFloat(document.getElementById('fm_juros').value) || 0;
            const contaId = document.getElementById('fm_conta').value;

            if (formaId) {
                const m = db.formas_monetarias.find(x => x.id === formaId);
                if (m) { m.nome = nome; m.multaPct = multaPct; m.jurosDiaPct = jurosDiaPct; m.contaId = contaId; }
            } else {
                db.formas_monetarias.push({ id: 'fm_' + Date.now(), nome, multaPct, jurosDiaPct, contaId, baixaAutomatica: true, status: 'Ativo' });
            }

            salvarDados(db);
            fecharModal('modal_fm');
            renderApp();
        }

        function renderTelaLogin() {
            return `
                <div class="min-h-screen relative overflow-hidden tech-mode flex items-center justify-center p-4">
                    <canvas id="matrixCanvas" class="absolute inset-0 pointer-events-none opacity-40 z-0"></canvas>
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden relative z-10 tech-card">
                        <div class="p-8 text-center bg-slate-950 text-cyan-400 border-b border-cyan-800">
                            <div class="w-16 h-16 bg-cyan-900/50 text-cyan-400 border border-cyan-500 shadow-cyan-500/50 shadow-lg rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl"><i class="fa-solid fa-shield-halved"></i></div>
                            <h2 class="text-2xl font-bold tracking-wide">Guardiões do Bravo</h2>
                            <p class="text-xs text-cyan-400 font-mono uppercase mt-1">Gestão Condominial Segura</p>
                        </div>
                        <form onsubmit="realizarLogin(event)" class="p-8 space-y-5">
                            <div><label class="block text-xs font-bold uppercase mb-1">Usuário / E-mail</label><input type="text" id="login_user" required class="w-full p-2.5 rounded text-sm font-bold tech-input"></div>
                            <div><label class="block text-xs font-bold uppercase mb-1">Senha</label><input type="password" id="login_pass" required class="w-full p-2.5 rounded text-sm font-bold tech-input"></div>
                            <div class="flex items-center justify-between">
                                <label class="flex items-center gap-2 text-xs font-bold text-cyan-300 cursor-pointer">
                                    <input type="checkbox" id="login_remember" class="rounded text-cyan-500 w-4 h-4">
                                    Lembrar credenciais de acesso
                                </label>
                            </div>
                            <button type="submit" class="w-full py-3 bg-cyan-600 text-slate-950 font-mono font-bold rounded shadow-md hover:bg-cyan-500 transition">Acessar Painel</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function iniciarAnimacaoMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '0123456789ABCDEFGUARDIOSBRAVO';
            const drops = Array(Math.floor(canvas.width / 14)).fill(1);
            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(() => {
                ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#06b6d4';
                ctx.font = '14px monospace';
                drops.forEach((y, i) => {
                    ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * 14, y * 14);
                    if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }, 33);
        }

        function renderModalNovoTitulo(tituloId = null) {
            const f = tituloId ? db.financeiro.find(x => x.id === tituloId) : null;
            const html = `
                <div id="modal_novo_t" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">${f ? 'Editar Título Financeiro' : 'Novo Título Financeiro'}</h3>
                            <button onclick="fecharModal('modal_novo_t')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarNovoTituloForm(event, '${tituloId || ''}')" class="p-6 space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Tipo</label>
                                    <select id="nt_tipo" class="w-full p-2 border rounded text-xs font-bold">
                                        <option value="Receber" ${f && f.tipo==='Receber'?'selected':''}>A Receber</option>
                                        <option value="Pagar" ${f && f.tipo==='Pagar'?'selected':''}>A Pagar</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Valor (R$)</label>
                                    <input type="number" step="0.01" id="nt_valor" required value="${f ? f.valor : 2500.00}" class="w-full p-2 border rounded text-xs font-bold">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Histórico / Descrição</label>
                                <input type="text" id="nt_hist" required value="${f ? escapeHTML(f.historico) : ''}" placeholder="Ex: Taxa Condominial Ordinária" class="w-full p-2 border rounded text-xs font-bold">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Competência</label>
                                    <input type="text" id="nt_comp" value="${f ? escapeHTML(f.competencia) : '10/2026'}" class="w-full p-2 border rounded text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Vencimento</label>
                                    <input type="date" id="nt_venc" required value="${f ? f.vencimento : '2026-10-15'}" class="w-full p-2 border rounded text-xs font-bold">
                                </div>
                            </div>
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_novo_t')" class="px-3 py-1.5 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-3 py-1.5 bg-teal-600 text-white rounded text-xs font-bold">Salvar Título</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarNovoTituloForm(e, tituloId = '') {
            e.preventDefault();
            const tipo = document.getElementById('nt_tipo').value;
            const valor = parseFloat(document.getElementById('nt_valor').value) || 0;
            const historico = document.getElementById('nt_hist').value.trim();
            const competencia = document.getElementById('nt_comp').value.trim();
            const vencimento = document.getElementById('nt_venc').value;

            if (tituloId) {
                const f = db.financeiro.find(x => x.id === tituloId);
                if (f) { f.tipo = tipo; f.valor = valor; f.historico = historico; f.competencia = competencia; f.vencimento = vencimento; }
            } else {
                db.financeiro.push({ id: 'fin_' + Date.now(), tipo, valor, historico, competencia, vencimento, status: 'Aberto' });
            }

            salvarDados(db); fecharModal('modal_novo_t'); renderApp();
        }

        function excluirItemGenerico(modKey, itemId) {
            if (confirm('Deseja excluir este registro?')) {
                db[modKey] = db[modKey].filter(x => x.id !== itemId);
                salvarDados(db);
                renderApp();
            }
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        window.addEventListener('DOMContentLoaded', () => { renderApp(); });
    </script>
</body>
</html>
