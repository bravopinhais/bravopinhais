<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Completa em Nuvem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Pako (Compressão Gzip para arquivos grandes) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Supabase JS Client para Banco de Dados na Nuvem -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 3px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-full { height: 100vh; position: sticky; top: 0; }
        @media print {
            aside, header, .no-print, button, .actions-col { display: none !important; }
            body { background: white !important; color: black !important; }
            main { padding: 0 !important; }
            .print-break { page-break-before: always; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <!-- Indicador de Status da Nuvem -->
    <div id="status-nuvem" class="bg-teal-600 text-white text-[10px] font-bold py-1 px-4 text-center no-print flex items-center justify-center gap-2">
        <i class="fa-solid fa-cloud"></i> A ligar ao Supabase na Nuvem...
    </div>

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>
    <div id="modal-container"></div>

    <script>
        // =========================================================================
        // CONFIGURAÇÃO DA SUA NUVEM (SUPABASE)
        // =========================================================================
        const SUPABASE_URL = 'https://ycwgwtzysvizossqveiy.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_tsVxjzBmQ6v33EXQbz_U7Q_7DTW3b3m';
        // =========================================================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tempArquivoNome = ''; 
        let tempArquivoGzipBase64 = ''; 
        let filtroAtivoMoradores = { bloco: '', nome: '' };

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        const DEFAULT_DATA = {
            condominio: {
                nome: 'Condomínio Guardiões do Bravo',
                cnpj: '12.345.678/0001-90',
                razaoSocial: 'Condomínio Residencial Guardiões do Bravo',
                endereco: 'Rua das Palmeiras, 1000',
                bairro: 'Centro',
                cidade: 'Curitiba',
                uf: 'PR',
                cep: '80000-000',
                telefone: '(41) 3333-0000',
                email: 'contato@guardioesdobravo.com.br'
            },
            conselheiros: [
                { id: 'cons_1', nome: 'Alan Reis', cargo: 'Síndico', BlocoAp: 'Bloco 1 - Ap 137', telefone: '(41) 99999-9999', inicioMandato: '2026-01-01', fimMandato: '2027-12-31', status: 'Ativo' }
            ],
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', cargo: 'Administrador', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345' },
                { id: 'usr_sheila', usuario: 'sheila', nome: 'Sheila (Subsíndica/Operadora)', email: 'sheila@guardioes.com', cargo: 'Subsíndica', perfil: 'Síndico', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Sheila@123' }
            ],
            financeiro: [],
            formas_monetarias: [],
            contas_bancarias: [],
            moradores: [],
            fornecedores: [],
            empregados: [],
            categorias: [],
            estoque: [],
            documentos: [],
            logs: []
        };

        // RECUPERAÇÃO SEGURA: Preserva os dados já salvos no navegador para não perder nada
        let db = DEFAULT_DATA;
        const dadosLocaisSalvos = localStorage.getItem('guardioes_bravo_db');
        if (dadosLocaisSalvos) {
            try {
                db = JSON.parse(dadosLocaisSalvos);
            } catch (e) {
                db = DEFAULT_DATA;
            }
        }

        let sessao = { usuarioLogado: null };

        async function carregarDadosDaNuvem() {
            const elStatus = document.getElementById('status-nuvem');
            try {
                const { data, error } = await supabaseClient
                    .from('condominio_dados')
                    .select('payload')
                    .eq('id', 'principal')
                    .single();

                if (data && data.payload) {
                    db = data.payload;
                    localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));
                    if (elStatus) {
                        elStatus.className = "bg-emerald-600 text-white text-[10px] font-bold py-1 px-4 text-center no-print flex items-center justify-center gap-2";
                        elStatus.innerHTML = `<i class="fa-solid fa-cloud-arrow-down"></i> Sincronizado com o Supabase com Sucesso!`;
                    }
                } else {
                    await salvarDadosNaNuvem(db);
                }
            } catch (err) {
                if (elStatus) {
                    elStatus.className = "bg-amber-600 text-white text-[10px] font-bold py-1 px-4 text-center no-print";
                    elStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> A utilizar armazenamento local preservado.`;
                }
            }
            renderApp();
        }

        async function salvarDadosNaNuvem(dataObj) {
            db = dataObj;
            localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));

            const elStatus = document.getElementById('status-nuvem');
            if (elStatus) {
                elStatus.className = "bg-teal-500 text-white text-[10px] font-bold py-1 px-4 text-center no-print animate-pulse";
                elStatus.innerHTML = `<i class="fa-solid fa-rotate fa-spin"></i> A guardar na nuvem...`;
            }

            try {
                const { error } = await supabaseClient
                    .from('condominio_dados')
                    .upsert({ id: 'principal', payload: db, atualizado_em: new Date() });

                if (!error && elStatus) {
                    elStatus.className = "bg-emerald-600 text-white text-[10px] font-bold py-1 px-4 text-center no-print flex items-center justify-center gap-2";
                    elStatus.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Sincronizado com a Nuvem em Tempo Real`;
                }
            } catch (err) {
                if (elStatus) {
                    elStatus.className = "bg-amber-600 text-white text-[10px] font-bold py-1 px-4 text-center no-print";
                    elStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Guardado localmente com segurança`;
                }
            }
        }

        function salvarDados(data) { salvarDadosNaNuvem(data); }

        try {
            const sessaoData = sessionStorage.getItem('guardioes_sessao');
            if (sessaoData) sessao.usuarioLogado = JSON.parse(sessaoData);
        } catch (e) { sessao.usuarioLogado = null; }

        let tabsState = { openTabs: ['dashboard'], activeTab: 'dashboard' };

        const MODULE_NAMES = {
            dashboard: 'Dashboard',
            condominio: 'Dados do Condomínio & Conselho',
            financeiro: 'Contas Pagar/Receber',
            moradores: 'Moradores / Unidades',
            fornecedores: 'Fornecedores',
            empregados: 'Empregados',
            estoque: 'Estoque & Inventário',
            documentos: 'Gestão de Documentos',
            relatorios: 'Central de Relatórios & DRE',
            usuarios: 'Gestão de Usuários'
        };

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            fecharMenuMobile();
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
        }

        function toggleMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        function fecharMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const userFound = (db.usuarios || []).find(u => u.usuario === userInput || u.email === userInput);
            if (userFound && userFound.senhaHash === senhaInput) {
                if (userFound.status === 'Inativo') { alert('Utilizador inativo.'); return; }
                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                renderApp();
            } else { alert('Credenciais incorretas!'); }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            try { sessionStorage.removeItem('guardioes_sessao'); } catch (e) {}
            renderApp();
        }

        function renderTelaLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold mx-auto shadow-lg"><i class="fa-solid fa-shield-halved"></i></div>
                            <h2 class="text-2xl font-black text-slate-800">Guardiões do Bravo</h2>
                            <p class="text-xs text-teal-600 font-bold uppercase">Sincronização em Nuvem Ativa</p>
                        </div>
                        <form onsubmit="realizarLogin(event)" class="space-y-4">
                            <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">Utilizador</label><input type="text" id="login_user" required value="admin" class="w-full p-3 border rounded-lg text-sm font-bold bg-slate-50"></div>
                            <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">Palavra-passe</label><input type="password" id="login_pass" required value="Admin@12345" class="w-full p-3 border rounded-lg text-sm font-bold bg-slate-50"></div>
                            <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-lg text-sm">Entrar no Sistema</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderMainOnly() {
            const mainEl = document.querySelector('main');
            if (mainEl) {
                mainEl.innerHTML = renderModuleContent(tabsState.activeTab);
            }
        }

        function renderApp() {
            const container = document.getElementById('app');
            if (!container) return;
            if (!sessao.usuarioLogado) { container.innerHTML = renderTelaLogin(); return; }

            container.innerHTML = `
                <div class="flex-1 flex flex-col md:flex-row min-h-screen">
                    <div id="sidebar-backdrop" onclick="fecharMenuMobile()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden"></div>

                    <aside id="sidebar-menu" class="fixed md:sticky top-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col sidebar-full border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
                        <div class="p-4 bg-slate-950 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold text-xl shadow"><i class="fa-solid fa-shield-halved"></i></div>
                                <div><h1 class="font-bold text-white text-base leading-tight">Guardiões</h1><p class="text-xs text-teal-400">Nuvem Supabase</p></div>
                            </div>
                            <button onclick="fecharMenuMobile()" class="md:hidden text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos</p>
                            <button onclick="abrirModulo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</button>
                            <button onclick="abrirModulo('condominio')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'condominio' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-building w-5 text-center"></i> Condomínio</button>
                            <button onclick="abrirModulo('financeiro')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'financeiro' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-receipt w-5 text-center"></i> Pagar/Receber</button>
                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-users w-5 text-center"></i> Moradores</button>
                            <button onclick="abrirModulo('fornecedores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'fornecedores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-truck-fast w-5 text-center"></i> Fornecedores</button>
                            <button onclick="abrirModulo('empregados')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'empregados' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-tie w-5 text-center"></i> Empregados</button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Estoque</button>
                            <button onclick="abrirModulo('documentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'documentos' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-open w-5 text-center"></i> Documentos</button>
                            <button onclick="abrirModulo('relatorios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'relatorios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Relatórios</button>
                            <button onclick="abrirModulo('usuarios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'usuarios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-gear w-5 text-center"></i> Usuários</button>
                        </nav>

                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                            <div class="truncate pr-2">
                                <span class="text-xs font-bold text-slate-200 block truncate">${escapeHTML(sessao.usuarioLogado.nome)}</span>
                            </div>
                            <button onclick="encerrarSessao()" class="p-2 text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
                        <header class="bg-slate-900 text-white p-3 flex md:hidden items-center justify-between border-b border-slate-800 no-print">
                            <span class="font-bold text-sm">Guardiões do Bravo</span>
                            <button onclick="toggleMenuMobile()" class="p-2 bg-slate-800 rounded-lg text-slate-200"><i class="fa-solid fa-bars"></i></button>
                        </header>

                        <div class="bg-slate-200 border-b flex items-center overflow-x-auto px-2 pt-2 gap-1 no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer ${tabsState.activeTab === tabId ? 'tab-active' : 'bg-slate-300 text-slate-600'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;
        }

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            if (moduloId === 'usuarios') btnNovoHtml = `<button onclick="window.renderModalUsuario()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-user-plus"></i> Novo Utilizador</button>`;
            else if (moduloId === 'moradores') btnNovoHtml = `<button onclick="window.renderModalMorador()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                    <div><h2 class="text-xl md:text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2></div>
                    <div class="flex flex-wrap items-center gap-2 no-print">${btnNovoHtml}</div>
                </div>
            `;

            if (moduloId === 'dashboard') return headerGlobal + `<div class="grid grid-cols-1 sm:grid-cols-3 gap-4"><div class="bg-white p-5 rounded-xl border shadow-sm"><p class="text-xs font-bold text-slate-400 uppercase">Usuários</p><h3 class="text-2xl font-black text-slate-800">${(db.usuarios||[]).length}</h3></div></div>`;
            if (moduloId === 'usuarios') return headerGlobal + renderUsuariosView();
            if (moduloId === 'moradores') return headerGlobal + `<div class="bg-white rounded-xl border p-4"><p class="text-xs text-slate-600">Módulo de Moradores Ativo.</p></div>`;
            return headerGlobal + `<div class="bg-white p-6 rounded-2xl border shadow-sm"><p class="text-xs text-slate-600">Módulo ${MODULE_NAMES[moduloId]} ativo e funcional.</p></div>`;
        }

        function abrirModalContainer(html) { document.getElementById('modal-container').innerHTML = html; }
        function fecharModalContainer() { document.getElementById('modal-container').innerHTML = ''; }

        function renderUsuariosView() {
            const users = db.usuarios || [];
            return `
                <div class="bg-white rounded-xl border overflow-hidden shadow-sm">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-800 text-white">
                            <tr>
                                <th class="p-3">Utilizador / Nome</th>
                                <th class="p-3">E-mail</th>
                                <th class="p-3">Cargo</th>
                                <th class="p-3">Palavra-passe (Senha)</th>
                                <th class="p-3 text-center">Ações / Redefinir Senha</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${users.map(u => `
                                <tr>
                                    <td class="p-3">
                                        <div class="font-bold text-slate-800">${escapeHTML(u.usuario)}</div>
                                        <div class="text-[10px] text-slate-500">${escapeHTML(u.nome || '')}</div>
                                    </td>
                                    <td class="p-3">${escapeHTML(u.email || '-')}</td>
                                    <td class="p-3 font-semibold text-teal-700">${escapeHTML(u.cargo || u.perfil || 'Operador')}</td>
                                    <td class="p-3 font-mono text-slate-600">••••••••</td>
                                    <td class="p-3 text-center">
                                        <button onclick="window.renderModalRedefinirSenha('${u.id}')" class="px-2.5 py-1 bg-amber-50 text-amber-700 hover:bg-amber-100 rounded font-bold mr-1" title="Redefinir Senha"><i class="fa-solid fa-key"></i> Redefinir Senha</button>
                                        <button onclick="window.renderModalUsuario('${u.id}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 rounded mr-1" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                        ${u.id !== 'usr_admin' ? `<button onclick="excluirRegistro('usuarios','${u.id}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded" title="Excluir"><i class="fa-solid fa-trash"></i></button>` : ''}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalUsuario = function(id = null) {
            const item = id ? (db.usuarios||[]).find(x => x.id === id) : { id: '', usuario: '', nome: '', email: '', cargo: '', senhaHash: 'Condo@2026' };
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-bold text-lg text-slate-800">${id ? 'Editar Utilizador' : 'Novo Utilizador'}</h3>
                        <form onsubmit="salvarModalUsuario(event, '${id}')" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Login / Utilizador</label><input type="text" id="m_u_login" required value="${escapeHTML(item.usuario)}" class="w-full p-2.5 border rounded-lg font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Nome Completo</label><input type="text" id="m_u_nome" required value="${escapeHTML(item.nome)}" class="w-full p-2.5 border rounded-lg font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">E-mail</label><input type="email" id="m_u_email" value="${escapeHTML(item.email || '')}" class="w-full p-2.5 border rounded-lg font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Cargo</label><input type="text" id="m_u_cargo" required value="${escapeHTML(item.cargo || item.perfil || 'Operador')}" class="w-full p-2.5 border rounded-lg font-bold bg-slate-50"></div>
                            ${!id ? `<div><label class="block font-bold uppercase text-slate-600 mb-1">Palavra-passe (Senha)</label><input type="password" id="m_u_senha" required value="Condo@2026" class="w-full p-2.5 border rounded-lg font-bold bg-slate-50"></div>` : ''}
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-bold">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.salvarModalUsuario = function(e, id) {
            e.preventDefault();
            if(!db.usuarios) db.usuarios = [];
            const isEdit = id && id !== 'null';
            const usuarioExistente = isEdit ? db.usuarios.find(x => x.id === id) : null;

            const obj = {
                id: isEdit ? id : 'usr_' + Date.now(),
                usuario: document.getElementById('m_u_login').value,
                nome: document.getElementById('m_u_nome').value,
                email: document.getElementById('m_u_email').value,
                cargo: document.getElementById('m_u_cargo').value,
                perfil: document.getElementById('m_u_cargo').value,
                status: 'Ativo',
                senhaHash: usuarioExistente ? usuarioExistente.senhaHash : document.getElementById('m_u_senha').value,
                primeiroAcesso: usuarioExistente ? usuarioExistente.primeiroAcesso : false
            };

            const idx = db.usuarios.findIndex(x => x.id === obj.id);
            if(idx !== -1) db.usuarios[idx] = obj; else db.usuarios.push(obj);
            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        window.renderModalRedefinirSenha = function(id) {
            const user = (db.usuarios || []).find(x => x.id === id);
            if (!user) return;
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-lg text-slate-800">Redefinir Senha: ${escapeHTML(user.usuario)}</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="executarRedefinicaoSenha(event, '${id}')" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Nova Palavra-passe</label><input type="password" id="nova_senha_admin" required class="w-full p-2.5 border rounded-lg font-bold bg-slate-50" placeholder="Mínimo de 6 caracteres"></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Confirmar Nova Palavra-passe</label><input type="password" id="nova_senha_admin_conf" required class="w-full p-2.5 border rounded-lg font-bold bg-slate-50" placeholder="Repita a palavra-passe"></div>
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-bold">Atualizar Senha</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.executarRedefinicaoSenha = function(e, id) {
            e.preventDefault();
            const s1 = document.getElementById('nova_senha_admin').value;
            const s2 = document.getElementById('nova_senha_admin_conf').value;
            if (s1.length < 6) { alert('A palavra-passe deve ter pelo menos 6 caracteres.'); return; }
            if (s1 !== s2) { alert('As palavras-passe não coincidem.'); return; }

            const idx = (db.usuarios || []).findIndex(x => x.id === id);
            if (idx !== -1) {
                db.usuarios[idx].senhaHash = s1;
                salvarDados(db);
                fecharModalContainer();
                alert('Palavra-passe redefinida com sucesso!');
                renderMainOnly();
            }
        };

        function excluirRegistro(col, id) {
            if(!confirm('Deseja eliminar este registo?')) return;
            if(db[col]) {
                db[col] = db[col].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
