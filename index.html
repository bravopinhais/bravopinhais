        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Funções de Compactação Gzip para Arquivos Grandes
        function compactarArquivoParaGzip(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const compressed = pako.deflate(uint8Array);
                    
                    // Converte Uint8Array comprimido para Base64 para armazenar no JSON
                    let binary = '';
                    const len = compressed.byteLength;
                    for (let i = 0; i < len; i++) {
                        binary += String.fromCharCode(compressed[i]);
                    }
                    const base64Gzip = btoa(binary);
                    callback(base64Gzip, file.name);
                } catch (err) {
                    alert('Erro ao compactar arquivo.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decompressed = pako.inflate(bytes);
                const blob = new Blob([decompressed]);
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = nomeOriginal;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                alert('Erro ao extrair e baixar o arquivo compactado.');
            }
        }

            };
            reader.readAsDataURL(file);
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) {
                alert('Não há dados disponíveis para exportação.');
                return;
            }
            const sanitizeData = dados.map(item => {
                let obj = { ...item };
                delete obj.arquivoCompactadoGzip;
                return obj;
            });
            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(';') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => {
                    let val = row[k] === null || row[k] === undefined ? '' : row[k];
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csvContent += values.join(';') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeArquivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function inicializarGraficosDashboard() {
            if (tabsState.activeTab !== 'dashboard') return;
            if (activeCharts.moradores) activeCharts.moradores.destroy();
            if (activeCharts.financeiro) activeCharts.financeiro.destroy();

            db = carregarDados();
            const ctxMoradores = document.getElementById('chartMoradoresTipo');
            if (ctxMoradores) {
                const moradores = db.moradores || [];
                const proprietarios = moradores.filter(m => (m.tipo || 'Proprietário') === 'Proprietário').length;
                const inquilinos = moradores.filter(m => m.tipo === 'Inquilino').length;
                activeCharts.moradores = new Chart(ctxMoradores, {
                    type: 'doughnut',
                    data: {
                        labels: ['Proprietários', 'Inquilinos'],
                        datasets: [{ data: [proprietarios, inquilinos], backgroundColor: ['#0d9488', '#f59e0b'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            const ctxFin = document.getElementById('chartFinanceiroResumo');
            if (ctxFin) {
                activeCharts.financeiro = new Chart(ctxFin, {
                    type: 'bar',
                    data: {
                        labels: ['Receitas', 'Despesas'],
                        datasets: [{ label: 'Valor (R$)', data: [2500, 850], backgroundColor: ['#10b981', '#ef4444'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        function ordenarMoradores(campo) {
            if (morFiltros.ordenacao === campo) morFiltros.direcao = morFiltros.direcao === 'asc' ? 'desc' : 'asc';
            else { morFiltros.ordenacao = campo; morFiltros.direcao = 'asc'; }
            renderMainOnly();
        }

        function renderMoradoresView() {
            db = carregarDados();
            if (!db.moradores) db.moradores = [];
            let list = [...db.moradores];
            const blocosUnicos = [...new Set(list.map(m => `Bloco ${m.bloco} - Ap ${m.apartamento}`))].sort();

            if (morFiltros.busca.trim() !== '') {
                const b = morFiltros.busca.toLowerCase();
                list = list.filter(m => (m.nome || '').toLowerCase().includes(b) || (m.apartamento || '').includes(b) || (m.bloco || '').toLowerCase().includes(b) || (m.petNome || '').toLowerCase().includes(b) || (m.veiculoPlaca || '').toLowerCase().includes(b) || (m.vagaGaragem || '').toLowerCase().includes(b) || (m.observacoes || '').toLowerCase().includes(b));
            }
            if (morFiltros.blocoApFiltro && morFiltros.blocoApFiltro !== 'Todos') {
                list = list.filter(m => `Bloco ${m.bloco} - Ap ${m.apartamento}` === morFiltros.blocoApFiltro);
            }

            list.sort((a, b) => {
                let valA = a[morFiltros.ordenacao], valB = b[morFiltros.ordenacao];
                if (morFiltros.ordenacao === 'apartamento') {
                    return morFiltros.direcao === 'asc' ? (Number(a.apartamento)||0) - (Number(b.apartamento)||0) : (Number(b.apartamento)||0) - (Number(a.apartamento)||0);
                }
                valA = (valA || '').toString().toLowerCase(); valB = (valB || '').toString().toLowerCase();
                if (valA < valB) return morFiltros.direcao === 'asc' ? -1 : 1;
                if (valA > valB) return morFiltros.direcao === 'asc' ? 1 : -1;
                return 0;
            });

            const iconeSeta = (campo) => morFiltros.ordenacao !== campo ? '<i class="fa-solid fa-sort text-slate-400 ml-1"></i>' : (morFiltros.direcao === 'asc' ? '<i class="fa-solid fa-sort-up text-teal-400 ml-1"></i>' : '<i class="fa-solid fa-sort-down text-teal-400 ml-1"></i>');

            return `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center no-print">
                        <input type="text" value="${escapeHTML(morFiltros.busca)}" oninput="morFiltros.busca = this.value; renderMainOnly();" placeholder="Buscar por Nome, Bloco, Ap, Pet, Placa, Vaga ou Observação..." class="flex-1 p-2 border rounded-lg text-xs">
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-800 text-white font-bold uppercase tracking-wider text-[11px]">
                                    <th class="p-3">
                                        <div class="flex items-center gap-2">
                                            <span onclick="ordenarMoradores('bloco')" class="cursor-pointer hover:underline select-none">Bloco/Ap ${iconeSeta('bloco')}</span>
                                            <select onchange="morFiltros.blocoApFiltro = this.value; renderMainOnly();" class="bg-slate-700 text-white text-[10px] rounded px-1.5 py-0.5 border border-slate-600 outline-none cursor-pointer">
                                                <option value="Todos">Filtrar Bloco/Ap (Todos)</option>
                                                ${blocosUnicos.map(ba => `<option value="${ba}" ${morFiltros.blocoApFiltro === ba ? 'selected' : ''}>${ba}</option>`).join('')}
                                            </select>
                                        </div>
                                    </th>
                                    <th onclick="ordenarMoradores('nome')" class="p-3 cursor-pointer hover:bg-slate-700 transition select-none">Nome Completo ${iconeSeta('nome')}</th>
                                    <th onclick="ordenarMoradores('telefone')" class="p-3 cursor-pointer hover:bg-slate-700 transition select-none">Contato ${iconeSeta('telefone')}</th>
                                    <th class="p-3">🐾 Pet</th>
                                    <th class="p-3">🚗 Automóvel</th>
                                    <th class="p-3">🅿️ Vaga</th>
                                    <th class="p-3 text-center actions-col">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 font-medium text-slate-700">
                                ${list.length === 0 ? `<tr><td colspan="7" class="p-6 text-center text-slate-400 font-semibold">Nenhum morador encontrado.</td></tr>` : list.map(m => `
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="p-3 font-bold text-teal-700">Bloco ${escapeHTML(m.bloco)} - Ap ${escapeHTML(m.apartamento)}</td>
                                        <td class="p-3 font-bold text-slate-900">${escapeHTML(m.nome)}<br><span class="text-[10px] text-slate-400 font-normal">${escapeHTML(m.tipo || 'Proprietário')}</span></td>
                                        <td class="p-3">${escapeHTML(m.telefone)}<br><span class="text-[10px] text-slate-500 font-normal">${escapeHTML(m.email)}</span></td>
                                        <td class="p-3">${m.petNome ? `<span class="font-bold text-slate-800">${escapeHTML(m.petNome)}</span><br><span class="text-[10px] text-slate-500">${escapeHTML(m.petRaca || '')} (${escapeHTML(m.petCor || '')}, ${escapeHTML(m.petIdade || '')})</span>` : '<span class="text-slate-400 italic">Nenhum</span>'}</td>
                                        <td class="p-3">${m.veiculoModelo ? `<span class="font-bold text-slate-800">${escapeHTML(m.veiculoModelo)}</span><br><span class="text-[10px] text-slate-500">Placa: ${escapeHTML(m.veiculoPlaca || '-')} (${escapeHTML(m.veiculoCor || '-')})</span>` : '<span class="text-slate-400 italic">Nenhum</span>'}</td>
                                        <td class="p-3 font-bold text-slate-700">${escapeHTML(m.vagaGaragem || 'Nenhuma')}</td>
                                        <td class="p-3 text-center actions-col">
                                            <div class="flex items-center justify-center gap-1">
                                                <button onclick="window.renderModalMorador('${m.id}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition" title="Editar Morador"><i class="fa-solid fa-pen"></i></button>
                                                <button onclick="excluirRegistro('moradores', '${m.id}')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md transition" title="Excluir Morador"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

                            <h3 class="font-bold text-lg text-slate-800">Inserir Novo Documento (Compactação Inteligente)</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="window.salvarModalDocumento(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Título do Documento</label>
                                <input type="text" id="m_doc_titulo" required placeholder="Ex: Projeto Arquitetônico Completo" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Pasta / Categoria</label>
                                <select id="m_doc_pasta" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                    ${categorias.length === 0 ? `<option value="Geral">Geral</option>` : categorias.map(c => `<option value="${escapeHTML(c.nome)}">${escapeHTML(c.nome)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Selecionar Arquivo (PDF ou Foto Grande)</label>
                                <input type="file" id="m_doc_arquivo" required onchange="processarArquivoDocumentoGzip(event)" class="w-full p-2 border rounded-lg text-xs bg-slate-50 cursor-pointer">
                                <p class="text-[10px] text-teal-600 mt-1 font-semibold">O arquivo será compactado automaticamente para economizar memória.</p>
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold">Salvar e Compactar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        function processarArquivoDocumentoGzip(event) {
            const file = event.target.files[0];
            if (!file) return;
            compactarArquivoParaGzip(file, function(base64Gzip, nomeOriginal) {
                tempArquivoGzipBase64 = base64Gzip;
                tempArquivoNome = nomeOriginal;
            });
        }

        window.salvarModalDocumento = function(e) {
            e.preventDefault();
            db = carregarDados();
            if (!db.documentos) db.documentos = [];

            const titulo = document.getElementById('m_doc_titulo').value.trim();
            const pasta = document.getElementById('m_doc_pasta').value;

            const novoDoc = {
                id: 'doc_' + Date.now(),
                titulo: titulo,
                pasta: pasta,
                nomeArquivo: tempArquivoNome || 'documento.pdf',
                arquivoCompactadoGzip: tempArquivoGzipBase64 || '',
                dataUpload: new Date().toISOString().split('T')[0]
            };

            db.documentos.push(novoDoc);
            salvarDados(db);
            fecharModalContainer();
            renderMainOnly();
            alert('Documento compactado e inserido com sucesso!');
        };

        // =====================================
        // GESTÃO DE USUÁRIOS
        // =====================================
        function renderUsuariosView() {
            db = carregarDados();
            const list = db.usuarios || [];
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-800 text-white font-bold uppercase tracking-wider text-[11px]">
                                <th class="p-3">Usuário</th>
                                <th class="p-3">Nome Completo</th>
                                <th class="p-3">E-mail</th>
                                <th class="p-3">Perfil</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center actions-col">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 font-medium text-slate-700">
                            ${list.length === 0 ? `<tr><td colspan="6" class="p-6 text-center text-slate-400">Nenhum usuário cadastrado.</td></tr>` : list.map(u => `
                                <tr>
                                    <td class="p-3 font-bold text-teal-700">${escapeHTML(u.usuario)}</td>
                                    <td class="p-3 font-bold text-slate-900">${escapeHTML(u.nome)}</td>
                                    <td class="p-3">${escapeHTML(u.email)}</td>
                                    <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 text-slate-800 rounded font-bold">${escapeHTML(u.perfil)}</span></td>
                                    <td class="p-3"><span class="px-2 py-0.5 rounded font-bold ${u.status === 'Ativo' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${escapeHTML(u.status || 'Ativo')}</span></td>
                                    <td class="p-3 text-center actions-col">
                                        <div class="flex items-center justify-center gap-1">
                                            <button onclick="window.renderModalUsuario('${u.id}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition" title="Editar Usuário"><i class="fa-solid fa-pen"></i></button>
                                            ${u.id !== 'usr_admin' ? `<button onclick="excluirRegistro('usuarios', '${u.id}')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md transition" title="Excluir Usuário"><i class="fa-solid fa-trash"></i></button>` : ''}
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalUsuario = function(id = null) {
            db = carregarDados();
            if (!db.usuarios) db.usuarios = [];
            const item = id ? db.usuarios.find(x => x.id === id) : { id: '', usuario: '', nome: '', email: '', perfil: 'Operador', status: 'Ativo', senhaHash: 'Condo@2026' };
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-lg text-slate-800">${id ? 'Editar Usuário do Sistema' : 'Novo Usuário do Sistema'}</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form id="form_usuario_modal" onsubmit="window.salvarModalUsuario(event, '${id}')" class="space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">Login (Usuário)</label><input type="text" id="m_usr_login" required value="${escapeHTML(item.usuario)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50"></div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Perfil</label>
                                    <select id="m_usr_perfil" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                        <option value="Admin" ${item.perfil === 'Admin' ? 'selected' : ''}>Admin</option>
                                        <option value="Síndico" ${item.perfil === 'Síndico' ? 'selected' : ''}>Síndico</option>
                                        <option value="Operador" ${item.perfil === 'Operador' ? 'selected' : ''}>Operador</option>
                                    </select>
                                </div>
                            </div>
                            <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nome Completo</label><input type="text" id="m_usr_nome" required value="${escapeHTML(item.nome)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50"></div>
                            <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">E-mail</label><input type="email" id="m_usr_email" required value="${escapeHTML(item.email)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50"></div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Senha Inicial / Temporária</label>
                                <input type="text" id="m_usr_senha" required value="${escapeHTML(item.senhaHash || 'Condo@2026')}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                <p class="text-[10px] text-slate-500 mt-1">O usuário será forçado a alterar esta senha no primeiro login.</p>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Status</label>
                                <select id="m_usr_status" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                    <option value="Ativo" ${item.status === 'Ativo' ? 'selected' : ''}>Ativo</option>
                                    <option value="Inativo" ${item.status === 'Inativo' ? 'selected' : ''}>Inativo</option>
                                </select>
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold">Salvar Usuário</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.salvarModalUsuario = function(e, id) {
            e.preventDefault();
            db = carregarDados();
            if (!db.usuarios) db.usuarios = [];
            const senhaDigitada = document.getElementById('m_usr_senha').value.trim();
            const usuarioExistente = id && id !== 'null' ? db.usuarios.find(x => x.id === id) : null;
            
            const isNovo = !id || id === 'null';
            const newItem = {
                id: isNovo ? 'usr_' + Date.now() : id,
                usuario: document.getElementById('m_usr_login').value.trim(),
                nome: document.getElementById('m_usr_nome').value.trim(),
                email: document.getElementById('m_usr_email').value.trim(),
                perfil: document.getElementById('m_usr_perfil').value,
                status: document.getElementById('m_usr_status').value,
                primeiroAcesso: isNovo ? true : (usuarioExistente ? (usuarioExistente.senhaHash !== senhaDigitada ? true : usuarioExistente.primeiroAcesso) : true),
                senhaHash: senhaDigitada || (usuarioExistente ? usuarioExistente.senhaHash : 'Condo@2026')
            };

            const idx = db.usuarios.findIndex(x => x.id === newItem.id);
            if (idx !== -1) db.usuarios[idx] = newItem;
            else db.usuarios.push(newItem);
            
            salvarDados(db);
            fecharModalContainer();
            renderMainOnly();
        };

        // =====================================
        // OUTROS MÓDULOS ESSENCIAIS
        // =====================================
        function renderFormasMonetariasView() {
            return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Formas Monetárias</h3></div>`;
        }
        function renderContasBancariasView() {
            return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Contas Bancárias</h3></div>`;
        }
        function renderEstoqueView() {
            return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Estoque & Bens</h3></div>`;
        }

        function excluirRegistro(colecao, id) {
            if (!confirm('Deseja realmente remover este registro?')) return;
            db = carregarDados();
            if (db[colecao]) {
                db[colecao] = db[colecao].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        function renderRelatoriosCentralView() {
            db = carregarDados();
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="font-black text-slate-800 text-lg border-b pb-3 uppercase tracking-wider">Demonstrativo do Resultado do Exercício (DRE)</h3>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between p-3 bg-emerald-50 text-emerald-900 font-bold rounded-lg">
                            <span>(+) RECEITA OPERACIONAL BRUTA</span>
                            <span>R$ 2.500,00</span>
                        </div>
                        <div class="flex justify-between p-3 bg-rose-50 text-rose-900 font-bold rounded-lg">
                            <span>(-) DESPESAS OPERACIONAIS</span>
                            <span>R$ 850,00</span>
                        </div>
                        <div class="flex justify-between p-4 bg-teal-600 text-white font-black text-sm rounded-xl shadow">
                            <span>(=) RESULTADO OPERACIONAL LÍQUIDO</span>
                            <span>R$ 1.650,00</span>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            setTimeout(inicializarGraficosDashboard, 100);
        });
    </script>
</body>
</html>
