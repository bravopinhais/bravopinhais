        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function compactarArquivoParaGzip(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const compressed = pako.deflate(uint8Array);
                    let binary = '';
                    const len = compressed.byteLength;
                    for (let i = 0; i < len; i++) { binary += String.fromCharCode(compressed[i]); }
                    callback(btoa(binary), file.name);
                } catch (err) { alert('Erro ao compactar ficheiro.'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                const blob = new Blob([decompressed]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nomeOriginal;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
            } catch (err) { alert('Erro ao extrair ficheiro.'); }
        }

        function visualizarArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                
                let mimeType = 'application/octet-stream';
                const ext = nomeOriginal.split('.').pop().toLowerCase();
                if (ext === 'pdf') mimeType = 'application/pdf';
                else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) mimeType = `image/${ext === 'jpg' ? 'jpeg' : ext}`;
                else if (ext === 'txt') mimeType = 'text/plain';

                const blob = new Blob([decompressed], { type: mimeType });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            } catch (err) { alert('Erro ao visualizar o ficheiro.'); }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) { alert('Não há dados disponíveis.'); return; }
            const sanitizeData = dados.map(item => { let obj = { ...item }; delete obj.arquivoCompactadoGzip; delete obj.fotoCompactadaGzip; return obj; });
            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(',') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`);
                csvContent += values.join(',') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function importarPlanilhaMoradores(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const texto = e.target.result;
                    const linhas = texto.split(/\r\n|\n/);
                    if (linhas.length < 2) { alert('A planilha parece estar vazia.'); return; }

                    const cabecalho = linhas[0].split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim().toLowerCase());
                    
                    const idxBloco = cabecalho.findIndex(h => h.includes('bloco') || h.includes('bl'));
                    const idxAp = cabecalho.findIndex(h => h.includes('ap') || h.includes('unidade') || h.includes('casa'));
                    const idxNome = cabecalho.findIndex(h => h.includes('nome') || h.includes('morador') || h.includes('proprietario'));
                    const idxEmail = cabecalho.findIndex(h => h.includes('email') || h.includes('e-mail'));
                    const idxTel = cabecalho.findIndex(h => h.includes('tel') || h.includes('cel') || h.includes('whatsapp') || h.includes('fone'));
                    const idxCpf = cabecalho.findIndex(h => h.includes('cpf') || h.includes('documento') || h.includes('rg'));
                    const idxPet = cabecalho.findIndex(h => h.includes('pet') || h.includes('animal'));
                    const idxVaga = cabecalho.findIndex(h => h.includes('vaga') || h.includes('estacionamento') || h.includes('garagem'));

                    let importados = 0;
                    if (!db.moradores) db.moradores = [];

                    for (let i = 1; i < linhas.length; i++) {
                        const linha = linhas[i].trim();
                        if (!linha) continue;
                        const cols = linha.split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim());
                        
                        db.moradores.push({
                            id: 'mor_imp_' + Date.now() + '_' + i,
                            bloco: idxBloco !== -1 ? (cols[idxBloco] || '1') : (cols[0] || '1'),
                            apartamento: idxAp !== -1 ? (cols[idxAp] || '') : (cols[1] || ''),
                            nome: idxNome !== -1 ? (cols[idxNome] || 'Sem Nome') : (cols[2] || 'Sem Nome'),
                            email: idxEmail !== -1 ? (cols[idxEmail] || '') : '',
                            telefone: idxTel !== -1 ? (cols[idxTel] || '') : '',
                            cpf: idxCpf !== -1 ? (cols[idxCpf] || '') : '',
                            petNome: idxPet !== -1 ? (cols[idxPet] || '') : '',
                            vagaGaragem: idxVaga !== -1 ? (cols[idxVaga] || '') : ''
                        });
                        importados++;
                    }

                    if (importados > 0) {
                        salvarDados(db);
                        alert(`${importados} moradores importados com sucesso para a nuvem com mapeamento inteligente!`);
                        renderMainOnly();
                    } else {
                        alert('Nenhum morador válido encontrado na planilha.');
                    }
                } catch (err) {
                    alert('Erro ao processar o arquivo CSV.');
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        function initDashboardEstoqueChart() {

                    <!-- Dashboard Gráfico de Estoque -->

                                                <button onclick="excluirRegistro('estoque','${st.id}')" class="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg transition-colors" title="Excluir"><i class="fa-solid fa-trash"></i></button>

        function initEstoqueChart() {
            if (tabsState.activeTab !== 'estoque') return;
            const ctx = document.getElementById('chartEstoqueStatus');
            if (!ctx) return;

            const list = db.estoque || [];
            let qtdAdequado = 0;
            let qtdCritico = 0;
            let qtdExcedente = 0;

            list.forEach(st => {
                const atual = parseInt(st.quantidade !== undefined ? st.quantidade : (st.qtd || 0));
                const minimo = parseInt(st.minimo || 0);
                const maximo = parseInt(st.maximo || 0);

                if (atual <= minimo) qtdCritico++;
                else if (maximo > 0 && atual > maximo) qtdExcedente++;
                else qtdAdequado++;
            });

            if (list.length === 0) { qtdAdequado = 1; }

            if (chartInstanceEstoque) chartInstanceEstoque.destroy();
            chartInstanceEstoque = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Estoque Adequado', 'Estoque Insuficiente (Crítico)', 'Excedente / Antigo (Não Comprar)'],
                    datasets: [{
                        data: [qtdAdequado, qtdCritico, qtdExcedente],
                        backgroundColor: ['#0d9488', '#f43f5e', '#f59e0b'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { weight: 'bold', size: 10 } } }
                    },
                    cutout: '65%'
                }
            });
        }

            abrirModalContainer(`

        // Função para ativar a câmera do celular e escanear código de barras
        let cameraStreamAtiva = null;
        function iniciarScannerCamera() {
            const divScanner = document.createElement('div');
            divScanner.id = 'scanner-modal-overlay';
            divScanner.className = 'fixed inset-0 bg-slate-950/80 z-[60] flex flex-col items-center justify-center p-4 backdrop-blur-md';
            divScanner.innerHTML = `
                <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl flex flex-col items-center space-y-4 text-center">
                    <div class="flex justify-between w-full items-center">
                        <h4 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-camera text-teal-600 mr-2"></i> Apontar Câmera p/ Código de Barras</h4>
                        <button onclick="fecharScannerCamera()" class="text-slate-400 hover:text-slate-700 text-lg"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden flex items-center justify-center">
                        <video id="video-scanner" autoplay playsinline muted class="w-full h-full object-cover"></video>
                        <div class="absolute inset-x-8 top-1/2 -translate-y-1/2 h-16 border-2 border-dashed border-teal-400 rounded-lg pointer-events-none animate-pulse"></div>
                    </div>
                    <p class="text-[11px] text-slate-500 font-medium">Posicione o código de barras no centro da moldura ou digite manualmente caso prefira.</p>
                    <div class="w-full flex gap-2">
                        <input type="text" id="input-codigo-manual" placeholder="Ou digite o código..." class="flex-1 p-2 border rounded-xl text-xs font-bold bg-slate-50">
                        <button type="button" onclick="confirmarCodigoDigitadoScanner()" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold">Usar</button>
                    </div>
                    <button type="button" onclick="fecharScannerCamera()" class="w-full py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Fechar Câmera</button>
                </div>
            `;
            document.body.appendChild(divScanner);

            const videoElement = document.getElementById('video-scanner');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    cameraStreamAtiva = stream;
                    videoElement.srcObject = stream;
                    videoElement.play();

                    if ('BarcodeDetector' in window) {
                        const barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'qr_code', 'upc_a'] });
                        const scanInterval = setInterval(async () => {
                            if (!cameraStreamAtiva) { clearInterval(scanInterval); return; }
                            try {
                                const barcodes = await barcodeDetector.detect(videoElement);
                                if (barcodes.length > 0) {
                                    const codigoLido = barcodes[0].rawValue;
                                    document.getElementById('m_est_etiq').value = codigoLido;
                                    clearInterval(scanInterval);
                                    fecharScannerCamera();
                                    alert(`Código de barras escaneado com sucesso: ${codigoLido}`);
                                }
                            } catch (err) {}
                        }, 500);
                    }
                })
                .catch(err => {

        function filtrarProdutosAcerto(termo) {
            const select = document.getElementById('m_ac_produto');
            if (!select) return;
            const produtos = db.estoque || [];
            const t = termo.toLowerCase().trim();

            select.innerHTML = '<option value="">[ Selecione o Produto ]</option>';
            produtos.forEach(st => {
                const label = `[${st.etiqueta || 'S/C'}] ${st.item} (Atual: ${st.quantidade || 0})`.toLowerCase();
                if (!t || label.includes(t)) {
                    const opt = document.createElement('option');
                    opt.value = st.id;
                    opt.textContent = `[${st.etiqueta || 'S/C'}] ${st.item} (Atual: ${st.quantidade || 0})`;
                    select.appendChild(opt);
                }
            });
        }

        window.salvarModalAcertoEstoque = function(e) {
            e.preventDefault();
            if (!db.acertos_estoque) db.acertos_estoque = [];

            const tipo = document.getElementById('m_ac_tipo').value;
            const produtoId = document.getElementById('m_ac_produto').value;
            const quantidade = parseInt(document.getElementById('m_ac_qtd').value) || 0;
            const motivo = document.getElementById('m_ac_motivo').value;

            if (!produtoId) { alert('Selecione um produto.'); return; }

            const prodIndex = (db.estoque || []).findIndex(st => st.id === produtoId);
            if (prodIndex === -1) { alert('Produto não encontrado.'); return; }

            let qtdAtual = parseInt(db.estoque[prodIndex].quantidade || 0);
            if (tipo === 'Entrada') {
                qtdAtual += quantidade;
            } else {
                if (quantidade > qtdAtual) {
                    if (!confirm('A quantidade de saída é maior que o saldo atual em estoque. Deseja continuar mesmo assim?')) return;
                }
                qtdAtual -= quantidade;
            }
            db.estoque[prodIndex].quantidade = qtdAtual;

            const novoAcerto = {
                id: 'ac_' + Date.now(),
                data: new Date().toLocaleString('pt-BR'),
                tipo: tipo,
                produtoId: produtoId,
                quantidade: quantidade,
                motivo: motivo
            };

            db.acertos_estoque.push(novoAcerto);
            salvarDados(db);
            fecharModalContainer();
            renderMainOnly();
            alert('Acerto de estoque registado e saldo atualizado com sucesso!');
        };

            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        window.renderModalRedefinirSenha = function(id) {
            const user = (db.usuarios || []).find(x => x.id === id);
            if (!user) return;
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 w-full backdrop-blur-sm">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-lg text-slate-800">Redefinir Senha: ${escapeHTML(user.usuario)}</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="executarRedefinicaoSenha(event, '${id}')" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Nova Palavra-passe</label><input type="password" id="nova_senha_admin" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50" placeholder="Mínimo de 6 caracteres"></div>
                            <div><label class="block font-bold uppercase text-slate-600 mb-1">Confirmar Nova Palavra-passe</label><input type="password" id="nova_senha_admin_conf" required class="w-full p-2.5 border rounded-xl font-bold bg-slate-50" placeholder="Repita a palavra-passe"></div>
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-sm">Atualizar Senha</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.executarRedefinicaoSenha = function(e, id) {
            e.preventDefault();
            const s1 = document.getElementById('nova_senha_admin').value;
            const s2 = document.getElementById('nova_senha_admin_conf').value;
            if (s1.length < 6) { alert('A palavra-passe deve ter pelo menos 6 caracteres.'); return; }
            if (s1 !== s2) { alert('As palavras-passe não coincidem.'); return; }

            const idx = (db.usuarios || []).findIndex(x => x.id === id);
            if (idx !== -1) {
                db.usuarios[idx].senhaHash = s1;
                salvarDados(db);
                fecharModalContainer();
                alert('Palavra-passe redefinida com sucesso!');
                renderMainOnly();
            }
        };

        function renderRelatoriosCentralView() {
            const financeiroList = db.financeiro || [];
            const planoContas = db.plano_contas || [];

            let totalReceitasDRE = 0;
            let totalDespesasDRE = 0;

            const itensPorConta = {};
            planoContas.forEach(pc => {
                itensPorConta[pc.id] = { codigo: pc.codigo, nome: pc.nome, tipo: pc.tipo, total: 0 };
            });

            financeiroList.forEach(f => {
                const val = parseFloat(f.valor) || 0;
                if (f.tipo === 'Receber') totalReceitasDRE += val;
                else if (f.tipo === 'Pagar') totalDespesasDRE += val;

                if (f.planoContaId && itensPorConta[f.planoContaId]) {
                    itensPorConta[f.planoContaId].total += val;
                }
            });

            const resultadoLiquidoDRE = totalReceitasDRE - totalDespesasDRE;

            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-6 w-full card-hover">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-black text-slate-800 text-lg uppercase tracking-tight"><i class="fa-solid fa-file-invoice-dollar mr-2 text-teal-600"></i> Demonstrativo do Resultado (DRE Dinâmico)</h3>
                        <span class="text-xs bg-teal-50 text-teal-700 px-3.5 py-1.5 rounded-xl font-bold shadow-inner">Vinculado ao Plano de Contas</span>
                    </div>

                    <div class="space-y-4 text-xs">
                        <div class="space-y-2">
                            <p class="font-bold text-slate-400 uppercase tracking-wider text-[11px]">Receitas</p>
                            ${Object.values(itensPorConta).filter(i => i.tipo === 'Receita').map(i => `
                                <div class="flex justify-between p-3.5 bg-emerald-50/70 text-emerald-900 font-semibold rounded-2xl border border-emerald-100/80 transition-all hover:shadow-sm">
                                    <span>(+) ${escapeHTML(i.codigo + ' - ' + i.nome)}</span>
                                    <span class="font-mono font-bold">R$ ${i.total.toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="space-y-2 pt-2">
                            <p class="font-bold text-slate-400 uppercase tracking-wider text-[11px]">Despesas</p>
                            ${Object.values(itensPorConta).filter(i => i.tipo === 'Despesa').map(i => `
                                <div class="flex justify-between p-3.5 bg-rose-50/70 text-rose-900 font-semibold rounded-2xl border border-rose-100/80 transition-all hover:shadow-sm">
                                    <span>(-) ${escapeHTML(i.codigo + ' - ' + i.nome)}</span>
                                    <span class="font-mono font-bold">R$ ${i.total.toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-4 border-t">
                            <div class="flex justify-between p-4 bg-teal-600 text-white font-black text-sm rounded-2xl shadow-md">
                                <span>(=) RESULTADO LÍQUIDO DO EXERCÍCIO</span>
                                <span class="font-mono">R$ ${resultadoLiquidoDRE.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function excluirRegistro(col, id) {
            if(!confirm('Deseja eliminar este registo?')) return;
            if(db[col]) {
                db[col] = db[col].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
