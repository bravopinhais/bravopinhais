<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Integrado</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pako para Gzip (Compressão) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-modern { border: 1px solid rgba(226, 232, 240, 0.8); }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Container Principal da Aplicação -->
    <div id="app" class="flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center no-print">
            <h1 class="font-black text-xl text-slate-900"><i class="fa-solid fa-cube text-teal-600 mr-2"></i>Gestão Integrada</h1>
            <div id="user-info" class="text-xs font-bold text-slate-600"></div>
        </header>

        <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
            <!-- Navegação / Abas Rápidas -->
            <div class="flex flex-wrap gap-2 no-print">
                <button onclick="mudarAba('estoque')" class="px-4 py-2 bg-white rounded-2xl font-bold text-xs shadow-sm border hover:bg-slate-50"><i class="fa-solid fa-boxes-stacked mr-1 text-teal-600"></i> Estoque</button>
                <button onclick="mudarAba('acertos')" class="px-4 py-2 bg-white rounded-2xl font-bold text-xs shadow-sm border hover:bg-slate-50"><i class="fa-solid fa-right-left mr-1 text-teal-600"></i> Acertos</button>
                <button onclick="mudarAba('documentos')" class="px-4 py-2 bg-white rounded-2xl font-bold text-xs shadow-sm border hover:bg-slate-50"><i class="fa-solid fa-cloud mr-1 text-teal-600"></i> Documentos</button>
                <button onclick="mudarAba('usuarios')" class="px-4 py-2 bg-white rounded-2xl font-bold text-xs shadow-sm border hover:bg-slate-50"><i class="fa-solid fa-users mr-1 text-teal-600"></i> Utilizadores</button>
                <button onclick="mudarAba('relatorios')" class="px-4 py-2 bg-white rounded-2xl font-bold text-xs shadow-sm border hover:bg-slate-50"><i class="fa-solid fa-chart-pie mr-1 text-teal-600"></i> Relatórios / DRE</button>
            </div>

            <!-- Botões de Ação Global -->
            <div id="acoes-topo" class="flex gap-2 no-print">
                <!-- Preenchido dinamicamente conforme a aba -->
            </div>

            <!-- Área de Conteúdo Dinâmico -->
            <div id="conteudo-principal" class="w-full">
                <!-- Renderizado via JS -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // Base de Dados Global Simulada
        let db = {
            estoque: [],
            acertos_estoque: [],
            documentos: [],
            usuarios: [
                { id: 'usr_1', usuario: 'admin', nome: 'Administrador', email: 'admin@sistema.local', perfil: 'Admin', status: 'Ativo', senhaHash: '123456', primeiroAcesso: false }
            ],
            financeiro: [],
            categorias: [{ nome: 'Contratos' }, { nome: 'Fiscal' }],
            motivos_acerto_estoque: [{ nome: 'Inventário Periódico' }, { nome: 'Avaria' }, { nome: 'Quebra' }]
        };

        let abaAtual = 'estoque';
        let cameraStreamAtiva = null;
        let scanInterval = null;
        let tempEstoqueFotoGzip = '';
        let tempEstoqueFotoNome = '';
        let tempArquivoGzipBase64 = '';
        let tempArquivoNome = '';

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function carregarDadosDaNuvem() {
            const salvo = localStorage.getItem('sistema_db_integrado');
            if (salvo) {
                try { db = JSON.parse(salvo); } catch(e) { console.error(e); }
            }
            renderMainOnly();
        }

        function salvarDados(dados) {
            localStorage.setItem('sistema_db_integrado', JSON.stringify(dados));
        }

        function mudarAba(aba) {
            abaAtual = aba;
            renderMainOnly();
        }

        function abrirModalContainer(htmlContent) {
            document.getElementById('modal-container').innerHTML = htmlContent;
        }

        function fecharModalContainer() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function compactarArquivoParaGzip(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const binaryString = e.target.result;
                const uint8Array = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    uint8Array[i] = binaryString.charCodeAt(i);
                }
                const compressed = pako.gzip(uint8Array);
                let binaryCompressed = '';
                for (let i = 0; i < compressed.length; i++) {
                    binaryCompressed += String.fromCharCode(compressed[i]);
                }
                const base64Gzip = btoa(binaryCompressed);
                callback(base64Gzip, file.name);
            };
            reader.readAsBinaryString(file);
        }

        function visualizarArquivo(base64Gzip, nomeOriginal) {
            try {
                const binStr = atob(base64Gzip);
                const len = binStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binStr.charCodeAt(i); }
                const decompressed = pako.ungzip(bytes);
                const blob = new Blob([decompressed]);
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } catch(e) {
                alert('Erro ao descompactar e visualizar o ficheiro.');
            }
        }

        function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
            try {
                const binStr = atob(base64Gzip);
                const len = binStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binStr.charCodeAt(i); }
                const decompressed = pako.ungzip(bytes);
                const blob = new Blob([decompressed]);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = nomeOriginal || 'arquivo_descarregado';
                link.click();
            } catch(e) {
                alert('Erro ao efetuar o download do ficheiro.');
            }
        }

        function exportarParaPDF() {
            window.print();
        }

        function renderMainOnly() {
            const acoesTopo = document.getElementById('acoes-topo');
            const conteudo = document.getElementById('conteudo-principal');

            if (abaAtual === 'estoque') {
                acoesTopo.innerHTML = `<button onclick="window.renderModalEstoque()" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl text-xs font-bold shadow-sm"><i class="fa-solid fa-plus mr-1"></i> Novo Item no Estoque</button>`;
                conteudo.innerHTML = renderEstoqueView();
            } else if (abaAtual === 'acertos') {
                acoesTopo.innerHTML = `<button onclick="window.renderModalAcertoEstoque()" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl text-xs font-bold shadow-sm"><i class="fa-solid fa-plus mr-1"></i> Registar Acerto de Estoque</button>`;
                conteudo.innerHTML = renderAcertoEstoqueView();
            } else if (abaAtual === 'documentos') {
                acoesTopo.innerHTML = `<button onclick="window.renderModalDocumento()" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl text-xs font-bold shadow-sm"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Inserir Documento</button>`;
                conteudo.innerHTML = renderDocumentosView();
            } else if (abaAtual === 'usuarios') {
                acoesTopo.innerHTML = `<button onclick="window.renderModalUsuario()" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl text-xs font-bold shadow-sm"><i class="fa-solid fa-user-plus mr-1"></i> Novo Utilizador</button>`;
                conteudo.innerHTML = renderUsuariosView();
            } else if (abaAtual === 'relatorios') {
                acoesTopo.innerHTML = '';
                conteudo.innerHTML = renderRelatoriosCentralView();
            }
        }

        function renderEstoqueView() {
            const list = db.estoque || [];
            return `
                <div class="bg-white rounded-3xl card-modern overflow-x-auto w-full shadow-sm">
                    <table class="w-full text-left text-xs min-w-[700px]">
                        <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-100">
                            <tr>
                                <th class="p-4">Etiqueta / Código</th>
                                <th class="p-4">Item</th>
                                <th class="p-4">Quantidade</th>
                                <th class="p-4">Mín / Máx</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${list.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhum item registado no estoque.</td></tr>` : list.map(st => `
                                <tr class="hover:bg-slate-50/80 transition-colors">
                                    <td class="p-4 font-mono font-bold text-teal-700">${escapeHTML(st.etiqueta)}</td>
                                    <td class="p-4 font-bold text-slate-900">${escapeHTML(st.item)}</td>
                                    <td class="p-4 font-mono font-black">${st.quantidade !== undefined ? st.quantidade : (st.qtd || 0)}</td>
                                    <td class="p-4 font-mono text-slate-500">${st.minimo || 0} / ${st.maximo || 0}</td>
                                    <td class="p-4 text-center">
                                        <button onclick="window.renderModalEstoque('${st.id}')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl mr-1 transition-colors"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="excluirRegistro('estoque','${st.id}')" class="p-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl transition-colors"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalEstoque = function(id = null) {
            const st = id ? (db.estoque||[]).find(x => x.id === id) : { id: '', etiqueta: '', item: '', quantidade: 0, minimo: 0, maximo: 0 };
            tempEstoqueFotoGzip = st.fotoCompactadaGzip || '';
            tempEstoqueFotoNome = st.fotoNome || '';

            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 w-full backdrop-blur-md">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-black text-lg text-slate-900">${id ? 'Editar Item de Estoque' : 'Novo Item de Estoque'}</h3>
                        <form onsubmit="salvarModalEstoque(event, '${id}')" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Etiqueta / Código</label><input type="text" id="m_est_etiq" required value="${escapeHTML(st.etiqueta)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Nome do Item</label><input type="text" id="m_est_item" required value="${escapeHTML(st.item)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            <div class="grid grid-cols-3 gap-2">
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Qtd Atual</label><input type="number" id="m_est_qtd" required value="${st.quantidade !== undefined ? st.quantidade : (st.qtd || 0)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Mín</label><input type="number" id="m_est_min" required value="${st.minimo || 0}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Máx</label><input type="number" id="m_est_max" required value="${st.maximo || 0}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            </div>
                            <div>
                                <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Foto do Item (Opcional)</label>
                                <input type="file" accept="image/*" onchange="processarFotoEstoqueGzip(event)" class="w-full p-2 border rounded-2xl bg-slate-50">
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-2xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl font-bold shadow-sm">Salvar</button></div>
                        </form>
                    </div>
                </div>
            `);
        };

        function processarFotoEstoqueGzip(event) {
            const file = event.target.files[0];
            if (!file) return;
            compactarArquivoParaGzip(file, (base64Gzip, nome) => {
                tempEstoqueFotoGzip = base64Gzip;
                tempEstoqueFotoNome = nome;
                alert('Foto compactada e pronta para guardar!');
            });
        }

        window.salvarModalEstoque = function(e, id) {
            e.preventDefault();
            if(!db.estoque) db.estoque = [];
            const obj = {
                id: id && id !== 'null' ? id : 'est_' + Date.now(),
                etiqueta: document.getElementById('m_est_etiq').value,
                item: document.getElementById('m_est_item').value,
                quantidade: parseInt(document.getElementById('m_est_qtd').value) || 0,
                minimo: parseInt(document.getElementById('m_est_min').value) || 0,
                maximo: parseInt(document.getElementById('m_est_max').value) || 0,
                fotoNome: tempEstoqueFotoNome,
                fotoCompactadaGzip: tempEstoqueFotoGzip
            };
            const idx = db.estoque.findIndex(x => x.id === obj.id);
            if(idx !== -1) {
                if(!obj.fotoCompactadaGzip) obj.fotoCompactadaGzip = db.estoque[idx].fotoCompactadaGzip || '';
                if(!obj.fotoNome) obj.fotoNome = db.estoque[idx].fotoNome || '';
                db.estoque[idx] = obj;
            } else {
                db.estoque.push(obj);
            }
            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        function renderAcertoEstoqueView() {
            const list = db.acertos_estoque || [];
            return `
                <div class="bg-white rounded-3xl card-modern overflow-x-auto w-full shadow-sm">
                    <table class="w-full text-left text-xs min-w-[650px]">
                        <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-100">
                            <tr>
                                <th class="p-4">Item</th>
                                <th class="p-4">Tipo</th>
                                <th class="p-4">Quantidade</th>
                                <th class="p-4">Motivo</th>
                                <th class="p-4">Data / Histórico</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${list.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhum acerto de estoque registado.</td></tr>` : list.map(ac => {
                                const estObj = (db.estoque || []).find(x => x.id === ac.estoqueId);
                                return `
                                    <tr class="hover:bg-slate-50/80 transition-colors">
                                        <td class="p-4 font-bold text-slate-900">${estObj ? escapeHTML(estObj.item) : 'Item Removido'}</td>
                                        <td class="p-4"><span class="px-3 py-1 rounded-full font-extrabold ${ac.tipo === 'Entrada' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${escapeHTML(ac.tipo)}</span></td>
                                        <td class="p-4 font-mono font-black">${ac.quantidade}</td>
                                        <td class="p-4 font-bold text-teal-700">${escapeHTML(ac.motivo)}</td>
                                        <td class="p-4 text-slate-500 font-medium">${escapeHTML(ac.data || '-')}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalAcertoEstoque = function() {
            const estoqueList = db.estoque || [];
            const motivos = db.motivos_acerto_estoque || [];
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 w-full backdrop-blur-md">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-black text-lg text-slate-900">Novo Acerto de Estoque</h3>
                        <form onsubmit="salvarModalAcertoEstoque(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Item do Estoque</label>
                                <select id="m_ac_item" required class="w-full p-3 border rounded-2xl font-bold bg-slate-50">
                                    <option value="">[ Selecione o Item ]</option>
                                    ${estoqueList.map(st => `<option value="${st.id}">${escapeHTML(st.item + ' (Atual: ' + (st.quantidade !== undefined ? st.quantidade : st.qtd || 0) + ')')}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Tipo de Movimento</label>
                                <select id="m_ac_tipo" class="w-full p-3 border rounded-2xl font-bold bg-slate-50">
                                    <option value="Saída">Saída (Baixa)</option>
                                    <option value="Entrada">Entrada (Reposição)</option>
                                </select>
                            </div>
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Quantidade</label><input type="number" id="m_ac_qtd" required min="1" value="1" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            <div>
                                <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Motivo</label>
                                <select id="m_ac_motivo" class="w-full p-3 border rounded-2xl font-bold bg-slate-50">
                                    ${motivos.map(m => `<option value="${escapeHTML(m.nome)}">${escapeHTML(m.nome)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-2xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl font-bold shadow-sm">Registar Acerto</button></div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.salvarModalAcertoEstoque = function(e) {
            e.preventDefault();
            const estoqueId = document.getElementById('m_ac_item').value;
            const tipo = document.getElementById('m_ac_tipo').value;
            const qtd = parseInt(document.getElementById('m_ac_qtd').value) || 0;
            const motivo = document.getElementById('m_ac_motivo').value;

            const estIdx = (db.estoque || []).findIndex(x => x.id === estoqueId);
            if (estIdx !== -1) {
                let atual = parseInt(db.estoque[estIdx].quantidade !== undefined ? db.estoque[estIdx].quantidade : (db.estoque[estIdx].qtd || 0));
                if (tipo === 'Entrada') atual += qtd;
                else atual = Math.max(0, atual - qtd);
                db.estoque[estIdx].quantidade = atual;
            }

            if (!db.acertos_estoque) db.acertos_estoque = [];
            db.acertos_estoque.push({
                id: 'ac_' + Date.now(),
                estoqueId: estoqueId,
                tipo: tipo,
                quantidade: qtd,
                motivo: motivo,
                data: new Date().toLocaleDateString('pt-BR')
            });

            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        function renderDocumentosView() {
            const list = db.documentos || [];
            return `
                <div class="bg-white rounded-3xl card-modern overflow-x-auto w-full shadow-sm">
                    <table class="w-full text-left text-xs min-w-[500px]">
                        <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-100">
                            <tr>
                                <th class="p-4">Nome do Documento</th>
                                <th class="p-4">Pasta</th>
                                <th class="p-4 text-center">Ficheiro Gzip</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${list.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-slate-400">Nenhum documento guardado na nuvem.</td></tr>` : list.map(d => `
                                <tr class="hover:bg-slate-50/80 transition-colors">
                                    <td class="p-4 font-bold text-slate-900">${escapeHTML(d.nome)}</td>
                                    <td class="p-4 font-semibold text-teal-700">${escapeHTML(d.categoria || 'Geral')}</td>
                                    <td class="p-4 text-center font-mono text-[11px] text-slate-400">${escapeHTML(d.nomeOriginal || 'arquivo')}</td>
                                    <td class="p-4 text-center">
                                        <button onclick="visualizarArquivo('${d.arquivoCompactadoGzip}','${d.nomeOriginal}')" class="p-2 bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-xl mr-1 transition-colors" title="Visualizar"><i class="fa-solid fa-eye"></i></button>
                                        <button onclick="extrairEDownloadArquivo('${d.arquivoCompactadoGzip}','${d.nomeOriginal}')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl mr-1 transition-colors" title="Descarregar"><i class="fa-solid fa-download"></i></button>
                                        <button onclick="excluirRegistro('documentos','${d.id}')" class="p-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl transition-colors" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalDocumento = function() {
            const categorias = db.categorias || [];
            tempArquivoGzipBase64 = '';
            tempArquivoNome = '';

            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 w-full backdrop-blur-md">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-black text-lg text-slate-900">Inserir Documento na Nuvem</h3>
                        <form onsubmit="salvarModalDocumento(event)" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Nome do Documento</label><input type="text" id="m_doc_nome" required class="w-full p-3 border rounded-2xl font-bold bg-slate-50" placeholder="Ex: Ata Assembleia 2026"></div>
                            <div>
                                <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Pasta</label>
                                <select id="m_doc_cat" class="w-full p-3 border rounded-2xl font-bold bg-slate-50">
                                    <option value="Geral">Geral</option>
                                    ${categorias.map(c => `<option value="${escapeHTML(c.nome)}">${escapeHTML(c.nome)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Ficheiro (PDF, Imagem, etc.)</label>
                                <input type="file" required onchange="processarArquivoDocGzip(event)" class="w-full p-2 border rounded-2xl bg-slate-50">
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-2xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl font-bold shadow-sm">Guardar na Nuvem</button></div>
                        </form>
                    </div>
                </div>
            `);
        };

        function processarArquivoDocGzip(event) {
            const file = event.target.files[0];
            if (!file) return;
            compactarArquivoParaGzip(file, (base64Gzip, nome) => {
                tempArquivoGzipBase64 = base64Gzip;
                tempArquivoNome = nome;
                alert('Ficheiro compactado Gzip com sucesso!');
            });
        }

        window.salvarModalDocumento = function(e) {
            e.preventDefault();
            if (!tempArquivoGzipBase64) { alert('Selecione um ficheiro válido.'); return; }
            if(!db.documentos) db.documentos = [];
            db.documentos.push({
                id: 'doc_' + Date.now(),
                nome: document.getElementById('m_doc_nome').value,
                categoria: document.getElementById('m_doc_cat').value,
                nomeOriginal: tempArquivoNome,
                arquivoCompactadoGzip: tempArquivoGzipBase64
            });
            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        function renderUsuariosView() {
            const list = db.usuarios || [];
            return `
                <div class="bg-white rounded-3xl card-modern overflow-x-auto w-full shadow-sm">
                    <table class="w-full text-left text-xs min-w-[700px]">
                        <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-100">
                            <tr>
                                <th class="p-4">Utilizador</th>
                                <th class="p-4">Nome</th>
                                <th class="p-4">Perfil</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${list.map(u => `
                                <tr class="hover:bg-slate-50/80 transition-colors">
                                    <td class="p-4 font-mono font-bold text-teal-700">${escapeHTML(u.usuario)}</td>
                                    <td class="p-4 font-bold text-slate-900">${escapeHTML(u.nome)}</td>
                                    <td class="p-4"><span class="px-3 py-1 bg-slate-100 text-slate-700 rounded-full font-bold">${escapeHTML(u.perfil || u.cargo || 'Operador')}</span></td>
                                    <td class="p-4"><span class="px-3 py-1 rounded-full font-extrabold ${u.status === 'Ativo' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">${escapeHTML(u.status || 'Ativo')}</span></td>
                                    <td class="p-4 text-center">
                                        <button onclick="window.renderModalUsuario('${u.id}')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl mr-1 transition-colors"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="excluirRegistro('usuarios','${u.id}')" class="p-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl transition-colors"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalUsuario = function(id = null) {
            const u = id ? (db.usuarios||[]).find(x => x.id === id) : { id: '', usuario: '', nome: '', email: '', perfil: 'Operador', status: 'Ativo', senhaHash: '123456', primeiroAcesso: true };
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 w-full backdrop-blur-md">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 class="font-black text-lg text-slate-900">${id ? 'Editar Utilizador' : 'Novo Utilizador'}</h3>
                        <form onsubmit="salvarModalUsuario(event, '${id}')" class="space-y-3 text-xs">
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Nome de Utilizador</label><input type="text" id="m_usr_user" required value="${escapeHTML(u.usuario)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Nome Completo</label><input type="text" id="m_usr_nome" required value="${escapeHTML(u.nome)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">E-mail</label><input type="email" id="m_usr_email" required value="${escapeHTML(u.email)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Perfil</label>
                                    <select id="m_usr_perfil" class="w-full p-3 border rounded-2xl font-bold bg-slate-50">
                                        <option value="Admin" ${u.perfil==='Admin'?'selected':''}>Admin</option>
                                        <option value="Operador" ${u.perfil==='Operador'?'selected':''}>Operador</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Status</label>
                                    <select id="m_usr_status" class="w-full p-3 border rounded-2xl font-bold bg-slate-50">
                                        <option value="Ativo" ${u.status==='Ativo'?'selected':''}>Ativo</option>
                                        <option value="Inativo" ${u.status==='Inativo'?'selected':''}>Inativo</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-2xl font-bold">Cancelar</button><button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl font-bold shadow-sm">Salvar</button></div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.salvarModalUsuario = function(e, id) {
            e.preventDefault();
            if(!db.usuarios) db.usuarios = [];
            const isEdit = id && id !== 'null';
            const existente = isEdit ? db.usuarios.find(x => x.id === id) : null;

            const obj = {
                id: isEdit ? id : 'usr_' + Date.now(),
                usuario: document.getElementById('m_usr_user').value,
                nome: document.getElementById('m_usr_nome').value,
                email: document.getElementById('m_usr_email').value,
                perfil: document.getElementById('m_usr_perfil').value,
                status: document.getElementById('m_usr_status').value,
                senhaHash: existente ? existente.senhaHash : '123456',
                primeiroAcesso: existente ? existente.primeiroAcesso : true
            };
            const idx = db.usuarios.findIndex(x => x.id === obj.id);
            if(idx !== -1) db.usuarios[idx] = obj; else db.usuarios.push(obj);
            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        function renderRelatoriosCentralView() {
            const financeiroList = db.financeiro || [];
            let totalReceber = 0;
            let totalPagar = 0;
            financeiroList.forEach(f => {
                const val = parseFloat(f.valor) || 0;
                if (f.tipo === 'Receber') totalReceber += val;
                else if (f.tipo === 'Pagar') totalPagar += val;
            });
            const resultadoLiquido = totalReceber - totalPagar;

            return `
                <div class="space-y-6 w-full max-w-4xl mx-auto">
                    <div class="bg-white rounded-3xl card-modern p-8 shadow-sm space-y-6">
                        <div class="flex justify-between items-center border-b pb-4">
                            <div>
                                <h3 class="font-black text-slate-900 text-xl">DRE Gerencial Consolidada</h3>
                                <p class="text-xs text-slate-500 font-medium">Demonstração do Resultado do Exercício</p>
                            </div>
                            <div class="flex gap-2 no-print">
                                <button onclick="exportarParaPDF()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl text-xs font-bold shadow-sm"><i class="fa-solid fa-file-pdf mr-1"></i> Imprimir PDF</button>
                            </div>
                        </div>
                        <div class="space-y-4 text-xs font-bold text-slate-800">
                            <div class="flex justify-between items-center p-4 bg-emerald-50 rounded-2xl text-emerald-900">
                                <span>(+) Total de Receitas Registadas</span>
                                <span class="font-mono text-sm">R$ ${totalReceber.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between items-center p-4 bg-rose-50 rounded-2xl text-rose-900">
                                <span>(-) Total de Despesas Registadas</span>
                                <span class="font-mono text-sm">R$ ${totalPagar.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between items-center p-5 bg-slate-900 text-white rounded-2xl text-sm font-black">
                                <span>(=) Resultado Líquido do Período</span>
                                <span class="font-mono ${resultadoLiquido >= 0 ? 'text-emerald-400' : 'text-rose-400'}">R$ ${resultadoLiquido.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function excluirRegistro(tabela, id) {
            if (!confirm('Deseja realmente eliminar este registo?')) return;
            if (db[tabela]) {
                db[tabela] = db[tabela].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        // Inicialização ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
