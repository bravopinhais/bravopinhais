        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];

        function mascaraMoeda(e) {
            let value = e.target.value.replace(/\D/g, "");
            value = (value / 100).toFixed(2) + "";
            value = value.replace(".", ",");
            value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            e.target.value = "R$ " + value;
        }

        function mascaraCPF(e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 11) v = v.substring(0, 11);
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            e.target.value = v;
        }

        function mascaraCNPJ(e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 14) v = v.substring(0, 14);
            v = v.replace(/^(\d{2})(\d)/, "$1.$2");
            v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
            v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
            v = v.replace(/(\d{4})(\d)/, "$1-$2");
            e.target.value = v;
        }

        function mascaraTelefone(e) {
            let v = e.target.value.replace(/\D/g, "");

            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            e.target.value = v;
        }

        function compactarArquivoParaGzip(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const compressed = pako.deflate(uint8Array);
                    let binary = '';
                    const len = compressed.byteLength;
                    for (let i = 0; i < len; i++) { binary += String.fromCharCode(compressed[i]); }
                    callback(btoa(binary), file.name);
                } catch (err) { alert('Erro ao compactar ficheiro.'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                const blob = new Blob([decompressed]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nomeOriginal;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
            } catch (err) { alert('Erro ao extrair ficheiro.'); }
        }

        function visualizarArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                
                let mimeType = 'application/octet-stream';
                const ext = nomeOriginal.split('.').pop().toLowerCase();
                if (ext === 'pdf') mimeType = 'application/pdf';
                else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) mimeType = `image/${ext === 'jpg' ? 'jpeg' : ext}`;
                else if (ext === 'txt') mimeType = 'text/plain';

                const blob = new Blob([decompressed], { type: mimeType });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            } catch (err) { alert('Erro ao visualizar o ficheiro.'); }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) { alert('Não há dados disponíveis.'); return; }
            const sanitizeData = dados.map(item => { let obj = { ...item }; delete obj.arquivoCompactadoGzip; delete obj.fotoCompactadaGzip; return obj; });
            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(',') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`);
                csvContent += values.join(',') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm bento-card flex flex-col justify-between">
                        <h3 class="font-bold text-slate-800 dark:text-white text-sm mb-2"><i class="fa-solid fa-boxes-stacked text-teal-600 mr-2"></i> Estoque</h3>
                        <div class="relative h-44 w-full flex items-center justify-center">
                            <canvas id="chartEstoqueDash"></canvas>
                        </div>
                        <button onclick="abrirModulo('estoque')" class="mt-2 text-teal-600 dark:text-teal-400 text-xs font-bold text-center hover:underline">Ver Inventário Completo &rarr;</button>
                    </div>
                </div>
            `;
        }

        function initDashboardCharts() {
            if (tabsState.activeTab !== 'dashboard') return;
            const finList = db.financeiro || [];
            let totalReceber = 0, totalPagar = 0;
            finList.forEach(f => {
                const val = parseFloat(f.valor) || 0;
                if (f.tipo === 'Receber') totalReceber += val;
                else if (f.tipo === 'Pagar') totalPagar += val;
            });

            const ctx1 = document.getElementById('chartReceitaDespesa');
            if (ctx1) {
                if (chartInstanceReceitaDespesa) chartInstanceReceitaDespesa.destroy();
                chartInstanceReceitaDespesa = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['Total a Receber', 'Total a Pagar', 'Saldo Líquido'],
                        datasets: [{
                            data: [totalReceber, totalPagar, totalReceber - totalPagar],
                            backgroundColor: ['#0d9488', '#f43f5e', '#3b82f6'],
                            borderRadius: 12, barThickness: 40
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }
        }

        function initDashboardEstoqueChart() {
            if (tabsState.activeTab !== 'dashboard') return;
            const ctx = document.getElementById('chartEstoqueDash');
            if (!ctx) return;

            const list = db.estoque || [];
            let qtdAdequado = 0, qtdCritico = 0, qtdExcedente = 0;
            list.forEach(st => {
                const atual = parseInt(st.quantidade !== undefined ? st.quantidade : (st.qtd || 0));
                if (atual <= (st.minimo||0)) qtdCritico++;
                else if ((st.maximo||0) > 0 && atual > st.maximo) qtdExcedente++;
                else qtdAdequado++;
            });

            if (chartInstanceEstoqueDash) chartInstanceEstoqueDash.destroy();
            chartInstanceEstoqueDash = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Adequado', 'Insuficiente', 'Excedente'],
                    datasets: [{ data: [qtdAdequado || 1, qtdCritico, qtdExcedente], backgroundColor: ['#0d9488', '#f43f5e', '#f59e0b'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '70%' }
            });
        }

        function renderMoradoresView() {
            let moradores = db.moradores || [];
            if (termoBuscaGlobal) {
                const t = termoBuscaGlobal.toLowerCase();
                moradores = moradores.filter(m => (m.nome||'').toLowerCase().includes(t) || (m.apartamento||'').toLowerCase().includes(t));
            }

            return `
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 overflow-x-auto shadow-sm">
                    <table class="w-full text-left text-xs min-w-[700px]">
                        <thead class="bg-slate-800 text-white">
                            <tr><th class="p-4">Bloco/Ap</th><th class="p-4">Nome</th><th class="p-4">CPF</th><th class="p-4">Telefone</th><th class="p-4 text-center">Ações</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-slate-800 dark:text-slate-200">
                            ${moradores.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhum morador encontrado.</td></tr>` : moradores.map(m => `
                                <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                    <td class="p-4 font-bold">Bloco ${escapeHTML(m.bloco)} - Ap ${escapeHTML(m.apartamento)}</td>
                                    <td class="p-4 font-bold">${escapeHTML(m.nome)}</td>
                                    <td class="p-4 font-mono">${escapeHTML(m.cpf || '-')}</td>
                                    <td class="p-4 font-mono">${escapeHTML(m.telefone || '-')}</td>
                                    <td class="p-4 text-center">
                                        <button onclick="window.renderModalMorador('${m.id}')" class="p-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl mr-1"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="excluirRegistro('moradores','${m.id}')" class="p-2 bg-rose-50 dark:bg-rose-950/50 text-rose-600 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.renderModalMorador = function(id = null) {
            const m = id ? (db.moradores||[]).find(x => x.id === id) : { id: '', bloco: '1', apartamento: '', nome: '', email: '', telefone: '', cpf: '' };
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800">
                        <div class="flex justify-between items-center border-b dark:border-slate-800 pb-3">
                            <h3 class="font-bold text-lg text-slate-800 dark:text-white">${id ? 'Editar Morador' : 'Novo Morador'}</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="salvarModalMorador(event, '${id}')" class="space-y-3 text-xs">
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block font-bold uppercase text-slate-500 mb-1">Bloco</label><input type="text" id="m_m_bloco" required value="${escapeHTML(m.bloco)}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white"></div>
                                <div><label class="block font-bold uppercase text-slate-500 mb-1">Apartamento</label><input type="text" id="m_m_ap" required value="${escapeHTML(m.apartamento)}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white"></div>
                            </div>
                            <div><label class="block font-bold uppercase text-slate-500 mb-1">Nome Completo</label><input type="text" id="m_m_nome" required value="${escapeHTML(m.nome)}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white"></div>
                            <div><label class="block font-bold uppercase text-slate-500 mb-1">CPF (Máscara Automática)</label><input type="text" id="m_m_cpf" oninput="mascaraCPF(event)" value="${escapeHTML(m.cpf || '')}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="000.000.000-00"></div>
                            <div><label class="block font-bold uppercase text-slate-500 mb-1">Telefone (Máscara Automática)</label><input type="text" id="m_m_tel" oninput="mascaraTelefone(event)" value="${escapeHTML(m.telefone || '')}" class="w-full p-3 border rounded-xl font-bold bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder="(00) 00000-0000"></div>
                            <div class="flex justify-end gap-2 pt-3 border-t dark:border-slate-800">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-sm">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.salvarModalMorador = function(e, id) {
            e.preventDefault();
            if(!db.moradores) db.moradores = [];
            const obj = {
                id: id && id !== 'null' ? id : 'mor_' + Date.now(),
                bloco: document.getElementById('m_m_bloco').value,
                apartamento: document.getElementById('m_m_ap').value,
                nome: document.getElementById('m_m_nome').value,
                cpf: document.getElementById('m_m_cpf').value,
                telefone: document.getElementById('m_m_tel').value
            };
            const idx = db.moradores.findIndex(x => x.id === obj.id);
            if(idx !== -1) db.moradores[idx] = obj; else db.moradores.push(obj);
            salvarDados(db); fecharModalContainer(); renderMainOnly();
        };

        function renderCondominioView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Dados do Condomínio Ativo.</div>`; }
        function renderPlanoContasView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Plano de Contas Ativo.</div>`; }
        function renderFinanceiroView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Financeiro Ativo.</div>`; }
        function renderEstoqueView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Estoque e Fotos Gzip Ativo.</div>`; }
        function renderDocumentosView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Documentos Gzip Ativo.</div>`; }
        function renderRelatoriosCentralView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Relatórios e DRE Ativo.</div>`; }
        function renderUsuariosView() { return `<div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">Módulo Gestão de Utilizadores Ativo.</div>`; }

        function excluirRegistro(col, id) {
            if(!confirm('Deseja eliminar este registo?')) return;
            if(db[col]) {
                db[col] = db[col].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
