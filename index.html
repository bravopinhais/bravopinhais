<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950" data-animacoes="ativadas">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="description" content="Guardiões do Bravo — sistema de gestão condominial.">
        <meta name="theme-color" content="#020617">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Guardiões do Bravo">
        <link rel="manifest" href="./manifest.webmanifest">
        <link rel="icon" href="./icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="./icon-192.png">
        <title>Guardiões do Bravo - Gestão Condominial Completa em Nuvem</title>
        <!-- Versão de melhorias: 2026.10.28 | login Google com imagem 3D cinematográfica e movimento de cena -->
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <!-- FontAwesome Icons CDN -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- Chart.js CDN -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- Pako (Compressão Gzip para arquivos grandes) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
        <!-- Supabase JS Client para Banco de Dados na Nuvem -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'sans-serif']
                        },
                        colors: {
                            brand: {
                                50: '#f0fdfa',
                                100: '#ccfbf1',
                                200: '#99f6e4',
                                300: '#5eead4',
                                400: '#2dd4bf',
                                500: '#14b8a6',
                                600: '#0d9488',
                                700: '#0f766e',
                                800: '#115e59',
                                900: '#134e4a',
                                950: '#042f2e'
                            }
                        }
                    }
                }
            }
        </script>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                font-family: 'Inter', sans-serif;
            }

            input, select, textarea {
                color: #0f172a !important;
                font-weight: 600 !important;
            }

            .tab-active {
                border-bottom: 2px solid #0d9488;
                background-color: #ffffff;
                color: #0f766e;
                font-weight: 700;
                shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            }

            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #f1f5f9;
            }

            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 9999px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }

            .sidebar-full {
                height: 100vh;
                position: sticky;
                top: 0;
            }

            .card-modern {
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                border: 1px solid rgba(226, 232, 240, 0.8);
            }

            .card-modern:hover {
                transform: translateY(-3px);
                box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            }

            .glass-header {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(12px);
            }

            @media print {
                aside, header, .no-print, button, .actions-col {
                    display: none !important;
                }

                body {
                    background: white !important;
                    color: black !important;
                }

                main {
                    padding: 0 !important;
                }

                .print-break {
                    page-break-before: always;
                }
            }

            /* ===== Modernização visual: camada complementar, sem alterar os módulos ===== */
            :root {
                color-scheme: light;
                --app-ink: #172033;
                --app-muted: #64748b;
                --app-primary: #0f766e;
                --app-border: #e2e8f0;
            }

            body {
                background: #f4f7fb !important;
                color: var(--app-ink);
                letter-spacing: -0.01em;
            }

            #status-nuvem {
                position: sticky;
                top: 0;
                z-index: 70;
                min-height: 34px;
                font-size: 11px;
                letter-spacing: .02em;
            }

            #app {
                background: linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);
            }

            .card-modern {
                border: 1px solid #e5eaf1 !important;
                border-radius: 18px !important;
                box-shadow: 0 3px 14px rgba(15,23,42,.035);
            }

            .card-modern:hover {
                transform: translateY(-2px);
                box-shadow: 0 14px 30px rgba(15,23,42,.075);
            }

            button, a, input, select, textarea {
                transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
            }

            button {
                min-height: 34px;
            }

            button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
                outline: 3px solid rgba(20,184,166,.38) !important;
                outline-offset: 2px;
            }

            input, select, textarea {
                border-color: #dbe3ed !important;
                border-radius: 10px !important;
            }

            input:focus, select:focus, textarea:focus {
                border-color: #0d9488 !important;
                box-shadow: 0 0 0 3px rgba(13,148,136,.10) !important;
            }

            table {
                border-collapse: separate;
                border-spacing: 0;
            }

            thead th {
                letter-spacing: .06em;
                font-size: 10px;
            }

            tbody tr:hover {
                background-color: #f8fbff;
            }

            .sidebar-full {
                height: 100dvh;
            }

            #sidebar-menu {
                box-shadow: 8px 0 28px rgba(2,6,23,.08);
            }

            #sidebar-menu nav button {
                min-height: 40px;
                border-radius: 10px;
            }

            #sidebar-menu nav button:hover {
                transform: translateX(2px);
            }

            #modal-container > div {
                padding: 16px;
            }

            #modal-container > div > div {
                max-height: min(90dvh, 900px);
                overflow-y: auto;
                border: 1px solid rgba(255,255,255,.5);
            }

            .glass-header {
                background: rgba(255,255,255,.92);
                border-bottom: 1px solid #e8edf4;
            }

            ::selection {
                background: #99f6e4;
                color: #134e4a;
            }

            @media (max-width: 768px) {
                .pet-espia {
                    top: -42px;
                }

                .pet-espia.esq {
                    left: 18px;
                }

                .pet-espia.dir {
                    right: 18px;
                }

                .login-google-card {
                    margin-top: 18px;
                }

                .sidebar-full {
                    height: 100dvh;
                }

                table {
                    font-size: 12px;
                }

                #status-nuvem {
                    padding-inline: 8px; text-align: center;
                }
            }

            /* O sistema inicia com animações ligadas. O utilizador pode desligá-las em Configurações. */
            @media (prefers-reduced-motion: reduce) {
                html:not([data-animacoes="ativadas"]) *, html:not([data-animacoes="ativadas"]) *::before, html:not([data-animacoes="ativadas"]) *::after {
                    animation-duration: .01ms !important;
                    animation-iteration-count: 1 !important;
                    scroll-behavior: auto !important;
                    transition-duration: .01ms !important;
                }

                html:not([data-animacoes="ativadas"]) .card-modern:hover, html:not([data-animacoes="ativadas"]) #sidebar-menu nav button:hover {
                    transform: none;
                }
            }

            html[data-animacoes="desativadas"] *, html[data-animacoes="desativadas"] *::before, html[data-animacoes="desativadas"] *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }

            html[data-animacoes="desativadas"] .card-modern:hover, html[data-animacoes="desativadas"] #sidebar-menu nav button:hover {
                transform: none !important;
            }

            /* ===== ANIMAÇÕES v2 ===== */
            /* ---------- Entrada dos módulos (troca de aba e login) ---------- */
            @keyframes entrar-subindo {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .entrada-seq {
                animation: entrar-subindo .42s cubic-bezier(.2, .7, .2, 1) both;
                animation-delay: calc(var(--base, 0ms) + var(--i, 0) * 60ms);
            }

            /* ---------- Modais ---------- */
            @keyframes modal-fundo-in {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            @keyframes modal-fundo-out {
                from {
                    opacity: 1;
                }

                to {
                    opacity: 0;
                }
            }

            @keyframes modal-caixa-in {
                from {
                    opacity: 0;
                    transform: translateY(14px) scale(.97);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes modal-caixa-out {
                from {
                    opacity: 1;
                    transform: none;
                }

                to {
                    opacity: 0;
                    transform: translateY(8px) scale(.98);
                }
            }

            #modal-container > div {
                animation: modal-fundo-in .18s ease-out both;
            }

            #modal-container > div > div {
                animation: modal-caixa-in .24s cubic-bezier(.2, .8, .2, 1) both;
            }

            #modal-container.fechando > div {
                animation: modal-fundo-out .16s ease-in both;
            }

            #modal-container.fechando > div > div {
                animation: modal-caixa-out .16s ease-in both;
            }

            button:active:not(:disabled) {
                transform: scale(.97);
            }

            #sidebar-backdrop:not(.hidden) {
                animation: modal-fundo-in .25s ease-out both;
            }

            /* ---------- Login: cartão + cão e gato espiando ---------- */
            #app > .min-h-screen > .max-w-md {
                animation: modal-caixa-in .5s cubic-bezier(.2, .8, .2, 1) both;
            }

            .pet-espia {
                position: absolute;
                top: -48px;
                z-index: 30;
                pointer-events: none;
                display: block;
                line-height: 0;
            }

            .pet-login-card, .login-google-card {
                overflow: visible !important;
            }

            .pet-login-emoji {
                display: block;
                font-size: 52px;
                line-height: 1;
                filter: drop-shadow(0 5px 5px rgba(0,0,0,.25));
                animation: espiar 3.2s ease-in-out infinite;
            }

            .pet-login-gato .pet-login-emoji {
                animation-delay: -1.4s;
            }

            .pet-espia svg {
                display: block;
                animation: espiar 3.2s ease-in-out infinite;
                transform-origin: 50% 100%;
            }

            .pet-espia.dir {
                right: 24px;
            }

            .pet-espia.esq {
                left: 24px;
            }

            .pet-espia.esq svg {
                animation-delay: -1.4s;
            }

            @keyframes espiar {
                0%, 100% {
                    transform: translateY(0) rotate(0);
                }

                50% {
                    transform: translateY(-4px) rotate(-3deg);
                }
            }

            /* ---------- Transição de login: cão e gato correndo ---------- */
            #transicao-login {
                position: fixed;
                inset: 0;
                z-index: 200;
                background: radial-gradient(circle at 50% 38%, #0f3d3a, #020617 70%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 26px;
                transition: opacity .45s ease;
                cursor: pointer;
            }

            #transicao-login.saindo {
                opacity: 0;
                pointer-events: none;
            }

            .tl-texto {
                color: #fff;
                font-weight: 800;
                font-size: 18px;
                letter-spacing: -.01em;
                animation: entrar-subindo .5s both;
            }

            .tl-pista {
                position: relative;
                width: 100%;
                height: 84px;
                overflow: hidden;
            }

            .tl-corredor {
                position: absolute;
                bottom: 6px;
                left: 0;
                animation: corre 1.45s cubic-bezier(.4, .1, .5, .95) both;
            }

            .tl-corredor svg {
                display: block;
                animation: pula .3s ease-in-out infinite;
                transform-origin: 50% 100%;
            }

            @keyframes corre {
                from {
                    transform: translateX(-90px);
                }

                to {
                    transform: translateX(calc(100vw + 30px));
                }
            }

            @keyframes pula {
                0%, 100% {
                    transform: translateY(0) rotate(-5deg);
                }

                50% {
                    transform: translateY(-14px) rotate(5deg);
                }
            }

            .tl-pegada {
                position: absolute;
                bottom: 2px;
                font-size: 14px;
                opacity: 0;
                animation: pegada 1.1s ease-out both;
            }

            @keyframes pegada {
                0% {
                    opacity: 0;
                }

                20% {
                    opacity: .7;
                }

                100% {
                    opacity: 0;
                }
            }

            /* ---------- Gato 3D do botão de IA ---------- */
            .gato-ia {
                display: block;
                transform-origin: 50% 90%;
                animation: gato-balanca 2.6s ease-in-out infinite;
                filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
            }

            @keyframes gato-balanca {
                0%, 100% {
                    transform: rotate(-5deg);
                }

                50% {
                    transform: rotate(5deg);
                }
            }

            .pet-olho {
                transform-box: fill-box;
                transform-origin: center;
                animation: pet-pisca 4.5s infinite;
            }

            @keyframes pet-pisca {
                0%, 92%, 100% {
                    transform: scaleY(1);
                }

                96% {
                    transform: scaleY(.1);
                }
            }

            /* ===== Linhas de tabela: destaque ao salvar e saída ao excluir ===== */
            @keyframes flash-linha {
                0% {
                    background-color: rgba(45,212,191,.38);
                }

                100% {
                    background-color: transparent;
                }
            }

            @keyframes linha-sai {
                0% {
                    opacity: 1;
                }

                100% {
                    opacity: 0;
                    transform: translateX(26px);
                }
            }

            tr.linha-nova > td {
                animation: flash-linha 1.8s ease-out both;
            }

            tr.linha-saindo > td {
                background-color: rgba(244,63,94,.14);
                animation: linha-sai .26s ease-in both;
            }

            /* ===== Assistente (gato) ===== */
            #assistente-ia {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 80;
                font-family: 'Inter', sans-serif;
            }

            #ai-flutua {
                position: relative;
                display: block;
                animation: ai-flutua 3.2s ease-in-out infinite;
            }

            #ai-gato {
                display: block;
                width: 76px;
                height: 76px;
                padding: 0;
                border: 0;
                background: transparent;
                cursor: pointer;
                filter: drop-shadow(0 8px 10px rgba(2,6,23,.35));
                transition: transform .2s;
            }

            #ai-gato svg {
                width: 100%;
                height: 100%;
                animation: none;
            }

            #ai-gato:hover {
                transform: scale(1.08) rotate(-4deg);
            }

            @keyframes ai-flutua {
                0%,100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-6px);
                }
            }

            #ai-balao {
                position: absolute;
                right: 4px;
                bottom: calc(100% - 2px);
                background: #fff;
                color: #0f172a;
                font-size: 13px;
                font-weight: 700;
                padding: 10px 14px;
                border-radius: 16px;
                box-shadow: 0 10px 28px rgba(15,23,42,.22);
                white-space: nowrap;
                cursor: pointer;
                opacity: 0;
                transform-origin: 85% 100%;
                animation: ai-balao-in .45s cubic-bezier(.2,.9,.3,1.3) var(--atraso, 900ms) both;
                transition: opacity .4s;
            }

            #ai-balao::after {
                content: '';
                position: absolute;
                right: 26px;
                bottom: -6px;
                width: 14px;
                height: 14px;
                background: #fff;
                transform: rotate(45deg);
                border-radius: 3px;
            }

            #ai-balao.sumindo {
                opacity: 0 !important;
                animation: none;
                pointer-events: none;
            }

            @keyframes ai-balao-in {
                from {
                    opacity: 0;
                    transform: scale(.6) translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            #ai-painel {
                display: none;
                position: absolute;
                right: 0;
                bottom: 88px;
                width: min(390px, calc(100vw - 32px));
                height: min(560px, 72dvh);
                background: #fff;
                border-radius: 22px;
                box-shadow: 0 24px 60px rgba(2,6,23,.35);
                border: 1px solid #e2e8f0;
                overflow: hidden;
                flex-direction: column;
            }

            #ai-painel.aberto {
                display: flex;
                animation: modal-caixa-in .26s cubic-bezier(.2,.8,.2,1) both;
            }

            .ai-topo {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 14px;
                background: linear-gradient(90deg,#0f766e,#115e59);
                color: #fff;
            }

            .ai-topo strong {
                font-size: 14px;
                font-weight: 800;
                display: block;
            }

            .ai-topo span {
                font-size: 11px;
                opacity: .8;
            }

            .ai-topo button {
                margin-left: auto;
                color: #fff;
                background: rgba(255,255,255,.14);
                border: 0;
                border-radius: 10px;
                width: 32px;
                height: 32px;
                cursor: pointer;
            }

            #ai-msgs {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                background: #f8fafc;
            }

            .ai-msg {
                max-width: 88%;
                padding: 9px 12px;
                border-radius: 16px;
                font-size: 13px;
                line-height: 1.5;
                animation: entrar-subindo .25s both;
                word-wrap: break-word;
            }

            .ai-msg.bot {
                background: #fff;
                color: #1e293b;
                border: 1px solid #e2e8f0;
                border-bottom-left-radius: 4px;
                align-self: flex-start;
            }

            .ai-msg.eu {
                background: #0d9488;
                color: #fff;
                border-bottom-right-radius: 4px;
                align-self: flex-end;
            }

            .ai-acao {
                display: inline-block;
                margin-top: 8px;
                padding: 7px 12px;
                background: #0f766e;
                color: #fff;
                border: 0;
                border-radius: 10px;
                font-size: 12px;
                font-weight: 700;
                cursor: pointer;
            }

            .ai-digitando span {
                display: inline-block;
                width: 6px;
                height: 6px;
                margin: 0 2px;
                border-radius: 50%;
                background: #94a3b8;
                animation: ai-ponto 1s infinite;
            }

            .ai-digitando span:nth-child(2) {
                animation-delay: .15s;
            }

            .ai-digitando span:nth-child(3) {
                animation-delay: .3s;
            }

            @keyframes ai-ponto {
                0%,60%,100% {
                    transform: translateY(0);
                    opacity: .5;
                }

                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            #ai-chips {
                display: flex;
                gap: 6px;
                padding: 8px 12px 0;
                overflow-x: auto;
                background: #fff;
            }

            #ai-chips button {
                flex: none;
                padding: 6px 11px;
                font-size: 11.5px;
                font-weight: 700;
                color: #0f766e;
                background: #f0fdfa;
                border: 1px solid #99f6e4;
                border-radius: 999px;
                cursor: pointer;
                min-height: 0;
            }

            #ai-form {
                display: flex;
                gap: 8px;
                padding: 10px 12px 12px;
                background: #fff;
            }

            #ai-input {
                flex: 1;
                padding: 10px 12px;
                font-size: 13px;
                border: 1px solid #dbe3ed;
                border-radius: 12px;
            }

            #ai-form button {
                width: 40px;
                border: 0;
                border-radius: 12px;
                background: #0d9488;
                color: #fff;
                cursor: pointer;
            }

            @media (max-width: 640px) {
                #assistente-ia {
                    right: 10px;
                    bottom: 10px;
                }

                #ai-gato {
                    width: 64px;
                    height: 64px;
                }

                #ai-painel {
                    bottom: 76px;
                }
            }

            /* ===== Ajustes mobile/PWA e acessibilidade ===== */
            body {
                padding-bottom: env(safe-area-inset-bottom);
            }

            #app {
                min-width: 0;
            }

            main, aside, nav, header {
                min-width: 0;
            }

            button, [role="button"], input[type="checkbox"], label {
                touch-action: manipulation;
            }

            #sidebar-menu {
                padding-bottom: env(safe-area-inset-bottom);
            }

            #status-nuvem {
                padding-top: max(6px, env(safe-area-inset-top));
            }

            @media (max-width: 768px) {
                #sidebar-menu {
                    width: min(86vw, 320px);
                }

                main {
                    padding-left: 12px !important;
                    padding-right: 12px !important;
                }

                #app button {
                    min-height: 42px;
                }

                #app input[type="checkbox"] {
                    min-width: 18px;
                    min-height: 18px;
                }

                .tab-active, [onclick^="abrirModulo("] {
                    -webkit-tap-highlight-color: rgba(20,184,166,.15);
                }
            }

            @media (display-mode: standalone) {
                body {
                    user-select: none;
                    -webkit-user-select: none;
                }

                input, textarea, select, [contenteditable="true"] {
                    user-select: text;
                    -webkit-user-select: text;
                }
            }

            /* ===== Tela de login: mascotes de corpo inteiro, animados ===== */
            .login-page {
                position: relative;
                isolation: isolate;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
                width: 100%;
                overflow: hidden;

            /* ===== Login cinematográfico 3D com a primeira imagem aprovada ===== */
            .login-photo-page {
                position: relative;
                isolation: isolate;
                min-height: 100vh;
                min-height: 100dvh;
                width: 100%;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: clamp(14px,2.4vw,34px);
                color: #f4f8ff;
                background: radial-gradient(ellipse at 82% 15%,rgba(27,95,159,.27),transparent 42%), linear-gradient(135deg,#020b19 0%,#071a31 55%,#0b2748 100%);
            }

            .login-photo-page::before {
                content: "";
                position: absolute;
                width: 550px;
                height: 550px;
                right: -260px;
                top: -250px;
                border: 1px solid rgba(96,165,250,.13);
                border-radius: 50%;
                box-shadow: 0 0 0 50px rgba(96,165,250,.025),0 0 0 100px rgba(96,165,250,.018);
                pointer-events: none;
                z-index: -1;
            }

            .login-photo-layout {
                width: min(1450px,100%);
                margin: auto;
                display: grid;
                grid-template-columns: minmax(0,1.04fr) minmax(360px,.86fr);
                gap: clamp(18px,2.8vw,42px);
                align-items: center;
            }

            .login-photo-stage {
                position: relative;
                width: 100%;
                aspect-ratio: 875 / 1024;
                max-height: calc(100dvh - 42px);
                overflow: hidden;
                isolation: isolate;
                border-radius: 28px;
                background: #132942;
                border: 1px solid rgba(166,202,244,.22);
                box-shadow: 0 28px 80px rgba(0,0,0,.40),0 0 0 1px rgba(255,255,255,.035);
                transform: translateZ(0);
            }

            .login-photo-stage::after {
                content: "";
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: linear-gradient(180deg,rgba(2,12,28,.02) 45%,rgba(2,12,28,.08) 63%,rgba(2,12,28,.66) 100%), linear-gradient(90deg,rgba(2,12,28,.04),transparent 30%,rgba(2,12,28,.12));
            }

            .login-photo-image {
                display: block;
                position: absolute;
                inset: -2.5%;
                width: 105%;
                height: 105%;
                max-width: none;
                object-fit: cover;
                object-position: center;
                z-index: 0;
                filter: saturate(1.04) contrast(1.02);
                will-change: transform;
                animation: login-photo-camera 8.5s ease-in-out infinite;
            }

            @keyframes login-photo-camera {
                0%,100% {
                    transform: translate3d(-.3%,0,0) scale(1.025);
                }

                50% {
                    transform: translate3d(.45%,-.45%,0) scale(1.075);
                }

                position: absolute;

                left: 18px;

                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;'
                    }[m];
                });
            }

            function compactarArquivoParaGzip(file, callback) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const arrayBuffer = e.target.result;
                        const uint8Array = new Uint8Array(arrayBuffer);
                        const compressed = pako.deflate(uint8Array);
                        let binary = '';
                        const len = compressed.byteLength;
                        for (let i = 0; i < len; i++) {
                            binary += String.fromCharCode(compressed[i]);
                        }
                        callback(btoa(binary), file.name);
                    } catch (err) {
                        alert('Erro ao compactar ficheiro.');
                    }
                }
                ;
                reader.readAsArrayBuffer(file);
            }

            function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
                try {
                    const binaryString = atob(base64Gzip);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const decompressed = pako.inflate(bytes);
                    const blob = new Blob([decompressed]);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = nomeOriginal;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    alert('Erro ao extrair ficheiro.');
                }
            }

            function visualizarArquivo(base64Gzip, nomeOriginal) {
                try {
                    const binaryString = atob(base64Gzip);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const decompressed = pako.inflate(bytes);

                    let mimeType = 'application/octet-stream';
                    const ext = nomeOriginal.split('.').pop().toLowerCase();
                    if (ext === 'pdf')
                        mimeType = 'application/pdf';
                    else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext))
                        mimeType = `image/${ext === 'jpg' ? 'jpeg' : ext}`;
                    else if (ext === 'txt')
                        mimeType = 'text/plain';

                    const blob = new Blob([decompressed],{
                        type: mimeType
                    });
                    const url = URL.createObjectURL(blob);

                            elStatus.className = pendente ? 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800' : 'bg-slate-900 text-emerald-400 text-[11px] font-semibold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 border-b border-slate-800 shadow-sm';
                            elStatus.innerHTML = pendente ? '<i class="fa-solid fa-triangle-exclamation"></i> Há alterações locais aguardando sincronização. Não feche esta sessão antes de resolver.' : '<i class="fa-solid fa-cloud-arrow-down text-emerald-400"></i> Sincronizado com o Supabase com Sucesso!';
                        }
                    } else {
                        const pendencia = obterSyncPendente();
                        const msg = pendencia ? `A nuvem não retornou um registro, mas há alterações locais pendentes.

OK: tentar criar/atualizar a nuvem com a cópia local.
Cancelar: manter localmente sem gravar na nuvem.` : `A nuvem não retornou nenhum registro acessível. Isso pode significar uma base nova OU uma configuração de permissões incompleta.

OK: criar o registro na nuvem a partir desta cópia local.
Cancelar: não gravar nada na nuvem e continuar sem sincronização.`;
                        if (confirm(msg)) {
                            if (!marcarSyncPendente('criação ou recuperação do registro da nuvem')) {
                                console.warn('Não foi possível registrar a pendência local.');
                            }
                            await salvarDadosNaNuvem(db, {
                                recuperacaoConfirmada: true
                            });
                        } else {
                            marcarSyncPendente('base local mantida; registro da nuvem não confirmado');
                            if (elStatus) {
                                elStatus.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                                elStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Base local mantida; sincronização não confirmada.';
                            }
                        }
                    }

                    supabaseClient.channel('mudancas-condominio').on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'condominio_dados',
                        filter: 'id=eq.principal'
                    }, (payload) => {
                        if (payload.new && payload.new.payload) {
                            // Nunca substitua alterações locais pendentes por um evento remoto silenciosamente.
                            if (obterSyncPendente()) {
                                if (elStatus) {
                                    elStatus.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                                    elStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> A nuvem mudou enquanto há dados locais pendentes. Faça backup e resolva a sincronização.';
                                }
                                return;
                            }
                            db = payload.new.payload;
                            if (!db.configuracoes || typeof db.configuracoes !== 'object')
                                db.configuracoes = {};
                            if (!db.configuracoes.modulos || typeof db.configuracoes.modulos !== 'object')
                                db.configuracoes.modulos = {};
                            if (!db.plano_contas)
                                db.plano_contas = DEFAULT_DATA.plano_contas;
                            if (!db.acertos_estoque)
                                db.acertos_estoque = [];
                            if (!db.motivos_acerto_estoque)
                                db.motivos_acerto_estoque = DEFAULT_DATA.motivos_acerto_estoque;
                            salvarCacheLocal();
                            atualizarVersaoConhecidaNuvem(payload.new.atualizado_em);
                            renderApp();
                            if (elStatus) {
                                elStatus.className = 'bg-teal-900 text-teal-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print animate-pulse border-b border-teal-800';
                                elStatus.innerHTML = '<i class="fa-solid fa-rotate"></i> Dados atualizados em tempo real por outro utilizador!';
                                setTimeout( () => {
                                    if (obterSyncPendente())
                                        return;
                                    elStatus.className = 'bg-slate-900 text-emerald-400 text-[11px] font-semibold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 border-b border-slate-800 shadow-sm';
                                    elStatus.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Sincronizado com a Nuvem em Tempo Real';
                                }
                                , 2000);
                            }
                        }
                    }
                    ).subscribe();

                } catch (err) {
                    console.warn('Falha ao carregar dados da nuvem; mantendo cópia local quando disponível.', err);
                    if (elStatus) {
                        const pendente = obterSyncPendente();
                        elStatus.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                        elStatus.innerHTML = pendente ? '<i class="fa-solid fa-triangle-exclamation"></i> Sem conexão com a nuvem; alterações locais mantidas para recuperação.' : '<i class="fa-solid fa-triangle-exclamation"></i> A utilizar armazenamento local; confirme a sincronização antes de trocar de dispositivo.';
                    }
                }
                renderApp();
            }

            async function salvarDadosNaNuvem(dataObj, opcoes={}) {
                db = dataObj;
                const pendenciaAnterior = obterSyncPendente();
                const cacheLocalSalvo = salvarCacheLocal();
                const elStatus = document.getElementById('status-nuvem');

                // Se já havia uma pendência, confirme que a versão remota não mudou antes de fazer upsert.
                // A opção recuperacaoConfirmada só é usada depois de uma confirmação explícita do administrador/usuário.
                if (pendenciaAnterior && !opcoes.recuperacaoConfirmada) {
                    try {
                        const {data: remotoAtual, error: erroVersao} = await supabaseClient.from('condominio_dados').select('payload, atualizado_em').eq('id', 'principal').maybeSingle();
                        if (erroVersao)
                            throw erroVersao;
                        const baseline = pendenciaAnterior.ultimaVersaoNuvem || localStorage.getItem(CHAVE_ULTIMA_SYNC_NUVEM);
                        const mesmaVersao = !!(remotoAtual && remotoAtual.payload && baseline && remotoAtual.atualizado_em && versoesEquivalentes(baseline, remotoAtual.atualizado_em));
                        if (!mesmaVersao) {
                            const podeSobrescrever = confirm(`Existe uma alteração local pendente e não foi possível comprovar que a nuvem está na mesma versão.\n\nOK: enviar os dados locais e substituir a versão remota, se existir.\nCancelar: manter os dados locais e não enviar agora.\n\nFaça um backup antes de enviar.`);
                            if (!podeSobrescrever) {
                                if (cacheLocalSalvo && !obterSyncPendente())
                                    marcarSyncPendente('alterações locais pendentes; envio cancelado pelo usuário');
                                if (elStatus) {
                                    elStatus.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                                    elStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Alterações locais mantidas; envio para a nuvem cancelado.';
                                }
                                return false;
                            }
                        }
                    } catch (erro) {
                        console.warn('Não foi possível confirmar a versão remota antes de salvar.', erro);
                        if (elStatus) {
                            elStatus.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                            elStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Pendência mantida localmente; não foi possível verificar a versão da nuvem.';
                        }
                        return false;
                    }
                }

                if (cacheLocalSalvo)
                    marcarSyncPendente('gravação local aguardando confirmação da nuvem');
                if (elStatus) {
                    elStatus.className = 'bg-slate-900 text-teal-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print animate-pulse border-b border-slate-800';
                    elStatus.innerHTML = '<i class="fa-solid fa-rotate fa-spin"></i> A guardar na nuvem...';
                }

                const atualizadoEm = new Date().toISOString();
                try {
                    const {error} = await supabaseClient.from('condominio_dados').upsert({
                        id: 'principal',
                        payload: db,
                        atualizado_em: atualizadoEm
                    });

                    if (error)
                        throw error;
                    limparSyncPendente();
                    atualizarVersaoConhecidaNuvem(atualizadoEm);
                    if (elStatus) {
                        elStatus.className = 'bg-slate-900 text-emerald-400 text-[11px] font-semibold py-1.5 px-4 text-center no-print flex items-center justify-center gap-2 border-b border-slate-800 shadow-sm';
                        elStatus.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Sincronizado com a Nuvem em Tempo Real';
                    }
                    return true;
                } catch (err) {
                    console.warn('Não foi possível sincronizar dados na nuvem.', err);
                    if (elStatus) {
                        elStatus.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                        elStatus.innerHTML = cacheLocalSalvo ? '<i class="fa-solid fa-triangle-exclamation"></i> Alterações mantidas neste dispositivo; sincronização pendente.' : '<i class="fa-solid fa-triangle-exclamation"></i> Falha na nuvem e no armazenamento local. Baixe um backup e não feche a página.';
                    }
                    return false;
                }
            }

            function garantirConfiguracoesSistema() {
                if (!db.configuracoes || typeof db.configuracoes !== 'object')
                    db.configuracoes = {};
                if (!db.configuracoes.modulos || typeof db.configuracoes.modulos !== 'object')
                    db.configuracoes.modulos = {};
                MODULOS_CONFIGURAVEIS.forEach(modulo => {
                    if (typeof db.configuracoes.modulos[modulo.id] !== 'boolean')
                        db.configuracoes.modulos[modulo.id] = true;
                }
                );
                return db.configuracoes;
            }

            function moduloEstaAtivo(moduloId) {
                if (moduloId === 'configuracoes')
                    return true;
                garantirConfiguracoesSistema();
                return MODULOS_CONFIGURAVEIS.some(m => m.id === moduloId) ? db.configuracoes.modulos[moduloId] !== false : true;
            }

            function usuarioPodeConfigurarModulos() {
                const u = sessao && sessao.usuarioLogado;
                if (!u)
                    return false;
                const perfil = String(u.perfil || '').trim().toLowerCase();
                const cargo = String(u.cargo || '').trim().toLowerCase();
                return perfil === 'admin' || perfil === 'administrador' || cargo.includes('administrador');
            }

            function abrirModulo(moduloId, filtroEstoqueParam='todos') {
                if ((moduloId === 'configuracoes' || moduloId === 'usuarios') && !usuarioPodeConfigurarModulos()) {
                    alert('Somente um administrador pode acessar este módulo.');
                    return;

                if (moduloId !== 'configuracoes' && !moduloEstaAtivo(moduloId)) {
                    alert('Este módulo está desativado nas Configurações do Sistema.');
                    return;
                }
                if (moduloId === 'estoque' && filtroEstoqueParam) {
                    filtroAtivoEstoque = filtroEstoqueParam;
                }
                if (!tabsState.openTabs.includes(moduloId))
                    tabsState.openTabs.push(moduloId);
                tabsState.activeTab = moduloId;
                fecharMenuMobile();
                renderApp();
            }

            function fecharAba(e, moduloId) {
                e.stopPropagation();
                if (tabsState.openTabs.length === 1)
                    return;
                tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
                if (tabsState.activeTab === moduloId)
                    tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
                renderApp();
            }

                if (!usuarioPodeConfigurarModulos()) {
                    alert('Somente um administrador pode alterar estas configurações.');
                    renderApp();
                    return;
                }
                garantirConfiguracoesSistema();
                if (!MODULOS_CONFIGURAVEIS.some(m => m.id === moduloId))
                    return;

                db.configuracoes.modulos[moduloId] = !!ativar;
                if (!ativar) {
                    tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
                    if (tabsState.activeTab === moduloId) {
                        tabsState.activeTab = 'configuracoes';
                        if (!tabsState.openTabs.includes('configuracoes'))
                            tabsState.openTabs.push('configuracoes');
                    }
                }
                if (!tabsState.openTabs.length)
                    tabsState.openTabs = ['configuracoes'];
                salvarDados(db);

            const ITERACOES_BACKUP_CRIPTO = 310000;

            function bytesParaBase64Backup(bytes) {
                let binario = '';
                for (let i = 0; i < bytes.length; i++)
                    binario += String.fromCharCode(bytes[i]);
                return btoa(binario);
            }

            function base64ParaBytesBackup(texto) {
                const binario = atob(texto);
                const bytes = new Uint8Array(binario.length);
                for (let i = 0; i < binario.length; i++)
                    bytes[i] = binario.charCodeAt(i);
                return bytes;
            }

            async function derivarChaveBackupCriptografado(senha, salt, iteracoes) {
                const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey({
                    name: 'PBKDF2',
                    salt,
                    iterations: iteracoes,
                    hash: 'SHA-256'
                }, material, {
                    name: 'AES-GCM',
                    length: 256
                }, false, ['encrypt', 'decrypt']);
            }

            window.confirmarBackupCriptografado = async function(event) {

                    return;
                }

                if (senha !== confirmacao) {

                }
                try {
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const chave = await derivarChaveBackupCriptografado(senha, salt, ITERACOES_BACKUP_CRIPTO);
                    const claro = new TextEncoder().encode(JSON.stringify(db));
                    const cifrado = await crypto.subtle.encrypt({
                        name: 'AES-GCM',
                        iv
                    }, chave, claro);
                    const pacote = {
                        formato: 'guardioes-do-bravo-backup-criptografado',
                        versao: 1,
                        algoritmo: 'AES-256-GCM',
                        derivacao: 'PBKDF2-SHA-256',
                        iteracoes: ITERACOES_BACKUP_CRIPTO,
                        salt: bytesParaBase64Backup(salt),
                        iv: bytesParaBase64Backup(iv),
                        dados: bytesParaBase64Backup(new Uint8Array(cifrado))
                    };
                    const blob = new Blob([JSON.stringify(pacote, null, 2)],{
                        type: 'application/json;charset=utf-8'
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');

            window.confirmarRestauroBackupCriptografado = async function(event) {
                event.preventDefault();
                if (!usuarioPodeConfigurarModulos()) {
                    alert('Somente um administrador pode restaurar o backup completo.');
                    return;
                }
                const file = arquivoBackupCriptografadoPendente;

                if (!file) {
                    alert('Selecione novamente o arquivo criptografado.');
                    fecharModalContainer();
                    return;
                }
                const reader = new FileReader();
                reader.onerror = () => alert('Não foi possível ler o arquivo selecionado.');
                reader.onload = async function(ev) {
                    try {
                        const pacote = JSON.parse(ev.target.result);
                        if (!pacote || pacote.formato !== 'guardioes-do-bravo-backup-criptografado' || pacote.versao !== 1 || pacote.algoritmo !== 'AES-256-GCM' || pacote.derivacao !== 'PBKDF2-SHA-256')
                            throw new Error('Formato de backup criptografado inválido.');
                        const iteracoes = Number(pacote.iteracoes);
                        if (!Number.isInteger(iteracoes) || iteracoes < 100000 || iteracoes > 600000)
                            throw new Error('Parâmetro de derivação inválido.');
                        const salt = base64ParaBytesBackup(pacote.salt);
                        const iv = base64ParaBytesBackup(pacote.iv);
                        const cifrado = base64ParaBytesBackup(pacote.dados);
                        const chave = await derivarChaveBackupCriptografado(senha, salt, iteracoes);
                        const claro = await crypto.subtle.decrypt({
                            name: 'AES-GCM',
                            iv
                        }, chave, cifrado);
                        const parsed = JSON.parse(new TextDecoder().decode(claro));
                        const restaurado = prepararBackupRestaurado(parsed);
                        if (!confirm('A restauração vai substituir os dados atualmente carregados. Faça um backup atual antes de continuar. Deseja restaurar o backup criptografado?'))
                            return;
                        arquivoBackupCriptografadoPendente = null;
                        fecharModalContainer();
                        aplicarBackupRestaurado(restaurado, 'criptografado');
                    } catch (err) {
                        console.warn('Falha ao descriptografar ou validar o backup.', err);
                        alert('Não foi possível abrir o backup. Verifique a senha e a integridade do arquivo. Nenhum dado foi restaurado.');
                    }
                }
                ;
                reader.readAsText(file);
            }
            ;

Antes de continuar, baixe um backup atual. Os dados existentes não serão mesclados automaticamente. Deseja continuar?`))

                            if (Array.isArray(DEFAULT_DATA[chave])) {
                                if (parsed[chave] === undefined)
                                    restaurado[chave] = Array.isArray(db[chave]) ? db[chave] : DEFAULT_DATA[chave];
                                else if (!Array.isArray(parsed[chave]))
                                    throw new Error(`Campo inválido no backup: ${chave}`);
                            }
                        }
                        );
                        if (!restaurado.configuracoes || typeof restaurado.configuracoes !== 'object')
                            restaurado.configuracoes = {};
                        if (!restaurado.configuracoes.modulos || typeof restaurado.configuracoes.modulos !== 'object')
                            restaurado.configuracoes.modulos = {};
                        if (!restaurado.plano_contas)
                            restaurado.plano_contas = DEFAULT_DATA.plano_contas;
                        if (!restaurado.acertos_estoque)
                            restaurado.acertos_estoque = [];
                        if (!restaurado.motivos_acerto_estoque)
                            restaurado.motivos_acerto_estoque = DEFAULT_DATA.motivos_acerto_estoque;
                        db = restaurado;
                        marcarSyncPendente('restauração de backup aguardando confirmação da nuvem');
                        salvarCacheLocal();
                        salvarDados(db);
                        alert('Backup carregado. Confirme no indicador da nuvem se a sincronização foi concluída; mantenha o arquivo original guardado.');
                        renderApp();
                    } catch (err) {
                        console.error('Erro ao restaurar backup.', err);
                        alert('Erro ao ler o backup ou estrutura de dados inválida. Nenhum dado foi restaurado.');
                    } finally {
                        if (event && event.target)
                            event.target.value = '';
                    }
                }
                ;
                reader.onerror = function() {
                    alert('Não foi possível ler o arquivo selecionado.');
                    if (event && event.target)
                        event.target.value = '';
                }
                ;
                reader.readAsText(file);
            }

            function importarPlanilhaMoradores(event) {
                const file = event.target.files[0];
                if (!file)
                    return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const texto = e.target.result;
                        const linhas = texto.split(/\r\n|\n/);
                        if (linhas.length < 2) {
                            alert('A planilha parece estar vazia.');
                            return;
                        }

                        const cabecalho = linhas[0].split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim().toLowerCase());

                        const idxBloco = cabecalho.findIndex(h => h.includes('bloco') || h.includes('bl'));
                        const idxAp = cabecalho.findIndex(h => h.includes('ap') || h.includes('unidade') || h.includes('casa'));
                        const idxNome = cabecalho.findIndex(h => h.includes('nome') || h.includes('morador') || h.includes('proprietario'));
                        const idxEmail = cabecalho.findIndex(h => h.includes('email') || h.includes('e-mail'));
                        const idxTel = cabecalho.findIndex(h => h.includes('tel') || h.includes('cel') || h.includes('whatsapp') || h.includes('fone'));
                        const idxCpf = cabecalho.findIndex(h => h.includes('cpf') || h.includes('documento') || h.includes('rg'));
                        const idxPet = cabecalho.findIndex(h => h.includes('pet') || h.includes('animal'));
                        const idxVaga = cabecalho.findIndex(h => h.includes('vaga') || h.includes('estacionamento') || h.includes('garagem'));

                        let importados = 0;
                        if (!db.moradores)
                            db.moradores = [];

                        for (let i = 1; i < linhas.length; i++) {
                            const linha = linhas[i].trim();
                            if (!linha)
                                continue;
                            const cols = linha.split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim());

                            db.moradores.push({
                                id: 'mor_imp_' + Date.now() + '_' + i,
                                bloco: idxBloco !== -1 ? (cols[idxBloco] || '1') : (cols[0] || '1'),
                                apartamento: idxAp !== -1 ? (cols[idxAp] || '') : (cols[1] || ''),
                                nome: idxNome !== -1 ? (cols[idxNome] || 'Sem Nome') : (cols[2] || 'Sem Nome'),
                                email: idxEmail !== -1 ? (cols[idxEmail] || '') : '',
                                telefone: idxTel !== -1 ? (cols[idxTel] || '') : '',
                                cpf: idxCpf !== -1 ? (cols[idxCpf] || '') : '',
                                petNome: idxPet !== -1 ? (cols[idxPet] || '') : '',
                                vagaGaragem: idxVaga !== -1 ? (cols[idxVaga] || '') : ''
                            });
                            importados++;
                        }

                        if (importados > 0) {
                            salvarDados(db);
                            alert(`${importados} moradores importados com sucesso para a nuvem!`);
                            renderMainOnly();
                        } else {
                            alert('Nenhum morador válido encontrado na planilha.');
                        }
                    } catch (err) {
                        alert('Erro ao processar o arquivo CSV.');
                    }
                }
                ;
                reader.readAsText(file, 'UTF-8');
            }

            function toggleMostrarSenha() {
                const inputPass = document.getElementById('login_pass');
                const iconEye = document.getElementById('icon-eye');
                if (inputPass.type === 'password') {
                    inputPass.type = 'text';
                    iconEye.classList.remove('fa-eye');
                    iconEye.classList.add('fa-eye-slash');
                } else {
                    inputPass.type = 'password';
                    iconEye.classList.remove('fa-eye-slash');
                    iconEye.classList.add('fa-eye');
                }
            }

            function realizarLogin(e) {
                e.preventDefault();
                const userInput = document.getElementById('login_user').value.trim().toLowerCase();
                const senhaInput = document.getElementById('login_pass').value;
                const lembrarChecked = document.getElementById('login_lembrar')?.checked;

                if (lembrarChecked) {
                    localStorage.setItem('guardioes_lembrar_user', userInput);
                } else {
                    localStorage.removeItem('guardioes_lembrar_user');
                }

                const userFound = (db.usuarios || []).find(u => (u.usuario && u.usuario.toLowerCase() === userInput) || (u.email && u.email.toLowerCase() === userInput));

                if (userFound && userFound.senhaHash === senhaInput) {
                    if (userFound.status === 'Inativo') {
                        alert('Utilizador inativo.');
                        return;
                    }

                    if (userFound.primeiroAcesso) {
                        usuarioPendentePrimeiroAcesso = userFound;
                        renderApp();
                        return;
                    }

                    sessao.usuarioLogado = userFound;
                    try {
                        sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound));
                    } catch (err) {}
                    reiniciarTemporizadorInatividade();
                    renderApp();
                } else {
                    alert('Credenciais incorretas! Verifique o utilizador/e-mail e a palavra-passe.');
                }
            }

            function concluirPrimeiroAcesso(e) {
                e.preventDefault();
                const s1 = document.getElementById('prim_senha_nova').value;
                const s2 = document.getElementById('prim_senha_conf').value;

                if (s1.length < 12 || !/[A-Z]/.test(s1) || !/[a-z]/.test(s1) || !/[0-9]/.test(s1)) {
                    alert('Use pelo menos 12 caracteres, com letras maiúsculas, minúsculas e números.');
                    return;
                }
                if (s1 !== s2) {
                    alert('As palavras-passe não coincidem.');
                    return;
                }

                const userIndex = (db.usuarios || []).findIndex(u => u.id === usuarioPendentePrimeiroAcesso.id);
                if (userIndex !== -1) {
                    db.usuarios[userIndex].senhaHash = s1;
                    db.usuarios[userIndex].primeiroAcesso = false;
                    salvarDados(db);

                    sessao.usuarioLogado = db.usuarios[userIndex];
                    try {
                        sessionStorage.setItem('guardioes_sessao', JSON.stringify(sessao.usuarioLogado));
                    } catch (err) {}
                    reiniciarTemporizadorInatividade();

                    usuarioPendentePrimeiroAcesso = null;
                    alert('Palavra-passe alterada com sucesso! Bem-vindo(a) ao sistema.');
                    renderApp();
                }
            }

            function encerrarSessao() {
                if (temporizadorInatividade)
                    clearTimeout(temporizadorInatividade);
                sessao.usuarioLogado = null;
                usuarioPendentePrimeiroAcesso = null;
                try {
                    sessionStorage.removeItem('guardioes_sessao');
                } catch (e) {}
                renderApp();
            }

            // Posiciona a área clicável exatamente sobre o botão desenhado na arte estática.
            // No celular, o cenário é recortado para destacar os animais e o botão real fica abaixo.
            window.posicionarBotaoLoginGoogle = function() {
                const page = document.querySelector('.login-composite-page');
                const img = document.getElementById('login-composite-background');
                const btn = document.getElementById('btn-google-login');
                if (!page || !img || !btn || !img.naturalWidth || !img.naturalHeight)
                    return;

                const celular = window.matchMedia('(max-width: 700px), (max-aspect-ratio: 4/5)').matches;
                if (celular) {
                    btn.style.left = '';
                    btn.style.top = '';
                    btn.style.width = '';
                    btn.style.height = '';
                    return;
                }

                const rect = page.getBoundingClientRect();
                const scale = Math.max(rect.width / img.naturalWidth, rect.height / img.naturalHeight);
                const renderW = img.naturalWidth * scale;
                const renderH = img.naturalHeight * scale;
                const offsetX = (rect.width - renderW) / 2;
                const offsetY = (rect.height - renderH) / 2;

                // Caixa do botão Google na arte original 1536x1024 (com margem para facilitar o clique).
                const bx = 918
                  , by = 465
                  , bw = 506
                  , bh = 94;
                btn.style.left = `${offsetX + bx * scale}px`;
                btn.style.top = `${offsetY + by * scale}px`;
                btn.style.width = `${bw * scale}px`;
                btn.style.height = `${bh * scale}px`;
            }
            ;
            window.addEventListener('resize', () => requestAnimationFrame( () => window.posicionarBotaoLoginGoogle()));

            function renderTelaPrimeiroAcesso() {
                return `

                            <div><label class="block font-bold uppercase text-slate-500 mb-1">Confirmar Nova Palavra-passe</label><input type="password" id="prim_senha_conf" required class="w-full p-3 border rounded-2xl font-bold bg-slate-50 text-sm focus:ring-2 focus:ring-teal-500 outline-none" placeholder="Repita a palavra-passe"></div>
                            <button type="submit" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-2xl shadow-lg text-sm transition-all">Guardar Senha e Aceder</button>
                        </form>
                    </div>
                </div>
            `;

            function renderMainOnly() {
                const mainEl = document.querySelector('main');
                if (mainEl) {
                    mainEl.innerHTML = renderModuleContent(tabsState.activeTab);
                    if (tabsState.activeTab === 'dashboard') {
                        initDashboardCharts();
                        initDashboardEstoqueChart();
                    }
                    if (tabsState.activeTab === 'estoque')
                        initEstoqueChart();

            function renderApp() {
                const container = document.getElementById('app');
                if (!container)
                    return;

                if (usuarioPendentePrimeiroAcesso) {
                    container.innerHTML = renderTelaPrimeiroAcesso();
                    return;
                }

                if (!sessao.usuarioLogado) {
                    container.innerHTML = renderTelaLogin();
                    return;

            function dashboardNumero(valor) {
                if (typeof valor === 'number')
                    return Number.isFinite(valor) ? valor : 0;
                let raw = String(valor ?? '').trim().replace(/[R$\s]/g, '');
                if (!raw)
                    return 0;
                if (raw.includes(',') && raw.includes('.')) {
                    if (raw.lastIndexOf(',') > raw.lastIndexOf('.'))
                        raw = raw.replace(/\./g, '').replace(',', '.');
                    else
                        raw = raw.replace(/,/g, '');
                } else if (raw.includes(',')) {
                    raw = raw.replace(/\./g, '').replace(',', '.');
                }
                const n = Number(raw);
                return Number.isFinite(n) ? n : 0;
            }

            function dashboardMoeda(valor) {
                return new Intl.NumberFormat('pt-BR',{
                    style: 'currency',
                    currency: 'BRL',
                    maximumFractionDigits: 2
                }).format(dashboardNumero(valor));
            }

            function initDashboardEstoqueChart() {
                if (tabsState.activeTab !== 'dashboard')
                    return;
                const ctx = document.getElementById('chartEstoqueDash');
                if (!ctx)
                    return;

                const list = db.estoque || [];
                let qtdAdequado = 0;
                let qtdCritico = 0;
                let qtdExcedente = 0;

                list.forEach(st => {
                    const atual = dashboardNumero(st.quantidade !== undefined ? st.quantidade : (st.qtd || 0));
                    const minimo = dashboardNumero(st.minimo || 0);
                    const maximo = dashboardNumero(st.maximo || 0);

                    if (atual <= minimo)
                        qtdCritico++;
                    else if (maximo > 0 && atual > maximo)
                        qtdExcedente++;
                    else
                        qtdAdequado++;
                }
                );

                if (list.length === 0)
                    return;

                if (chartInstanceEstoqueDash)
                    chartInstanceEstoqueDash.destroy();
                chartInstanceEstoqueDash = new Chart(ctx,{
                    type: 'doughnut',
                    data: {
                        labels: ['Adequado', 'Insuficiente (Crítico)', 'Excedente (Antigo)'],
                        datasets: [{
                            data: [qtdAdequado, qtdCritico, qtdExcedente],
                            backgroundColor: ['#0d9488', '#f43f5e', '#f59e0b'],
                            borderWidth: 3,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    boxWidth: 12,
                                    font: {
                                        weight: 'bold',
                                        size: 10,
                                        family: 'Inter'
                                    }
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });
            }
