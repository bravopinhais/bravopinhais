        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (!data) return DEFAULT_DATA;
                const parsed = JSON.parse(data);
                if (!parsed.categorias) parsed.categorias = DEFAULT_DATA.categorias;
                if (!parsed.documentos) parsed.documentos = DEFAULT_DATA.documentos;
                if (!parsed.formas_monetarias) parsed.formas_monetarias = DEFAULT_DATA.formas_monetarias;
                if (!parsed.usuarios) parsed.usuarios = DEFAULT_DATA.usuarios;
                if (!parsed.dre_config) parsed.dre_config = DEFAULT_DATA.dre_config;
                if (!parsed.estoque) parsed.estoque = DEFAULT_DATA.estoque;
                if (!parsed.moradores) parsed.moradores = DEFAULT_DATA.moradores;
                if (!parsed.contas_bancarias) parsed.contas_bancarias = DEFAULT_DATA.contas_bancarias;
                if (!parsed.financeiro) parsed.financeiro = DEFAULT_DATA.financeiro;
                return parsed;
            } catch (e) {
                console.error('Erro ao carregar dados:', e);
                return DEFAULT_DATA;
            }
        }

        function salvarDados(data) {

        function registrarLog(modulo, acao, detalhe) {
            const user = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            db.logs.unshift({ id: 'log_' + Date.now(), dataHora: new Date().toLocaleString('pt-BR'), modulo, acao, usuario: user, detalhe });
            salvarDados(db);
        }

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            fecharMenuMobile();
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
        }

        function toggleMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        function fecharMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) {
                alert('Não há dados disponíveis para exportação.');
                return;
            }
            const sanitizeData = dados.map(item => {
                let obj = { ...item };
                delete obj.fotoBase64;
                delete obj.arquivoBase64;
                return obj;
            });

            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(';') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => {
                    let val = row[k] === null || row[k] === undefined ? '' : row[k];
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csvContent += values.join(';') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeArquivo.endsWith('.xlsx') || nomeArquivo.endsWith('.csv') ? nomeArquivo : nomeArquivo + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportarParaPDF() { window.print(); }

        function processarUploadBase64(event, targetImgId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempBase64 = e.target.result;
                const imgEl = document.getElementById(targetImgId);
                if (imgEl) {
                    if (file.type.startsWith('image/')) {
                        imgEl.src = tempBase64;
                        imgEl.classList.remove('hidden');
                    } else if (file.type === 'application/pdf') {
                        imgEl.src = 'https://upload.wikimedia.org/wikipedia/commons/8/87/PDF_file_icon.svg';
                        imgEl.classList.remove('hidden');
                    } else {
                        imgEl.src = 'https://upload.wikimedia.org/wikipedia/commons/0/0c/File-icon.png';
                        imgEl.classList.remove('hidden');
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const userFound = db.usuarios.find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                registrarLog('Segurança', 'Login Sucesso', `Usuário ${userFound.usuario} logou.`);
                renderApp();
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            try { sessionStorage.removeItem('guardioes_sessao'); } catch (e) {}
            renderApp();

            if (moduloId === 'financeiro') btnNovoHtml = `<button onclick="window.renderModalNovoTitulo()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Título</button>`;
            else if (moduloId === 'formas_monetarias') btnNovoHtml = `<button onclick="window.renderModalFormaMonetaria()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Nova Forma</button>`;
            else if (moduloId === 'moradores') btnNovoHtml = `<button onclick="window.renderModalMorador()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            else if (moduloId === 'contas_bancarias') btnNovoHtml = `<button onclick="window.renderModalContaBancaria()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Nova Conta</button>`;
            else if (moduloId === 'categorias') btnNovoHtml = `<button onclick="window.renderModalCategoria()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Nova Pasta / Categoria</button>`;
            else if (moduloId === 'estoque') btnNovoHtml = `<button onclick="window.renderModalEstoque()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Item</button>`;
            else if (moduloId === 'documentos') btnNovoHtml = `<button onclick="window.renderModalDocumento()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-upload"></i> Subir Documento</button>`;
            else if (moduloId === 'usuarios') btnNovoHtml = `<button onclick="window.renderModalUsuario()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-user-plus"></i> Novo Usuário</button>`;
            else if (moduloId === 'relatorios') btnNovoHtml = `
                <button onclick="restaurarDREPadrao()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold shadow transition flex items-center gap-1.5"><i class="fa-solid fa-rotate-left"></i> Restaurar DRE</button>
                <button onclick="window.renderModalDRELinha()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Linha DRE</button>
            `;

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'financeiro': return headerGlobal + renderFinanceiroView();

                case 'moradores': return headerGlobal + renderMoradoresView();
                case 'contas_bancarias': return headerGlobal + renderContasBancariasView();
                case 'categorias': return headerGlobal + renderCategoriasView();
                case 'estoque': return headerGlobal + renderEstoqueView();

                case 'relatorios': return headerGlobal + renderRelatoriosView();

        function exportarModuloExcel(moduloId) {
            let dataExport = [];

            else if (moduloId === 'formas_monetarias') dataExport = db.formas_monetarias;
            else if (moduloId === 'contas_bancarias') dataExport = db.contas_bancarias;
            else if (moduloId === 'moradores') dataExport = db.moradores;
            else if (moduloId === 'categorias') dataExport = db.categorias;
            else if (moduloId === 'estoque') dataExport = db.estoque;
            else if (moduloId === 'documentos') dataExport = db.documentos;
            else if (moduloId === 'usuarios') dataExport = db.usuarios;
            else if (moduloId === 'relatorios') dataExport = db.dre_config;

            exportarParaExcel(dataExport, `relatorio_${moduloId}_${Date.now()}.xlsx`);

        // =====================================
        // ESTOQUE COM AVISO DE ESTOQUE E AGENDAMENTO DE INVENTÁRIO
        // =====================================
        function renderEstoqueView() {
            let list = db.estoque || [];
            const hoje = new Date().toISOString().split('T')[0];

            // Identificação de Produtos Críticos (Abaixo ou no limite mínimo)
            const itensCriticos = list.filter(e => Number(e.qtd) <= Number(e.minimo));

            // Identificação de Balanços/Inventários Pendentes ou Vencendo em 3 Dias
            const tresDiasDepois = new Date();
            tresDiasDepois.setDate(tresDiasDepois.getDate() + 3);
            const dataLimite = tresDiasDepois.toISOString().split('T')[0];

            const itensInventarioPendente = list.filter(e => e.proximaContagem && e.proximaContagem <= dataLimite);

            // Filtros da Interface
            if (estFiltros.categoria !== 'Todas') list = list.filter(e => e.categoria === estFiltros.categoria);
            
            if (estFiltros.status === 'Critico') {
                list = list.filter(e => Number(e.qtd) <= Number(e.minimo));
            } else if (estFiltros.status === 'OK') {
                list = list.filter(e => Number(e.qtd) > Number(e.minimo));
            } else if (estFiltros.status === 'InventarioPendente') {
                list = list.filter(e => e.proximaContagem && e.proximaContagem <= dataLimite);
            }

            if (estFiltros.busca.trim() !== '') {
                const b = estFiltros.busca.toLowerCase();
                list = list.filter(e => (e.item || '').toLowerCase().includes(b) || (e.localizacao || '').toLowerCase().includes(b));
            }

            const categoriasDisponiveis = db.categorias.filter(c => c.modulo === 'Estoque' || c.modulo === 'Geral').map(c => c.nome);

            return `
                <div class="space-y-4">
                    <!-- CARDS DE ALERTA E AVISOS AUTOMÁTICOS -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 no-print">
                        <!-- Card de Produtos Acabando -->
                        <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 flex items-start gap-3 shadow-sm">
                            <div class="p-3 bg-rose-500 text-white rounded-lg"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
                            <div class="flex-1">
                                <h4 class="font-bold text-rose-900 text-sm">Estoque Crítico (${itensCriticos.length})</h4>
                                <p class="text-xs text-rose-700 mt-0.5">${itensCriticos.length > 0 ? `Atenção aos itens: <b>${itensCriticos.map(i => escapeHTML(i.item)).join(', ')}</b>` : 'Nenhum produto abaixo do limite mínimo.'}</p>
                            </div>
                        </div>

                        <!-- Card de Inventário Agendado -->
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start gap-3 shadow-sm">
                            <div class="p-3 bg-amber-500 text-white rounded-lg"><i class="fa-solid fa-clipboard-list text-xl"></i></div>
                            <div class="flex-1">
                                <h4 class="font-bold text-amber-900 text-sm">Inventários Pendentes / Agendados (${itensInventarioPendente.length})</h4>
                                <p class="text-xs text-amber-700 mt-0.5">${itensInventarioPendente.length > 0 ? `Contagem necessária para: <b>${itensInventarioPendente.map(i => escapeHTML(i.item)).join(', ')}</b>` : 'Nenhum inventário pendente para os próximos dias.'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- BARRA DE FILTROS -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center no-print">
                        <div class="flex-1 min-w-[200px]">
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Buscar Item/Local</label>
                            <input type="text" value="${escapeHTML(estFiltros.busca)}" oninput="estFiltros.busca = this.value; renderApp();" placeholder="Ex: Lâmpada, Almoxarifado..." class="w-full p-2 border rounded-lg text-xs">
                        </div>
                        <div class="w-40">
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Categoria</label>
                            <select onchange="estFiltros.categoria = this.value; renderApp();" class="w-full p-2 border rounded-lg text-xs font-semibold">
                                <option value="Todas">Todas</option>
                                ${categoriasDisponiveis.map(c => `<option value="${escapeHTML(c)}" ${estFiltros.categoria === c ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
                            </select>
                        </div>
                        <div class="w-48">
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Situação / Alerta</label>
                            <select onchange="estFiltros.status = this.value; renderApp();" class="w-full p-2 border rounded-lg text-xs font-semibold">
                                <option value="Todos" ${estFiltros.status === 'Todos' ? 'selected' : ''}>Todos os Itens</option>
                                <option value="Critico" ${estFiltros.status === 'Critico' ? 'selected' : ''}>⚠️ Estoque Crítico</option>
                                <option value="OK" ${estFiltros.status === 'OK' ? 'selected' : ''}>✅ Estoque Normal</option>
                                <option value="InventarioPendente" ${estFiltros.status === 'InventarioPendente' ? 'selected' : ''}>📋 Inventário Pendente</option>
                            </select>
                        </div>
                    </div>

                    <!-- TABELA DE PRODUCTOS -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-800 text-white font-bold uppercase tracking-wider text-[11px]">
                                        <th class="p-3">Foto</th>
                                        <th class="p-3">Item / Categoria</th>
                                        <th class="p-3">Localização</th>
                                        <th class="p-3 text-center">Qtd Atual</th>
                                        <th class="p-3 text-center">Min / Max</th>
                                        <th class="p-3">Próx. Contagem</th>
                                        <th class="p-3 text-center">Status</th>
                                        <th class="p-3 text-center actions-col">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 font-medium text-slate-700">
                                    ${list.length === 0 ? `<tr><td colspan="8" class="p-6 text-center text-slate-400 font-semibold">Nenhum item encontrado no estoque.</td></tr>` : list.map(e => {
                                        const isCritico = Number(e.qtd) <= Number(e.minimo);
                                        const isInventarioVencendo = e.proximaContagem && e.proximaContagem <= dataLimite;
                                        return `
                                            <tr class="hover:bg-slate-50 transition">
                                                <td class="p-3 w-12">
                                                    ${e.fotoBase64 ? `<img src="${e.fotoBase64}" class="w-10 h-10 object-cover rounded-lg border shadow-sm">` : `<div class="w-10 h-10 rounded-lg bg-slate-100 border flex items-center justify-center text-slate-400"><i class="fa-solid fa-box"></i></div>`}
                                                </td>
                                                <td class="p-3">
                                                    <div class="font-bold text-slate-900">${escapeHTML(e.item)}</div>
                                                    <span class="text-[10px] px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-bold border">${escapeHTML(e.categoria)}</span>
                                                </td>
                                                <td class="p-3 text-slate-600">${escapeHTML(e.localizacao || 'N/A')}</td>
                                                <td class="p-3 text-center font-black text-sm ${isCritico ? 'text-rose-600' : 'text-slate-800'}">${e.qtd}</td>
                                                <td class="p-3 text-center text-slate-500">${e.minimo} / ${e.maximo}</td>
                                                <td class="p-3">
                                                    <div class="flex items-center gap-1.5 ${isInventarioVencendo ? 'text-amber-600 font-bold' : 'text-slate-600'}">
                                                        <i class="fa-regular fa-calendar"></i> ${e.proximaContagem ? e.proximaContagem.split('-').reverse().join('/') : 'Não agendado'}
                                                    </div>
                                                </td>
                                                <td class="p-3 text-center">
                                                    ${isCritico ? `<span class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 text-[10px] font-bold border border-rose-300">⚠️ Crítico</span>` : `<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold border border-emerald-300">OK</span>`}
                                                </td>
                                                <td class="p-3 text-center actions-col">
                                                    <div class="flex items-center justify-center gap-1">
                                                        <button onclick="window.renderModalEstoque('${e.id}')" title="Editar Item" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition"><i class="fa-solid fa-pen"></i></button>
                                                        <button onclick="excluirItemEstoque('${e.id}')" title="Excluir" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md transition"><i class="fa-solid fa-trash"></i></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function excluirItemEstoque(id) {
            if (!confirm('Deseja realmente remover este item do estoque?')) return;
            db.estoque = db.estoque.filter(e => e.id !== id);
            salvarDados(db);
            registrarLog('Estoque', 'Exclusão', `Item ID ${id} removido.`);
            renderApp();
        }

        window.renderModalEstoque = function(id = null) {
            const item = id ? db.estoque.find(e => e.id === id) : { id: '', item: '', categoria: 'Elétrica', qtd: 0, minimo: 5, maximo: 50, localizacao: '', proximaContagem: '', fotoBase64: '' };
            tempBase64 = item.fotoBase64 || '';

            const categoriasOps = db.categorias.filter(c => c.modulo === 'Estoque' || c.modulo === 'Geral').map(c => `<option value="${escapeHTML(c.nome)}" ${item.categoria === c.nome ? 'selected' : ''}>${escapeHTML(c.nome)}</option>`).join('');

            const modalHtml = `
                <div id="modal_estoque" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-lg text-slate-800">${id ? 'Editar Item no Estoque' : 'Novo Item no Estoque'}</h3>
                            <button onclick="fecharModal('modal_estoque')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="salvarModalEstoque(event, '${id}')" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Descrição do Item</label>
                                <input type="text" id="m_est_item" required value="${escapeHTML(item.item)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Categoria</label>
                                    <select id="m_est_cat" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">${categoriasOps}</select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Localização</label>
                                    <input type="text" id="m_est_loc" value="${escapeHTML(item.localizacao)}" placeholder="Ex: Almoxarifado" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Qtd Atual</label>
                                    <input type="number" id="m_est_qtd" min="0" required value="${item.qtd}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Qtd Mínima</label>
                                    <input type="number" id="m_est_min" min="0" required value="${item.minimo}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Qtd Máxima</label>
                                    <input type="number" id="m_est_max" min="0" required value="${item.maximo}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Data Agendada para Inventário/Balanço</label>
                                <input type="date" id="m_est_prox" value="${item.proximaContagem}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Foto do Produto (Opcional)</label>
                                <input type="file" accept="image/*" onchange="processarUploadBase64(event, 'preview_est_img')" class="w-full text-xs text-slate-500">
                                <img id="preview_est_img" src="${tempBase64}" class="mt-2 h-20 object-cover rounded-lg border ${tempBase64 ? '' : 'hidden'}">
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_estoque')" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold">Salvar Item</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };

        function salvarModalEstoque(e, id) {
            e.preventDefault();
            const newItem = {
                id: id || 'est_' + Date.now(),
                item: document.getElementById('m_est_item').value.trim(),
                categoria: document.getElementById('m_est_cat').value,
                localizacao: document.getElementById('m_est_loc').value.trim(),
                qtd: Number(document.getElementById('m_est_qtd').value),
                minimo: Number(document.getElementById('m_est_min').value),
                maximo: Number(document.getElementById('m_est_max').value),
                proximaContagem: document.getElementById('m_est_prox').value,
                fotoBase64: tempBase64
            };

            if (id) {
                const idx = db.estoque.findIndex(e => e.id === id);
                if (idx !== -1) db.estoque[idx] = newItem;
            } else {
                db.estoque.push(newItem);
            }

            salvarDados(db);
            registrarLog('Estoque', id ? 'Edição' : 'Criação', `Item ${newItem.item} salvo.`);
            fecharModal('modal_estoque');
            renderApp();
        }

        // =====================================
        // DASHBOARD VIEW & CHARTS
        // =====================================
        function renderDashboardView() {
            let fin = db.financeiro || [];
            if (dashFiltro.dtIni) fin = fin.filter(f => f.vencimento >= dashFiltro.dtIni);
            if (dashFiltro.dtFim) fin = fin.filter(f => f.vencimento <= dashFiltro.dtFim);

            const recTot = fin.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((acc, f) => acc + Number(f.valor), 0);
            const despTot = fin.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((acc, f) => acc + Number(f.valor), 0);
            const saldo = recTot - despTot;
            const pendentes = fin.filter(f => f.status === 'Aberto').reduce((acc, f) => acc + Number(f.valor), 0);

            return `
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-3 items-center no-print">
                        <span class="text-xs font-bold text-slate-600 uppercase">Filtrar Período Dashboard:</span>
                        <input type="date" value="${dashFiltro.dtIni}" onchange="dashFiltro.dtIni = this.value; renderApp();" class="p-2 border rounded-lg text-xs font-bold">
                        <span class="text-xs text-slate-400">até</span>
                        <input type="date" value="${dashFiltro.dtFim}" onchange="dashFiltro.dtFim = this.value; renderApp();" class="p-2 border rounded-lg text-xs font-bold">
                        <button onclick="dashFiltro = {dtIni:'', dtFim:''}; renderApp();" class="px-3 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-xs">Limpar</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Receitas Efetuadas</p>
                            <h3 class="text-xl font-black text-emerald-600 mt-1">R$ ${recTot.toLocaleString('pt-BR', {minimumFractionDigits:2})}</h3>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Despesas Pagas</p>
                            <h3 class="text-xl font-black text-rose-600 mt-1">R$ ${despTot.toLocaleString('pt-BR', {minimumFractionDigits:2})}</h3>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Saldo em Caixa</p>
                            <h3 class="text-xl font-black ${saldo >= 0 ? 'text-teal-600' : 'text-rose-600'} mt-1">R$ ${saldo.toLocaleString('pt-BR', {minimumFractionDigits:2})}</h3>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Títulos em Aberto</p>
                            <h3 class="text-xl font-black text-amber-600 mt-1">R$ ${pendentes.toLocaleString('pt-BR', {minimumFractionDigits:2})}</h3>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <h4 class="font-bold text-slate-800 text-sm mb-4">Balanço de Receitas x Despesas</h4>

        function renderDashboardCharts() {
            const ctx1 = document.getElementById('chartBalanco');

                const recTot = fin.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((acc, f) => acc + Number(f.valor), 0);
                const despTot = fin.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((acc, f) => acc + Number(f.valor), 0);
                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['Receitas', 'Despesas'],
                        datasets: [{ data: [recTot, despTot], backgroundColor: ['#10b981', '#f43f5e'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }

            const ctx2 = document.getElementById('chartEstoque');
            if (ctx2) {
                const est = db.estoque || [];
                const catMap = {};
                est.forEach(e => { catMap[e.categoria] = (catMap[e.categoria] || 0) + Number(e.qtd); });
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(catMap),
                        datasets: [{ data: Object.values(catMap), backgroundColor: ['#0d9488', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'] }]

                    options: { responsive: true, maintainAspectRatio: false }

        function salvarModalMorador(e, id) {
            e.preventDefault();
            const newItem = {
                id: id || 'mor_' + Date.now(),
                bloco: document.getElementById('m_mor_bloco').value.trim(),
                apartamento: document.getElementById('m_mor_ap').value.trim(),
                nome: document.getElementById('m_mor_nome').value.trim(),
                email: document.getElementById('m_mor_email').value.trim(),
                telefone: document.getElementById('m_mor_tel').value.trim(),
                tipo: 'Proprietário'
            };

            if (id) {
                const idx = db.moradores.findIndex(m => m.id === id);
                if (idx !== -1) db.moradores[idx] = newItem;
            } else {
                db.moradores.push(newItem);
            }

            salvarDados(db);
            fecharModal('modal_mor');
            renderApp();
        }

        window.renderModalDocumento = function() {

        // =====================================
        // RELATÓRIOS & DRE
        // =====================================
        function renderRelatoriosView() {
            const fin = db.financeiro || [];
            const recTot = fin.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((acc, f) => acc + Number(f.valor), 0);
            const pendTot = fin.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((acc, f) => acc + Number(f.valor), 0);
            const recLiq = recTot - pendTot;
            const despTot = fin.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((acc, f) => acc + Number(f.valor), 0);
            const resFinal = recLiq - despTot;

            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="font-black text-slate-800 text-lg border-b pb-3 uppercase tracking-wider">Demonstrativo do Resultado do Exercício (DRE)</h3>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between p-3 bg-emerald-50 text-emerald-900 font-bold rounded-lg">
                            <span>(+) RECEITA OPERACIONAL BRUTA</span>
                            <span>R$ ${recTot.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
                        </div>
                        <div class="flex justify-between p-3 bg-rose-50 text-rose-900 font-bold rounded-lg">
                            <span>(-) INADIMPLÊNCIA / PENDÊNCIAS</span>
                            <span>R$ ${pendTot.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
                        </div>
                        <div class="flex justify-between p-3 bg-slate-100 text-slate-800 font-black rounded-lg border">
                            <span>(=) RECEITA OPERACIONAL LÍQUIDA</span>
                            <span>R$ ${recLiq.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
                        </div>
                        <div class="flex justify-between p-3 bg-rose-50 text-rose-900 font-bold rounded-lg">
                            <span>(-) DESPESAS OPERACIONAIS</span>
                            <span>R$ ${despTot.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
                        </div>
                        <div class="flex justify-between p-4 ${resFinal >= 0 ? 'bg-teal-600 text-white' : 'bg-rose-600 text-white'} font-black text-sm rounded-xl shadow">
                            <span>(=) RESULTADO OPERACIONAL LÍQUIDO</span>
                            <span>R$ ${resFinal.toLocaleString('pt-BR', {minimumFractionDigits:2})}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function restaurarDREPadrao() {
