<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950" data-animacoes="ativadas">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="description" content="Guardiões do Bravo — sistema de gestão condominial.">
        <meta name="theme-color" content="#020617">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Guardiões do Bravo">
        <link rel="manifest" href="./manifest.webmanifest">
        <link rel="icon" href="./icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="./icon-192.png">
        <title>Guardiões do Bravo - Gestão Condominial Completa em Nuvem</title>
        <!-- Versão de melhorias: 2026.10.28 | login Google com imagem 3D cinematográfica e movimento de cena -->
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <!-- FontAwesome Icons CDN -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- Chart.js CDN -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- Pako (Compressão Gzip para arquivos grandes) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
        <!-- Supabase JS Client para Banco de Dados na Nuvem -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'sans-serif']
                        },
                        colors: {
                            brand: {
                                50: '#f0fdfa',
                                100: '#ccfbf1',
                                200: '#99f6e4',
                                300: '#5eead4',
                                400: '#2dd4bf',
                                500: '#14b8a6',
                                600: '#0d9488',
                                700: '#0f766e',
                                800: '#115e59',
                                900: '#134e4a',
                                950: '#042f2e'
                            }
                        }
                    }
                }
            }
        </script>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                font-family: 'Inter', sans-serif;
            }

            input, select, textarea {
                color: #0f172a !important;
                font-weight: 600 !important;
            }

            .tab-active {
                border-bottom: 2px solid #0d9488;
                background-color: #ffffff;
                color: #0f766e;
                font-weight: 700;
                shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            }

            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #f1f5f9;
            }

            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 9999px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }

            .sidebar-full {
                height: 100vh;
                position: sticky;
                top: 0;
            }

            .card-modern {
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                border: 1px solid rgba(226, 232, 240, 0.8);
            }

            .card-modern:hover {
                transform: translateY(-3px);
                box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            }

            .glass-header {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(12px);
            }

            @media print {
                aside, header, .no-print, button, .actions-col {
                    display: none !important;
                }

                body {
                    background: white !important;
                    color: black !important;
                }

                main {
                    padding: 0 !important;
                }

                .print-break {
                    page-break-before: always;
                }
            }

            /* ===== Modernização visual: camada complementar, sem alterar os módulos ===== */
            :root {
                color-scheme: light;
                --app-ink: #172033;
                --app-muted: #64748b;
                --app-primary: #0f766e;
                --app-border: #e2e8f0;
            }

            body {
                background: #f4f7fb !important;
                color: var(--app-ink);
                letter-spacing: -0.01em;
            }

            #status-nuvem {
                position: sticky;
                top: 0;
                z-index: 70;
                min-height: 34px;
                font-size: 11px;
                letter-spacing: .02em;
            }

            #app {
                background: linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);
            }

            .card-modern {
                border: 1px solid #e5eaf1 !important;
                border-radius: 18px !important;
                box-shadow: 0 3px 14px rgba(15,23,42,.035);
            }

            .card-modern:hover {
                transform: translateY(-2px);
                box-shadow: 0 14px 30px rgba(15,23,42,.075);
            }

            button, a, input, select, textarea {
                transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
            }

            button {
                min-height: 34px;
            }

            button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
                outline: 3px solid rgba(20,184,166,.38) !important;
                outline-offset: 2px;
            }

            input, select, textarea {
                border-color: #dbe3ed !important;
                border-radius: 10px !important;
            }

            input:focus, select:focus, textarea:focus {
                border-color: #0d9488 !important;
                box-shadow: 0 0 0 3px rgba(13,148,136,.10) !important;
            }

            table {
                border-collapse: separate;
                border-spacing: 0;
            }

            thead th {
                letter-spacing: .06em;
                font-size: 10px;
            }

            tbody tr:hover {
                background-color: #f8fbff;
            }

            .sidebar-full {
                height: 100dvh;
            }

            #sidebar-menu {
                box-shadow: 8px 0 28px rgba(2,6,23,.08);
            }

            #sidebar-menu nav button {
                min-height: 40px;
                border-radius: 10px;
            }

            #sidebar-menu nav button:hover {
                transform: translateX(2px);
            }

            #modal-container > div {
                padding: 16px;
            }

            #modal-container > div > div {
                max-height: min(90dvh, 900px);
                overflow-y: auto;
                border: 1px solid rgba(255,255,255,.5);
            }

            .glass-header {
                background: rgba(255,255,255,.92);
                border-bottom: 1px solid #e8edf4;
            }

            ::selection {
                background: #99f6e4;
                color: #134e4a;
            }

            @media (max-width: 768px) {
                .pet-espia {
                    top: -42px;
                }

                .pet-espia.esq {
                    left: 18px;
                }

                .pet-espia.dir {
                    right: 18px;
                }

                .login-google-card {
                    margin-top: 18px;
                }

                .sidebar-full {
                    height: 100dvh;
                }

                table {
                    font-size: 12px;
                }

                #status-nuvem {
                    padding-inline: 8px; text-align: center;
                }
            }

            /* O sistema inicia com animações ligadas. O utilizador pode desligá-las em Configurações. */
            @media (prefers-reduced-motion: reduce) {
                html:not([data-animacoes="ativadas"]) *, html:not([data-animacoes="ativadas"]) *::before, html:not([data-animacoes="ativadas"]) *::after {
                    animation-duration: .01ms !important;
                    animation-iteration-count: 1 !important;
                    scroll-behavior: auto !important;
                    transition-duration: .01ms !important;
                }

                html:not([data-animacoes="ativadas"]) .card-modern:hover, html:not([data-animacoes="ativadas"]) #sidebar-menu nav button:hover {
                    transform: none;
                }
            }

            html[data-animacoes="desativadas"] *, html[data-animacoes="desativadas"] *::before, html[data-animacoes="desativadas"] *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }

            html[data-animacoes="desativadas"] .card-modern:hover, html[data-animacoes="desativadas"] #sidebar-menu nav button:hover {
                transform: none !important;
            }

            /* ===== ANIMAÇÕES v2 ===== */
            /* ---------- Entrada dos módulos (troca de aba e login) ---------- */
            @keyframes entrar-subindo {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .entrada-seq {
                animation: entrar-subindo .42s cubic-bezier(.2, .7, .2, 1) both;
                animation-delay: calc(var(--base, 0ms) + var(--i, 0) * 60ms);
            }

            /* ---------- Modais ---------- */
            @keyframes modal-fundo-in {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            @keyframes modal-fundo-out {
                from {
                    opacity: 1;
                }

                to {
                    opacity: 0;
                }
            }

            @keyframes modal-caixa-in {
                from {
                    opacity: 0;
                    transform: translateY(14px) scale(.97);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes modal-caixa-out {
                from {
                    opacity: 1;
                    transform: none;
                }

                to {
                    opacity: 0;
                    transform: translateY(8px) scale(.98);
                }
            }

            #modal-container > div {
                animation: modal-fundo-in .18s ease-out both;
            }

            #modal-container > div > div {
                animation: modal-caixa-in .24s cubic-bezier(.2, .8, .2, 1) both;
            }

            #modal-container.fechando > div {
                animation: modal-fundo-out .16s ease-in both;
            }

            #modal-container.fechando > div > div {
                animation: modal-caixa-out .16s ease-in both;
            }

            button:active:not(:disabled) {
                transform: scale(.97);
            }

            #sidebar-backdrop:not(.hidden) {
                animation: modal-fundo-in .25s ease-out both;
            }

            /* ---------- Login: cartão + cão e gato espiando ---------- */
            #app > .min-h-screen > .max-w-md {
                animation: modal-caixa-in .5s cubic-bezier(.2, .8, .2, 1) both;
            }

            .pet-espia {
                position: absolute;
                top: -48px;
                z-index: 30;
                pointer-events: none;
                display: block;
                line-height: 0;
            }

            .pet-login-card, .login-google-card {
                overflow: visible !important;
            }

            .pet-login-emoji {
                display: block;
                font-size: 52px;
                line-height: 1;
                filter: drop-shadow(0 5px 5px rgba(0,0,0,.25));
                animation: espiar 3.2s ease-in-out infinite;
            }

            .pet-login-gato .pet-login-emoji {
                animation-delay: -1.4s;
            }

            .pet-espia svg {
                display: block;
                animation: espiar 3.2s ease-in-out infinite;
                transform-origin: 50% 100%;
            }

            .pet-espia.dir {
                right: 24px;
            }

            .pet-espia.esq {
                left: 24px;
            }

            .pet-espia.esq svg {
                animation-delay: -1.4s;
            }

            @keyframes espiar {
                0%, 100% {
                    transform: translateY(0) rotate(0);
                }

                50% {
                    transform: translateY(-4px) rotate(-3deg);
                }
            }

            /* ---------- Transição de login: cão e gato correndo ---------- */
            #transicao-login {
                position: fixed;
                inset: 0;
                z-index: 200;
                background: radial-gradient(circle at 50% 38%, #0f3d3a, #020617 70%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 26px;
                transition: opacity .45s ease;
                cursor: pointer;
            }

            #transicao-login.saindo {
                opacity: 0;
                pointer-events: none;
            }

            .tl-texto {
                color: #fff;
                font-weight: 800;
                font-size: 18px;
                letter-spacing: -.01em;
                animation: entrar-subindo .5s both;
            }

            .tl-pista {
                position: relative;
                width: 100%;
                height: 84px;
                overflow: hidden;
            }

            .tl-corredor {
                position: absolute;
                bottom: 6px;
                left: 0;
                animation: corre 1.45s cubic-bezier(.4, .1, .5, .95) both;
            }

            .tl-corredor svg {
                display: block;
                animation: pula .3s ease-in-out infinite;
                transform-origin: 50% 100%;
            }

            @keyframes corre {
                from {
                    transform: translateX(-90px);
                }

                to {
                    transform: translateX(calc(100vw + 30px));
                }
            }

            @keyframes pula {
                0%, 100% {
                    transform: translateY(0) rotate(-5deg);
                }

                50% {
                    transform: translateY(-14px) rotate(5deg);
                }
            }

            .tl-pegada {
                position: absolute;
                bottom: 2px;
                font-size: 14px;
                opacity: 0;
                animation: pegada 1.1s ease-out both;
            }

            @keyframes pegada {
                0% {
                    opacity: 0;
                }

                20% {
                    opacity: .7;
                }

                100% {
                    opacity: 0;
                }
            }

            /* ---------- Gato 3D do botão de IA ---------- */
            .gato-ia {
                display: block;
                transform-origin: 50% 90%;
                animation: gato-balanca 2.6s ease-in-out infinite;
                filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
            }

            @keyframes gato-balanca {
                0%, 100% {
                    transform: rotate(-5deg);
                }

                50% {
                    transform: rotate(5deg);
                }
            }

            .pet-olho {
                transform-box: fill-box;
                transform-origin: center;
                animation: pet-pisca 4.5s infinite;
            }

            @keyframes pet-pisca {
                0%, 92%, 100% {
                    transform: scaleY(1);
                }

                96% {
                    transform: scaleY(.1);
                }
            }

            /* ===== Linhas de tabela: destaque ao salvar e saída ao excluir ===== */
            @keyframes flash-linha {
                0% {
                    background-color: rgba(45,212,191,.38);
                }

                100% {
                    background-color: transparent;
                }
            }

            @keyframes linha-sai {
                0% {
                    opacity: 1;
                }

                100% {
                    opacity: 0;
                    transform: translateX(26px);
                }
            }

            tr.linha-nova > td {
                animation: flash-linha 1.8s ease-out both;
            }

            tr.linha-saindo > td {
                background-color: rgba(244,63,94,.14);
                animation: linha-sai .26s ease-in both;
            }

            /* ===== Assistente (gato) ===== */
            #assistente-ia {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 80;
                font-family: 'Inter', sans-serif;
            }

            #ai-flutua {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 81;
                display: block;
                animation: none;
                touch-action: none;
                user-select: none;
            }

            #ai-gato {
                display: block;
                width: 76px;
                height: 76px;
                padding: 0;
                border: 0;
                background: transparent;
                cursor: grab;
                touch-action: none;
                filter: drop-shadow(0 8px 10px rgba(2,6,23,.35));
                transition: transform .2s;
            }

            #ai-gato:active {
                cursor: grabbing;
            }

            #ai-gato svg {
                width: 100%;
                height: 100%;
                animation: none;
            }

            #ai-gato:hover {
                transform: scale(1.08) rotate(-4deg);
            }

            @keyframes ai-flutua {
                0%,100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-6px);
                }
            }

            #ai-balao {
                position: absolute;
                right: 4px;
                bottom: calc(100% - 2px);
                background: #fff;
                color: #0f172a;
                font-size: 13px;
                font-weight: 700;
                padding: 10px 14px;
                border-radius: 16px;
                box-shadow: 0 10px 28px rgba(15,23,42,.22);
                white-space: nowrap;
                cursor: pointer;
                opacity: 0;
                transform-origin: 85% 100%;
                animation: ai-balao-in .45s cubic-bezier(.2,.9,.3,1.3) var(--atraso, 900ms) both;
                transition: opacity .4s;
            }

            #ai-balao::after {
                content: '';
                position: absolute;
                right: 26px;
                bottom: -6px;
                width: 14px;
                height: 14px;
                background: #fff;
                transform: rotate(45deg);
                border-radius: 3px;
            }

            #ai-balao.sumindo {
                opacity: 0 !important;
                animation: none;
                pointer-events: none;
            }

            @keyframes ai-balao-in {
                from {
                    opacity: 0;
                    transform: scale(.6) translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            #ai-painel {
                display: none;
                position: absolute;
                right: 0;
                bottom: 88px;
                width: min(390px, calc(100vw - 32px));
                height: min(560px, 72dvh);
                background: #fff;
                border-radius: 22px;
                box-shadow: 0 24px 60px rgba(2,6,23,.35);
                border: 1px solid #e2e8f0;
                overflow: hidden;
                flex-direction: column;
            }

            #ai-painel.aberto {
                display: flex;
                animation: modal-caixa-in .26s cubic-bezier(.2,.8,.2,1) both;
            }

            .ai-topo {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 14px;
                background: linear-gradient(90deg,#0f766e,#115e59);
                color: #fff;
            }

            .ai-topo strong {
                font-size: 14px;
                font-weight: 800;
                display: block;
            }

            .ai-topo span {
                font-size: 11px;
                opacity: .8;
            }

            .ai-topo button {
                margin-left: auto;
                color: #fff;
                background: rgba(255,255,255,.14);
                border: 0;
                border-radius: 10px;
                width: 32px;
                height: 32px;
                cursor: pointer;
            }

            #ai-msgs {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                background: #f8fafc;
            }

            .ai-msg {
                max-width: 88%;
                padding: 9px 12px;
                border-radius: 16px;
                font-size: 13px;
                line-height: 1.5;
                animation: entrar-subindo .25s both;
                word-wrap: break-word;
            }

            .ai-msg.bot {
                background: #fff;
                color: #1e293b;
                border: 1px solid #e2e8f0;
                border-bottom-left-radius: 4px;
                align-self: flex-start;
            }

            .ai-msg.eu {
                background: #0d9488;
                color: #fff;
                border-bottom-right-radius: 4px;
                align-self: flex-end;
            }

            .ai-acao {
                display: inline-block;
                margin-top: 8px;
                padding: 7px 12px;
                background: #0f766e;
                color: #fff;
                border: 0;
                border-radius: 10px;
                font-size: 12px;
                font-weight: 700;
                cursor: pointer;
            }

            .ai-digitando span {
                display: inline-block;
                width: 6px;
                height: 6px;
                margin: 0 2px;
                border-radius: 50%;
                background: #94a3b8;
                animation: ai-ponto 1s infinite;
            }

            .ai-digitando span:nth-child(2) {
                animation-delay: .15s;
            }

            .ai-digitando span:nth-child(3) {
                animation-delay: .3s;
            }

            @keyframes ai-ponto {
                0%,60%,100% {
                    transform: translateY(0);
                    opacity: .5;
                }

                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            #ai-chips {
                display: flex;
                gap: 6px;
                padding: 8px 12px 0;
                overflow-x: auto;
                background: #fff;
            }

            #ai-chips button {
                flex: none;
                padding: 6px 11px;
                font-size: 11.5px;
                font-weight: 700;
                color: #0f766e;
                background: #f0fdfa;
                border: 1px solid #99f6e4;
                border-radius: 999px;
                cursor: pointer;
                min-height: 0;
            }

            #ai-form {
                display: flex;
                gap: 8px;
                padding: 10px 12px 12px;
                background: #fff;
            }

            #ai-input {
                flex: 1;
                padding: 10px 12px;
                font-size: 13px;
                border: 1px solid #dbe3ed;
                border-radius: 12px;
            }

            #ai-form button {
                width: 40px;
                border: 0;
                border-radius: 12px;
                background: #0d9488;
                color: #fff;
                cursor: pointer;
            }

            @media (max-width: 640px) {
                #assistente-ia {
                    right: 10px;
                    bottom: 10px;
                }

                #ai-flutua {
                    right: 10px;
                    bottom: 10px;
                }

                #ai-gato {
                    width: 64px;
                    height: 64px;
                }

                #ai-painel {
                    bottom: 76px;
                }
            }

            /* ===== Ajustes mobile/PWA e acessibilidade ===== */
            body {
                padding-bottom: env(safe-area-inset-bottom);
            }

            #app {
                min-width: 0;
            }

            main, aside, nav, header {
                min-width: 0;
            }

            button, [role="button"], input[type="checkbox"], label {
                touch-action: manipulation;
            }

            #sidebar-menu {
                padding-bottom: env(safe-area-inset-bottom);
            }

            #status-nuvem {
                padding-top: max(6px, env(safe-area-inset-top));
            }

            @media (max-width: 768px) {
                #sidebar-menu {
                    width: min(86vw, 320px);
                }

                main {
                    padding-left: 12px !important;
                    padding-right: 12px !important;
                }

                #app button {
                    min-height: 42px;
                }

                #app input[type="checkbox"] {
                    min-width: 18px;
                    min-height: 18px;
                }

                .tab-active, [onclick^="abrirModulo("] {
                    -webkit-tap-highlight-color: rgba(20,184,166,.15);
                }
            }

            @media (display-mode: standalone) {
                body {
                    user-select: none;
                    -webkit-user-select: none;
                }

                input, textarea, select, [contenteditable="true"] {
                    user-select: text;
                    -webkit-user-select: text;
                }
            }

            /* ===== Tela de login: mascotes de corpo inteiro, animados ===== */

                border-radius: 28px;

                if (typeof str !== 'string')
                    return str || '';
                return str.replace(/[&<>"']/g, function(m) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;'
                    }[m];
                });
            }

            function compactarArquivoParaGzip(file, callback) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const arrayBuffer = e.target.result;
                        const uint8Array = new Uint8Array(arrayBuffer);
                        const compressed = pako.deflate(uint8Array);
                        let binary = '';
                        const len = compressed.byteLength;
                        for (let i = 0; i < len; i++) {
                            binary += String.fromCharCode(compressed[i]);
                        }
                        callback(btoa(binary), file.name);
                    } catch (err) {
                        alert('Erro ao compactar ficheiro.');
                    }
                }
                ;
                reader.readAsArrayBuffer(file);
            }

            function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
                try {
                    const binaryString = atob(base64Gzip);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const decompressed = pako.inflate(bytes);
                    const blob = new Blob([decompressed]);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = nomeOriginal;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    alert('Erro ao extrair ficheiro.');
                }
            }

            function visualizarArquivo(base64Gzip, nomeOriginal) {
                try {
                    const binaryString = atob(base64Gzip);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const decompressed = pako.inflate(bytes);

                    let mimeType = 'application/octet-stream';
                    const ext = nomeOriginal.split('.').pop().toLowerCase();
                    if (ext === 'pdf')
                        mimeType = 'application/pdf';
                    else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext))
                        mimeType = `image/${ext === 'jpg' ? 'jpeg' : ext}`;
                    else if (ext === 'txt')
                        mimeType = 'text/plain';

                    const blob = new Blob([decompressed],{
                        type: mimeType
                    });
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                } catch (err) {
                    alert('Erro ao visualizar o ficheiro.');
                }
            }

            function garantirConfiguracoesSistema() {
                if (!db.configuracoes || typeof db.configuracoes !== 'object')
                    db.configuracoes = {};
                if (!db.configuracoes.modulos || typeof db.configuracoes.modulos !== 'object')
                    db.configuracoes.modulos = {};
                MODULOS_CONFIGURAVEIS.forEach(modulo => {
                    if (typeof db.configuracoes.modulos[modulo.id] !== 'boolean')
                        db.configuracoes.modulos[modulo.id] = true;
                }
                );
                return db.configuracoes;
            }

            function moduloEstaAtivo(moduloId) {
                if (moduloId === 'configuracoes')
                    return true;
                garantirConfiguracoesSistema();
                return MODULOS_CONFIGURAVEIS.some(m => m.id === moduloId) ? db.configuracoes.modulos[moduloId] !== false : true;
            }

            function usuarioPodeConfigurarModulos() {
                const u = sessao && sessao.usuarioLogado;
                if (!u)
                    return false;
                const perfil = String(u.perfil || '').trim().toLowerCase();
                const cargo = String(u.cargo || '').trim().toLowerCase();
                return perfil === 'admin' || perfil === 'administrador' || cargo.includes('administrador');
            }

            function abrirModulo(moduloId, filtroEstoqueParam='todos') {
                if ((moduloId === 'configuracoes' || moduloId === 'usuarios') && !usuarioPodeConfigurarModulos()) {
                    alert('Somente um administrador pode acessar este módulo.');
                    return;
                }
                if (moduloId !== 'configuracoes' && !moduloEstaAtivo(moduloId)) {
                    alert('Este módulo está desativado nas Configurações do Sistema.');
                    return;
                }
                if (moduloId === 'estoque' && filtroEstoqueParam) {
                    filtroAtivoEstoque = filtroEstoqueParam;
                }
                if (!tabsState.openTabs.includes(moduloId))
                    tabsState.openTabs.push(moduloId);
                tabsState.activeTab = moduloId;
                fecharMenuMobile();
                renderApp();
            }

            function fecharAba(e, moduloId) {
                e.stopPropagation();
                if (tabsState.openTabs.length === 1)
                    return;
                tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
                if (tabsState.activeTab === moduloId)
                    tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
                renderApp();
            }

            function alternarModuloSistema(moduloId, ativar) {
                if (!usuarioPodeConfigurarModulos()) {
                    alert('Somente um administrador pode alterar estas configurações.');
                    renderApp();
                    return;
                }
                garantirConfiguracoesSistema();
                if (!MODULOS_CONFIGURAVEIS.some(m => m.id === moduloId))
                    return;

                db.configuracoes.modulos[moduloId] = !!ativar;
                if (!ativar) {
                    tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
                    if (tabsState.activeTab === moduloId) {
                        tabsState.activeTab = 'configuracoes';
                        if (!tabsState.openTabs.includes('configuracoes'))
                            tabsState.openTabs.push('configuracoes');
                    }
                }
                if (!tabsState.openTabs.length)
                    tabsState.openTabs = ['configuracoes'];
                salvarDados(db);
                renderApp();

            function exportarParaExcel(dados, nomeArquivo='relatorio.csv') {
                if (!dados || dados.length === 0) {
                    alert('Não há dados disponíveis.');
                    return;
                }
                const sanitizeData = dados.map(item => {
                    let obj = {
                        ...item
                    };
                    delete obj.arquivoCompactadoGzip;
                    delete obj.fotoCompactadaGzip;
                    return obj;
                }
                );
                const keys = Object.keys(sanitizeData[0]);
                let csvContent = '\uFEFF' + keys.join(',') + '\n';
                sanitizeData.forEach(row => {
                    const values = keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`);
                    csvContent += values.join(',') + '\n';
                }
                );
                const blob = new Blob([csvContent],{
                    type: 'text/csv;charset=utf-8;'
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nomeArquivo;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

                };
                restaurado.condominio = {
                    ...DEFAULT_DATA.condominio,
                    ...parsed.condominio
                };
                Object.keys(DEFAULT_DATA).forEach(chave => {
                    if (Array.isArray(DEFAULT_DATA[chave])) {
                        if (parsed[chave] === undefined)
                            restaurado[chave] = Array.isArray(db[chave]) ? db[chave] : DEFAULT_DATA[chave];
                        else if (!Array.isArray(parsed[chave]))
                            throw new Error(`Campo inválido no backup: ${chave}`);
                    }
                }
                );
                if (!restaurado.configuracoes || typeof restaurado.configuracoes !== 'object')
                    restaurado.configuracoes = {};
                if (!restaurado.configuracoes.modulos || typeof restaurado.configuracoes.modulos !== 'object')
                    restaurado.configuracoes.modulos = {};
                if (!restaurado.plano_contas)

            const ITERACOES_BACKUP_CRIPTO = 310000;
            let arquivoBackupCriptografadoPendente = null;

            function bytesParaBase64Backup(bytes) {
                let binario = '';
                for (let i = 0; i < bytes.length; i++)
                    binario += String.fromCharCode(bytes[i]);
                return btoa(binario);
            }

            function base64ParaBytesBackup(texto) {
                const binario = atob(texto);
                const bytes = new Uint8Array(binario.length);
                for (let i = 0; i < binario.length; i++)
                    bytes[i] = binario.charCodeAt(i);
                return bytes;
            }

            async function derivarChaveBackupCriptografado(senha, salt, iteracoes) {
                const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey({
                    name: 'PBKDF2',
                    salt,
                    iterations: iteracoes,
                    hash: 'SHA-256'
                }, material, {
                    name: 'AES-GCM',
                    length: 256
                }, false, ['encrypt', 'decrypt']);
            }

            window.confirmarRestauroBackupCriptografado = async function(event) {
                event.preventDefault();
                if (!usuarioPodeConfigurarModulos()) {
                    alert('Somente um administrador pode restaurar o backup completo.');
                    return;
                }
                const file = arquivoBackupCriptografadoPendente;

                if (!file) {
                    alert('Selecione novamente o arquivo criptografado.');
                    fecharModalContainer();
                    return;
                }
                const reader = new FileReader();
                reader.onerror = () => alert('Não foi possível ler o arquivo selecionado.');
                reader.onload = async function(ev) {
                    try {
                        const pacote = JSON.parse(ev.target.result);
                        if (!pacote || pacote.formato !== 'guardioes-do-bravo-backup-criptografado' || pacote.versao !== 1 || pacote.algoritmo !== 'AES-256-GCM' || pacote.derivacao !== 'PBKDF2-SHA-256')
                            throw new Error('Formato de backup criptografado inválido.');
                        const iteracoes = Number(pacote.iteracoes);
                        if (!Number.isInteger(iteracoes) || iteracoes < 100000 || iteracoes > 600000)
                            throw new Error('Parâmetro de derivação inválido.');
                        const salt = base64ParaBytesBackup(pacote.salt);
                        const iv = base64ParaBytesBackup(pacote.iv);
                        const cifrado = base64ParaBytesBackup(pacote.dados);
                        const chave = await derivarChaveBackupCriptografado(senha, salt, iteracoes);
                        const claro = await crypto.subtle.decrypt({
                            name: 'AES-GCM',
                            iv
                        }, chave, cifrado);
                        const parsed = JSON.parse(new TextDecoder().decode(claro));
                        const restaurado = prepararBackupRestaurado(parsed);
                        if (!confirm('A restauração vai substituir os dados atualmente carregados. Faça um backup atual antes de continuar. Deseja restaurar o backup criptografado?'))
                            return;
                        arquivoBackupCriptografadoPendente = null;
                        fecharModalContainer();
                        aplicarBackupRestaurado(restaurado, 'criptografado');
                    } catch (err) {
                        console.warn('Falha ao descriptografar ou validar o backup.', err);
                        alert('Não foi possível abrir o backup. Verifique a senha e a integridade do arquivo. Nenhum dado foi restaurado.');
                    }
                }
                ;
                reader.readAsText(file);
            }

                const reader = new FileReader();

Antes de continuar, baixe um backup atual. Os dados existentes não serão mesclados automaticamente. Deseja continuar?`))
                            return;
                        const restaurado = {

                        restaurado.condominio = {
                            ...DEFAULT_DATA.condominio,
                            ...parsed.condominio
                        };
                        Object.keys(DEFAULT_DATA).forEach(chave => {
                            if (Array.isArray(DEFAULT_DATA[chave])) {
                                if (parsed[chave] === undefined)
                                    restaurado[chave] = Array.isArray(db[chave]) ? db[chave] : DEFAULT_DATA[chave];
                                else if (!Array.isArray(parsed[chave]))
                                    throw new Error(`Campo inválido no backup: ${chave}`);
                            }
                        }
                        );
                        if (!restaurado.configuracoes || typeof restaurado.configuracoes !== 'object')
                            restaurado.configuracoes = {};
                        if (!restaurado.configuracoes.modulos || typeof restaurado.configuracoes.modulos !== 'object')
                            restaurado.configuracoes.modulos = {};
                        if (!restaurado.plano_contas)
                            restaurado.plano_contas = DEFAULT_DATA.plano_contas;
                        if (!restaurado.acertos_estoque)
                            restaurado.acertos_estoque = [];
                        if (!restaurado.motivos_acerto_estoque)
                            restaurado.motivos_acerto_estoque = DEFAULT_DATA.motivos_acerto_estoque;
                        db = restaurado;
                        marcarSyncPendente('restauração de backup aguardando confirmação da nuvem');
                        salvarCacheLocal();
                        salvarDados(db);
                        alert('Backup carregado. Confirme no indicador da nuvem se a sincronização foi concluída; mantenha o arquivo original guardado.');
                        renderApp();
                    } catch (err) {
                        console.error('Erro ao restaurar backup.', err);
                        alert('Erro ao ler o backup ou estrutura de dados inválida. Nenhum dado foi restaurado.');
                    } finally {
                        if (event && event.target)
                            event.target.value = '';
                    }
                }
                ;
                reader.onerror = function() {
                    alert('Não foi possível ler o arquivo selecionado.');
                    if (event && event.target)
                        event.target.value = '';
                }
                ;
                reader.readAsText(file);
            }

            function importarPlanilhaMoradores(event) {
                const file = event.target.files[0];
                if (!file)
                    return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const texto = e.target.result;
                        const linhas = texto.split(/\r\n|\n/);
                        if (linhas.length < 2) {
                            alert('A planilha parece estar vazia.');
                            return;
                        }

                        const cabecalho = linhas[0].split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim().toLowerCase());

                        const idxBloco = cabecalho.findIndex(h => h.includes('bloco') || h.includes('bl'));
                        const idxAp = cabecalho.findIndex(h => h.includes('ap') || h.includes('unidade') || h.includes('casa'));
                        const idxNome = cabecalho.findIndex(h => h.includes('nome') || h.includes('morador') || h.includes('proprietario'));
                        const idxEmail = cabecalho.findIndex(h => h.includes('email') || h.includes('e-mail'));
                        const idxTel = cabecalho.findIndex(h => h.includes('tel') || h.includes('cel') || h.includes('whatsapp') || h.includes('fone'));
                        const idxCpf = cabecalho.findIndex(h => h.includes('cpf') || h.includes('documento') || h.includes('rg'));
                        const idxPet = cabecalho.findIndex(h => h.includes('pet') || h.includes('animal'));
                        const idxVaga = cabecalho.findIndex(h => h.includes('vaga') || h.includes('estacionamento') || h.includes('garagem'));

                        let importados = 0;
                        if (!db.moradores)
                            db.moradores = [];

                        for (let i = 1; i < linhas.length; i++) {
                            const linha = linhas[i].trim();
                            if (!linha)
                                continue;
                            const cols = linha.split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim());

                            db.moradores.push({
                                id: 'mor_imp_' + Date.now() + '_' + i,
                                bloco: idxBloco !== -1 ? (cols[idxBloco] || '1') : (cols[0] || '1'),
                                apartamento: idxAp !== -1 ? (cols[idxAp] || '') : (cols[1] || ''),
                                nome: idxNome !== -1 ? (cols[idxNome] || 'Sem Nome') : (cols[2] || 'Sem Nome'),
                                email: idxEmail !== -1 ? (cols[idxEmail] || '') : '',
                                telefone: idxTel !== -1 ? (cols[idxTel] || '') : '',
                                cpf: idxCpf !== -1 ? (cols[idxCpf] || '') : '',
                                petNome: idxPet !== -1 ? (cols[idxPet] || '') : '',
                                vagaGaragem: idxVaga !== -1 ? (cols[idxVaga] || '') : ''
                            });
                            importados++;
                        }

                        if (importados > 0) {
                            salvarDados(db);
                            alert(`${importados} moradores importados com sucesso para a nuvem!`);
                            renderMainOnly();
                        } else {
                            alert('Nenhum morador válido encontrado na planilha.');
                        }
                    } catch (err) {
                        alert('Erro ao processar o arquivo CSV.');
                    }
                }
                ;
                reader.readAsText(file, 'UTF-8');
            }

            function realizarLogin(e) {
                e.preventDefault();
                const userInput = document.getElementById('login_user').value.trim().toLowerCase();
                const senhaInput = document.getElementById('login_pass').value;
                const lembrarChecked = document.getElementById('login_lembrar')?.checked;

                if (lembrarChecked) {
                    localStorage.setItem('guardioes_lembrar_user', userInput);
                } else {
                    localStorage.removeItem('guardioes_lembrar_user');
                }

                const userFound = (db.usuarios || []).find(u => (u.usuario && u.usuario.toLowerCase() === userInput) || (u.email && u.email.toLowerCase() === userInput));

                if (userFound && userFound.senhaHash === senhaInput) {
                    if (userFound.status === 'Inativo') {
                        alert('Utilizador inativo.');
                        return;
                    }

                    if (userFound.primeiroAcesso) {
                        usuarioPendentePrimeiroAcesso = userFound;
                        renderApp();
                        return;
                    }

                    sessao.usuarioLogado = userFound;
                    try {
                        sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound));
                    } catch (err) {}
                    reiniciarTemporizadorInatividade();
                    renderApp();
                } else {
                    alert('Credenciais incorretas! Verifique o utilizador/e-mail e a palavra-passe.');

                if (s1.length < 12 || !/[A-Z]/.test(s1) || !/[a-z]/.test(s1) || !/[0-9]/.test(s1)) {

                if (s1 !== s2) {

                }

                const userIndex = (db.usuarios || []).findIndex(u => u.id === usuarioPendentePrimeiroAcesso.id);
                if (userIndex !== -1) {

                    renderApp();
                }
            }

            // Posiciona o botão HTML funcional sobre o botão Google desenhado na tela do notebook.
            // A mesma composição estática é usada em computadores e celulares; o cálculo compensa o recorte.
            window.posicionarBotaoLoginGoogle = function() {
                const page = document.querySelector('.login-composite-page');
                const img = document.getElementById('login-composite-background');
                const btn = document.getElementById('btn-google-login');
                if (!page || !img || !btn || !img.naturalWidth || !img.naturalHeight)
                    return;

                const rect = page.getBoundingClientRect();
                const vw = rect.width || window.innerWidth;
                const vh = rect.height || window.innerHeight;
                if (!vw || !vh)
                    return;

                // object-fit:cover e object-position:center: reproduz o recorte real da arte.
                const scale = Math.max(vw / img.naturalWidth, vh / img.naturalHeight);
                const renderW = img.naturalWidth * scale;
                const renderH = img.naturalHeight * scale;
                const offsetX = (vw - renderW) / 2;
                const offsetY = (vh - renderH) / 2;

                // Caixa do botão impresso na arte original (1536 x 1024).
                const bx = 550
                  , by = 525
                  , bw = 433
                  , bh = 76;
                const naturalLeft = offsetX + bx * scale;
                const naturalTop = offsetY + by * scale;
                const naturalWidth = bw * scale;
                const naturalHeight = bh * scale;

                // Mantém uma área de toque acessível em telas curtas/pequenas, centrada no botão visual.
                const targetWidth = Math.max(naturalWidth, Math.min(144, vw * 0.85));
                const targetHeight = Math.max(naturalHeight, 44);
                const left = naturalLeft - (targetWidth - naturalWidth) / 2;
                const top = naturalTop - (targetHeight - naturalHeight) / 2;

                btn.style.left = `${left}px`;
                btn.style.top = `${top}px`;
                btn.style.width = `${targetWidth}px`;
                btn.style.height = `${targetHeight}px`;
            }
            ;

            let loginPositionFrame = 0;
            function agendarPosicaoBotaoLoginGoogle() {
                if (loginPositionFrame)
                    cancelAnimationFrame(loginPositionFrame);
                loginPositionFrame = requestAnimationFrame( () => {
                    loginPositionFrame = 0;
                    window.posicionarBotaoLoginGoogle();
                }
                );
            }
            window.addEventListener('resize', agendarPosicaoBotaoLoginGoogle, {
                passive: true
            });
            window.addEventListener('orientationchange', () => setTimeout(agendarPosicaoBotaoLoginGoogle, 80), {
                passive: true
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', agendarPosicaoBotaoLoginGoogle, {
                    passive: true
                });
            }
            if ('ResizeObserver'in window) {
                const loginResizeObserver = new ResizeObserver(agendarPosicaoBotaoLoginGoogle);
                window.addEventListener('load', () => {
                    const page = document.querySelector('.login-composite-page');
                    if (page)
                        loginResizeObserver.observe(page);
                }
                , {
                    once: true
                });
            }

            function dashboardNumero(valor) {
                if (typeof valor === 'number')
                    return Number.isFinite(valor) ? valor : 0;
                let raw = String(valor ?? '').trim().replace(/[R$\s]/g, '');
                if (!raw)
                    return 0;
                if (raw.includes(',') && raw.includes('.')) {
                    if (raw.lastIndexOf(',') > raw.lastIndexOf('.'))
                        raw = raw.replace(/\./g, '').replace(',', '.');
                    else
                        raw = raw.replace(/,/g, '');
                } else if (raw.includes(',')) {
                    raw = raw.replace(/\./g, '').replace(',', '.');
                }
                const n = Number(raw);
                return Number.isFinite(n) ? n : 0;
            }

            function dashboardMoeda(valor) {
                return new Intl.NumberFormat('pt-BR',{
                    style: 'currency',
                    currency: 'BRL',
                    maximumFractionDigits: 2
                }).format(dashboardNumero(valor));
            }

            function initDashboardEstoqueChart() {
                if (tabsState.activeTab !== 'dashboard')
                    return;
                const ctx = document.getElementById('chartEstoqueDash');
                if (!ctx)
                    return;

                const list = (db.estoque || []).filter(st => !estoqueItemEstaInativo(st));
                let qtdAdequado = 0;
                let qtdCritico = 0;
                let qtdExcedente = 0;

                list.forEach(st => {
                    const atual = dashboardNumero(st.quantidade !== undefined ? st.quantidade : (st.qtd || 0));
                    const minimo = dashboardNumero(st.minimo || 0);
                    const maximo = dashboardNumero(st.maximo || 0);

                    if (atual <= minimo)
                        qtdCritico++;
                    else if (maximo > 0 && atual > maximo)
                        qtdExcedente++;
                    else
                        qtdAdequado++;
                }
                );

                if (list.length === 0)
                    return;

                if (chartInstanceEstoqueDash)
                    chartInstanceEstoqueDash.destroy();
                chartInstanceEstoqueDash = new Chart(ctx,{
                    type: 'doughnut',
                    data: {
                        labels: ['Adequado', 'Insuficiente (Crítico)', 'Excedente (Antigo)'],
                        datasets: [{
                            data: [qtdAdequado, qtdCritico, qtdExcedente],
                            backgroundColor: ['#0d9488', '#f43f5e', '#f59e0b'],
                            borderWidth: 3,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {

                                    font: {

                        },

                    }

            // ===================== FORNECEDORES =====================
            const FOR_CATEGORIAS = ['Manutenção', 'Limpeza', 'Segurança / Portaria', 'Elevadores', 'Jardinagem / Paisagismo', 'Dedetização / Controle de pragas', 'Administração / Contabilidade', 'Material de consumo', 'Energia / Água / Gás', 'Obras e reformas', 'Tecnologia / Internet', 'Outros'];

            function forSoDigitos(v) {
                return String(v || '').replace(/\D/g, '');
            }
            function forMascaraCNPJ(v) {
                return forSoDigitos(v).slice(0, 14).replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
            }
            function forMascaraCEP(v) {
                return forSoDigitos(v).slice(0, 8).replace(/^(\d{5})(\d)/, '$1-$2');
            }
            function forMascaraTel(v) {
                const d = forSoDigitos(v).slice(0, 11);
                if (d.length <= 2)
                    return d;
                if (d.length <= 6)
                    return d.replace(/^(\d{2})(\d+)/, '($1) $2');
                if (d.length <= 10)
                    return d.replace(/^(\d{2})(\d{4})(\d+)/, '($1) $2-$3');
                return d.replace(/^(\d{2})(\d{5})(\d+)/, '($1) $2-$3');
            }
            function forCnpjValido(cnpj) {
                const n = forSoDigitos(cnpj);
                if (n.length !== 14 || /^(\d)\1+$/.test(n))
                    return false;
                const dv = (base) => {
                    let soma = 0
                      , peso = base.length - 7;
                    for (let i = 0; i < base.length; i++) {
                        soma += Number(base[i]) * peso--;
                        if (peso < 2)
                            peso = 9;
                    }
                    const r = soma % 11;
                    return r < 2 ? 0 : 11 - r;
                }
                ;
                return dv(n.slice(0, 12)) === Number(n[12]) && dv(n.slice(0, 13)) === Number(n[13]);
            }
            function forStatus(msg, tipo) {
                const el = document.getElementById('m_for_status');
                if (!el)
                    return;
                const cores = {
                    ok: 'text-emerald-600',
                    erro: 'text-rose-600',
                    info: 'text-slate-500'
                };
                el.className = 'text-[11px] font-bold mt-1 min-h-[16px] ' + (cores[tipo] || cores.info);
                el.innerHTML = msg || '';
            }
            function forSet(id, valor, mascara) {
                const el = document.getElementById(id);
                if (!el || valor === undefined || valor === null || String(valor).trim() === '')
                    return;
                el.value = mascara ? mascara(valor) : String(valor).trim();
            }
            async function forFetchJSON(url) {
                const ctrl = new AbortController();
                const t = setTimeout( () => ctrl.abort(), 9000);
                try {
                    const r = await fetch(url, {
                        signal: ctrl.signal
                    });
                    return {
                        ok: r.ok,
                        status: r.status,
                        json: r.ok ? await r.json() : null
                    };
                } finally {
                    clearTimeout(t);
                }
            }

            // Consulta CNPJ: BrasilAPI (principal) -> CNPJ.ws (reserva)
            async function forConsultarCNPJ(num) {
                let naoEncontrado = false;
                try {
                    const r = await forFetchJSON('https://brasilapi.com.br/api/cnpj/v1/' + num);
                    if (r.ok) {
                        const j = r.json;
                        return {
                            razao: j.razao_social,
                            fantasia: j.nome_fantasia,
                            situacao: j.descricao_situacao_cadastral,
                            cnae: j.cnae_fiscal_descricao,
                            cep: j.cep,
                            logradouro: ((j.descricao_tipo_de_logradouro || '') + ' ' + (j.logradouro || '')).trim(),
                            numero: j.numero,
                            complemento: j.complemento,
                            bairro: j.bairro,
                            cidade: j.municipio,
                            uf: j.uf,
                            telefone: j.ddd_telefone_1,
                            email: (j.email || '').toLowerCase()
                        };
                    }
                    if (r.status === 404)
                        naoEncontrado = true;
                } catch (e) {/* tenta a reserva */
                }
                if (!naoEncontrado) {
                    try {
                        const r = await forFetchJSON('https://publica.cnpj.ws/cnpj/' + num);
                        if (r.ok) {
                            const j = r.json
                              , e = j.estabelecimento || {};
                            return {
                                razao: j.razao_social,
                                fantasia: e.nome_fantasia,
                                situacao: e.situacao_cadastral,
                                cnae: e.atividade_principal && e.atividade_principal.descricao,
                                cep: e.cep,
                                logradouro: ((e.tipo_logradouro || '') + ' ' + (e.logradouro || '')).trim(),
                                numero: e.numero,
                                complemento: e.complemento,
                                bairro: e.bairro,
                                cidade: e.cidade && e.cidade.nome,
                                uf: e.estado && e.estado.sigla,
                                telefone: (e.ddd1 || '') + (e.telefone1 || ''),
                                email: (e.email || '').toLowerCase()
                            };
                        }
                        if (r.status === 404)
                            naoEncontrado = true;
                    } catch (e) {/* sem rede / bloqueado */
                    }
                }
                if (naoEncontrado)
                    throw new Error('CNPJ não encontrado na Receita Federal.');
                throw new Error('Não foi possível consultar agora (limite de consultas ou sem internet). Preencha manualmente ou tente de novo em instantes.');
            }

            window.forBuscarCNPJ = async function(auto) {
                const campo = document.getElementById('m_for_cnpj');
                if (!campo)
                    return;
                const num = forSoDigitos(campo.value);
                if (num.length !== 14) {
                    if (!auto)
                        forStatus('Digite os 14 números do CNPJ.', 'erro');
                    return;
                }
                if (!forCnpjValido(num)) {
                    forStatus('CNPJ inválido (dígitos verificadores não conferem).', 'erro');
                    return;
                }
                const btn = document.getElementById('m_for_btnbuscar');
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Buscando';
                }
                forStatus('Consultando Receita Federal...', 'info');
                try {
                    const d = await forConsultarCNPJ(num);
                    if (!document.getElementById('m_for_cnpj'))
                        return;
                    // modal fechado durante a consulta
                    forSet('m_for_razao', d.razao);
                    forSet('m_for_fantasia', d.fantasia);
                    forSet('m_for_situacao', d.situacao);
                    forSet('m_for_cnae', d.cnae);
                    forSet('m_for_cep', d.cep, forMascaraCEP);
                    forSet('m_for_logradouro', d.logradouro);
                    forSet('m_for_numero', d.numero);
                    forSet('m_for_complemento', d.complemento);
                    forSet('m_for_bairro', d.bairro);
                    forSet('m_for_cidade', d.cidade);
                    forSet('m_for_uf', d.uf ? String(d.uf).toUpperCase() : '');
                    forSet('m_for_telefone', d.telefone, forMascaraTel);
                    forSet('m_for_email', d.email);
                    forStatus('<i class="fa-solid fa-circle-check"></i> Dados preenchidos pela Receita Federal. Confira e complete os demais campos.', 'ok');
                } catch (err) {
                    forStatus('<i class="fa-solid fa-triangle-exclamation"></i> ' + escapeHTML(err.message), 'erro');
                } finally {
                    const b2 = document.getElementById('m_for_btnbuscar');
                    if (b2) {
                        b2.disabled = false;
                        b2.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Buscar dados';
                    }
                }
            }
            ;

            window.forBuscarCEP = async function() {
                const cep = forSoDigitos((document.getElementById('m_for_cep') || {}).value);
                if (cep.length !== 8)
                    return;
                forStatus('Buscando endereço pelo CEP...', 'info');
                try {
                    let end = null;
                    try {
                        const r = await forFetchJSON('https://brasilapi.com.br/api/cep/v1/' + cep);
                        if (r.ok)
                            end = {
                                logradouro: r.json.street,
                                bairro: r.json.neighborhood,
                                cidade: r.json.city,
                                uf: r.json.state
                            };
                    } catch (e) {}
                    if (!end) {
                        const r = await forFetchJSON('https://viacep.com.br/ws/' + cep + '/json/');
                        if (r.ok && !r.json.erro)
                            end = {
                                logradouro: r.json.logradouro,
                                bairro: r.json.bairro,
                                cidade: r.json.localidade,
                                uf: r.json.uf
                            };
                    }
                    if (!end) {
                        forStatus('CEP não encontrado.', 'erro');
                        return;
                    }
                    forSet('m_for_logradouro', end.logradouro);
                    forSet('m_for_bairro', end.bairro);
                    forSet('m_for_cidade', end.cidade);
                    forSet('m_for_uf', end.uf ? String(end.uf).toUpperCase() : '');
                    forStatus('Endereço preenchido pelo CEP.', 'ok');
                } catch (e) {
                    forStatus('Não foi possível consultar o CEP agora.', 'erro');
                }
            }
            ;

            window.forAoDigitarCNPJ = function(el) {
                el.value = forMascaraCNPJ(el.value);
                if (forSoDigitos(el.value).length === 14 && forCnpjValido(el.value) && el.dataset.novo === '1')
                    window.forBuscarCNPJ(true);
            }

                const badge = (s) => (s || 'Ativo') === 'Inativo' ? '<span class="px-2 py-1 rounded-full bg-slate-100 text-slate-500 font-bold text-[10px] uppercase">Inativo</span>' : '<span class="px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 font-bold text-[10px] uppercase">Ativo</span>';
                const linhas = list.map(f => `<tr class="hover:bg-slate-50/80 transition-colors">
                <td class="p-4 font-mono font-medium whitespace-nowrap">${escapeHTML(f.cnpj)}</td>

            window.salvarModalFornecedor = function(e, id) {
                e.preventDefault();
                if (!db.fornecedores)
                    db.fornecedores = [];
                const g = (k) => (document.getElementById('m_for_' + k).value || '').trim();
                const realId = id && id !== 'null' ? id : 'for_' + Date.now();
                const cnpjNum = forSoDigitos(g('cnpj'));
                if (db.fornecedores.some(x => x.id !== realId && forSoDigitos(x.cnpj) === cnpjNum)) {
                    alert('Já existe um fornecedor cadastrado com este CNPJ.');
                    return;
                }
                if (!forCnpjValido(cnpjNum) && !confirm('Este CNPJ parece inválido. Deseja salvar mesmo assim?'))
                    return;
                const anterior = db.fornecedores.find(x => x.id === realId) || {};
                const obj = Object.assign({}, anterior, {
                    id: realId,
                    cnpj: forMascaraCNPJ(cnpjNum),
                    razaoSocial: g('razao'),
                    nomeFantasia: g('fantasia'),
                    inscricaoEstadual: g('ie'),
                    situacao: g('situacao'),
                    status: g('status_reg') || 'Ativo',
                    categoria: g('categoria'),
                    atividade: g('cnae'),
                    contato: g('contato'),
                    telefone: g('telefone'),
                    email: g('email'),
                    site: g('site'),
                    cep: g('cep'),
                    logradouro: g('logradouro'),
                    numero: g('numero'),
                    complemento: g('complemento'),
                    bairro: g('bairro'),
                    cidade: g('cidade'),
                    uf: g('uf'),
                    chavePix: g('pix'),
                    observacoes: g('obs')
                });
                const idx = db.fornecedores.findIndex(x => x.id === obj.id);
                if (idx !== -1)
                    db.fornecedores[idx] = obj;
                else
                    db.fornecedores.push(obj);
                salvarDados(db);
                fecharModalContainer();
                renderMainOnly();
            }

                if (!st.fotoCompactadaGzip)
                    return '';
                const chave = st.id + ':' + st.fotoCompactadaGzip.length;
                if (cacheFotos.has(chave))
                    return cacheFotos.get(chave);
                try {
                    const bin = atob(st.fotoCompactadaGzip);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++)
                        bytes[i] = bin.charCodeAt(i);
                    const ext = (st.fotoNome || '').split('.').pop().toLowerCase();
                    const mime = ext === 'png' ? 'image/png' : ext === 'gif' ? 'image/gif' : ext === 'webp' ? 'image/webp' : 'image/jpeg';
                    const url = URL.createObjectURL(new Blob([pako.inflate(bytes)],{
                        type: mime
                    }));
                    cacheFotos.set(chave, url);
                    return url;
                } catch (e) {
                    return '';

            function initEstoqueChart() {
                if (tabsState.activeTab !== 'estoque')
                    return;
                const ctx = document.getElementById('chartEstoqueStatus');
                if (!ctx)
                    return;

                const list = (db.estoque || []).filter(st => !estoqueItemEstaInativo(st));
                let qtdAdequado = 0;
                let qtdCritico = 0;
                let qtdExcedente = 0;

                list.forEach(st => {
                    const atual = dashboardNumero(st.quantidade !== undefined ? st.quantidade : (st.qtd || 0));
                    const minimo = dashboardNumero(st.minimo || 0);
                    const maximo = dashboardNumero(st.maximo || 0);

                    if (atual <= minimo)
                        qtdCritico++;
                    else if (maximo > 0 && atual > maximo)
                        qtdExcedente++;
                    else
                        qtdAdequado++;
                }
                );

                if (list.length === 0) {
                    qtdAdequado = 1;
                }

                if (chartInstanceEstoque)
                    chartInstanceEstoque.destroy();
                chartInstanceEstoque = new Chart(ctx,{
                    type: 'doughnut',
                    data: {
                        labels: ['Estoque Adequado', 'Insuficiente (Crítico)', 'Excedente / Antigo'],
                        datasets: [{
                            data: [qtdAdequado, qtdCritico, qtdExcedente],
                            backgroundColor: ['#0d9488', '#f43f5e', '#f59e0b'],
                            borderWidth: 3,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    boxWidth: 12,
                                    font: {
                                        weight: 'bold',
                                        size: 10,
                                        family: 'Inter'
                                    }
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });
            }

                abrirModalContainer(`

                                    <button type="button" onclick="iniciarScannerCamera()" class="px-4 py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl font-bold shadow-sm transition-all flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-barcode"></i> Escanear</button>
                                </div>
                            </div>
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Item / Descrição</label><input type="text" id="m_est_item" required value="${escapeHTML(item.item || '')}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50" placeholder="Nome do produto ou material"></div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

                                <div><label for="m_est_setor_personalizado" class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Outro setor (opcional)</label><input type="text" id="m_est_setor_personalizado" value="${escapeHTML(setorItemPersonalizado)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50" placeholder="Ex.: brinquedoteca / depósito"></div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Marca</label><input type="text" id="m_est_marca" value="${escapeHTML(item.marca || item.brand || '')}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50" placeholder="Marca"></div>
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Linha</label><input type="text" id="m_est_linha" value="${escapeHTML(item.linha || item.line || '')}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50" placeholder="Linha / categoria comercial"></div>
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Fabricante</label><input type="text" id="m_est_fabricante" value="${escapeHTML(item.fabricante || item.manufacturer || '')}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50" placeholder="Fabricante"></div>
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Data de cadastro</label><input type="date" id="m_est_data_cadastro" value="${escapeHTML(dataEstoqueParaInput(item.dataCadastro || item.data_cadastro || item.dataRegistro || item.createdAt || ''))}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            </div>

                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Qtd Atual</label><input type="number" id="m_est_qtd" required value="${item.quantidade !== undefined ? item.quantidade : (item.qtd || 1)}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                                <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Mínimo</label><input type="number" id="m_est_min" value="${item.minimo !== undefined ? item.minimo : 0}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>
                            </div>
                            <div><label class="block font-bold uppercase text-slate-500 text-[10px] mb-1">Máximo</label><input type="number" id="m_est_max" value="${item.maximo !== undefined ? item.maximo : 0}" class="w-full p-3 border rounded-2xl font-bold bg-slate-50"></div>

                                <p class="text-[10px] text-slate-400 mt-1 font-medium">Foto atual: <span class="font-bold text-slate-700">${escapeHTML(item.fotoNome || 'Nenhuma')}</span></p>
