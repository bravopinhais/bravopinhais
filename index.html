<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - OS Condominial de Alta Tecnologia</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        cyber: {
                            50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
                            400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
                            800: '#115e59', 900: '#134e4a', 950: '#042f2e'
                        },
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card:hover { border-color: rgba(45, 212, 191, 0.3); box-shadow: 0 0 25px -5px rgba(20, 184, 166, 0.15); }
        .glow-teal { box-shadow: 0 0 20px rgba(20, 184, 166, 0.35); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #14b8a6; }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 antialiased flex flex-col h-screen overflow-hidden">

    <!-- Barra de Status IoT & Nuvem -->
    <header class="bg-slate-900/90 border-b border-slate-800/80 px-4 py-2 flex items-center justify-between text-xs font-mono z-50">
        <div class="flex items-center gap-4">
            <span class="flex items-center gap-2 text-cyber-400 font-semibold">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-cyber-500"></span>
                </span>
                GUARDIÕES OS v3.0 // ONLINE
            </span>
            <span class="text-slate-500 hidden md:inline">|</span>
            <span class="text-slate-400 hidden md:inline" id="top-condo-name"><i class="fa-solid fa-building text-cyber-500 mr-1"></i> Condomínio Guardiões do Bravo</span>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="status-cloud" class="flex items-center gap-1.5 text-emerald-400">
                <i class="fa-solid fa-server"></i>
                <span class="hidden sm:inline">Supabase Edge DB Connected</span>
            </div>
            <span class="text-slate-600">|</span>
            <div id="ai-status" class="flex items-center gap-1.5 text-cyber-400">
                <i class="fa-solid fa-brain animate-pulse"></i>
                <span>Bravo AI Core: Active</span>
            </div>
        </div>
    </header>

    <div id="app" class="flex-1 flex overflow-hidden"></div>

    <script>
        // =========================================================================
        // ESTADO GLOBAL DA APLICAÇÃO (STATE MANAGEMENT)
        // =========================================================================
        const APP_STATE = {
            user: null,
            activeTab: 'dashboard',
            condo: {
                nome: "Condomínio Guardiões do Bravo",
                unidadesTotal: 128,
                ocupacao: "94%",
                saldoCaixa: 142850.40,
                inadimplencia: "3.2%"
            },
            aiPrompting: false,
            aiMessages: [
                { sender: 'ai', text: 'Olá! Sou a inteligência artificial do Guardiões do Bravo. Como posso ajudar na gestão preditiva do condomínio hoje?' }
            ]
        };

        // Initialize App
        function initApp() {
            // Verificar sessão simulada ou carregada
            const savedUser = sessionStorage.getItem('bravo_user');
            if (savedUser) {
                APP_STATE.user = JSON.parse(savedUser);
            }
            render();
        }

        function render() {
            const root = document.getElementById('app');
            if (!APP_STATE.user) {
                root.innerHTML = renderLogin();
            } else {
                root.innerHTML = renderDashboardOS();
                initCharts();
            }
        }

        // =========================================================================
        // COMPONENTE 1: TELA DE LOGIN FUTURISTA
        // =========================================================================
        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-dark-950 to-black">
                    <div class="absolute w-[500px] h-[500px] bg-cyber-500/10 rounded-full blur-[120px] pointer-events-none"></div>
                    
                    <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl border border-slate-800/80 relative z-10 space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-gradient-to-tr from-cyber-600 to-emerald-400 rounded-2xl flex items-center justify-center text-dark-950 text-3xl font-black mx-auto glow-teal">
                                <i class="fa-solid fa-shield-cat"></i>
                            </div>
                            <h1 class="text-2xl font-black tracking-tight text-white font-mono">GUARDIÕES <span class="text-cyber-400">OS</span></h1>
                            <p class="text-xs text-slate-400">Sistema Operacional de Alta Tecnologia para Condomínios</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-mono uppercase tracking-widest text-cyber-400 mb-1">Credencial / E-mail</label>
                                <div class="relative">
                                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                                    <input type="text" id="login_user" required value="admin@guardioes.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-cyber-400 focus:ring-1 focus:ring-cyber-400 transition-all">
                                </div>
                            </div>

                            <div>
                                <label class="block text-[10px] font-mono uppercase tracking-widest text-cyber-400 mb-1">Chave de Acesso</label>
                                <div class="relative">
                                    <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                                    <input type="password" id="login_pass" required value="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-cyber-400 focus:ring-1 focus:ring-cyber-400 transition-all">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyber-500 to-emerald-500 hover:from-cyber-400 hover:to-emerald-400 text-dark-950 font-black rounded-xl text-sm uppercase tracking-wider transition-all transform hover:scale-[1.02] active:scale-[0.98] glow-teal">
                                <i class="fa-solid fa-bolt mr-1"></i> Autenticar no OS
                            </button>
                        </form>

                        <div class="text-center pt-2">
                            <span class="text-[11px] text-slate-500 font-mono"><i class="fa-solid fa-lock mr-1"></i> Encriptação Quantum-Safe 256-bit</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            APP_STATE.user = {
                nome: "Administrador Tech",
                email: document.getElementById('login_user').value,
                role: "SysAdmin"
            };
            sessionStorage.setItem('bravo_user', JSON.stringify(APP_STATE.user));
            render();
        }

        function handleLogout() {
            APP_STATE.user = null;
            sessionStorage.removeItem('bravo_user');
            render();
        }

        // =========================================================================
        // COMPONENTE 2: DASHBOARD PRINCIPAL (CYBERPANEL)
        // =========================================================================
        function renderDashboardOS() {
            return `
                <!-- Sidebar Lateral -->
                <aside class="w-64 bg-slate-900/60 border-r border-slate-800/80 flex flex-col justify-between hidden md:flex">
                    <div class="p-4 space-y-6">
                        <div class="flex items-center gap-3 px-2">
                            <div class="w-10 h-10 bg-cyber-500/10 border border-cyber-500/30 rounded-xl flex items-center justify-center text-cyber-400 font-black">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold font-mono text-white tracking-wide">GUARDIÕES OS</h2>
                                <p class="text-[10px] text-cyber-400 font-mono">v3.0 PRO EDITION</p>
                            </div>
                        </div>

                        <nav class="space-y-1">
                            ${renderNavItem('dashboard', 'fa-chart-pie', 'Dashboard OS')}
                            ${renderNavItem('portaria', 'fa-id-card-clip', 'Portaria & IoT')}
                            ${renderNavItem('financeiro', 'fa-vault', 'Financeiro & DRE')}
                            ${renderNavItem('moradores', 'fa-users-gear', 'Unidades & Moradores')}
                            ${renderNavItem('estoque', 'fa-boxes-stacked', 'Estoque Inteligente')}
                            ${renderNavItem('ai_hub', 'fa-brain', 'Bravo AI Analytics')}
                        </nav>
                    </div>

                    <div class="p-4 border-t border-slate-800/80 space-y-3">
                        <div class="flex items-center gap-3 px-2">
                            <div class="w-8 h-8 rounded-full bg-cyber-500/20 text-cyber-400 flex items-center justify-center font-bold text-xs border border-cyber-500/40">
                                AD
                            </div>
                            <div class="flex-1 overflow-hidden">
                                <p class="text-xs font-bold text-white truncate">${APP_STATE.user.nome}</p>
                                <p class="text-[10px] text-slate-400 truncate">${APP_STATE.user.role}</p>
                            </div>
                            <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 transition-colors">
                                <i class="fa-solid fa-power-off text-sm"></i>
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- Área Central de Conteúdo -->
                <main class="flex-1 flex flex-col overflow-y-auto bg-dark-950 p-6 space-y-6">
                    ${renderHeaderTab()}
                    ${renderTabContent()}
                </main>
            `;
        }

        function renderNavItem(id, icon, label) {
            const active = APP_STATE.activeTab === id;
            return `
                <button onclick="setActiveTab('${id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${active ? 'bg-cyber-500/10 text-cyber-400 border border-cyber-500/30 font-bold' : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'}">
                    <i class="fa-solid ${icon} w-4 text-center"></i>
                    <span>${label}</span>
                </button>
            `;
        }

        function setActiveTab(tabId) {
            APP_STATE.activeTab = tabId;
            render();
        }

        function renderHeaderTab() {
            return `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
                    <div>
                        <h1 class="text-2xl font-black text-white tracking-tight uppercase font-mono flex items-center gap-2">
                            <span class="text-cyber-400">//</span> ${APP_STATE.activeTab.replace('_', ' ')}
                        </h1>
                        <p class="text-xs text-slate-400">Telemetria e controle operacional centralizado</p>
                    </div>

                    <div class="flex items-center gap-3">
                        <button onclick="triggerAIInsight()" class="px-4 py-2 bg-cyber-500/10 hover:bg-cyber-500/20 border border-cyber-500/30 text-cyber-400 rounded-xl text-xs font-mono font-bold flex items-center gap-2 transition-all">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Insight com IA
                        </button>
                    </div>
                </div>
            `;
        }

        function renderTabContent() {
            switch(APP_STATE.activeTab) {
                case 'dashboard':
                    return renderDashboardView();
                case 'portaria':
                    return renderPortariaView();
                case 'ai_hub':
                    return renderAIHubView();
                default:
                    return `
                        <div class="glass-card p-12 rounded-3xl text-center space-y-3">
                            <i class="fa-solid fa-microchip text-4xl text-cyber-400 animate-pulse"></i>
                            <h3 class="text-lg font-bold text-white">Módulo em Processamento Quantum</h3>
                            <p class="text-xs text-slate-400 max-w-md mx-auto">Esta funcionalidade está sincronizando seus dados com as APIs relacionais do Supabase Edge.</p>
                        </div>
                    `;
            }
        }

        // =========================================================================
        // VIEWS ESPECÍFICAS
        // =========================================================================
        function renderDashboardView() {
            return `
                <!-- Cards Métrica KPI -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="glass-card p-5 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between text-slate-400 text-xs font-mono">
                            <span>SALDO CAIXA</span>
                            <i class="fa-solid fa-wallet text-cyber-400"></i>
                        </div>
                        <p class="text-2xl font-black text-white font-mono">R$ ${APP_STATE.condo.saldoCaixa.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                        <span class="text-[10px] text-emerald-400 font-mono"><i class="fa-solid fa-arrow-trend-up"></i> +4.2% este mês</span>
                    </div>

                    <div class="glass-card p-5 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between text-slate-400 text-xs font-mono">
                            <span>OCUPAÇÃO UNIDADES</span>
                            <i class="fa-solid fa-building text-cyber-400"></i>
                        </div>
                        <p class="text-2xl font-black text-white font-mono">${APP_STATE.condo.ocupacao}</p>
                        <span class="text-[10px] text-slate-400 font-mono">120 de 128 Unidades</span>
                    </div>

                    <div class="glass-card p-5 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between text-slate-400 text-xs font-mono">
                            <span>INADIMPLÊNCIA</span>
                            <i class="fa-solid fa-chart-line-down text-rose-400"></i>
                        </div>
                        <p class="text-2xl font-black text-rose-400 font-mono">${APP_STATE.condo.inadimplencia}</p>
                        <span class="text-[10px] text-emerald-400 font-mono"><i class="fa-solid fa-shield-check"></i> Abaixo da Meta (5%)</span>
                    </div>

                    <div class="glass-card p-5 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between text-slate-400 text-xs font-mono">
                            <span>DISPOSITIVOS IOT</span>
                            <i class="fa-solid fa-wifi text-cyber-400"></i>
                        </div>
                        <p class="text-2xl font-black text-white font-mono">24/24</p>
                        <span class="text-[10px] text-emerald-400 font-mono">Todas Câmeras/Portões Online</span>
                    </div>
                </div>

                <!-- Gráficos de Telemetria -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass-card p-5 rounded-2xl space-y-4">
                        <h3 class="text-sm font-bold text-white font-mono flex items-center gap-2">
                            <i class="fa-solid fa-chart-column text-cyber-400"></i> Fluxo Financeiro (Receitas vs Despesas)
                        </h3>
                        <div class="h-64 relative">
                            <canvas id="chartFinanceiro"></canvas>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-2xl space-y-4">
                        <h3 class="text-sm font-bold text-white font-mono flex items-center gap-2">
                            <i class="fa-solid fa-bolt text-amber-400"></i> Consumo de Energia do Condomínio (kWh)
                        </h3>
                        <div class="h-64 relative">
                            <canvas id="chartEnergia"></canvas>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPortariaView() {
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="glass-card p-5 rounded-2xl space-y-4">
                            <h3 class="text-sm font-bold text-white font-mono flex items-center justify-between">
                                <span><i class="fa-solid fa-video text-cyber-400 mr-2"></i> Monitoramento IoT em Tempo Real</span>
                                <span class="text-[10px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full border border-rose-500/30 animate-pulse">LIVE</span>
                            </h3>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-black/60 rounded-xl aspect-video relative overflow-hidden border border-slate-800 flex items-center justify-center">
                                    <span class="text-xs font-mono text-slate-500"><i class="fa-solid fa-camera mr-1"></i> CAM-01 (Entrada Principal)</span>
                                </div>
                                <div class="bg-black/60 rounded-xl aspect-video relative overflow-hidden border border-slate-800 flex items-center justify-center">
                                    <span class="text-xs font-mono text-slate-500"><i class="fa-solid fa-camera mr-1"></i> CAM-02 (Garagem G1)</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="glass-card p-5 rounded-2xl space-y-3">
                            <h3 class="text-sm font-bold text-white font-mono">Últimos Acessos</h3>
                            <div class="space-y-2 font-mono text-xs">
                                <div class="p-2.5 bg-slate-900/80 rounded-xl border border-slate-800 flex items-center justify-between">
                                    <div>
                                        <p class="font-bold text-white">Visitante: João Silva</p>
                                        <p class="text-[10px] text-slate-400">Apt 402 - Bloco A</p>
                                    </div>
                                    <span class="text-[10px] text-cyber-400">14:22</span>
                                </div>
                                <div class="p-2.5 bg-slate-900/80 rounded-xl border border-slate-800 flex items-center justify-between">
                                    <div>
                                        <p class="font-bold text-white">Morador: Maria Souza</p>
                                        <p class="text-[10px] text-slate-400">Apt 101 - Bloco B</p>
                                    </div>
                                    <span class="text-[10px] text-emerald-400">14:05</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAIHubView() {
            return `
                <div class="glass-card p-6 rounded-3xl space-y-4 flex flex-col h-[500px]">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-cyber-500/20 text-cyber-400 flex items-center justify-center border border-cyber-500/40">
                                <i class="fa-solid fa-brain"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-white font-mono">Bravo AI Analytics Core</h3>
                                <p class="text-[10px] text-slate-400">Modelo treinado para gestão condominial preventiva</p>
                            </div>
                        </div>
                    </div>

                    <div id="ai-chat-box" class="flex-1 overflow-y-auto space-y-3 p-2 font-mono text-xs">
                        ${APP_STATE.aiMessages.map(m => `
                            <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[80%] p-3 rounded-2xl ${m.sender === 'user' ? 'bg-cyber-500/20 border border-cyber-500/40 text-white' : 'bg-slate-900 border border-slate-800 text-slate-300'}">
                                    ${m.text}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <form onsubmit="sendAIMessage(event)" class="flex gap-2">
                        <input type="text" id="ai-input" placeholder="Pergunte sobre relatórios, inadimplência ou manutenção..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyber-400">
                        <button type="submit" class="px-4 py-2.5 bg-cyber-500 hover:bg-cyber-400 text-dark-950 font-bold rounded-xl text-xs transition-all">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            `;
        }

        function triggerAIInsight() {
            APP_STATE.activeTab = 'ai_hub';
            APP_STATE.aiMessages.push({
                sender: 'ai',
                text: '💡 **Insight Preditivo do Bravo AI:** Identificamos que o consumo elétrico do Bloco B teve um pico atípico de 14% na última semana. Recomendamos verificar os motores da bomba d\'água.'
            });
            render();
        }

        function sendAIMessage(e) {
            e.preventDefault();
            const input = document.getElementById('ai-input');
            const query = input.value.trim();
            if (!query) return;

            APP_STATE.aiMessages.push({ sender: 'user', text: query });
            input.value = '';
            
            // Simular resposta da IA
            setTimeout(() => {
                APP_STATE.aiMessages.push({
                    sender: 'ai',
                    text: `Analisando "${query}" nos dados do condomínio... Todos os parâmetros estão dentro das conformidades operacionais.`
                });
                render();
            }, 800);

            render();
        }

        // =========================================================================
        // INICIALIZAÇÃO DE GRÁFICOS (CHART.JS)
        // =========================================================================
        function initCharts() {
            setTimeout(() => {
                const ctxFin = document.getElementById('chartFinanceiro');
                if (ctxFin) {
                    new Chart(ctxFin, {
                        type: 'bar',
                        data: {
                            labels: ['Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out'],
                            datasets: [
                                { label: 'Receitas (R$)', data: [42000, 45000, 44000, 48000, 46000, 49000], backgroundColor: '#14b8a6' },
                                { label: 'Despesas (R$)', data: [31000, 34000, 32000, 38000, 33000, 35000], backgroundColor: '#f43f5e' }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'JetBrains Mono' } } } },
                            scales: {
                                x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                                y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                            }
                        }
                    });
                }

                const ctxEng = document.getElementById('chartEnergia');
                if (ctxEng) {
                    new Chart(ctxEng, {
                        type: 'line',
                        data: {

                            datasets: [{

                                tension: 0.4,

        }

        // Boot
        window.onload = initApp;
    </script>
