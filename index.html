<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardiões do Bravo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      :root {
        --bg: #f1f5f9;
        --sidebar: #0f172a;
        --primary: #0d9488;
        --text: #0f172a;
        --muted: #64748b;
        --danger: #ef4444;
        --warning: #f59e0b;
        --success: #10b981;
        --info: #3b82f6;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button, input, select, textarea {
        font: inherit;
      }

      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 250px;
        background: var(--sidebar);
        color: #e2e8f0;
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        padding: 8px 10px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        display: grid;
        place-items: center;
        font-size: 18px;
      }

      .brand h1 {
        margin: 0;
        color: white;
        font-size: 1.1rem;
      }

      .brand small {
        color: #5eead4;
      }

      .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .nav-item {
        width: 100%;
        border: none;
        background: transparent;
        color: #cbd5e1;
        padding: 12px 14px;
        text-align: left;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .nav-item.active {
        background: var(--primary);
        color: white;
      }

      .sidebar-user {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.12);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .logout-btn {
        border: 1px solid rgba(248,113,113,0.4);
        background: rgba(239,68,68,0.1);
        color: #fecaca;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }

      .main-panel {
        flex: 1;
        padding: 26px;
      }

      .section-header {
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .section-header h2 {
        margin: 0;
        font-size: 1.8rem;
      }

      .section-header p {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .primary-btn, .outline-btn {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
      }

      .primary-btn {
        background: var(--primary);
        color: white;
      }

      .outline-btn {
        background: white;
        color: var(--primary);
        border: 1px solid var(--primary);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }

      .stat-card {
        background: white;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
        border-top: 4px solid var(--primary);
      }

      .stat-card.success { border-top-color: var(--success); }
      .stat-card.danger { border-top-color: var(--danger); }
      .stat-card.warning { border-top-color: var(--warning); }
      .stat-card.info { border-top-color: var(--info); }

      .stat-card span {
        display: block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
      }

      .stat-card strong {
        display: block;
        margin-top: 10px;
        font-size: 1.7rem;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .toolbar input, .toolbar select, .form-grid input, .form-grid select, .form-grid textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: white;
        color: var(--text);
      }

      .table-wrap {
        background: white;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      }

      .table-wrap table {
        width: 100%;
        border-collapse: collapse;
      }

      .table-wrap th, .table-wrap td {
        padding: 12px 14px;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
        vertical-align: middle;
      }

      .table-wrap thead { background: #f8fafc; }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .action-btn {
        padding: 7px 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .edit-btn {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .delete-btn {
        background: #fee2e2;
        color: #991b1b;
      }

      .pay-btn {
        background: #dcfce7;
        color: #166534;
      }

      .badge {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
      }

      .badge-success { background: #dcfce7; color: #166534; }
      .badge-danger { background: #fee2e2; color: #991b1b; }
      .badge-warning { background: #fef3c7; color: #92400e; }
      .badge-info { background: #dbeafe; color: #1d4ed8; }

      .empty-state {
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }

      .login-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
      }

      .login-box {
        width: min(420px, 92vw);
        background: rgba(255,255,255,0.96);
        border-radius: 18px;
        padding: 30px 24px;
        box-shadow: 0 16px 40px rgba(15,23,42,0.25);
      }

      .login-logo {
        width: 68px;
        height: 68px;
        margin: 0 auto 12px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0d9488, #14b8a6);
        color: white;
        font-size: 2rem;
      }

      .login-box h2 {
        margin: 0;
        text-align: center;
        font-size: 1.8rem;
      }

      .login-box p {
        margin: 8px 0 20px;
        color: #64748b;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .login-form label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .login-form input {
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
      }

      .login-form button {
        margin-top: 8px;
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,0.55);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 1000;
      }

      .modal {
        width: min(800px, 92vw);
        background: white;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(15,23,42,0.25);
        overflow: hidden;
      }

      .modal-header {
        padding: 18px 22px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 1.2rem;
      }

      .close-modal {
        border: none;
        background: transparent;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--muted);
      }

      .modal-body {
        padding: 20px 22px 12px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .form-field label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .form-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 16px 22px 22px;
      }

      .chart-card {
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 2px 10px rgba(15,23,42,0.06);
      }

      .alert-box {
        border-left: 4px solid var(--danger);
        background: #fff1f2;
        color: #9f1239;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-weight: 700;
      }

      @media (max-width: 768px) {
        .app-shell { flex-direction: column; }
        .sidebar { width: 100%; }
        .main-panel { padding: 16px; }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script>
      const STORAGE_KEY = 'guardioes_bravo_db_final_v1';

      const DEFAULT_DATA = {
        usuarios: [
          { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', senhaHash: 'Admin@12345' }
        ],

        documentoCategorias: [
          { id: 'doccat_1', nome: 'Atas de Assembleia', descricao: 'Atas e registros das reuniões' },
          { id: 'doccat_2', nome: 'Contratos', descricao: 'Contratos e acordos' },
          { id: 'doccat_3', nome: 'Manutenção', descricao: 'Orçamentos e demandas de manutenção' },
          { id: 'doccat_4', nome: 'Financeiro', descricao: 'Comprovantes e documentos financeiros' }
        ],

        documentos: [
          { id: 'doc_1', titulo: 'Ata da Assembleia 2026', categoriaId: 'doccat_1', arquivoNome: 'ata-assembleia-2026.pdf', mimeType: 'application/pdf', arquivoData: '', data: '2026-03-10', observacao: 'Eleição do síndico' },
          { id: 'doc_2', titulo: 'Contrato de limpeza', categoriaId: 'doccat_2', arquivoNome: 'contrato-limpeza.pdf', mimeType: 'application/pdf', arquivoData: '', data: '2026-04-12', observacao: 'Vigência anual' },
          { id: 'doc_3', titulo: 'Orçamento de pintura', categoriaId: 'doccat_3', arquivoNome: 'orcamento-pintura.pdf', mimeType: 'application/pdf', arquivoData: '', data: '2026-05-02', observacao: 'Bloco B' }
        ],

        financeiro: [
          { id: 'fin_1', tipo: 'Receber', historico: 'Taxa Condominial Ordinária - Ap 101', valorTotal: 2500, valorPago: 1500, vencimento: '2026-10-15', status: 'Parcial', observacao: 'Faltando parcela' },
          { id: 'fin_2', tipo: 'Pagar', historico: 'Manutenção Elevador Otis', valorTotal: 850, valorPago: 850, vencimento: '2026-10-20', status: 'Pago', observacao: 'Pagamento concluído' },
          { id: 'fin_3', tipo: 'Receber', historico: 'Aluguel de espaço comercial', valorTotal: 1800, valorPago: 900, vencimento: '2026-10-18', status: 'Parcial', observacao: 'Saldo pendente' },
          { id: 'fin_4', tipo: 'Pagar', historico: 'Energia elétrica', valorTotal: 640, valorPago: 0, vencimento: '2026-10-25', status: 'Pendente', observacao: 'Aguardando liquidação' }
        ],

        estoque: [
          { id: 'est_1', item: 'Lâmpada LED 12W', categoria: 'Elétrica', qtd: 4, minimo: 10, localizacao: 'Almoxarifado', proximoInventario: '2026-10-29', ultimoInventario: '2026-10-01' },
          { id: 'est_2', item: 'Cloro Granulado 10kg', categoria: 'Piscina', qtd: 15, minimo: 5, localizacao: 'DML', proximoInventario: '2026-10-30', ultimoInventario: '2026-10-05' },
          { id: 'est_3', item: 'Filtro de água', categoria: 'Piscina', qtd: 2, minimo: 4, localizacao: 'DML', proximoInventario: '2026-10-15', ultimoInventario: '2026-10-04' },
          { id: 'est_4', item: 'Parafuso 8x40', categoria: 'Ferragens', qtd: 26, minimo: 12, localizacao: 'Depósito 2', proximoInventario: '2026-11-05', ultimoInventario: '2026-10-02' }
        ],

        moradores: [
          { id: 'mor_1', nome: 'Carlos Eduardo', bloco: 'A', apartamento: '101', tipo: 'Proprietário', cpf: '123.456.789-00', telefone: '(11) 99999-0001', email: 'carlos@email.com', status: 'Ativo', dataEntrada: '2020-01-10', observacao: 'Titular do apartamento' },
          { id: 'mor_2', nome: 'Fernanda Lima', bloco: 'A', apartamento: '102', tipo: 'Inquilino', cpf: '987.654.321-00', telefone: '(11) 98888-0002', email: 'fernanda@email.com', status: 'Ativo', dataEntrada: '2024-02-12', observacao: 'Contrato em vigor' }
        ],

        inquilinos: [
          { id: 'inq_1', nome: 'Fernanda Lima', bloco: 'A', apartamento: '102', cpf: '987.654.321-00', telefone: '(11) 98888-0002', email: 'fernanda@email.com', proprietario: 'Carlos Eduardo', valorAluguel: 2200, dataInicio: '2024-02-12', dataFim: '2025-02-11', status: 'Ativo' }
        ],

        fornecedores: [
          { id: 'for_1', razaoSocial: 'Clean Service Ltda', nomeContato: 'Marcos Silva', cnpj: '12.345.678/0001-99', categoria: 'Limpeza', telefone: '(11) 97777-1234', email: 'contato@cleanservice.com', endereco: 'Rua das Flores, 150', status: 'Ativo', observacao: 'Fornecedor de limpeza' }
        ]
      };

      function loadDb() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : DEFAULT_DATA;
        } catch {
          return DEFAULT_DATA;
        }
      }

      function saveDb() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.db));
        } catch {}
      }

      function generateId(prefix) {
        return prefix + '_' + Date.now() + '_' + Math.random().toString(16).slice(2, 8);
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value || 0));
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function exportCsv(rows, filename) {
        if (!rows.length) return;

        const headers = Object.keys(rows[0]);
        const csv = [
          headers.join(','),
          ...rows.map(row =>
            headers.map(header => `"${String(row[header]).replace(/"/g, '""')}"`).join(',')
          )
        ].join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', filename);
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function getFinanceStatus(item) {
        const total = Number(item.valorTotal || 0);
        const pago = Number(item.valorPago || 0);
        const restante = total - pago;

        if (restante <= 0) return 'Pago';
        if (pago > 0 && restante > 0) return 'Parcial';
        return 'Pendente';
      }

      function getRemaining(item) {
        return Number(item.valorTotal || 0) - Number(item.valorPago || 0);
      }

      function getEstoqueStatus(item) {
        const qtd = Number(item.qtd || 0);
        const minimo = Number(item.minimo || 0);

        if (qtd <= 0) return { text: 'Sem estoque', className: 'badge-danger' };
        if (qtd <= minimo) return { text: 'Baixo', className: 'badge-warning' };
        return { text: 'OK', className: 'badge-success' };
      }

      function getEstoqueAlerts() {
        return state.db.estoque.filter(item => {
          const qtd = Number(item.qtd || 0);
          const min = Number(item.minimo || 0);
          const today = new Date();
          const next = item.proximoInventario ? new Date(item.proximoInventario) : null;
          const withinWeek = next && next <= new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
          return qtd <= 0 || qtd <= min || withinWeek;
        });
      }

      const state = {
        db: loadDb(),
        user: JSON.parse(sessionStorage.getItem('guardioes_user') || 'null'),
        activeTab: 'dashboard',
        modal: null,
        filters: {
          financeiro: { busca: '', status: 'Todos', tipo: 'Todos' },
          estoque: { busca: '', categoria: 'Todas' },
          documentos: { busca: '', categoriaId: 'Todas' },
          moradores: { busca: '', bloco: 'Todos', tipo: 'Todos' },
          usuarios: { busca: '', perfil: 'Todos', status: 'Todos' }
        }
      };

      function renderLogin() {
        return `
          <div class="login-screen">
            <div class="login-box">
              <div class="login-logo"><i class="fa-solid fa-shield-halved"></i></div>
              <h2>Guardiões do Bravo</h2>
              <p>Acesso ao Sistema Condominial</p>
              <form id="loginForm" class="login-form">
                <label>Usuário / E-mail</label>
                <input id="login_user" type="text" value="admin" required />
                <label>Senha</label>
                <input id="login_pass" type="password" value="Admin@12345" required />
                <button type="submit">Entrar no Sistema</button>
              </form>
            </div>
          </div>
        `;
      }

      function renderDashboard() {
        const receitas = state.db.financeiro.filter(item => item.tipo === 'Receber').reduce((sum, item) => sum + Number(item.valorPago || 0), 0);
        const despesas = state.db.financeiro.filter(item => item.tipo === 'Pagar').reduce((sum, item) => sum + Number(item.valorPago || 0), 0);
        const pendentes = state.db.financeiro.filter(item => getFinanceStatus(item) !== 'Pago').length;
        const alertas = getEstoqueAlerts();

        setTimeout(() => {
          const existing = document.getElementById('dashboardChart');
          if (existing) {
            if (window.dashboardChartInstance) window.dashboardChartInstance.destroy();
            window.dashboardChartInstance = new Chart(existing, {
              type: 'bar',
              data: {
                labels: ['Receitas', 'Despesas', 'Pendentes', 'Moradores'],
                datasets: [{
                  label: 'Resumo geral',
                  data: [receitas, despesas, pendentes, state.db.moradores.length],
                  backgroundColor: ['#10b981', '#ef4444', '#f59e0b', '#3b82f6'],
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
              }
            });
          }
        }, 0);

        return `
          <section class="section-header">
            <div>
              <h2>Dashboard</h2>
              <p>Resumo geral da administração</p>
            </div>
            <button class="primary-btn" id="exportDashboardCsv">Exportar CSV</button>
          </section>

          ${alertas.length ? `
            <div class="alert-box">
              <i class="fa-solid fa-triangle-exclamation"></i>
              Há ${alertas.length} itens com atenção no estoque.
            </div>
          ` : ''}

          <div class="stats-grid">
            <div class="stat-card success">
              <span>Receitas líquidas</span>
              <strong>${formatCurrency(receitas)}</strong>
            </div>
            <div class="stat-card danger">
              <span>Despesas pagas</span>
              <strong>${formatCurrency(despesas)}</strong>
            </div>
            <div class="stat-card warning">
              <span>Pendentes</span>
              <strong>${pendentes}</strong>
            </div>
            <div class="stat-card info">
              <span>Moradores</span>
              <strong>${state.db.moradores.length}</strong>
            </div>
          </div>

          <div class="chart-card" style="margin-top: 22px;">
            <canvas id="dashboardChart" height="220"></canvas>
          </div>
        `;
      }

      function getFilteredFinanceiro() {
        const f = state.filters.financeiro;

        return state.db.financeiro.filter(item => {
          const busca = (f.busca || '').toLowerCase();
          const statusAtual = getFinanceStatus(item);
          item.status = statusAtual;

          const buscaMatch = !busca || item.historico.toLowerCase().includes(busca) || item.tipo.toLowerCase().includes(busca);
          const tipoMatch = f.tipo === 'Todos' || item.tipo === f.tipo;
          const statusMatch = f.status === 'Todos' || statusAtual === f.status;
          return buscaMatch && tipoMatch && statusMatch;
        });
      }

      function renderFinanceiro() {
        const itens = getFilteredFinanceiro();
        const tipos = Array.from(new Set(state.db.financeiro.map(x => x.tipo)));
        const statusList = ['Todos', 'Pendente', 'Parcial', 'Pago'];

        return `
          <section class="section-header">
            <div>
              <h2>Financeiro</h2>
              <p>Controle de receitas e despesas</p>
            </div>
            <div class="actions">
              <button class="outline-btn" id="exportFinanceiroCsv">Exportar CSV</button>
              <button class="primary-btn" data-action="add" data-module="financeiro">+ Novo lançamento</button>
            </div>
          </section>

          <div class="toolbar">
            <input id="finBusca" placeholder="Buscar histórico" value="${escapeHtml(state.filters.financeiro.busca)}" />
            <select id="finTipo">
              <option value="Todos" ${state.filters.financeiro.tipo === 'Todos' ? 'selected' : ''}>Todos</option>

      function saveDocumento(mode, id) {
        const titulo = document.getElementById('doc_titulo').value.trim();
        const categoriaId = document.getElementById('doc_categoria').value;
        const data = document.getElementById('doc_data').value;
        const observacao = document.getElementById('doc_observacao').value.trim();
        const fileInput = document.getElementById('doc_file');

        let arquivoNome = '';
        let mimeType = '';
        let arquivoData = '';

        if (fileInput && fileInput.files && fileInput.files[0]) {
          const file = fileInput.files[0];
          arquivoNome = file.name;
          mimeType = file.type;

          const reader = new FileReader();
          reader.onload = function (e) {
            const payload = {
              titulo,
              categoriaId,
              arquivoNome,
              mimeType,
              arquivoData: e.target.result,
              data,
              observacao
            };

            if (mode === 'edit' && id) {
              const idx = state.db.documentos.findIndex(item => item.id === id);
              if (idx >= 0) state.db.documentos[idx] = { ...state.db.documentos[idx], ...payload };
            } else {
              state.db.documentos.unshift({ id: generateId('doc'), ...payload });
            }

            saveDb();
            closeDocumentoModal();
            renderApp();
          };
          reader.readAsDataURL(file);
          return;
        }

        if (!titulo || !categoriaId) {
          alert('Preencha título e categoria.');
          return;
        }

        const payload = {
          titulo,
          categoriaId,
          arquivoNome: (id ? state.db.documentos.find(item => item.id === id)?.arquivoNome : '') || '',
          mimeType: (id ? state.db.documentos.find(item => item.id === id)?.mimeType : '') || '',
          arquivoData: (id ? state.db.documentos.find(item => item.id === id)?.arquivoData : '') || '',
          data,
          observacao
        };

        if (mode === 'edit' && id) {
          const idx = state.db.documentos.findIndex(item => item.id === id);
          if (idx >= 0) state.db.documentos[idx] = { ...state.db.documentos[idx], ...payload };
        } else {
          state.db.documentos.unshift({ id: generateId('doc'), ...payload });
        }

        saveDb();
        closeDocumentoModal();
        renderApp();
      }

        if (!confirm('Deseja excluir este documento?')) return;
        state.db.documentos = state.db.documentos.filter(item => item.id !== id);
        saveDb();
        renderApp();
      }

          documentos: 'Deseja excluir este documento?',

      function attachGlobalEvents() {
        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.dataset.tab;
            renderApp();
          });
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
          state.user = null;
          sessionStorage.removeItem('guardioes_user');
          renderApp();
        });

        document.querySelectorAll('[data-action="add"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const module = btn.dataset.module;
            if (module === 'financeiro') openFinanceiroModal(module, 'add');
            if (module === 'estoque') openEstoqueModal(module, 'add');
          });
        });

        document.querySelectorAll('[data-action="edit"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const module = btn.dataset.module;
            if (module === 'financeiro') openFinanceiroModal(module, 'edit', btn.dataset.id);
            if (module === 'estoque') openEstoqueModal(module, 'edit', btn.dataset.id);
          });
        });

        document.querySelectorAll('[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', () => deleteItem(btn.dataset.module, btn.dataset.id));
        });

        document.querySelectorAll('[data-action="pay"]').forEach(btn => {
          btn.addEventListener('click', () => openPartialPaymentModal(btn.dataset.id));
        });

        document.querySelectorAll('[data-action="add-cadastro"]').forEach(btn => {
          btn.addEventListener('click', () => openCadastroModal(btn.dataset.type, 'add'));
        });

        document.querySelectorAll('[data-action="edit-cadastro"]').forEach(btn => {
          btn.addEventListener('click', () => openCadastroModal(btn.dataset.type, 'edit', btn.dataset.id));
        });

        document.querySelectorAll('[data-action="delete-cadastro"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            const id = btn.dataset.id;

            let msg = 'Deseja excluir este item?';
            if (type === 'morador') msg = 'Deseja excluir este morador?';
            if (type === 'inquilino') msg = 'Deseja excluir este inquilino?';
            if (type === 'fornecedor') msg = 'Deseja excluir este fornecedor?';

            if (!confirm(msg)) return;

            if (type === 'morador') state.db.moradores = state.db.moradores.filter(item => item.id !== id);
            if (type === 'inquilino') state.db.inquilinos = state.db.inquilinos.filter(item => item.id !== id);
            if (type === 'fornecedor') state.db.fornecedores = state.db.fornecedores.filter(item => item.id !== id);

            saveDb();
            renderApp();
          });
        });

        document.querySelectorAll('[data-action="add-documento"]').forEach(btn => {
          btn.addEventListener('click', () => openDocumentoModal('add'));
        });

        document.querySelectorAll('[data-action="edit-documento"]').forEach(btn => {
          btn.addEventListener('click', () => openDocumentoModal('edit', btn.dataset.id));
        });

        document.querySelectorAll('[data-action="delete-documento"]').forEach(btn => {
          btn.addEventListener('click', () => deleteDocumento(btn.dataset.id));
        });

        document.querySelectorAll('[data-action="add-categoria-doc"]').forEach(btn => {
          btn.addEventListener('click', () => openCategoriaDocumentoModal('add'));
        });

        document.querySelectorAll('[data-action="edit-categoria-doc"]').forEach(btn => {
          btn.addEventListener('click', () => openCategoriaDocumentoModal('edit', btn.dataset.id));
        });

        document.querySelectorAll('[data-action="delete-categoria-doc"]').forEach(btn => {
          btn.addEventListener('click', () => deleteCategoriaDocumento(btn.dataset.id));
        });

        document.getElementById('exportDashboardCsv')?.addEventListener('click', () => {
          exportCsv([
            { categoria: 'Receitas', valor: state.db.financeiro.filter(i => i.tipo === 'Receber').reduce((s, v) => s + Number(v.valorPago || 0), 0) },
            { categoria: 'Despesas', valor: state.db.financeiro.filter(i => i.tipo === 'Pagar').reduce((s, v) => s + Number(v.valorPago || 0), 0) },
            { categoria: 'Pendentes', valor: state.db.financeiro.filter(i => getFinanceStatus(i) !== 'Pago').length },
            { categoria: 'Moradores', valor: state.db.moradores.length }
          ], 'dashboard.csv');
        });

        document.getElementById('exportFinanceiroCsv')?.addEventListener('click', () => {
          const payload = getFilteredFinanceiro().map(item => ({
            tipo: item.tipo,
            historico: item.historico,
            valorTotal: item.valorTotal,
            valorPago: item.valorPago,
            restante: getRemaining(item),
            vencimento: item.vencimento,
            status: getFinanceStatus(item)
          }));
          exportCsv(payload, 'financeiro.csv');
        });

        document.getElementById('exportEstoqueCsv')?.addEventListener('click', () => {
          exportCsv(getFilteredEstoque(), 'estoque.csv');
        });

        document.getElementById('exportDocumentosCsv')?.addEventListener('click', () => {
          exportCsv(getFilteredDocumentos(), 'documentos.csv');
        });

        if (state.activeTab === 'financeiro') {
          const finBusca = document.getElementById('finBusca');
          const finTipo = document.getElementById('finTipo');
          const finStatus = document.getElementById('finStatus');

          finBusca?.addEventListener('input', (e) => {
            state.filters.financeiro.busca = e.target.value;
            renderApp();
          });

          finTipo?.addEventListener('change', (e) => {
            state.filters.financeiro.tipo = e.target.value;
            renderApp();
          });

          finStatus?.addEventListener('change', (e) => {
            state.filters.financeiro.status = e.target.value;
            renderApp();
          });
        }

        if (state.activeTab === 'estoque') {
          const estBusca = document.getElementById('estBusca');
          const estCategoria = document.getElementById('estCategoria');

          estBusca?.addEventListener('input', (e) => {
            state.filters.estoque.busca = e.target.value;
            renderApp();
          });

          estCategoria?.addEventListener('change', (e) => {
            state.filters.estoque.categoria = e.target.value;
            renderApp();
          });
        }

        if (state.activeTab === 'documentos') {
          const docBusca = document.getElementById('docBusca');
          const docCategoriaFiltro = document.getElementById('docCategoriaFiltro');

          docBusca?.addEventListener('input', (e) => {
            state.filters.documentos.busca = e.target.value;
            renderApp();
          });

          docCategoriaFiltro?.addEventListener('change', (e) => {
            state.filters.documentos.categoriaId = e.target.value;
            renderApp();
          });
        }
      }

      function renderApp() {
        const root = document.getElementById('app');

        if (!state.user) {
          root.innerHTML = renderLogin();
          document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const loginUser = document.getElementById('login_user').value.trim();
            const loginPass = document.getElementById('login_pass').value;

            const found = state.db.usuarios.find(user =>
              (user.usuario === loginUser || user.email === loginUser) &&
              user.senhaHash === loginPass
            );

            if (found) {
              state.user = found;
              sessionStorage.setItem('guardioes_user', JSON.stringify(found));
              renderApp();
            } else {
              alert('Credenciais inválidas!');
            }
          });
          return;
        }

        root.innerHTML = `
          <div class="app-shell">
            <aside class="sidebar">
              <div class="brand">
                <div class="brand-mark"><i class="fa-solid fa-shield-halved"></i></div>
                <div>
                  <h1>Guardiões</h1>
                  <small>Gestão</small>
                </div>
              </div>

              <nav class="nav-menu">
                <button class="nav-item ${state.activeTab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">
                  <i class="fa-solid fa-gauge-high"></i> Dashboard
                </button>

                <button class="nav-item ${state.activeTab === 'financeiro' ? 'active' : ''}" data-tab="financeiro">
                  <i class="fa-solid fa-wallet"></i> Financeiro
                </button>

                <button class="nav-item ${state.activeTab === 'estoque' ? 'active' : ''}" data-tab="estoque">
                  <i class="fa-solid fa-boxes-stacked"></i> Estoque
                </button>

                <button class="nav-item ${state.activeTab === 'documentos' ? 'active' : ''}" data-tab="documentos">
                  <i class="fa-solid fa-folder-open"></i> Documentos
                </button>

                <button class="nav-item ${state.activeTab === 'cadastros' ? 'active' : ''}" data-tab="cadastros">
                  <i class="fa-solid fa-address-card"></i> Cadastros
                </button>
              </nav>

              <div class="sidebar-user">
                <span>${escapeHtml(state.user.nome)}</span>
                <button id="logoutBtn" class="logout-btn">Sair</button>
              </div>
            </aside>

            <main class="main-panel">
              <div id="content">${renderContent()}</div>
            </main>
          </div>
        `;

        attachGlobalEvents();
      }

      renderApp();
    </script>
  </body>
</html>
