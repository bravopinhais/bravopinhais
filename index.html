        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function compactarArquivoParaGzip(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const compressed = pako.deflate(uint8Array);
                    let binary = '';
                    const len = compressed.byteLength;
                    for (let i = 0; i < len; i++) { binary += String.fromCharCode(compressed[i]); }
                    callback(btoa(binary), file.name);
                } catch (err) { alert('Erro ao compactar ficheiro.'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function extrairEDownloadArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                const blob = new Blob([decompressed]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nomeOriginal;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
            } catch (err) { alert('Erro ao extrair ficheiro.'); }
        }

        function visualizarArquivo(base64Gzip, nomeOriginal) {
            try {
                const binaryString = atob(base64Gzip);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
                const decompressed = pako.inflate(bytes);
                
                let mimeType = 'application/octet-stream';
                const ext = nomeOriginal.split('.').pop().toLowerCase();
                if (ext === 'pdf') mimeType = 'application/pdf';
                else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) mimeType = `image/${ext === 'jpg' ? 'jpeg' : ext}`;
                else if (ext === 'txt') mimeType = 'text/plain';

                const blob = new Blob([decompressed], { type: mimeType });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            } catch (err) { alert('Erro ao visualizar o ficheiro.'); }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) { alert('Não há dados disponíveis.'); return; }
            const sanitizeData = dados.map(item => { let obj = { ...item }; delete obj.arquivoCompactadoGzip; delete obj.fotoCompactadaGzip; return obj; });
            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(',') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`);
                csvContent += values.join(',') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = nomeArquivo;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function importarPlanilhaMoradores(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const texto = e.target.result;
                    const linhas = texto.split(/\r\n|\n/);
                    if (linhas.length < 2) { alert('A planilha parece estar vazia.'); return; }

                    const cabecalho = linhas[0].split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim().toLowerCase());
                    
                    const idxBloco = cabecalho.findIndex(h => h.includes('bloco') || h.includes('bl'));
                    const idxAp = cabecalho.findIndex(h => h.includes('ap') || h.includes('unidade') || h.includes('casa'));
                    const idxNome = cabecalho.findIndex(h => h.includes('nome') || h.includes('morador') || h.includes('proprietario'));
                    const idxEmail = cabecalho.findIndex(h => h.includes('email') || h.includes('e-mail'));
                    const idxTel = cabecalho.findIndex(h => h.includes('tel') || h.includes('cel') || h.includes('whatsapp') || h.includes('fone'));
                    const idxCpf = cabecalho.findIndex(h => h.includes('cpf') || h.includes('documento') || h.includes('rg'));
                    const idxPet = cabecalho.findIndex(h => h.includes('pet') || h.includes('animal'));
                    const idxVaga = cabecalho.findIndex(h => h.includes('vaga') || h.includes('estacionamento') || h.includes('garagem'));

                    let importados = 0;
                    if (!db.moradores) db.moradores = [];

                    for (let i = 1; i < linhas.length; i++) {
                        const linha = linhas[i].trim();
                        if (!linha) continue;
                        const cols = linha.split(/,|;/).map(c => c.replace(/^["']|["']$/g, '').trim());
                        
                        db.moradores.push({
                            id: 'mor_imp_' + Date.now() + '_' + i,
                            bloco: idxBloco !== -1 ? (cols[idxBloco] || '1') : (cols[0] || '1'),
                            apartamento: idxAp !== -1 ? (cols[idxAp] || '') : (cols[1] || ''),
                            nome: idxNome !== -1 ? (cols[idxNome] || 'Sem Nome') : (cols[2] || 'Sem Nome'),
                            email: idxEmail !== -1 ? (cols[idxEmail] || '') : '',
                            telefone: idxTel !== -1 ? (cols[idxTel] || '') : '',
                            cpf: idxCpf !== -1 ? (cols[idxCpf] || '') : '',
                            petNome: idxPet !== -1 ? (cols[idxPet] || '') : '',
                            vagaGaragem: idxVaga !== -1 ? (cols[idxVaga] || '') : ''
                        });
                        importados++;
                    }

                    if (importados > 0) {
                        salvarDados(db);
                        alert(`${importados} moradores importados com sucesso para a nuvem!`);
                        renderMainOnly();
                    } else {
                        alert('Nenhum morador válido encontrado na planilha.');
                    }
                } catch (err) {
                    alert('Erro ao processar o arquivo CSV.');
                }
            };

            const inputPass = document.getElementById('login_pass');
            const iconEye = document.getElementById('icon-eye');
            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                iconEye.classList.remove('fa-eye');
                iconEye.classList.add('fa-eye-slash');
            } else {
                inputPass.type = 'password';
                iconEye.classList.remove('fa-eye-slash');
                iconEye.classList.add('fa-eye');
            }
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim().toLowerCase();
            const senhaInput = document.getElementById('login_pass').value;
            const lembrarChecked = document.getElementById('login_lembrar')?.checked;

            if (lembrarChecked) {
                localStorage.setItem('guardioes_lembrar_user', userInput);
            } else {
                localStorage.removeItem('guardioes_lembrar_user');
            }
            
            const userFound = (db.usuarios || []).find(u => 
                (u.usuario && u.usuario.toLowerCase() === userInput) || 
                (u.email && u.email.toLowerCase() === userInput)
            );

            if (userFound && userFound.senhaHash === senhaInput) {
                if (userFound.status === 'Inativo') { alert('Utilizador inativo.'); return; }
                
                if (userFound.primeiroAcesso) {
                    usuarioPendentePrimeiroAcesso = userFound;
                    renderApp();
                    return;
                }

                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                renderApp();
            } else { alert('Credenciais incorretas! Verifique o utilizador/e-mail e a palavra-passe.'); }
        }

        function concluirPrimeiroAcesso(e) {
            e.preventDefault();
            const s1 = document.getElementById('prim_senha_nova').value;
            const s2 = document.getElementById('prim_senha_conf').value;

            if (s1.length < 6) { alert('A palavra-passe deve ter pelo menos 6 caracteres.'); return; }
            if (s1 !== s2) { alert('As palavras-passe não coincidem.'); return; }

            const userIndex = (db.usuarios || []).findIndex(u => u.id === usuarioPendentePrimeiroAcesso.id);
            if (userIndex !== -1) {
                db.usuarios[userIndex].senhaHash = s1;
                db.usuarios[userIndex].primeiroAcesso = false;
                salvarDados(db);

                sessao.usuarioLogado = db.usuarios[userIndex];
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(sessao.usuarioLogado)); } catch (err) {}
                
                usuarioPendentePrimeiroAcesso = null;
                alert('Palavra-passe alterada com sucesso! Bem-vindo(a) ao sistema.');
                renderApp();
            }
        }

        function initDashboardCharts() {
            const ctx1 = document.getElementById('chartReceitaDespesa');
            if (ctx1) {
                const rec = (db.financeiro || []).filter(f => f.tipo === 'Receita').reduce((a, b) => a + Number(b.valor || 0), 0);
                const desp = (db.financeiro || []).filter(f => f.tipo === 'Despesa').reduce((a, b) => a + Number(b.valor || 0), 0);

                chartInstanceReceitaDespesa = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['Receitas Total', 'Despesas Total'],
                        datasets: [{
                            label: 'Valor (R$)',
                            data: [rec, desp],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            const ctx2 = document.getElementById('chartOcupacao');
            if (ctx2) {
                const blocos = {};
                (db.moradores || []).forEach(m => {
                    const b = m.bloco || 'Indefinido';
                    blocos[b] = (blocos[b] || 0) + 1;
                });

                chartInstanceOcupacao = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(blocos).length > 0 ? Object.keys(blocos) : ['Sem dados'],
                        datasets: [{
                            data: Object.values(blocos).length > 0 ? Object.values(blocos) : [1],
                            backgroundColor: ['#0d9488', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

                        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead class="bg-slate-50 border-b border-slate-200 font-extrabold text-slate-500 uppercase">
                                    <tr>
                                        <th class="p-3.5">Item</th>
                                        <th class="p-3.5">Categoria</th>
                                        <th class="p-3.5">Qtd</th>
                                        <th class="p-3.5 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 font-semibold">
                                    ${lista.map(item => `
                                        <tr class="hover:bg-slate-50/80 transition-colors">
                                            <td class="p-3.5 font-bold text-slate-900">${escapeHTML(item.nome)}</td>
                                            <td class="p-3.5">${escapeHTML(item.categoria || 'Geral')}</td>
                                            <td class="p-3.5 font-extrabold text-teal-600">${item.quantidade}</td>
                                            <td class="p-3.5 text-right">
                                                <button onclick="removerItemEstoque('${item.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                    ${lista.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-slate-400 font-bold">Nenhum item em estoque.</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <h4 class="text-xs font-extrabold uppercase text-slate-400 tracking-wider mb-3">Capacidade de Inventário</h4>
                            <div class="relative h-48">
                                <canvas id="chartEstoqueCanvas"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function initEstoqueChart() {
            const ctx = document.getElementById('chartEstoqueCanvas');
            if (!ctx) return;
            const labels = (db.estoque || []).map(i => i.nome);
            const data = (db.estoque || []).map(i => i.quantidade);

            chartInstanceEstoque = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels.length > 0 ? labels : ['Vazio'],
                    datasets: [{
                        data: data.length > 0 ? data : [1],
                        backgroundColor: ['#0d9488', '#14b8a6', '#2dd4bf', '#5eead4', '#99f6e4']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function abrirModalNovoItemEstoque() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl border border-slate-100">
                        <h3 class="text-base font-black text-slate-900 border-b border-slate-100 pb-3">Adicionar Item ao Estoque</h3>
                        <form onsubmit="salvarNovoItemEstoque(event)" class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-1">Nome do Item</label>
                                <input type="text" id="est_nome" required class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Categoria</label>
                                    <input type="text" id="est_cat" placeholder="Limpeza, Eletrica..." class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-1">Quantidade</label>
                                    <input type="number" id="est_qtd" required min="0" value="1" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white outline-none">
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" onclick="fecharModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl">Salvar Item</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            setTimeout(restaurarFormulariosEmTempoReal, 50);
        }

        function salvarNovoItemEstoque(e) {
            e.preventDefault();
            if (!db.estoque) db.estoque = [];
            db.estoque.push({
                id: 'est_' + Date.now(),
                nome: document.getElementById('est_nome').value,
                categoria: document.getElementById('est_cat').value,
                quantidade: parseInt(document.getElementById('est_qtd').value || 0)
            });
            salvarDados(db);
            limparRascunhosFormulario();
            fecharModal();
            renderMainOnly();
        }

        function removerItemEstoque(id) {
            if (confirm('Remover este item do estoque?')) {
                db.estoque = db.estoque.filter(i => i.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        function renderAcertoEstoqueModule() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-base font-black text-slate-900">Acerto & Reajuste de Inventário</h3>
                    <p class="text-xs text-slate-500 font-semibold">Registro de baixas por avaria, uso interno ou perdas físicas.</p>
                </div>
            `;
        }

        function renderFornecedoresModule() {
            const lista = db.fornecedores || [];
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
                        <h3 class="text-sm font-black text-slate-900">Lista de Fornecedores</h3>
                        <button onclick="abrirModalNovoFornecedor()" class="px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-md shadow-teal-600/20 flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> Novo Fornecedor
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-50 border-b border-slate-200 font-extrabold text-slate-500 uppercase">
                                <tr>
                                    <th class="p-3.5">Razão / Nome</th>
                                    <th class="p-3.5">CNPJ / CPF</th>
                                    <th class="p-3.5">Contato</th>
                                    <th class="p-3.5 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 font-semibold">
                                ${lista.map(f => `
                                    <tr class="hover:bg-slate-50/80 transition-colors">
                                        <td class="p-3.5 font-bold text-slate-900">${escapeHTML(f.nome)}</td>
                                        <td class="p-3.5">${escapeHTML(f.doc || '-')}</td>
                                        <td class="p-3.5">${escapeHTML(f.telefone || '-')}</td>
                                        <td class="p-3.5 text-right">
                                            <button onclick="removerFornecedor('${f.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                                ${lista.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-slate-400 font-bold">Nenhum fornecedor registrado.</td></tr>` : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function abrirModalNovoFornecedor() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl border border-slate-100">
                        <h3 class="text-base font-black text-slate-900 border-b border-slate-100 pb-3">Novo Fornecedor</h3>
                        <form onsubmit="salvarNovoFornecedor(event)" class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-1">Nome / Razão Social</label>
                                <input type="text" id="for_nome" required class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-1">CNPJ / CPF</label>
                                <input type="text" id="for_doc" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-1">Telefone / E-mail</label>
                                <input type="text" id="for_tel" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white outline-none">
                            </div>
                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button" onclick="fecharModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl">Salvar Fornecedor</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            setTimeout(restaurarFormulariosEmTempoReal, 50);
        }

        function salvarNovoFornecedor(e) {
            e.preventDefault();
            if (!db.fornecedores) db.fornecedores = [];
            db.fornecedores.push({
                id: 'for_' + Date.now(),
                nome: document.getElementById('for_nome').value,
                doc: document.getElementById('for_doc').value,
                telefone: document.getElementById('for_tel').value
            });
            salvarDados(db);
            limparRascunhosFormulario();
            fecharModal();
            renderMainOnly();
        }

        function removerFornecedor(id) {
            if (confirm('Excluir este fornecedor?')) {
                db.fornecedores = db.fornecedores.filter(f => f.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        function renderEmpregadosModule() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-base font-black text-slate-900">Quadro de Empregados & Funcionários</h3>
                    <p class="text-xs text-slate-500 font-semibold">Registro de zeladores, portaria e equipe operacional.</p>
                </div>
            `;
        }

        function renderDocumentosModule() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-base font-black text-slate-900">Gestão de Documentos em Nuvem</h3>
                    <p class="text-xs text-slate-500 font-semibold">Atas de assembleia, regulamento interno e contratos compactados.</p>
                </div>
            `;
        }

        function renderRelatoriosModule() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 class="text-base font-black text-slate-900">Central de Relatórios Executivos & DRE</h3>
                        <button onclick="exportarParaPDF()" class="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-print mr-1"></i> Imprimir / Gerar PDF
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 font-semibold">Demonstrativo do Resultado do Exercício e Balancete Consolidado.</p>
                </div>
            `;
        }

        function renderUsuariosModule() {
            const lista = db.usuarios || [];
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200">
                        <h3 class="text-sm font-black text-slate-900">Utilizadores do Sistema</h3>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-50 border-b border-slate-200 font-extrabold text-slate-500 uppercase">
                                <tr>
                                    <th class="p-3.5">Utilizador</th>
                                    <th class="p-3.5">Nome</th>
                                    <th class="p-3.5">E-mail</th>
                                    <th class="p-3.5">Perfil</th>
                                    <th class="p-3.5">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 font-semibold">
                                ${lista.map(u => `
                                    <tr class="hover:bg-slate-50/80 transition-colors">
                                        <td class="p-3.5 font-bold text-slate-900">${escapeHTML(u.usuario)}</td>
                                        <td class="p-3.5">${escapeHTML(u.nome)}</td>
                                        <td class="p-3.5">${escapeHTML(u.email)}</td>
                                        <td class="p-3.5 font-bold text-teal-700">${escapeHTML(u.perfil)}</td>
                                        <td class="p-3.5">
                                            <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${u.status==='Ativo'?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}">
                                                ${u.status}
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function fecharModal() {
            const modal = document.getElementById('modal-container');
            if (modal) modal.innerHTML = '';
        }

        // Evento de Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosDaNuvem();
        });
    </script>
</body>
</html>
