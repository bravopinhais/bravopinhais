    <!-- MAIN SYSTEM SCRIPT -->
    <script>
        // ==========================================
        // 1. SEGURANÇA E SANITIZAÇÃO (XSS SAFE)
        // ==========================================
        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Complexidade de Senha: 8+ chars, minúscula, maiúscula, número, especial
        function validarSenhaForte(senha) {
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&*!_\-]).{8,}$/;
            return regex.test(senha);
        }

        // Compresor de imagens base64 via Canvas (Otimização localStorage)
        function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(base64Str);
            });
        }

        // ==========================================
        // 2. ESTADO GLOBAL E BANCO LOCALSTORAGE
        // ==========================================
        const DEFAULT_DATA = {
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345', foto: '' },
                { id: 'usr_auditor', usuario: 'auditor', nome: 'Auditor de Segurança', email: 'auditor@guardioes.com', perfil: 'Leitura', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Auditor@12345', foto: '' }
            ],
            financeiro: [
                { id: 'fin_1', tipo: 'Receber', historico: 'Taxa Condominial Ordinária - Ap 101', valor: 650.00, vencimento: '2026-11-10', competencia: '11/2026', categoria: '1.1 Taxa Condominial', fornecedor: 'Carlos Eduardo', status: 'Aberto', saldoRestante: 650.00 },
                { id: 'fin_2', tipo: 'Pagar', historico: 'Manutenção Preventiva Elevadores', valor: 1200.00, vencimento: '2026-11-05', competencia: '11/2026', categoria: '2.3 Manutenção Predial', fornecedor: 'Otis Elevadores', status: 'Aberto', saldoRestante: 1200.00 }
            ],
            moradores: [
                { id: 'mor_1', bloco: 'A', apartamento: '101', nome: 'Carlos Eduardo', email: 'carlos@email.com', telefone: '(41) 99999-1111', tipo: 'Proprietário', status: 'Ativo' },
                { id: 'mor_2', bloco: 'B', apartamento: '304', nome: 'Mariana Silva', email: 'mariana@email.com', telefone: '(41) 98888-2222', tipo: 'Inquilino', status: 'Ativo' }
            ],
            fornecedores: [
                { id: 'for_1', nome: 'Otis Elevadores', cnpj: '12.345.678/0001-90', telefone: '(41) 3333-4444', servico: 'Elevadores', status: 'Ativo' },
                { id: 'for_2', nome: 'Copel Energia', cnpj: '00.360.305/0001-04', telefone: '0800 51 00 116', servico: 'Energia Elétrica', status: 'Ativo' }
            ],
            estoque: [
                { id: 'est_1', item: 'Lâmpada LED 12W', categoria: 'Elétrica', qtd: 24, minimo: 5, localizacao: 'Almoxarifado Central' },
                { id: 'est_2', item: 'Cloro Granulado 10kg', categoria: 'Piscina', qtd: 2, minimo: 3, localizacao: 'DML Piscina' }
            ],
            patrimonio: [
                { id: 'pat_1', codigo: 'PAT-001', item: 'Cortador de Grama Elétrico', local: 'Jardim', valor: 1850.00, estado: 'Ótimo' }
            ],
            logs: []
        };

        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                return data ? JSON.parse(data) : DEFAULT_DATA;
            } catch (e) {
                console.error('Erro ao carregar do localStorage:', e);
                return DEFAULT_DATA;
            }
        }

        function salvarDados(db) {
            try {
                localStorage.setItem('guardioes_bravo_db', JSON.stringify(db));
            } catch (e) {
                alert('Atenção: Limite de armazenamento local excedido!');
            }
        }

        let db = carregarDados();

        // Estado da Sessão Ativa
        let sessao = {
            usuarioLogado: JSON.parse(sessionStorage.getItem('guardioes_sessao')) || null,
            tentativasFalhas: 0,
            bloqueadoAte: null,
            timerInatividade: null
        };

        // Estado do Sistema de Abas
        let tabsState = {
            openTabs: ['dashboard'], // IDs dos módulos abertos
            activeTab: 'dashboard'
        };

        // Dicionário de Títulos de Módulos
        const MODULE_NAMES = {
            dashboard: 'Dashboard',
            financeiro: 'Contas Pagar/Receber',
            plano_contas: 'Plano de Contas',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores / Unidades',
            fornecedores: 'Fornecedores',
            estoque: 'Estoque de Produtos',
            patrimonio: 'Patrimônio / Bens',
            documentos: 'Documentos & Comprovantes',
            usuarios: 'Gestão de Usuários',
            audit_log: 'Log de Auditoria'
        };

        // Registrar Ação no Log de Auditoria
        function registrarLog(modulo, acao, detalhe) {
            const user = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            const logItem = {
                id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                dataHora: new Date().toLocaleString('pt-BR'),
                modulo: modulo,
                acao: acao,
                usuario: user,
                detalhe: detalhe
            };
            db.logs.unshift(logItem);
            if (db.logs.length > 500) db.logs.pop(); // Mantém últimos 500 logs
            salvarDados(db);
        }

        // ==========================================
        // 3. NAVEGAÇÃO DE ABAS & MODULOS
        // ==========================================
        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) {
                tabsState.openTabs.push(moduloId);
            }
            tabsState.activeTab = moduloId;
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return; // Mantém pelo menos uma aba aberta

            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) {
                tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            }
            renderApp();
        }

        // ==========================================
        // 4. AUTENTICAÇÃO E TROCA DE SENHA
        // ==========================================
        function realizarLogin(e) {
            e.preventDefault();
            const now = Date.now();
            if (sessao.bloqueadoAte && now < sessao.bloqueadoAte) {
                const resta = Math.ceil((sessao.bloqueadoAte - now) / 1000);
                alert(`Sistema temporariamente bloqueado por segurança. Tente novamente em ${resta} segundos.`);
                return;
            }

            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const lembrar = document.getElementById('login_remember').checked;

            const userFound = db.usuarios.find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                if (userFound.status !== 'Ativo') {
                    alert('Utilizador inativo. Contacte o administrador do sistema.');
                    return;
                }

                sessao.tentativasFalhas = 0;
                sessao.usuarioLogado = userFound;
                sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound));

                if (lembrar) {
                    localStorage.setItem('guardioes_remember_user', userInput);
                } else {
                    localStorage.removeItem('guardioes_remember_user');
                }

                registrarLog('Segurança', 'Login Sucesso', `Usuário ${userFound.usuario} efetuou login.`);

                if (userFound.primeiroAcesso) {
                    renderModalTrocaSenhaObrigatoria();
                } else {
                    iniciarMonitorInatividade();
                    renderApp();
                }
            } else {
                sessao.tentativasFalhas++;
                registrarLog('Segurança', 'Tentativa Inválida', `Tentativa de login falhada para: ${userInput}`);
                if (sessao.tentativasFalhas >= 5) {
                    sessao.bloqueadoAte = Date.now() + (5 * 60 * 1000); // 5 min lockout
                    alert('Bloqueio de Segurança: 5 tentativas incorretas. Tente novamente em 5 minutos.');
                } else {
                    alert(`Credenciais incorretas! Tentativa ${sessao.tentativasFalhas} de 5.`);
                }
            }
        }

        function encerrarSessao() {
            if (sessao.usuarioLogado) {
                registrarLog('Segurança', 'Logout', `Usuário ${sessao.usuarioLogado.usuario} encerrou a sessão.`);
            }
            sessao.usuarioLogado = null;
            sessionStorage.removeItem('guardioes_sessao');
            if (sessao.timerInatividade) clearTimeout(sessao.timerInatividade);
            renderApp();
        }

        function iniciarMonitorInatividade() {
            if (sessao.timerInatividade) clearTimeout(sessao.timerInatividade);
            const resetTimer = () => {
                if (!sessao.usuarioLogado) return;
                clearTimeout(sessao.timerInatividade);
                sessao.timerInatividade = setTimeout(() => {
                    alert('Sessão encerrada por inatividade (15 minutos).');
                    encerrarSessao();
                }, 15 * 60 * 1000); // 15 minutos
            };

            window.onload = resetTimer;
            document.onmousemove = resetTimer;
            document.onkeypress = resetTimer;
            document.onclick = resetTimer;
            document.ontouchstart = resetTimer;
        }

        // ==========================================
        // 5. COMPONENTES E INTERFACE
        // ==========================================

        // Renderizador Global
        function renderApp() {
            const container = document.getElementById('app');

            if (!sessao.usuarioLogado) {
                container.innerHTML = renderTelaLogin();
                const savedUser = localStorage.getItem('guardioes_remember_user');
                if (savedUser) {
                    document.getElementById('login_user').value = savedUser;
                    document.getElementById('login_remember').checked = true;
                }
                return;
            }

            container.innerHTML = `

                            </div>

                        <!-- NAV ITEMS -->
                        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos Principais</p>
                            <button onclick="abrirModulo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
                            </button>

                            <p class="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Financeiro</p>
                            <button onclick="abrirModulo('financeiro')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'financeiro' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-receipt w-5 text-center"></i> Contas Pagar/Receber
                            </button>
                            <button onclick="abrirModulo('plano_contas')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'plano_contas' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-sitemap w-5 text-center"></i> Plano de Contas
                            </button>
                            <button onclick="abrirModulo('contas_bancarias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'contas_bancarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-building-columns w-5 text-center"></i> Contas Bancárias / Caixa
                            </button>

                            <p class="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Gestão & Operação</p>
                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-users w-5 text-center"></i> Moradores / Unidades
                            </button>
                            <button onclick="abrirModulo('fornecedores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'fornecedores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-truck-field w-5 text-center"></i> Fornecedores
                            </button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Estoque de Produtos
                            </button>
                            <button onclick="abrirModulo('patrimonio')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'patrimonio' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-couch w-5 text-center"></i> Patrimônio / Bens
                            </button>
                            <button onclick="abrirModulo('documentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'documentos' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-folder-open w-5 text-center"></i> Documentos & Anexos
                            </button>

                            <p class="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Administração</p>
                            <button onclick="abrirModulo('usuarios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'usuarios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-user-shield w-5 text-center"></i> Gestão de Usuários
                            </button>
                            <button onclick="abrirModulo('audit_log')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${tabsState.activeTab === 'audit_log' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}">
                                <i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Rastreio & Auditoria
                            </button>
                        </nav>

                        <!-- USER FOOTER -->
                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-teal-400 font-bold border border-slate-700">
                                    ${sessao.usuarioLogado.usuario.substr(0,2).toUpperCase()}
                                </div>
                                <div class="truncate">
                                    <p class="text-xs font-semibold text-slate-200 truncate">${escapeHTML(sessao.usuarioLogado.nome)}</p>
                                    <p class="text-[10px] text-teal-400 capitalize">${escapeHTML(sessao.usuarioLogado.perfil)}</p>
                                </div>
                            </div>
                            <button onclick="encerrarSessao()" title="Sair do Sistema" class="p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800 transition">

                            </button>
                        </div>
                    </aside>

                    <!-- MAIN CONTENT AREA -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <!-- TOP HEADER MOBILE -->
                        <header class="bg-slate-900 text-white p-3 flex md:hidden items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleMobileSidebar()" class="p-2 rounded-lg bg-slate-800 text-slate-200">
                                    <i class="fa-solid fa-bars text-lg"></i>
                                </button>
                                <span class="font-bold text-sm">Guardiões do Bravo</span>
                            </div>
                            <button onclick="encerrarSessao()" class="text-xs bg-red-600/20 text-red-400 px-2.5 py-1.5 rounded-md">
                                <i class="fa-solid fa-power-off"></i> Sair
                            </button>
                        </header>

                        <!-- MULTI-TAB NAVIGATION BAR -->
                        <div class="bg-slate-200 border-b border-slate-300 flex items-center overflow-x-auto px-2 pt-2 gap-1 scrollbar-none">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer transition select-none ${tabsState.activeTab === tabId ? 'tab-active shadow-sm' : 'bg-slate-300 text-slate-600 hover:bg-slate-300/80'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `
                                        <button onclick="fecharAba(event, '${tabId}')" class="text-slate-400 hover:text-red-600 rounded-full w-4 h-4 flex items-center justify-center">
                                            <i class="fa-solid fa-xmark text-[10px]"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <!-- MODULE CONTENT BODY -->
                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        // Renderizador de Módulos Específicos
        function renderModuleContent(moduloId) {
            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2>
                        <p class="text-xs text-slate-500">Módulo de Gestão Ativo</p>
                    </div>

                        </button>

            `;

            }
        }

        // ==========================================
        // 6. TELA DE LOGIN
        // ==========================================
        function renderTelaLogin() {
            return `
                <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
                        <div class="p-8 text-center bg-slate-950 text-white relative">
                            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-3xl">
                                <i class="fa-solid fa-shield-halved text-white"></i>
                            </div>
                            <h2 class="text-2xl font-bold">Guardiões do Bravo</h2>

        function toggleVisibilidadeSenha(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.remove('fa-eye');
                eye.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                eye.classList.remove('fa-eye-slash');
                eye.classList.add('fa-eye');
            }
        }

        function salvarUsuarioForm(e, userId) {
            e.preventDefault();
            const login = document.getElementById('usr_login').value.trim();
            const nome = document.getElementById('usr_nome').value.trim();
            const email = document.getElementById('usr_email').value.trim();
            const perfil = document.getElementById('usr_perfil').value;

            if (userId) {
                const u = db.usuarios.find(x => x.id === userId);
                if (u) {
                    u.nome = nome;
                    u.email = email;
                    u.perfil = perfil;
                    registrarLog('Usuários', 'Edição', `Usuário ${u.usuario} atualizado.`);
                }
            } else {
                const senha = document.getElementById('usr_senha').value;
                if (!validarSenhaForte(senha)) {
                    alert('A senha deve ter no mínimo 8 caracteres, incluindo letras maiúsculas, minúsculas, números e caracteres especiais!');
                    return;
                }
                const novo = {
                    id: 'usr_' + Date.now(),
                    usuario: login,
                    nome: nome,
                    email: email,
                    perfil: perfil,
                    status: 'Ativo',
                    primeiroAcesso: true,
                    senhaHash: senha,
                    foto: ''
                };
                db.usuarios.push(novo);
                registrarLog('Usuários', 'Criação', `Usuário ${login} criado no sistema.`);
            }

            salvarDados(db);
            fecharModal('modal_usr');
            renderApp();
        }

        function toggleStatusUsuario(userId) {
            const u = db.usuarios.find(x => x.id === userId);
            if (u) {
                if (u.id === sessao.usuarioLogado.id) {
                    alert('Não é possível inativar o próprio usuário conectado.');
                    return;
                }
                u.status = u.status === 'Ativo' ? 'Inativo' : 'Ativo';
                registrarLog('Usuários', 'Status Alterado', `Usuário ${u.usuario} alterado para ${u.status}`);
                salvarDados(db);
                renderApp();
            }
        }

        function excluirUsuario(userId) {
            const u = db.usuarios.find(x => x.id === userId);
            if (u) {
                if (u.id === sessao.usuarioLogado.id) {
                    alert('Não é possível excluir seu próprio usuário logado.');
                    return;
                }
                if (confirm(`Tem certeza que deseja excluir o usuário "${u.usuario}"?`)) {
                    db.usuarios = db.usuarios.filter(x => x.id !== userId);
                    registrarLog('Usuários', 'Exclusão', `Usuário ${u.usuario} excluído.`);
                    salvarDados(db);
                    renderApp();
                }
            }
        }

        function salvarNovaSenhaPrimeiroAcesso(e) {
            e.preventDefault();
            const p1 = document.getElementById('new_pass_1').value;
            const p2 = document.getElementById('new_pass_2').value;

            if (p1 !== p2) {
                alert('As senhas preenchidas não coincidem!');
                return;
            }

            if (!validarSenhaForte(p1)) {
                alert('A senha deve possuir no mínimo 8 caracteres, contendo maiúsculas, minúsculas, números e caracteres especiais!');
                return;
            }

            const u = db.usuarios.find(x => x.id === sessao.usuarioLogado.id);
            if (u) {
                u.senhaHash = p1;
                u.primeiroAcesso = false;
                sessao.usuarioLogado.primeiroAcesso = false;
                salvarDados(db);
                registrarLog('Segurança', 'Senha Atualizada', `Usuário ${u.usuario} alterou a senha do primeiro acesso.`);
                fecharModal('modal_first_pass');
                iniciarMonitorInatividade();
                renderApp();
            }
        }

                                    <th class="p-3">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${db.financeiro.map(f => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${f.tipo === 'Receber' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${escapeHTML(f.tipo)}</span>
                                        </td>
                                        <td class="p-3 font-semibold text-slate-800">${escapeHTML(f.historico)}</td>
                                        <td class="p-3 text-slate-600">${escapeHTML(f.fornecedor)}</td>
                                        <td class="p-3 text-slate-600">${escapeHTML(f.vencimento)}</td>
                                        <td class="p-3 font-bold text-slate-900">R$ ${f.valor.toFixed(2)}</td>
                                        <td class="p-3"><span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded text-[10px] font-bold">${escapeHTML(f.status)}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // UTILS
        // ==========================================
        function fecharModal(modalId) {
            const el = document.getElementById(modalId);
            if (el) el.remove();
        }

        // Inicializador da Aplicação
        window.addEventListener('DOMContentLoaded', () => {
            if (sessao.usuarioLogado) {
                iniciarMonitorInatividade();
            }
            renderApp();
        });
    </script>
</body>
</html>
