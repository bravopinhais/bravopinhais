<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        @media print {
            body * { visibility: hidden; }
            #areaImpressao, #areaImpressao * { visibility: visible; }
            #areaImpressao { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen custom-scrollbar">

    <!-- ECRÃ DE LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4 bg-slate-950">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600/20 text-blue-500 mb-4">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-wide">Guardiões do Bravo</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Gestão Condominial Integrada</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); fazerLogin();" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Utilizador / E-mail</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="loginUser" required placeholder="admin" value="admin" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Palavra-passe</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="loginPass" required placeholder="12345678" value="12345678" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Entrar no Sistema</span>
                </button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (DASHBOARD) -->
    <div id="mainDashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div>
                <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-white leading-tight">Guardiões do Bravo</h2>
                        <span class="text-[10px] text-blue-400 font-medium uppercase tracking-wider">Condomínio</span>
                    </div>
                </div>

                <nav class="p-4 space-y-1">
                    <button onclick="navegarPara('dashboard')" id="nav-dashboard" class="nav-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-blue-400 bg-blue-600/10 border border-blue-500/20">
                        <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                    </button>
                    <button onclick="navegarPara('financeiro')" id="nav-financeiro" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-wallet w-5"></i> Financeiro
                    </button>
                    <button onclick="navegarPara('plano-contas')" id="nav-plano-contas" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-sitemap w-5"></i> Plano de Contas
                    </button>
                    <button onclick="navegarPara('bancos')" id="nav-bancos" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-building-columns w-5"></i> Bancos & Contas
                    </button>
                    <button onclick="navegarPara('moradores')" id="nav-moradores" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-users w-5"></i> Moradores & Unidades
                    </button>
                    <button onclick="navegarPara('fornecedores')" id="nav-fornecedores" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-truck-field w-5"></i> Fornecedores
                    </button>
                    <button onclick="navegarPara('estoque')" id="nav-estoque" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-boxes-stacked w-5"></i> Estoque & Inventário
                    </button>
                    <button onclick="navegarPara('documentos')" id="nav-documentos" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-folder-open w-5"></i> Documentos
                    </button>
                    <button onclick="navegarPara('relatorios')" id="nav-relatorios" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-900 hover:text-white">
                        <i class="fa-solid fa-file-contract w-5"></i> Relatórios Globais
                    </button>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-800">
                <button onclick="fazerLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                    <i class="fa-solid fa-right-from-bracket w-5"></i> Terminar Sessão
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-slate-900 p-6 md:p-8 overflow-y-auto">
            <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-800 mb-8">
                <div>
                    <h1 id="pageTitle" class="text-2xl font-bold text-white">Visão Geral</h1>
                    <p id="pageSubTitle" class="text-xs text-slate-400 mt-1">Gestão centralizada do Condomínio Guardiões do Bravo</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Ativo
                    </span>
                </div>
            </header>

            <!-- CONTEÚDO DINÂMICO DA PÁGINA -->
            <div id="contentArea"></div>
        </main>
    </div>

    <!-- MODAL CONTAINER (GENÉRICO PARA FORMULÁRIOS) -->
    <div id="modalContainer" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modalBody" class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative custom-scrollbar">
            <!-- Conteúdo injetado via JS -->
        </div>
    </div>

    <!-- LIGHTBOX DE IMAGEM -->
    <div id="lightboxModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 cursor-pointer" onclick="fecharLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl border border-slate-700" src="" alt="Ampliação">
    </div>

    <script>
        // BANCO DE DADOS LOCAL (INICIALMENTE ZERADO OU PRONTO PARA CADASTROS)
        let dadosSistema = {
            bancos: [
                { id: 'b1', nome: 'Itaú Unibanco', agencia: '0123', conta: '45678-9', saldo: 0 },
                { id: 'b2', nome: 'Caixa Econômica', agencia: '4321', conta: '98765-4', saldo: 0 }
            ],
            planoContas: [
                { id: 'pc1', codigo: '1.01', nome: 'Taxa Condominial', tipo: 'RECEITA' },
                { id: 'pc2', codigo: '1.02', nome: 'Uso de Salão de Festas', tipo: 'RECEITA' },
                { id: 'pc3', codigo: '2.01', nome: 'Manutenção Preventiva / Elevadores', tipo: 'DESPESA' },
                { id: 'pc4', codigo: '2.02', nome: 'Energia Elétrica / Água', tipo: 'DESPESA' },
                { id: 'pc5', codigo: '2.03', nome: 'Material de Limpeza & Consumo', tipo: 'DESPESA' }
            ],
            moradores: [],
            fornecedores: [],
            financeiro: [],
            estoque: [],
            historicoEstoque: [],
            documentos: []
        };

        // INICIALIZAÇÃO
        function fazerLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (user === 'admin' && pass === '12345678') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                carregarDashboard();
            } else {
                alert('Credenciais incorretas! Use admin / 12345678');
            }
        }

        function fazerLogout() {
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalContainer').classList.add('hidden');
        }

        function abrirLightbox(url) {
            if(!url) return;
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function fecharLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function navegarPara(pagina) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active', 'text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
                el.classList.add('text-slate-400');
            });

            const currentNav = document.getElementById('nav-' + pagina);
            if(currentNav) {
                currentNav.classList.add('active', 'text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
            }

            const title = document.getElementById('pageTitle');
            const subTitle = document.getElementById('pageSubTitle');

            if(pagina === 'dashboard') {
                title.innerText = 'Visão Geral';
                subTitle.innerText = 'Resumo executivo do condomínio';
                carregarDashboard();
            } else if(pagina === 'financeiro') {
                title.innerText = 'Módulo Financeiro';
                subTitle.innerText = 'Contas a Pagar, Receber e Baixas Parciais';
                carregarFinanceiro();
            } else if(pagina === 'plano-contas') {
                title.innerText = 'Plano de Contas';
                subTitle.innerText = 'Categorização de Receitas e Despesas';
                carregarPlanoContas();
            } else if(pagina === 'bancos') {
                title.innerText = 'Bancos & Contas';
                subTitle.innerText = 'Gestão de contas bancárias e saldos';
                carregarBancos();
            } else if(pagina === 'moradores') {
                title.innerText = 'Moradores & Unidades';
                subTitle.innerText = 'Cadastro de proprietários e inquilinos por bloco/unidade';
                carregarMoradores();
            } else if(pagina === 'fornecedores') {
                title.innerText = 'Fornecedores';
                subTitle.innerText = 'Empresas parceiras e prestadores de serviços';
                carregarFornecedores();
            } else if(pagina === 'estoque') {
                title.innerText = 'Estoque & Inventário';
                subTitle.innerText = 'Catálogo com fotos e histórico auditado de acertos';
                carregarEstoque();
            } else if(pagina === 'documentos') {
                title.innerText = 'Gestão de Documentos';
                subTitle.innerText = 'Atas, contratos e comprovantes organizados';
                carregarDocumentos();
            } else if(pagina === 'relatorios') {
                title.innerText = 'Relatórios Globais';
                subTitle.innerText = 'Relatórios consolidadores de todos os módulos com exportação';
                carregarRelatorios();
            }
        }

        // ==========================================
        // 1. DASHBOARD
        // ==========================================
        function carregarDashboard() {
            const totalReceitas = dadosSistema.financeiro.filter(f => f.tipo === 'RECEITA' && f.status === 'PAGO').reduce((a, b) => a + Number(b.valor), 0);
            const totalDespesas = dadosSistema.financeiro.filter(f => f.tipo === 'DESPESA' && f.status === 'PAGO').reduce((a, b) => a + Number(b.valor), 0);
            const saldoGeral = totalReceitas - totalDespesas;

            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Saldo em Conta</span>
                        <h3 class="text-2xl font-bold ${saldoGeral >= 0 ? 'text-emerald-400' : 'text-rose-400'} mt-2">R$ ${saldoGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h3>
                        <p class="text-xs text-slate-500 mt-1">Total consolidado</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Moradores</span>
                        <h3 class="text-2xl font-bold text-blue-400 mt-2">${dadosSistema.moradores.length} Unidades</h3>
                        <p class="text-xs text-slate-500 mt-1">Cadastros de moradores</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Fornecedores</span>
                        <h3 class="text-2xl font-bold text-indigo-400 mt-2">${dadosSistema.fornecedores.length} Cadastrados</h3>
                        <p class="text-xs text-slate-500 mt-1">Prestadores de serviço</p>
                    </div>
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Itens em Estoque</span>
                        <h3 class="text-2xl font-bold text-amber-400 mt-2">${dadosSistema.estoque.length} Produtos</h3>
                        <p class="text-xs text-slate-500 mt-1">Itens monitorados</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <h3 class="text-lg font-bold text-white mb-4">Acesso Rápido</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="modalNovoLancamento()" class="p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 transition text-left">
                                <i class="fa-solid fa-plus-circle text-blue-500 text-xl mb-2"></i>
                                <div class="font-semibold text-white text-sm">Novo Lançamento</div>
                                <div class="text-xs text-slate-400">Pagar ou Receber</div>
                            </button>
                            <button onclick="modalNovoMorador()" class="p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 transition text-left">
                                <i class="fa-solid fa-user-plus text-emerald-500 text-xl mb-2"></i>
                                <div class="font-semibold text-white text-sm">Novo Morador</div>
                                <div class="text-xs text-slate-400">Cadastrar unidade</div>
                            </button>
                            <button onclick="modalNovoEstoque()" class="p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 transition text-left">
                                <i class="fa-solid fa-box text-amber-500 text-xl mb-2"></i>
                                <div class="font-semibold text-white text-sm">Novo Item Estoque</div>
                                <div class="text-xs text-slate-400">Com foto e quantidade</div>
                            </button>
                            <button onclick="navegarPara('relatorios')" class="p-4 bg-slate-900 border border-slate-800 rounded-xl hover:border-blue-500 transition text-left">
                                <i class="fa-solid fa-chart-line text-purple-500 text-xl mb-2"></i>
                                <div class="font-semibold text-white text-sm">Ver Relatórios</div>
                                <div class="text-xs text-slate-400">Visão global consolidada</div>
                            </button>
                        </div>
                    </div>

                    <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                        <h3 class="text-lg font-bold text-white mb-4">Avisos e Estado do Sistema</h3>
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span class="text-sm text-slate-300"><i class="fa-solid fa-check-circle text-emerald-400 mr-2"></i> Módulo de Baixa Parcial</span>
                                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium">Ativo</span>
                            </div>
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span class="text-sm text-slate-300"><i class="fa-solid fa-check-circle text-emerald-400 mr-2"></i> Acerto de Estoque Auditado</span>
                                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium">Ativo</span>
                            </div>
                            <div class="p-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span class="text-sm text-slate-300"><i class="fa-solid fa-check-circle text-emerald-400 mr-2"></i> Modais In-Page (Sem Prompts)</span>
                                <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-medium">Ativo</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 2. MORADORES
        // ==========================================
        function carregarMoradores() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <input type="text" id="filtroMorador" onkeyup="filtrarMoradores()" placeholder="🔍 Filtrar por Nome, Bloco ou Unidade..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500 w-full sm:w-80">
                    <button onclick="modalNovoMorador()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Novo Morador
                    </button>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-800">
                            <tr>
                                <th class="p-4">Morador</th>
                                <th class="p-4">Bloco</th>
                                <th class="p-4">Unidade/AP</th>
                                <th class="p-4">Tipo</th>
                                <th class="p-4">Contacto</th>
                                <th class="p-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaMoradores" class="divide-y divide-slate-800 text-slate-300">
                            ${gerarLinhasMoradores(dadosSistema.moradores)}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function gerarLinhasMoradores(lista) {
            if(lista.length === 0) {
                return `<tr><td colspan="6" class="p-8 text-center text-slate-500">Nenhum morador cadastrado até ao momento.</td></tr>`;
            }
            return lista.map((m, idx) => `
                <tr class="hover:bg-slate-900/50 transition">
                    <td class="p-4 font-semibold text-white">${m.nome}</td>
                    <td class="p-4">${m.bloco}</td>
                    <td class="p-4 font-bold text-blue-400">${m.ap}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${m.tipo === 'Proprietário' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">${m.tipo}</span></td>
                    <td class="p-4 text-xs">${m.telefone || '-'} <br><span class="text-slate-500">${m.email || ''}</span></td>
                    <td class="p-4 text-right">
                        <button onclick="excluirMorador(${idx})" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function modalNovoMorador() {
            document.getElementById('modalBody').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Cadastrar Novo Morador</h3>
                    <button onclick="fecharModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <form onsubmit="event.preventDefault(); salvarMorador();" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome Completo</label>
                        <input type="text" id="mNome" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Bloco / Torre</label>
                            <input type="text" id="mBloco" placeholder="Ex: Bloco A" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Apartamento / Unidade</label>

        function confirmarBaixaParcial(idx) {
            const itemOriginal = dadosSistema.financeiro[idx];
            const valorPago = parseFloat(document.getElementById('bpValor').value) || 0;
            const bancoId = document.getElementById('bpBanco').value;
            const novoVencimento = document.getElementById('bpNovoVencimento').value;

            if(valorPago >= itemOriginal.valor || valorPago <= 0) {
                alert("O valor da baixa parcial deve ser maior que zero e menor que o valor total do título!");
                return;
            }

            const valorResidual = itemOriginal.valor - valorPago;

            // Atualiza o saldo bancário com a parte paga
            const banco = dadosSistema.bancos.find(b => b.id === bancoId);
            if(banco) {
                if(itemOriginal.tipo === 'RECEITA') banco.saldo += valorPago;
                else banco.saldo -= valorPago;
            }

            // Marca a parte paga como quitada
            dadosSistema.financeiro.push({
                tipo: itemOriginal.tipo,
                valor: valorPago,
                descricao: `${itemOriginal.descricao} (Baixa Parcial)`,
                vencimento: itemOriginal.vencimento,
                pessoa: itemOriginal.pessoa,
                status: 'PAGO'
            });

            // Cria o título residual com o valor restante
            itemOriginal.valor = valorResidual;
            itemOriginal.vencimento = novoVencimento;
            itemOriginal.descricao = `${itemOriginal.descricao} (Saldo Residual)`;

            fecharModal();
            carregarFinanceiro();
        }

            const qtd = parseInt(document.getElementById('acQtd').value) || 0;
            const motivo = document.getElementById('acMotivo').value;

                else {

                        alert("A quantidade de saída não pode ser maior do que o saldo atual do estoque!");

                    produto.qtd -= qtd;

                dadosSistema.historicoEstoque.unshift({
                    data: new Date().toLocaleString('pt-BR'),
                    produto: produto.nome,
                    tipo: tipo,
                    qtd: qtd,
                    motivo: motivo

            }

            fecharModal();
            carregarEstoque();

                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-slate-800">
                            <tr>
                                <th class="p-4">Título</th>
                                <th class="p-4">Categoria</th>
                                <th class="p-4">Data</th>
                                <th class="p-4">Observação</th>
                                <th class="p-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaDocumentos" class="divide-y divide-slate-800 text-slate-300">
                            ${gerarLinhasDocumentos(dadosSistema.documentos)}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function gerarLinhasDocumentos(lista) {
            if(lista.length === 0) {
                return `<tr><td colspan="5" class="p-8 text-center text-slate-500">Nenhum documento arquivado.</td></tr>`;
            }
            return lista.map((d, idx) => `
                <tr class="hover:bg-slate-900/50 transition">
                    <td class="p-4 font-semibold text-white">${d.titulo}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">${d.categoria}</span></td>
                    <td class="p-4 text-xs font-mono">${d.data}</td>
                    <td class="p-4 text-xs text-slate-400">${d.obs || '-'}</td>
                    <td class="p-4 text-right">
                        <button onclick="excluirDocumento(${idx})" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function modalNovoDocumento() {
            document.getElementById('modalBody').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-white">Arquivar Documento</h3>
                    <button onclick="fecharModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <form onsubmit="event.preventDefault(); salvarDocumento();" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Título do Documento</label>
                        <input type="text" id="dTitulo" placeholder="Ex: Ata da Assembleia Geral 2026" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Categoria</label>
                            <select id="dCategoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none">
                                <option value="Atas e Convenções">Atas e Convenções</option>
                                <option value="Contratos">Contratos</option>
                                <option value="Comprovantes">Comprovantes</option>
                                <option value="Manutenção">Manutenção</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Data do Documento</label>
                            <input type="date" id="dData" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Observações</label>
                        <textarea id="dObs" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 h-20"></textarea>
                    </div>
                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" onclick="fecharModal()" class="px-5 py-2.5 rounded-xl border border-slate-800 text-slate-400 hover:text-white text-sm font-semibold">Cancelar</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold shadow-lg shadow-blue-600/20">Salvar Documento</button>
                    </div>
                </form>
            `;
            document.getElementById('modalContainer').classList.remove('hidden');
        }

        function salvarDocumento() {
            const doc = {
                titulo: document.getElementById('dTitulo').value,
                categoria: document.getElementById('dCategoria').value,
                data: document.getElementById('dData').value,
                obs: document.getElementById('dObs').value
            };
            dadosSistema.documentos.push(doc);
            fecharModal();
            carregarDocumentos();
        }

        function excluirDocumento(idx) {
            if(confirm("Deseja remover este documento?")) {
                dadosSistema.documentos.splice(idx, 1);
                carregarDocumentos();
            }
        }

        // ==========================================
        // 8. RELATÓRIOS GLOBAIS
        // ==========================================
        function carregarRelatorios() {
            const content = document.getElementById('contentArea');
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <button onclick="gerarRelatorioGlobal('DRE')" class="p-6 bg-slate-950 border border-slate-800 rounded-2xl hover:border-blue-500 transition text-left flex items-start gap-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-base">Demonstrativo DRE</h4>
                            <p class="text-xs text-slate-400 mt-1">Resumo consolidado por Plano de Contas e Fluxo financeiro.</p>
                        </div>
                    </button>

                    <button onclick="gerarRelatorioGlobal('MORADORES')" class="p-6 bg-slate-950 border border-slate-800 rounded-2xl hover:border-blue-500 transition text-left flex items-start gap-4">
                        <div class="w-12 h-12 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-users text-2xl"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-base">Relatório de Moradores</h4>
                            <p class="text-xs text-slate-400 mt-1">Lista completa de proprietários e inquilinos por bloco.</p>
                        </div>
                    </button>

                    <button onclick="gerarRelatorioGlobal('ESTOQUE')" class="p-6 bg-slate-950 border border-slate-800 rounded-2xl hover:border-blue-500 transition text-left flex items-start gap-4">
                        <div class="w-12 h-12 rounded-xl bg-amber-600/20 text-amber-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-base">Balanço de Estoque</h4>
                            <p class="text-xs text-slate-400 mt-1">Relatório de saldo físico e itens com alerta de estoque mínimo.</p>
                        </div>
                    </button>
                </div>

                <!-- ÁREA DE EXIBIÇÃO E IMPRESSÃO DO RELATÓRIO -->
                <div id="areaRelatorioGerado" class="bg-slate-950 border border-slate-800 rounded-2xl p-8">
                    <p class="text-center text-slate-500">Selecione um dos modelos de relatório acima para visualizar e imprimir.</p>
                </div>
            `;
        }

        function gerarRelatorioGlobal(tipo) {
            const container = document.getElementById('areaRelatorioGerado');
            
            if(tipo === 'DRE') {
                const receitas = dadosSistema.financeiro.filter(f => f.tipo === 'RECEITA' && f.status === 'PAGO').reduce((a, b) => a + Number(b.valor), 0);
                const despesas = dadosSistema.financeiro.filter(f => f.tipo === 'DESPESA' && f.status === 'PAGO').reduce((a, b) => a + Number(b.valor), 0);

                container.innerHTML = `
                    <div id="areaImpressao">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                            <div>
                                <h2 class="text-xl font-bold text-white">Demonstrativo do Resultado (DRE)</h2>
                                <p class="text-xs text-slate-400">Condomínio Guardiões do Bravo - Emissão: ${new Date().toLocaleDateString('pt-BR')}</p>
                            </div>
                            <button onclick="window.print()" class="no-print bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2">
                                <i class="fa-solid fa-print"></i> Imprimir / Gerar PDF
                            </button>
                        </div>
                        <div class="space-y-4">
                            <div class="p-4 bg-slate-900 rounded-xl flex justify-between items-center">
                                <span class="font-bold text-emerald-400">Total de Receitas Liquidadas (+)</span>
                                <span class="font-mono font-bold text-emerald-400">R$ ${receitas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                            </div>
                            <div class="p-4 bg-slate-900 rounded-xl flex justify-between items-center">
                                <span class="font-bold text-rose-400">Total de Despesas Liquidadas (-)</span>
                                <span class="font-mono font-bold text-rose-400">R$ ${despesas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                            </div>
                            <div class="p-4 bg-slate-800 rounded-xl flex justify-between items-center text-lg">
                                <span class="font-bold text-white">Resultado Operacional Líquido</span>
                                <span class="font-mono font-bold ${(receitas - despesas) >= 0 ? 'text-emerald-400' : 'text-rose-400'}">R$ ${(receitas - despesas).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if(tipo === 'MORADORES') {
                container.innerHTML = `
                    <div id="areaImpressao">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                            <div>
                                <h2 class="text-xl font-bold text-white">Relatório Geral de Ocupantes</h2>
                                <p class="text-xs text-slate-400">Total de Moradores: ${dadosSistema.moradores.length}</p>
                            </div>
                            <button onclick="window.print()" class="no-print bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2">
                                <i class="fa-solid fa-print"></i> Imprimir / Gerar PDF
                            </button>
                        </div>
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-900 text-slate-400 text-xs uppercase">
                                <tr>
                                    <th class="p-3">Nome</th>
                                    <th class="p-3">Bloco</th>
                                    <th class="p-3">Unidade</th>
                                    <th class="p-3">Tipo</th>
                                    <th class="p-3">Contacto</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                                ${dadosSistema.moradores.map(m => `
                                    <tr>
                                        <td class="p-3 font-semibold text-white">${m.nome}</td>
                                        <td class="p-3">${m.bloco}</td>
                                        <td class="p-3 font-bold text-blue-400">${m.ap}</td>
                                        <td class="p-3">${m.tipo}</td>
                                        <td class="p-3 text-xs">${m.telefone || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if(tipo === 'ESTOQUE') {
                container.innerHTML = `
                    <div id="areaImpressao">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                            <div>
                                <h2 class="text-xl font-bold text-white">Balanço de Estoque e Inventário</h2>
                                <p class="text-xs text-slate-400">Itens em Alerta Mínimo: ${dadosSistema.estoque.filter(e => e.qtd <= e.qtdMinima).length}</p>
                            </div>
                            <button onclick="window.print()" class="no-print bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2">
                                <i class="fa-solid fa-print"></i> Imprimir / Gerar PDF
                            </button>
                        </div>
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-900 text-slate-400 text-xs uppercase">
                                <tr>
                                    <th class="p-3">Produto</th>
                                    <th class="p-3">Categoria</th>
                                    <th class="p-3">Localização</th>
                                    <th class="p-3">Qtd. Atual</th>
                                    <th class="p-3">Mínimo</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                                ${dadosSistema.estoque.map(e => `
                                    <tr>
                                        <td class="p-3 font-semibold text-white">${e.nome}</td>
                                        <td class="p-3 text-xs">${e.categoria}</td>
                                        <td class="p-3 text-xs">${e.localizacao || '-'}</td>
                                        <td class="p-3 font-bold ${e.qtd <= e.qtdMinima ? 'text-amber-400' : 'text-emerald-400'}">${e.qtd}</td>
                                        <td class="p-3 text-xs">${e.qtdMinima}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
