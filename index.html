        <!-- Segurança de senhas e login (script separado) -->
        <script>
            // =====================================================================
            // SEGURANÇA DE SENHAS E LOGIN
            // - Senhas passam a ser guardadas com PBKDF2-SHA256 + sal aleatório (não mais texto puro)
            // - Senhas antigas em texto puro são convertidas no primeiro login bem-sucedido
            // - Senhas fracas ou conhecidas (ex.: as padrão do código) exigem troca no próximo acesso
            // - Bloqueio temporário após tentativas erradas
            // - O hash nunca vai para a sessão do navegador nem para o CSV exportado
            // AVISO: isto reforça o armazenamento, mas o login continua sendo feito no navegador.
            // Para proteger de fato os dados na nuvem é preciso Supabase Auth + RLS.
            // =====================================================================
            const PBKDF2_ITER = 150000;
            const SENHAS_CONHECIDAS = ['Admin@12345', '123456', 'admin', 'admin123', 'senha', '12345678'];
            const MAX_TENTATIVAS = 5
              , BLOQUEIO_MIN = 5;

            const _enc = new TextEncoder();
            const _b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
            const _deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
            const _pausa = ms => new Promise(r => setTimeout(r, ms));
            const _temCripto = () => !!(window.crypto && crypto.subtle);

            async function _derivar(senha, salt, iter) {
                const k = await crypto.subtle.importKey('raw', _enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
                return crypto.subtle.deriveBits({
                    name: 'PBKDF2',
                    hash: 'SHA-256',
                    salt,
                    iterations: iter
                }, k, 256);
            }
            async function hashSenhaNova(senha) {
                if (!_temCripto()) {
                    console.warn('Criptografia indisponível neste contexto (use HTTPS).');
                    return senha;
                }
                const salt = crypto.getRandomValues(new Uint8Array(16));
                return `pbkdf2$${PBKDF2_ITER}$${_b64(salt)}$${_b64(await _derivar(senha, salt, PBKDF2_ITER))}`;
            }
            async function conferirSenha(senha, guardado) {
                if (!guardado)
                    return {
                        ok: false
                    };
                if (!String(guardado).startsWith('pbkdf2$'))
                    return {
                        ok: senha === guardado,
                        legado: true
                    };
                if (!_temCripto())
                    return {
                        ok: false
                    };
                const [,it,s,h] = guardado.split('$');
                return {
                    ok: _b64(await _derivar(senha, _deb64(s), parseInt(it))) === h,
                    legado: false
                };
            }
            const senhaForte = s => s.length >= 12 && /[A-Z]/.test(s) && /[a-z]/.test(s) && /[0-9]/.test(s) && !SENHAS_CONHECIDAS.includes(s);
            const MSG_SENHA = 'Use pelo menos 12 caracteres, com maiúsculas, minúsculas e números, e não use senhas óbvias.';

            // ---- bloqueio por tentativas ----
            function _lerTentativas() {
                try {
                    return JSON.parse(localStorage.getItem('guardioes_tentativas') || '{}');
                } catch (e) {
                    return {};
                }
            }
            function _gravarTentativas(o) {
                try {
                    localStorage.setItem('guardioes_tentativas', JSON.stringify(o));
                } catch (e) {}
            }
            function minutosDeBloqueio(usuario) {
                const r = _lerTentativas()[usuario];
                return (r && r.ate && r.ate > Date.now()) ? Math.ceil((r.ate - Date.now()) / 60000) : 0;
            }
            function registrarFalha(usuario) {
                const o = _lerTentativas();
                const r = o[usuario] || {
                    n: 0
                };
                r.n = (r.ate && r.ate <= Date.now()) ? 1 : r.n + 1;
                if (r.n >= MAX_TENTATIVAS) {
                    r.ate = Date.now() + BLOQUEIO_MIN * 60000;
                    r.n = 0;
                }
                o[usuario] = r;
                _gravarTentativas(o);
            }
            function limparFalhas(usuario) {
                const o = _lerTentativas();
                delete o[usuario];
                _gravarTentativas(o);
            }

            // ---- sessão sem o hash ----
            function iniciarSessaoSegura(u) {
                const {senhaHash, ...semSenha} = u;
                sessao.usuarioLogado = semSenha;
                try {
                    sessionStorage.setItem('guardioes_sessao', JSON.stringify(semSenha));
                } catch (e) {}
                reiniciarTemporizadorInatividade();
                renderApp();
            }

            // ---- login ----
            realizarLogin = async function(e) {
                e.preventDefault();
                const userInput = document.getElementById('login_user').value.trim().toLowerCase();
                const senhaInput = document.getElementById('login_pass').value;
                const lembrar = document.getElementById('login_lembrar')?.checked;
                if (lembrar)
                    localStorage.setItem('guardioes_lembrar_user', userInput);
                else
                    localStorage.removeItem('guardioes_lembrar_user');

                const espera = minutosDeBloqueio(userInput);
                if (espera) {
                    alert(`Muitas tentativas incorretas. Tente novamente em ${espera} minuto(s).`);
                    return;
                }

                const u = (db.usuarios || []).find(x => (x.usuario && x.usuario.toLowerCase() === userInput) || (x.email && x.email.toLowerCase() === userInput));
                let r = {
                    ok: false
                };
                try {
                    r = u ? await conferirSenha(senhaInput, u.senhaHash) : (await _pausa(250),
                    {
                        ok: false
                    });
                } catch (err) {
                    console.warn(err);
                }
                if (!u || !r.ok) {
                    registrarFalha(userInput);
                    await _pausa(700);
                    alert('Credenciais incorretas! Verifique o utilizador/e-mail e a palavra-passe.');
                    return;
                }
                if (u.status === 'Inativo') {
                    alert('Utilizador inativo.');
                    return;
                }
                limparFalhas(userInput);

                let mudou = false;
                if (r.legado) {
                    // converte a senha antiga (texto puro) em hash
                    if (!senhaForte(senhaInput))
                        u.primeiroAcesso = true;
                    u.senhaHash = await hashSenhaNova(senhaInput);
                    mudou = true;
                }
                if (SENHAS_CONHECIDAS.includes(senhaInput) && !u.primeiroAcesso) {
                    u.primeiroAcesso = true;
                    mudou = true;
                }
                if (mudou)
                    salvarDados(db);

                if (u.primeiroAcesso) {
                    usuarioPendentePrimeiroAcesso = u;
                    renderApp();
                    return;
                }
                iniciarSessaoSegura(u);
            }
            ;

            // ---- troca obrigatória de senha ----
            concluirPrimeiroAcesso = async function(e) {
                e.preventDefault();
                const s1 = document.getElementById('prim_senha_nova').value;
                const s2 = document.getElementById('prim_senha_conf').value;
                if (!senhaForte(s1)) {
                    alert(MSG_SENHA);
                    return;
                }
                if (s1 !== s2) {
                    alert('As palavras-passe não coincidem.');
                    return;
                }
                const alvo = (db.usuarios || []).find(x => x.id === usuarioPendentePrimeiroAcesso.id);
                if (!alvo)
                    return;
                if ((await conferirSenha(s1, alvo.senhaHash)).ok) {
                    alert('A nova palavra-passe deve ser diferente da anterior.');
                    return;
                }
                alvo.senhaHash = await hashSenhaNova(s1);
                alvo.primeiroAcesso = false;
                salvarDados(db);
                usuarioPendentePrimeiroAcesso = null;
                alert('Palavra-passe alterada com sucesso! Bem-vindo(a) ao sistema.');
                iniciarSessaoSegura(alvo);
            }
            ;

            // ---- administração de utilizadores ----
            window.salvarModalUsuario = async function(e, id) {
                e.preventDefault();
                if (!db.usuarios)
                    db.usuarios = [];
                const isEdit = id && id !== 'null';
                const existente = isEdit ? db.usuarios.find(x => x.id === id) : null;
                const login = document.getElementById('m_u_login').value.trim();
                const email = document.getElementById('m_u_email').value.trim();
                const duplicado = db.usuarios.some(x => x.id !== (isEdit ? id : '') && ((x.usuario || '').toLowerCase() === login.toLowerCase() || (email && (x.email || '').toLowerCase() === email.toLowerCase())));
                if (duplicado) {
                    alert('Já existe um utilizador com este login ou e-mail.');
                    return;
                }

                let senhaHash;
                if (existente)
                    senhaHash = existente.senhaHash;
                else {
                    const temp = document.getElementById('m_u_senha').value;
                    if (!senhaForte(temp)) {
                        alert(MSG_SENHA);
                        return;
                    }
                    senhaHash = await hashSenhaNova(temp);
                }
                const obj = {
                    id: isEdit ? id : 'usr_' + Date.now(),
                    usuario: login,
                    nome: document.getElementById('m_u_nome').value,
                    email,
                    loja: document.getElementById('m_u_loja').value,
                    cargo: document.getElementById('m_u_cargo').value,
                    perfil: document.getElementById('m_u_cargo').value,
                    status: existente ? (existente.status || 'Ativo') : 'Ativo',
                    senhaHash,
                    primeiroAcesso: existente ? existente.primeiroAcesso : true
                };
                const idx = db.usuarios.findIndex(x => x.id === obj.id);
                if (idx !== -1)
                    db.usuarios[idx] = obj;
                else
                    db.usuarios.push(obj);
                salvarDados(db);
                fecharModalContainer();
                renderMainOnly();
            }
            ;

            window.executarRedefinicaoSenha = async function(e, id) {
                e.preventDefault();
                const s1 = document.getElementById('nova_senha_admin').value;
                const s2 = document.getElementById('nova_senha_admin_conf').value;
                if (!senhaForte(s1)) {
                    alert(MSG_SENHA);
                    return;
                }
                if (s1 !== s2) {
                    alert('As palavras-passe não coincidem.');
                    return;
                }
                const alvo = (db.usuarios || []).find(x => x.id === id);
                if (!alvo)
                    return;
                alvo.senhaHash = await hashSenhaNova(s1);
                alvo.primeiroAcesso = true;
                // o utilizador define a senha dele no próximo acesso
                salvarDados(db);
                fecharModalContainer();
                alert('Palavra-passe temporária definida. O utilizador deverá criar a sua própria senha no próximo acesso.');
                renderMainOnly();
            }
            ;

            const _redefinirModalOriginal = window.renderModalRedefinirSenha;
            window.renderModalRedefinirSenha = function(id) {
                _redefinirModalOriginal(id);
                const i = document.getElementById('nova_senha_admin');
                if (i)
                    i.placeholder = 'Mínimo 12 caracteres, com maiúscula, minúscula e número';
            }
            ;

            // ---- exportações nunca levam o hash ----
            const _exportarOriginal = exportarParaExcel;
            exportarParaExcel = function(dados, nome) {
                _exportarOriginal((dados || []).map(r => {

            // ---- tela de login sem pistas sobre contas ----
            const _renderAppAntesSeguranca = renderApp;
            renderApp = function() {

                if (i)
                    i.placeholder = 'Seu utilizador ou e-mail';
            }
            ;

            // ---------- salvar (com RLS) ----------

                    delete u.senhaHash;
                }
                );
                // senhas nunca vão para a nuvem
                _statusNuvem('bg-slate-900 text-teal-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print animate-pulse border-b border-slate-800', '<i class="fa-solid fa-rotate fa-spin"></i> A guardar na nuvem...');

                    const {error} = await supabaseClient.from('condominio_dados').upsert({

            // ---------- carregar (só depois de autenticado) ----------
            async function carregarDadosAutenticado() {
                const {data, error} = await supabaseClient.from('condominio_dados').select('payload').eq('id', 'principal').maybeSingle();
                if (error) {
                    console.warn(error);
                    return false;
                }
                if (data && data.payload) {
                    db = data.payload;

                } else {
                    // Proteção crítica: nunca criar/substituir a base existente durante a migração de login.
                    _statusNuvem(CL_ERRO, '<i class="fa-solid fa-triangle-exclamation"></i> A nuvem não retornou a base esperada; nenhum dado foi alterado.');

                    event: '*',

                if ((db.usuarios || []).some(u => u.senhaHash !== undefined))

        <script>
            // ===== Lembrar credenciais =====
            // Usuário: guardado em localStorage (já existia). Senha: NUNCA é guardada pelo sistema;
            // fica no gerenciador de senhas do próprio navegador (API de Credenciais).
            (function() {
                function _lembrarUsuario(valor, ligado) {
                    try {
                        if (ligado && valor)
                            localStorage.setItem('guardioes_lembrar_user', valor);
                        else if (!ligado)
                            localStorage.removeItem('guardioes_lembrar_user');
                    } catch (e) {}
                }

                async function salvarCredencialNavegador(usuario, senha) {
                    try {
                        if (!window.PasswordCredential || !navigator.credentials || !navigator.credentials.store)
                            return;
                        const cred = new PasswordCredential({
                            id: usuario,
                            password: senha,
                            name: usuario
                        });
                        await navigator.credentials.store(cred);
                    } catch (e) {
                        console.warn('Credencial não salva:', e);
                    }
                }

                async function preencherCredencialSalva() {
                    try {
                        if (!window.PasswordCredential || !navigator.credentials || !navigator.credentials.get)
                            return;
                        const chk = document.getElementById('login_lembrar');
                        if (!chk || !chk.checked)
                            return;
                        const cred = await navigator.credentials.get({
                            password: true,
                            mediation: 'silent'
                        });
                        const u = document.getElementById('login_user')
                          , pw = document.getElementById('login_pass');
                        if (!cred || !cred.password || !u || !pw || pw.value)
                            return;
                        if (u.value && u.value.trim().toLowerCase() !== String(cred.id).toLowerCase())
                            return;
                        u.value = cred.id;
                        pw.value = cred.password;
                    } catch (e) {/* sem credencial disponível */
                    }
                }

                // Login: lembra o usuário e, se o login der certo, entrega a senha ao gerenciador do navegador
                const _loginBase = realizarLogin;
                realizarLogin = async function(e) {
                    const uEl = document.getElementById('login_user')
                      , pEl = document.getElementById('login_pass')
                      , cEl = document.getElementById('login_lembrar');
                    const usuario = uEl ? uEl.value.trim() : ''
                      , senha = pEl ? pEl.value : ''
                      , lembrar = !!(cEl && cEl.checked);
                    _lembrarUsuario(usuario.toLowerCase(), lembrar);
                    await _loginBase(e);
                    if (lembrar && usuario && senha && sessao.usuarioLogado)
                        salvarCredencialNavegador(usuario, senha);
                }
                ;

                // Ao desmarcar a caixa, esquece o usuário na hora
                document.addEventListener('change', function(ev) {
                    if (ev.target && ev.target.id === 'login_lembrar' && !ev.target.checked)
                        _lembrarUsuario('', false);
                });

                // Sempre que a tela de login for desenhada, tenta preencher a senha salva
                const _renderAppBase = renderApp;
                renderApp = function() {
                    _renderAppBase.apply(this, arguments);
                    try {
                        if (!sessao.usuarioLogado)
                            preencherCredencialSalva();
                    } catch (e) {}
                }
                ;
            }
            )();
        </script>
        <script>
            // Sincronização assistida ao recuperar conexão: se a nuvem mudou, nunca sobrescreve silenciosamente.
            (function configurarRecuperacaoConexao() {
                let verificacaoEmAndamento = false;
                window.addEventListener('online', async () => {
                    if (verificacaoEmAndamento || !obterSyncPendente() || !sessao.usuarioLogado || (typeof AUTH_SUPABASE !== 'undefined' && AUTH_SUPABASE))
                        return;
                    verificacaoEmAndamento = true;
                    try {
                        const {data, error} = await supabaseClient.from('condominio_dados').select('payload, atualizado_em').eq('id', 'principal').maybeSingle();
                        if (error)
                            throw error;
                        const pendencia = obterSyncPendente();
                        if (!pendencia)
                            return;
                        if (!data || !data.payload) {
                            if (confirm('A conexão voltou, mas a nuvem não retornou uma base acessível. Deseja tentar enviar os dados locais?')) {
                                await salvarDadosNaNuvem(db, {
                                    recuperacaoConfirmada: true
                                });
                            }
                            return;
                        }
                        const baseline = pendencia.ultimaVersaoNuvem || localStorage.getItem(CHAVE_ULTIMA_SYNC_NUVEM);
                        const remotoMudou = !baseline || !data.atualizado_em || !versoesEquivalentes(baseline, data.atualizado_em);
                        if (!remotoMudou) {
                            await salvarDadosNaNuvem(db, {
                                recuperacaoConfirmada: true
                            });
                            return;
                        }
                        const escolha = confirm(`A conexão voltou, mas os dados na nuvem podem ter mudado desde a última sincronização.

OK: enviar a versão local para a nuvem (pode substituir alterações remotas).
Cancelar: manter a pendência sem sobrescrever a nuvem.

Faça um backup antes de confirmar.`);
                        if (escolha)
                            await salvarDadosNaNuvem(db, {
                                recuperacaoConfirmada: true
                            });
                        else {
                            const el = document.getElementById('status-nuvem');
                            if (el) {
                                el.className = 'bg-amber-950 text-amber-300 text-[11px] font-semibold py-1.5 px-4 text-center no-print border-b border-amber-800';
                                el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Sincronização pendente; os dados locais foram mantidos.';
                            }
                        }
                    } catch (e) {
                        console.warn('A conexão voltou, mas não foi possível verificar a sincronização.', e);
                    } finally {
                        verificacaoEmAndamento = false;
                    }
                }
                );
            }
            )();

            // Registra o service worker somente em origem HTTPS/localhost e quando o arquivo complementar está publicado.
            if ('serviceWorker'in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./service-worker.js').catch(err => {
                        console.info('Modo PWA indisponível nesta publicação; o sistema continua funcionando no navegador.', err);
                    }
                    );
                }
                );
            }
        </script>

                    return `
            <div class="min-h-screen flex items-center justify-center bg-slate-950 p-4 w-full relative overflow-hidden">
                <div class="bg-white/95 backdrop-blur-xl w-full max-w-md p-8 rounded-3xl shadow-2xl border border-white/20 space-y-6 relative z-10">
                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-gradient-to-tr from-teal-600 to-emerald-500 rounded-2xl flex items-center justify-center text-white text-3xl font-extrabold mx-auto"><i class="fa-solid fa-key"></i></div>
                        <h2 class="text-2xl font-black text-slate-900">Criar nova senha</h2>
                        <p class="text-sm text-slate-600">Escolha uma senha nova para a sua conta.</p>
                    </div>
                    <form onsubmit="finalizarRecuperacaoSenha(event)" class="space-y-4" autocomplete="on">
                        <div><label for="rec_senha_nova" class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Nova senha</label><input id="rec_senha_nova" type="password" autocomplete="new-password" required minlength="12" class="w-full p-3 border rounded-2xl bg-slate-50 text-sm" placeholder="Mínimo 12 caracteres, maiúscula, minúscula e número"></div>
                        <div><label for="rec_senha_conf" class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Confirmar nova senha</label><input id="rec_senha_conf" type="password" autocomplete="new-password" required minlength="12" class="w-full p-3 border rounded-2xl bg-slate-50 text-sm" placeholder="Digite a senha novamente"></div>
                        <p id="rec_senha_status" role="status" aria-live="polite" class="hidden rounded-xl p-3 text-sm"></p>
                        <button id="rec_senha_btn" type="submit" class="w-full py-3.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold rounded-2xl shadow-lg text-sm">Salvar nova senha</button>
                    </form>
                    <button type="button" onclick="cancelarRecuperacaoSenha()" class="w-full py-2 text-sm font-bold text-teal-700 hover:text-teal-900">Voltar ao login</button>
                    <p class="text-xs text-slate-500 text-center">Use pelo menos 12 caracteres, com letras maiúsculas, minúsculas e números.</p>
                </div>
            </div>`;
                }

                window.abrirRecuperacaoSenha = function() {
                    if (!AUTH_SUPABASE) {
                        abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 backdrop-blur-md">
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div class="flex items-center gap-3"><div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl"><i class="fa-solid fa-envelope-circle-check"></i></div><h3 class="font-black text-lg text-slate-900">Recuperar senha por e-mail</h3></div>
                        <p class="text-sm leading-6 text-slate-600">A autenticação atual do Guardiões do Bravo é local. Para que o link de e-mail altere a senha de forma segura, é necessário migrar os usuários para o Supabase Auth e testar o novo login. Essa migração ainda não está ativada neste arquivo, para não bloquear o acesso existente.</p>
                        <p class="text-sm text-slate-600">Enquanto isso, peça ao administrador do sistema para redefinir sua senha pelo módulo de utilizadores.</p>
                        <div class="flex flex-col gap-2"><button type="button" onclick="baixarGuiaSeguranca()" class="w-full py-3 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-bold">Baixar guia de ativação</button><button type="button" onclick="fecharModalContainer()" class="w-full py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">Fechar</button></div>
                    </div>
                </div>`);
                        return;
                    }

                    if (!['https:', 'http:'].includes(window.location.protocol)) {
                        alert('A recuperação por e-mail precisa que o sistema esteja publicado em HTTPS (ou localhost para testes).');
                        return;
                    }
                    const atual = document.getElementById('login_user')?.value.trim() || '';
                    const emailInicial = atual.includes('@') ? atual : '';
                    abrirModalContainer(`
            <div class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 backdrop-blur-md">
                <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                    <div class="flex items-center gap-3"><div class="w-12 h-12 rounded-2xl bg-teal-100 text-teal-700 flex items-center justify-center text-xl"><i class="fa-solid fa-envelope"></i></div><h3 class="font-black text-lg text-slate-900">Esqueci minha senha</h3></div>
                    <p class="text-sm leading-6 text-slate-600">Informe o e-mail cadastrado. Se houver uma conta associada, você receberá um link para criar uma nova senha.</p>
                    <form onsubmit="solicitarRecuperacaoSenhaEmail(event)" class="space-y-3">
                        <label for="rec_email" class="block text-[11px] font-bold uppercase text-slate-500">E-mail cadastrado</label>
                        <input id="rec_email" type="email" autocomplete="email" required maxlength="254" value="${escapeHTML(emailInicial)}" class="w-full p-3 border rounded-2xl bg-slate-50 text-sm" placeholder="voce@exemplo.com">
                        <p id="rec_email_status" role="status" aria-live="polite" class="hidden rounded-xl p-3 text-sm"></p>
                        <div class="flex gap-2 pt-2"><button type="button" onclick="fecharModalContainer()" class="flex-1 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">Cancelar</button><button id="rec_email_btn" type="submit" class="flex-1 py-3 rounded-2xl bg-teal-700 hover:bg-teal-800 text-white font-bold">Enviar link</button></div>
                    </form>
                </div>
            </div>`);
                    setTimeout( () => document.getElementById('rec_email')?.focus(), 50);
                }
                ;

                window.solicitarRecuperacaoSenhaEmail = async function(e) {
                    e.preventDefault();
                    if (!AUTH_SUPABASE) {
                        window.abrirRecuperacaoSenha();
                        return;
                    }
                    const email = (document.getElementById('rec_email')?.value || '').trim().toLowerCase();
                    const btn = document.getElementById('rec_email_btn');
                    if (!email || !email.includes('@')) {
                        alert('Informe um e-mail válido.');
                        return;
                    }
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = 'Enviando…';
                    }
                    try {
                        const destino = new URL(window.location.href);
                        destino.search = '';
                        destino.hash = '';
                        destino.searchParams.set('passwordRecovery', '1');
                        const {error} = await supabaseClient.auth.resetPasswordForEmail(email, {
                            redirectTo: destino.href
                        });
                        if (error) {
                            console.error('Falha ao solicitar recuperação de senha:', error.message);
                            alert('Não foi possível enviar o pedido agora. Confira a conexão, a configuração de e-mail e a URL de redirecionamento permitida no Supabase.');
                            return;
                        }
                        fecharModalContainer();
                        alert('Se esse e-mail estiver cadastrado, enviaremos uma mensagem com o link para criar uma nova senha. Verifique também a caixa de spam.');
                    } catch (err) {
                        console.error('Erro de conexão na recuperação de senha:', err);
                        alert('Não foi possível solicitar a recuperação neste momento. Tente novamente mais tarde.');
                    } finally {
                        if (btn && document.body.contains(btn)) {
                            btn.disabled = false;
                            btn.textContent = 'Enviar link';
                        }
                    }
                }
                ;

                window.finalizarRecuperacaoSenha = async function(e) {
                    e.preventDefault();
                    if (!AUTH_SUPABASE) {
                        renderApp();
                        return;
                    }
                    const s1 = document.getElementById('rec_senha_nova')?.value || '';
                    const s2 = document.getElementById('rec_senha_conf')?.value || '';
                    const status = document.getElementById('rec_senha_status');
                    const btn = document.getElementById('rec_senha_btn');
                    const mostrarStatus = (msg, ok=false) => {
                        if (!status)
                            return;
                        status.textContent = msg;
                        status.className = `rounded-xl p-3 text-sm ${ok ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'}`;
                    }
                    ;
                    if (!senhaForte(s1)) {
                        mostrarStatus(MSG_SENHA);
                        return;
                    }
                    if (s1 !== s2) {
                        mostrarStatus('As senhas não coincidem.');
                        return;
                    }
                    if (btn) {
                        btn.disabled = true;
                        btn.textContent = 'Salvando…';
                    }
                    try {
                        const {data: sessaoAuth, error: erroSessao} = await supabaseClient.auth.getSession();
                        if (erroSessao || !sessaoAuth?.session) {
                            mostrarStatus('Este link expirou ou já foi utilizado. Solicite uma nova recuperação pelo login.');
                            return;
                        }
                        const {error} = await supabaseClient.auth.updateUser({
                            password: s1
                        });
                        if (error) {
                            console.error('Falha ao atualizar senha após recuperação:', error.message);
                            mostrarStatus('Não foi possível salvar a nova senha. Solicite outro link e tente novamente.');
                            return;
                        }
                        try {
                            await supabaseClient.auth.signOut();
                        } catch (err) {
                            console.warn('Senha alterada; não foi possível encerrar a sessão de recuperação automaticamente.', err);
                        }
                        recuperacaoEmailAtiva = false;
                        history.replaceState({}, document.title, window.location.pathname);
                        alert('Senha alterada com sucesso. Entre novamente com seu e-mail e a nova senha.');
                        renderApp();
                    } catch (err) {
                        console.error('Erro durante a recuperação de senha:', err);
                        mostrarStatus('Ocorreu um erro de conexão. Tente novamente.');
                    } finally {
                        if (btn && document.body.contains(btn)) {
                            btn.disabled = false;
                            btn.textContent = 'Salvar nova senha';
                        }
                    }
                }
                ;

                const _renderAppAntesRecuperacaoSenha = renderApp;
                renderApp = function() {
                    if (emFluxoDeRecuperacao()) {
                        const container = document.getElementById('app');
                        if (container)
                            container.innerHTML = telaRecuperacaoSenha();
                        return;
                    }
                    _renderAppAntesRecuperacaoSenha.apply(this, arguments);
                }
                ;

                // Supabase pode identificar a recuperação pelo evento mesmo que a URL seja normalizada.
                if (AUTH_SUPABASE && supabaseClient?.auth) {
                    supabaseClient.auth.onAuthStateChange(event => {
                        if (event === 'PASSWORD_RECOVERY') {
                            recuperacaoEmailAtiva = true;
                            if (document.readyState === 'loading') {
                                document.addEventListener('DOMContentLoaded', () => renderApp(), {
                                    once: true
                                });
                            } else {
                                renderApp();
                            }
                        }
                    }
                    );
                }
            }
            )();
        </script>
        <script type="text/plain" id="guia-seguranca-supabase">
            
GUIA: ATIVAR O LOGIN SEGURO (Supabase Auth + RLS)
=====================================================================
Siga NESTA ORDEM. O sistema só fica protegido de verdade no passo 7.

A URL de retorno do site está definida como https://guardioesdobravos.vercel.app/.
Antes de produção, faça backup e confirme os pontos abaixo.

 1. Supabase > Authentication > URL Configuration: Site URL = https://guardioesdobravos.vercel.app/;
    Redirect URLs deve incluir https://guardioesdobravos.vercel.app/.
 2. Google Cloud: Authorized JavaScript origin = https://guardioesdobravos.vercel.app;
    Authorized redirect URI = https://ycwgwtzysvizossqveiy.supabase.co/auth/v1/callback.
 3. Supabase > Authentication > Sign In / Providers > Google: provider habilitado, Client ID e Secret corretos.
 4. Para um sistema restrito, desative cadastros públicos e crie previamente as contas permitidas em
    Authentication > Users. O e-mail Google precisa corresponder ao e-mail do perfil em Utilizadores.
 5. Publique e teste com uma conta autorizada primeiro. O sistema bloqueia e-mails sem perfil ativo.
 6. Confirme e teste as políticas RLS antes de liberar o sistema. Políticas genéricas para todos os
    utilizadores autenticados não constituem uma lista de acesso individual.
 7. Se houver falha ao carregar a base da nuvem, o sistema não cria nem substitui uma base vazia.
 8. Teste: abra uma janela anônima, abra o console (F12) e rode
      await supabaseClient.from('condominio_dados').select()
    O resultado deve vir VAZIO (sem dados). Se vier com dados, o passo 7 não funcionou.

RECUPERAÇÃO DE SENHA POR E-MAIL
- A opção "Esqueci minha senha" funciona para contas de e-mail/senha no Supabase Auth; usuários que entram exclusivamente com Google usam a segurança da conta Google.
- Em Supabase > Authentication > URL Configuration, adicione a URL HTTPS publicada do sistema à lista Redirect URLs. O sistema acrescenta o parâmetro passwordRecovery=1 ao retorno.
- Em Authentication > Sign In / Providers > Email, mantenha Email ativado. Configure SMTP próprio para envio confiável em produção; o serviço de e-mail padrão do Supabase tem limites e disponibilidade de teste.
- A recuperação por e-mail altera a senha do Supabase Auth, não a senha local antiga. Por isso não ative AUTH_SUPABASE antes de cadastrar/validar todos os utilizadores e testar o acesso em homologação.
- O botão "Continuar com Google" usa signInWithOAuth e retorna para a URL de produção cadastrada.
Cada pessoa pode trocar a própria senha depois de entrar pelo botão da chave no menu.

----- SQL DE EXEMPLO — REVISAR ANTES DE EXECUTAR -----
ATENÇÃO: as políticas abaixo permitem acesso a QUALQUER usuário autenticado.
Só são aceitáveis se o cadastro público estiver desativado e todas as contas em
Supabase > Authentication > Users forem provisionadas e controladas pelo administrador.
Se houver contas não autorizadas, NÃO execute este SQL genérico: implemente uma lista

-- Primeiro, inspecione as políticas atuais; remova políticas públicas antigas com cuidado:

-- (a tabela deve continuar na publicação "supabase_realtime" para a atualização em tempo real)

PARTE 2 — ATIVAR O GOOGLE GEMINI NO ASSISTENTE
=====================================================================
A função assistente-ia precisa ser atualizada no Supabase, pois a versão anterior
chamava Anthropic/Claude. Ter criado uma chave Gemini no painel não altera o código
já publicado. O HTML atualizado contém o código Gemini e permite baixar a função.

1. Gere uma chave de API Gemini no Google AI Studio:
   https://aistudio.google.com/apikey
   Confira os limites e a cobrança aplicáveis à sua conta.

2. No Supabase Dashboard, abra Edge Functions / Function Secrets (ou Edge Function Secrets)
   e adicione:
      Nome: GEMINI_API_KEY
      Valor: sua chave Gemini
   Não coloque essa chave no index.html, no Vercel público ou em mensagens.

3. Substitua o código da função já existente "assistente-ia" pelo arquivo
   assistente-ia-gemini-dados-reais.ts baixado pelo botão "Baixar função Gemini".
   O arquivo deve ser o entrypoint index.ts da função.

4. Publique/redeploy a função assistente-ia. Se usar Supabase CLI:
      supabase login
      supabase link --project-ref ycwgwtzysvizossqveiy
      supabase functions deploy assistente-ia
   Os comandos devem ser executados na pasta do projeto local que contém
   supabase/functions/assistente-ia/index.ts. Não use uma nova função com outro nome.

5. Mantenha a verificação JWT habilitada. A função valida a sessão Supabase Auth,
   verifica um perfil ativo na tabela condominio_dados e só então consulta o Gemini.
   A leitura da tabela precisa estar autorizada pelas políticas RLS do usuário logado.

6. No Google AI Studio, confira se a chave tem acesso à API Gemini e se o modelo
   gemini-3.6-flash está disponível para seu projeto. O nome do modelo fica no início
   do código da função e pode ser ajustado caso a conta não tenha acesso.

7. No módulo Configurações > Assistente Gemini, clique em "Testar conexão Gemini".
   O botão chama a função publicada e confirma se a resposta veio do Gemini.
   Depois teste no chat com uma pergunta aberta. Consulte Supabase > Edge Functions
   > assistente-ia > Logs em caso de falha.

Diagnóstico rápido:
- 401: a sessão Supabase Auth está ausente/expirada ou a verificação JWT recusou a chamada.
- 403: o usuário não tem perfil ativo, ou a leitura da tabela foi bloqueada por RLS.
- 404: a função assistente-ia não existe no projeto/endereço esperado.
- 429: limite de uso da API atingido; verifique quotas e faturamento do Gemini.
- 500 com GEMINI_KEY_MISSING: cadastre o segredo com o nome exato GEMINI_API_KEY.
- 502/GEMINI_API_ERROR: confirme a chave, acesso à API, modelo e logs da função.

O código envia ao Gemini resumos agregados, itens de estoque e contas por categoria; não envia
nome/apartamento de moradores, nomes de empregados/conselheiros nem histórico textual das contas.
Perguntas e histórico recentes também passam por uma tentativa de remoção de e-mails, CPFs, telefones
e nomes conhecidos. Ainda assim, evite incluir dados pessoais na pergunta; valide a privacidade e
o uso permitido antes de liberar a funcionalidade a todos.

Limite indicativo: até 20 perguntas por usuário em 10 minutos por instância ativa da
função. Para impor limite global resistente a múltiplas instâncias, use rate limiting
persistido no banco ou no gateway.

        <script>
            function baixarGuiaSeguranca() {
                const el = document.getElementById('guia-seguranca-supabase');
                const blob = new Blob([el.textContent.replace(/^\r?\n/, '').replace(/\s+$/, '') + '\n'],{
                    type: 'text/plain;charset=utf-8'
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'guia-login-seguro-supabase.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
