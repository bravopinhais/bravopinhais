<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Segura</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Pako (Compressão Gzip) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        .tab-active { border-bottom: 3px solid #0d9488; background-color: #ffffff; color: #0f766e; font-weight: 700; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-full { height: 100vh; position: sticky; top: 0; }
        @media print {
            aside, header, .no-print, button, .actions-col { display: none !important; }
            body { background: white !important; color: black !important; }
            main { padding: 0 !important; }
            .print-break { page-break-before: always; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>
    <div id="modal-container"></div>

    <script>
        let tempArquivoNome = ''; 
        let tempArquivoGzip = ''; 
        let activeCharts = {};
        let firebaseDb = null;

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        const DEFAULT_DATA = {
            condominio: {
                nome: 'Condomínio Guardiões do Bravo',
                cnpj: '12.345.678/0001-90',
                razaoSocial: 'Condomínio Residencial Guardiões do Bravo',
                endereco: 'Rua das Palmeiras, 1000',
                bairro: 'Centro',
                cidade: 'Curitiba',
                uf: 'PR',
                cep: '80000-000',
                telefone: '(41) 3333-0000',
                email: 'contato@guardioesdobravo.com.br'
            },
            conselheiros: [
                { id: 'cons_1', nome: 'Alan Reis', cargo: 'Síndico', BlocoAp: 'Bloco 1 - Ap 137', telefone: '(41) 99999-9999', inicioMandato: '2026-01-01', fimMandato: '2027-12-31', status: 'Ativo' },
                { id: 'cons_2', nome: 'Carlos Eduardo', cargo: 'Subsíndico', BlocoAp: 'Bloco 1 - Ap 102', telefone: '(41) 98888-8888', inicioMandato: '2026-01-01', fimMandato: '2027-12-31', status: 'Ativo' }
            ],
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', senhaHash: 'Admin@12345' }
            ],
            financeiro: [
                { id: 'fin_1', tipo: 'Receber', historico: 'Taxa Condominial Ordinária - Ap 137', valor: 2500.00, vencimento: '2026-10-15', status: 'Aberto' }
            ],
            formas_monetarias: [
                { id: 'fm_1', nome: 'MOVIMENTO BANCARIO', multaPct: 2.0, jurosDiaPct: 0.033, status: 'Ativo' }
            ],
            contas_bancarias: [
                { id: 'cb_1', banco: 'CAIXA BARAO', agencia: '1234-5', conta: '98765-4', saldo: 45800.00 }
            ],
            moradores: [
                { 
                    id: 'mor_1', bloco: '1', apartamento: '137', nome: 'Alan Reis', email: 'alan@email.com', telefone: '(41) 99999-9999', tipo: 'Proprietário', 
                    petNome: 'Angel', petRaca: 'Gato Rajado', petCor: 'Cinza', petIdade: '2 anos',
                    veiculoModelo: 'Onix', veiculoPlaca: 'ABC-1234', veiculoCor: 'Prata', vagaGaragem: 'Vaga 42',
                    observacoes: 'Proprietário residente' 
                }
            ],
            fornecedores: [
                { id: 'for_1', cnpj: '00.000.000/0001-00', razaoSocial: 'Fornecedor Exemplo Ltda', email: 'contato@exemplo.com', telefone: '(41) 3333-4444' }
            ],
            empregados: [
                { id: 'emp_1', nome: 'João da Silva', cargo: 'Porteiro', funcao: 'Controle de Acesso', telefone: '(41) 98888-1111' }
            ],
            categorias: [
                { id: 'cat_1', nome: 'Atas de Assembleia', modulo: 'Documentos' }
            ],
            estoque: [
                { id: 'est_1', item: 'Extintor ABC', categoria: 'Segurança', qtd: 4, localizacao: 'Hall Principal' }
            ],
            documentos: [
                { id: 'doc_1', titulo: 'Ata Assembleia Outubro', pasta: 'Atas de Assembleia', nomeArquivo: 'ata_out.pdf' }
            ]
        };

        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (data) {
                    const parsed = JSON.parse(data);
                    return { ...DEFAULT_DATA, ...parsed };
                }
                return JSON.parse(JSON.stringify(DEFAULT_DATA));
            } catch (e) {
                return JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
        }

        function salvarDados(data) {
            try { 
                localStorage.setItem('guardioes_bravo_db', JSON.stringify(data)); 
            } catch (e) { 
                alert('Aviso: Armazenamento local cheio.'); 
            }
        }

        let db = carregarDados();
        let sessao = { usuarioLogado: null };

        try {
            const sessaoData = sessionStorage.getItem('guardioes_sessao');
            if (sessaoData) sessao.usuarioLogado = JSON.parse(sessaoData);
        } catch (e) { sessao.usuarioLogado = null; }

        let tabsState = { openTabs: ['dashboard'], activeTab: 'dashboard' };
        let morFiltros = { busca: '', blocoApFiltro: 'Todos', ordenacao: 'bloco', direcao: 'asc' };

        const MODULE_NAMES = {
            dashboard: 'Dashboard',
            condominio: 'Dados do Condomínio & Conselho',
            financeiro: 'Contas Pagar/Receber',
            formas_monetarias: 'Formas Monetárias',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores / Unidades',
            fornecedores: 'Fornecedores',
            empregados: 'Empregados',
            categorias: 'Pastas & Categorias',
            estoque: 'Estoque & Bens',
            documentos: 'Gestão de Documentos',
            relatorios: 'Central de Relatórios & DRE',
            usuarios: 'Gestão de Usuários'
        };

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            fecharMenuMobile();
            renderApp();
            if (moduloId === 'dashboard') setTimeout(inicializarGraficosDashboard, 50);
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
            if (tabsState.activeTab === 'dashboard') setTimeout(inicializarGraficosDashboard, 50);
        }

        function toggleMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        function fecharMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function exportarParaPDF() { window.print(); }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const userFound = (db.usuarios || []).find(u => u.usuario === userInput || u.email === userInput);
            if (userFound && userFound.senhaHash === senhaInput) {
                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                renderApp();
                setTimeout(inicializarGraficosDashboard, 50);
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            try { sessionStorage.removeItem('guardioes_sessao'); } catch (e) {}
            renderApp();
        }

        function renderTelaLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold mx-auto shadow-lg">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <h2 class="text-2xl font-black text-slate-800">Guardiões do Bravo</h2>
                            <p class="text-xs text-slate-500 font-bold uppercase">Acesso ao Sistema Condominial</p>
                        </div>
                        <form onsubmit="realizarLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Usuário / E-mail</label>
                                <input type="text" id="login_user" required value="admin" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Senha</label>
                                <input type="password" id="login_pass" required value="Admin@12345" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-lg shadow-teal-600/30 transition text-sm">
                                Entrar no Sistema
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderMainOnly() {
            const mainEl = document.querySelector('main');
            if (mainEl) {
                mainEl.innerHTML = renderModuleContent(tabsState.activeTab);
                if (tabsState.activeTab === 'dashboard') setTimeout(inicializarGraficosDashboard, 50);
            }
        }

        function renderApp() {
            const container = document.getElementById('app');
            if (!container) return;
            if (!sessao.usuarioLogado) {
                container.innerHTML = renderTelaLogin();
                return;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col md:flex-row min-h-screen">
                    <div id="sidebar-backdrop" onclick="fecharMenuMobile()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden"></div>

                    <aside id="sidebar-menu" class="fixed md:sticky top-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col sidebar-full border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
                        <div class="p-4 bg-slate-950 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold text-xl shadow"><i class="fa-solid fa-shield-halved"></i></div>
                                <div><h1 class="font-bold text-white text-base leading-tight">Guardiões</h1><p class="text-xs text-teal-400">Gestão Condominial</p></div>
                            </div>
                            <button onclick="fecharMenuMobile()" class="md:hidden text-slate-400 hover:text-white p-2">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos Principais</p>
                            <button onclick="abrirModulo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</button>
                            <button onclick="abrirModulo('condominio')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'condominio' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-building w-5 text-center"></i> Dados do Condomínio</button>
                            <button onclick="abrirModulo('financeiro')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'financeiro' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-receipt w-5 text-center"></i> Pagar/Receber</button>
                            <button onclick="abrirModulo('formas_monetarias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'formas_monetarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-money-bill-transfer w-5 text-center"></i> Formas Monetárias</button>
                            <button onclick="abrirModulo('contas_bancarias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'contas_bancarias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-building-columns w-5 text-center"></i> Contas Bancárias</button>
                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-users w-5 text-center"></i> Moradores</button>
                            <button onclick="abrirModulo('fornecedores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'fornecedores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-truck-fast w-5 text-center"></i> Fornecedores</button>
                            <button onclick="abrirModulo('empregados')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'empregados' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-tie w-5 text-center"></i> Empregados</button>
                            
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Estoque & Documentos</p>
                            <button onclick="abrirModulo('categorias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'categorias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-tree w-5 text-center"></i> Pastas & Categorias</button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Estoque & Bens</button>
                            <button onclick="abrirModulo('documentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'documentos' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-open w-5 text-center"></i> Documentos</button>
                            
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Gestão & Configurações</p>
                            <button onclick="abrirModulo('relatorios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'relatorios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Central de Relatórios</button>
                            <button onclick="abrirModulo('usuarios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'usuarios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-gear w-5 text-center"></i> Gestão de Usuários</button>
                        </nav>

                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-200 truncate pr-2">${escapeHTML(sessao.usuarioLogado.nome)}</span>
                            <button onclick="encerrarSessao()" title="Sair" class="p-2 text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
                        <header class="bg-slate-900 text-white p-3 flex md:hidden items-center justify-between border-b border-slate-800 no-print">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleMenuMobile()" class="p-2 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700">
                                    <i class="fa-solid fa-bars text-lg"></i>
                                </button>
                                <span class="font-bold text-sm">Guardiões do Bravo</span>
                            </div>
                            <button onclick="encerrarSessao()" class="text-xs bg-red-600/20 text-red-400 px-2.5 py-1.5 rounded-md font-bold">Sair</button>
                        </header>

                        <div class="bg-slate-200 border-b border-slate-300 flex items-center overflow-x-auto px-2 pt-2 gap-1 no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer ${tabsState.activeTab === tabId ? 'tab-active shadow-sm' : 'bg-slate-300 text-slate-600'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `<button onclick="fecharAba(event, '${tabId}')" class="hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;

            if (tabsState.activeTab === 'dashboard') setTimeout(inicializarGraficosDashboard, 50);
        }

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            let btnExportHtml = `
                <button onclick="exportarParaPDF()" class="px-3 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-bold text-xs shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf"></i> Exportar PDF
                </button>
            `;

            if (moduloId === 'condominio') btnNovoHtml = `<button onclick="window.renderModalConselheiro()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Membro do Conselho</button>`;
            else if (moduloId === 'financeiro') btnNovoHtml = `<button onclick="window.renderModalNovoTitulo()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Título</button>`;
            else if (moduloId === 'moradores') btnNovoHtml = `<button onclick="window.renderModalMorador()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            else if (moduloId === 'empregados') btnNovoHtml = `<button onclick="window.renderModalEmpregado()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Empregado</button>`;
            else if (moduloId === 'fornecedores') btnNovoHtml = `<button onclick="window.renderModalFornecedor()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Fornecedor</button>`;

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                    <div><h2 class="text-xl md:text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2><p class="text-xs text-slate-500">Módulo Ativo</p></div>
                    <div class="flex flex-wrap items-center gap-2 no-print">${btnExportHtml} ${btnNovoHtml}</div>
                </div>
            `;

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'condominio': return headerGlobal + renderCondominioView();
                case 'financeiro': return headerGlobal + renderFinanceiroView();
                case 'moradores': return headerGlobal + renderMoradoresView();
                case 'fornecedores': return headerGlobal + renderFornecedoresView();
                case 'empregados': return headerGlobal + renderEmpregadosView();
                case 'relatorios': return headerGlobal + renderRelatoriosCentralView();
                default: return headerGlobal + `<div class="bg-white p-6 rounded-xl border font-bold text-slate-700">Módulo ${MODULE_NAMES[moduloId]} Ativo.</div>`;
            }
        }

        function abrirModalContainer(html) {
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = html;
        }

        function fecharModalContainer() {
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = '';
        }

        // =====================================
        // MÓDULO: DADOS DO CONDOMÍNO & CONSELHO
        // =====================================
        function renderCondominioView() {
            const cond = db.condominio || {};
            const conselheiros = db.conselheiros || [];

            return `
                <div class="space-y-6">
                    <!-- DADOS CADASTRAIS DO CONDOMÍNIO -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-building text-teal-600"></i> Informações do Condomínio
                            </h3>
                            <button onclick="salvarDadosCondominio()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-4 py-2 rounded-lg font-bold shadow transition flex items-center gap-1.5">
                                <i class="fa-solid fa-floppy-disk"></i> Salvar Dados
                            </button>
                        </div>
                        <form id="form_condominio" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nome do Condomínio</label>
                                <input type="text" id="cond_nome" value="${escapeHTML(cond.nome)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">CNPJ</label>
                                <input type="text" id="cond_cnpj" value="${escapeHTML(cond.cnpj)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div class="md:col-span-3">
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Razão Social</label>
                                <input type="text" id="cond_razao" value="${escapeHTML(cond.razaoSocial)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Endereço</label>
                                <input type="text" id="cond_end" value="${escapeHTML(cond.endereco)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Bairro</label>
                                <input type="text" id="cond_bairro" value="${escapeHTML(cond.bairro)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Cidade</label>
                                <input type="text" id="cond_cidade" value="${escapeHTML(cond.cidade)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Estado (UF)</label>
                                <input type="text" id="cond_uf" value="${escapeHTML(cond.uf)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">CEP</label>
                                <input type="text" id="cond_cep" value="${escapeHTML(cond.cep)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Telefone Principal</label>
                                <input type="text" id="cond_tel" value="${escapeHTML(cond.telefone)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">E-mail Administrativo</label>
                                <input type="email" id="cond_email" value="${escapeHTML(cond.email)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                        </form>
                    </div>

                    <!-- TABELA DE CONSELHEIROS E CORPO DIRETIVO -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                            <h3 class="font-bold text-sm flex items-center gap-2">
                                <i class="fa-solid fa-user-shield text-teal-400"></i> Corpo Diretivo & Conselheiros
                            </h3>
                        </div>
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-800 text-white font-bold uppercase tracking-wider text-[11px]">
                                    <th class="p-3">Nome do Membro</th>
                                    <th class="p-3">Cargo / Função</th>
                                    <th class="p-3">Bloco / Ap</th>
                                    <th class="p-3">Contato</th>
                                    <th class="p-3">Vigência do Mandato</th>
                                    <th class="p-3 text-center actions-col">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 font-medium text-slate-700">
                                ${conselheiros.length === 0 ? `<tr><td colspan="6" class="p-6 text-center text-slate-400">Nenhum membro cadastrado no conselho.</td></tr>` : conselheiros.map(c => `
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="p-3 font-bold text-slate-900">${escapeHTML(c.nome)}</td>
                                        <td class="p-3"><span class="px-2 py-0.5 bg-teal-100 text-teal-800 rounded font-bold text-[10px]">${escapeHTML(c.cargo)}</span></td>
                                        <td class="p-3 font-bold text-slate-700">${escapeHTML(c.BlocoAp || '-')}</td>
                                        <td class="p-3">${escapeHTML(c.telefone)}</td>
                                        <td class="p-3 font-mono">${escapeHTML(c.inicioMandato || '-')} até ${escapeHTML(c.fimMandato || '-')}</td>
                                        <td class="p-3 text-center actions-col">
                                            <div class="flex items-center justify-center gap-1">
                                                <button onclick="window.renderModalConselheiro('${c.id}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition"><i class="fa-solid fa-pen"></i></button>
                                                <button onclick="excluirRegistro('conselheiros', '${c.id}')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md transition"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function salvarDadosCondominio() {
            db.condominio = {
                nome: document.getElementById('cond_nome').value.trim(),
                cnpj: document.getElementById('cond_cnpj').value.trim(),
                razaoSocial: document.getElementById('cond_razao').value.trim(),
                endereco: document.getElementById('cond_end').value.trim(),
                bairro: document.getElementById('cond_bairro').value.trim(),
                cidade: document.getElementById('cond_cidade').value.trim(),
                uf: document.getElementById('cond_uf').value.trim(),
                cep: document.getElementById('cond_cep').value.trim(),
                telefone: document.getElementById('cond_tel').value.trim(),
                email: document.getElementById('cond_email').value.trim()
            };
            salvarDados(db);
            alert('Dados do condomínio salvos com sucesso!');
        }

        window.renderModalConselheiro = function(id = null) {
            if (!db.conselheiros) db.conselheiros = [];
            const item = id ? db.conselheiros.find(x => x.id === id) : { id: '', nome: '', cargo: 'Conselheiro Fiscal', BlocoAp: '', telefone: '', inicioMandato: '', fimMandato: '' };
            abrirModalContainer(`
                <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-lg text-slate-800">${id ? 'Editar Conselheiro' : 'Novo Conselheiro / Membro'}</h3>
                            <button onclick="fecharModalContainer()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <form onsubmit="salvarModalConselheiro(event, '${id}')" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nome Completo</label>
                                <input type="text" id="m_cons_nome" required value="${escapeHTML(item.nome)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Cargo</label>
                                    <select id="m_cons_cargo" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                        <option value="Síndico" ${item.cargo === 'Síndico' ? 'selected' : ''}>Síndico</option>
                                        <option value="Subsíndico" ${item.cargo === 'Subsíndico' ? 'selected' : ''}>Subsíndico</option>
                                        <option value="Conselheiro Fiscal" ${item.cargo === 'Conselheiro Fiscal' ? 'selected' : ''}>Conselheiro Fiscal</option>
                                        <option value="Conselheiro Consultivo" ${item.cargo === 'Conselheiro Consultivo' ? 'selected' : ''}>Conselheiro Consultivo</option>
                                        <option value="Secretário" ${item.cargo === 'Secretário' ? 'selected' : ''}>Secretário</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Bloco / Unidade</label>
                                    <input type="text" id="m_cons_ap" value="${escapeHTML(item.BlocoAp)}" placeholder="Ex: Bloco 1 - Ap 137" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Telefone de Contato</label>
                                <input type="text" id="m_cons_tel" value="${escapeHTML(item.telefone)}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Início Mandato</label>
                                    <input type="date" id="m_cons_inicio" value="${item.inicioMandato || ''}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Fim Mandato</label>
                                    <input type="date" id="m_cons_fim" value="${item.fimMandato || ''}" class="w-full p-2.5 border rounded-lg text-xs font-bold bg-slate-50">
                                </div>
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModalContainer()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold">Salvar Membro</button>
                            </div>
                        </form>
                    </div>
                </div>
            `);
        };

        function salvarModalConselheiro(e, id) {
            e.preventDefault();
            if (!db.conselheiros) db.conselheiros = [];
            const newItem = {
                id: id && id !== 'null' ? id : 'cons_' + Date.now(),
                nome: document.getElementById('m_cons_nome').value.trim(),
                cargo: document.getElementById('m_cons_cargo').value,
                BlocoAp: document.getElementById('m_cons_ap').value.trim(),
                telefone: document.getElementById('m_cons_tel').value.trim(),
                inicioMandato: document.getElementById('m_cons_inicio').value,
                fimMandato: document.getElementById('m_cons_fim').value
            };
            const idx = db.conselheiros.findIndex(x => x.id === newItem.id);
            if (idx !== -1) db.conselheiros[idx] = newItem;
            else db.conselheiros.push(newItem);
            salvarDados(db);
            fecharModalContainer();
            renderMainOnly();
        }

        // Dashboard e demais telas seguem a lógica unificada
        function renderDashboardView() {
            return `<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><h3 class="font-bold text-slate-800">Painel Principal Guardiões do Bravo</h3></div>`;
        }
        function renderFinanceiroView() { return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Financeiro</h3></div>`; }
        function renderMoradoresView() { return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Moradores</h3></div>`; }
        function renderFornecedoresView() { return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Fornecedores</h3></div>`; }
        function renderEmpregadosView() { return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Módulo Empregados</h3></div>`; }
        function renderRelatoriosCentralView() { return `<div class="bg-white p-6 rounded-2xl border"><h3 class="font-bold">Central de Relatórios</h3></div>`; }

        function excluirRegistro(colecao, id) {
            if (!confirm('Deseja remover este registro?')) return;
            if (db[colecao]) {
                db[colecao] = db[colecao].filter(x => x.id !== id);
                salvarDados(db);
                renderMainOnly();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
