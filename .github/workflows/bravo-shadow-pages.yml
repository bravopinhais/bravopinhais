name: Bravo Shadow — validar preview estático

on:
  push:
    branches:
      - bravo-shadow
    paths:
      - "bravo-shadow/frontend/**"
      - ".github/workflows/bravo-shadow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bravo-shadow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar site estático
        run: |
          mkdir -p _site
          cp -R bravo-shadow/frontend/. _site/
          touch _site/.nojekyll

      - name: Validar arquivos e proteções do preview
        run: |
          test -s _site/index.html
          test -s _site/js/bravo-bootstrap.js
          grep -q 'function usuariosView' _site/index.html
          grep -q 'const IS_STATIC_PREVIEW=location.hostname.endsWith("github.io")' _site/index.html
          grep -q 'PREVIEW ESTÁTICO · GITHUB PAGES' _site/index.html
          grep -q 'Indicadores aguardando autenticação' _site/index.html
          grep -q '<a class="skip-link" href="#main-content">' _site/index.html
          grep -q '<main class="main" id="main-content" tabindex="-1">' _site/index.html
          grep -q '<div id="view" aria-live="polite" aria-atomic="true">' _site/index.html
          grep -q '@media(max-width:980px)' _site/index.html
          grep -q '@media(prefers-reduced-motion:reduce)' _site/index.html
          grep -q 'async function loadFormasMonetarias' _site/index.html
          grep -q 'api.get("/api/v1/formas-monetarias"' _site/index.html
          grep -q 'function financeiroView' _site/index.html
          grep -q 'api.get("/api/v1/financeiro"' _site/index.html
          grep -q 'function relatoriosView' _site/index.html
          grep -q 'api.get("/api/v1/relatorios/dre"' _site/index.html
          grep -q 'function comprasConsumoView' _site/index.html
          grep -q 'api.get(comprasConsumoQueryPath()' _site/index.html
          grep -q 'value.enabled !== true' _site/js/bravo-bootstrap.js
          grep -q 'A API deve usar a mesma origem HTTPS desta homologação.' _site/js/bravo-bootstrap.js
          grep -q 'Login Google bloqueado: API HTTPS e configuração Shadow ainda não confirmadas.' _site/js/bravo-bootstrap.js
