        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (!data) return DEFAULT_DATA;
                const parsed = JSON.parse(data);
                
                if (!parsed.categorias) parsed.categorias = DEFAULT_DATA.categorias;
                if (!parsed.documentos) parsed.documentos = DEFAULT_DATA.documentos;
                if (!parsed.formas_monetarias) parsed.formas_monetarias = DEFAULT_DATA.formas_monetarias;
                if (!parsed.usuarios) parsed.usuarios = DEFAULT_DATA.usuarios;
                if (!parsed.dre_config) parsed.dre_config = DEFAULT_DATA.dre_config;
                if (!parsed.estoque) parsed.estoque = DEFAULT_DATA.estoque;
                if (!parsed.moradores) parsed.moradores = DEFAULT_DATA.moradores;
                if (!parsed.contas_bancarias) parsed.contas_bancarias = DEFAULT_DATA.contas_bancarias;
                if (!parsed.financeiro) parsed.financeiro = DEFAULT_DATA.financeiro;
                
                return parsed;
            } catch (e) {
                console.error('Erro ao carregar localStorage:', e);
                return DEFAULT_DATA;
            }
        }

        function salvarDados(data) {
            try { 
                localStorage.setItem('guardioes_bravo_db', JSON.stringify(data));

        function registrarLog(modulo, acao, detalhe) {
            const user = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            db.logs.unshift({ id: 'log_' + Date.now(), dataHora: new Date().toLocaleString('pt-BR'), modulo, acao, usuario: user, detalhe });
            salvarDados(db);
        }

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            fecharMenuMobile();
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
        }

        function toggleMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        function fecharMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) {
                alert('Não há dados disponíveis para exportação.');
                return;
            }
            const sanitizeData = dados.map(item => {
                let obj = { ...item };
                delete obj.fotoBase64;
                delete obj.arquivoBase64;
                return obj;
            });

            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(';') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => {
                    let val = row[k] === null || row[k] === undefined ? '' : row[k];
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csvContent += values.join(';') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeArquivo.endsWith('.xlsx') || nomeArquivo.endsWith('.csv') ? nomeArquivo : nomeArquivo + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportarParaPDF() { window.print(); }

        function processarUploadBase64(event, targetImgId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempBase64 = e.target.result;
                const imgEl = document.getElementById(targetImgId);
                if (imgEl) {
                    if (file.type.startsWith('image/')) {
                        imgEl.src = tempBase64;
                        imgEl.classList.remove('hidden');
                    } else if (file.type === 'application/pdf') {
                        imgEl.src = 'https://upload.wikimedia.org/wikipedia/commons/8/87/PDF_file_icon.svg';
                        imgEl.classList.remove('hidden');
                    } else {
                        imgEl.src = 'https://upload.wikimedia.org/wikipedia/commons/0/0c/File-icon.png';
                        imgEl.classList.remove('hidden');
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const userFound = db.usuarios.find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                registrarLog('Segurança', 'Login Sucesso', `Usuário ${userFound.usuario} logou.`);
                renderApp();
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            try { sessionStorage.removeItem('guardioes_sessao'); } catch (e) {}

        function setDashPeriodo(tipo) {
            const hoje = new Date().toISOString().split('T')[0];
            if (tipo === 'hoje') { dashFiltro.dtIni = hoje; dashFiltro.dtFim = hoje; }
            else if (tipo === 'mes') {
                const now = new Date();
                dashFiltro.dtIni = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                dashFiltro.dtFim = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
            } else if (tipo === 'ano') {
                const now = new Date();
                dashFiltro.dtIni = `${now.getFullYear()}-01-01`;
                dashFiltro.dtFim = `${now.getFullYear()}-12-31`;
            } else if (tipo === 'tudo') {
                dashFiltro.dtIni = ''; dashFiltro.dtFim = '';
            }
            renderApp();
        }

        function atualizarFiltroDash() {
            dashFiltro.dtIni = document.getElementById('dash_dt_ini').value;
            dashFiltro.dtFim = document.getElementById('dash_dt_fim').value;
            renderApp();
        }

        function limparFiltroDash() { dashFiltro.dtIni = ''; dashFiltro.dtFim = ''; renderApp(); }

        function renderDashboardCharts() {
            if (typeof Chart === 'undefined') return;
            const ctxDonut = document.getElementById('chartDonut');
            const ctxBar = document.getElementById('chartBar');

            let lista = db.financeiro || [];
            if (dashFiltro.dtIni) lista = lista.filter(f => f.vencimento >= dashFiltro.dtIni);
            if (dashFiltro.dtFim) lista = lista.filter(f => f.vencimento <= dashFiltro.dtFim);

            const rec = lista.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pag = lista.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const recAb = lista.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((a, b) => a + b.valor, 0);
            const pagAb = lista.filter(f => f.tipo === 'Pagar' && f.status === 'Aberto').reduce((a, b) => a + b.valor, 0);

            if (ctxDonut) new Chart(ctxDonut, { type: 'doughnut', data: { labels: ['Receitas', 'Despesas'], datasets: [{ data: [rec || 1, pag || 0.1], backgroundColor: ['#059669', '#e11d48'] }] }, options: { responsive: true, maintainAspectRatio: false } });
            if (ctxBar) new Chart(ctxBar, { type: 'bar', data: { labels: ['A Receber', 'A Pagar'], datasets: [{ label: 'Valor Aberto (R$)', data: [recAb, pagAb], backgroundColor: ['#34d399', '#f87171'] }] }, options: { responsive: true, maintainAspectRatio: false } });
        }

                                <option value="Pagar" ${finFiltros.tipo === 'Pagar' ? 'selected' : ''}>A Pagar</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">

            finFiltros.competencia = document.getElementById('flt_comp').value;
            finFiltros.status = document.getElementById('flt_status').value;

            `;

        function salvarNovoTituloForm(e, tituloId = '') {
            e.preventDefault();
            const tipo = document.getElementById('nt_tipo').value;
            const valor = parseFloat(document.getElementById('nt_valor').value) || 0;
            const historico = document.getElementById('nt_hist').value.trim();
            const competencia = document.getElementById('nt_comp').value.trim();
            const vencimento = document.getElementById('nt_venc').value;

            if (tituloId) {
                const f = db.financeiro.find(x => x.id === tituloId);
                if (f) { f.tipo = tipo; f.valor = valor; f.historico = historico; f.competencia = competencia; f.vencimento = vencimento; }
            } else {
                db.financeiro.push({ id: 'fin_' + Date.now(), tipo, valor, historico, competencia, vencimento, status: 'Aberto' });
            }
            salvarDados(db); fecharModal('modal_novo_t'); renderApp();
        }

        // ESTOQUE (+ FILTROS)
        // =====================================
        function renderEstoqueView() {
            let list = db.estoque || [];
            const hoje = new Date().toISOString().split('T')[0];

            if (estFiltros.categoria !== 'Todas') list = list.filter(e => e.categoria === estFiltros.categoria);
            if (estFiltros.status === 'Critico') list = list.filter(e => e.qtd <= e.minimo);
            else if (estFiltros.status === 'OK') list = list.filter(e => e.qtd > e.minimo);
            if (estFiltros.busca.trim() !== '') {
                const b = estFiltros.busca.toLowerCase();
                list = list.filter(e => (e.item || '').toLowerCase().includes(b) || (e.localizacao || '').toLowerCase().includes(b));
            }

        function salvarEstoqueForm(ev, itemId = '') {
            ev.preventDefault();

            const cat = document.getElementById('est_categoria').value;
            const qtd = parseInt(document.getElementById('est_qtd').value) || 0;
            const min = parseInt(document.getElementById('est_min').value) || 0;

            if (itemId) {
                const e = db.estoque.find(x => x.id === itemId);
                if (e) { e.item = item; e.categoria = cat; e.qtd = qtd; e.minimo = min; e.fotoBase64 = tempBase64; }
            } else {
                db.estoque.push({ id: 'est_' + Date.now(), item, categoria: cat, qtd, minimo: min, fotoBase64: tempBase64 });
            }

            salvarDados(db); fecharModal('modal_est'); renderApp();
        }

            const titulo = document.getElementById('doc_titulo').value.trim();
            const pasta = document.getElementById('doc_pasta').value;
            const data = document.getElementById('doc_data').value;
            const obs = document.getElementById('doc_obs').value.trim();

            salvarDados(db); fecharModal('modal_doc'); renderApp();

            const isImage = d.arquivoBase64.startsWith('data:image');

                            <p class="text-[10px] text-slate-400">Pasta: ${escapeHTML(d.pasta)} | Data: ${d.data}</p>
                        </div>
                        <div class="flex gap-3">
                            <a href="${d.arquivoBase64}" download="${d.titulo}_${d.id}" class="p-2 bg-teal-600 hover:bg-teal-700 text-white rounded text-xs font-bold shadow"><i class="fa-solid fa-download"></i> Baixar</a>

                    <div class="flex-1 overflow-auto flex items-center justify-center p-4">

        function salvarCategoriaForm(e, catId = '') {
            e.preventDefault();
            const nome = document.getElementById('cat_nome').value.trim();
            const modulo = document.getElementById('cat_modulo').value;

            if (catId) {
                const c = db.categorias.find(x => x.id === catId);
                if (c) {
                    const oldNome = c.nome;
                    c.nome = nome; c.modulo = modulo;
                    if (oldNome !== nome) {
                        db.documentos.forEach(d => { if (d.pasta === oldNome) d.pasta = nome; });
                        db.estoque.forEach(est => { if (est.categoria === oldNome) est.categoria = nome; });
                    }
                }
            } else {
                db.categorias.push({ id: 'cat_' + Date.now(), nome, modulo });
            }

            salvarDados(db); fecharModal('modal_cat'); renderApp();
        }

        function calcularValorLinhaDRE(row, valoresAcumulados) {
            const recTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pagTotal = db.financeiro.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pendTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((a, b) => a + b.valor, 0);

            if (row.tipo === 'direto') {
                if (row.operacao === 'somar_receitas') return recTotal;
                if (row.operacao === 'somar_pendencias') return pendTotal;
                if (row.operacao === 'somar_despesas') return pagTotal;
                return parseFloat(row.valorFixo || 0);
            }

            if (row.tipo === 'formula' && row.formula) {
                try {
                    let expr = row.formula.toUpperCase();
                    Object.keys(valoresAcumulados).forEach(k => {
                        const regex = new RegExp('\\b' + k + '\\b', 'g');
                        expr = expr.replace(regex, valoresAcumulados[k]);
                    });
                    return eval(expr) || 0;
                } catch (e) { return 0; }
            }
            return 0;
        }

            const formula = document.getElementById('dre_formula').value.trim();

            if (linhaId) {
                const r = db.dre_config.find(x => x.id === linhaId);
                if (r) { r.id = id; r.tipo = tipo; r.label = label; r.operacao = operacao; r.formula = formula; }
            } else {
                db.dre_config.push({ id, tipo, label, operacao, formula });
            }
            salvarDados(db); fecharModal('modal_dre_linha'); renderApp();
        }

        function excluirLinhaDRE(id) {
            if (confirm(`Deseja excluir a linha ${id}?`)) {
                db.dre_config = db.dre_config.filter(x => x.id !== id);
                salvarDados(db); renderApp();
            }
        }
        function restaurarDREPadrao() {
            if (confirm('Restaurar a estrutura padrão da DRE?')) {
                db.dre_config = DEFAULT_DATA.dre_config;
                salvarDados(db); renderApp();
            }
        }

        function abrirTelaPagarParcial(id, modo = 'parcial') {
            const f = db.financeiro.find(x => x.id === id);
            if (!f) return;

            const html = `
                <div id="modal_pagar_parcial" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-3">
                    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                        <div class="p-4 bg-slate-100 border-b flex items-center justify-between">
                            <h3 class="text-base font-bold text-slate-700 flex items-center gap-2"><i class="fa-solid fa-file-invoice-dollar text-teal-600"></i> Liquidação de Título</h3>
                            <button onclick="fecharModal('modal_pagar_parcial')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-5 space-y-4 text-xs">
                            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div>
                                    <label class="block font-bold text-slate-600 uppercase text-[10px] mb-1">Forma Monetária</label>
                                    <select id="bx_forma_sel" class="w-full p-2 border rounded font-bold bg-white text-slate-900">
                                        ${db.formas_monetarias.map(m => `<option value="${m.id}">${escapeHTML(m.nome)}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block font-bold text-slate-600 uppercase text-[10px] mb-1">Valor Original</label>
                                        <input type="text" readonly value="R$ ${f.valor.toFixed(2)}" class="w-full p-2 border rounded font-bold bg-slate-100">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-600 uppercase text-[10px] mb-1">Valor Baixado</label>
                                        <input type="number" step="0.01" id="bx_val_baixa" value="${f.valor.toFixed(2)}" class="w-full p-2 border border-teal-500 rounded font-bold bg-teal-50 text-slate-900">
                                    </div>
                                </div>
                                <div class="pt-2">
                                    <button onclick="confirmarEFinalizarBaixa('${f.id}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-xs shadow"><i class="fa-solid fa-check"></i> Confirmar Baixa</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function confirmarEFinalizarBaixa(id) {
            const f = db.financeiro.find(x => x.id === id);
            if (!f) return;

            const valBaixa = parseFloat(document.getElementById('bx_val_baixa').value) || 0;
            const formaId = document.getElementById('bx_forma_sel').value;

            if (valBaixa <= 0) { alert('Informe um valor de baixa válido!'); return; }

            if (valBaixa < f.valor) {
                const residuo = f.valor - valBaixa;
                f.valor = valBaixa;
                f.status = 'Baixado';
                f.formaMonetariaId = formaId;

                db.financeiro.push({
                    id: 'fin_' + Date.now(), tipo: f.tipo, historico: `${f.historico} (Resíduo)`, valor: residuo, vencimento: f.vencimento, competencia: f.competencia, fornecedor: f.fornecedor, status: 'Aberto'
                });
            } else {
                f.status = 'Baixado'; f.formaMonetariaId = formaId;
            }

            salvarDados(db); fecharModal('modal_pagar_parcial'); renderApp();
        }

        function excluirItemGenerico(modKey, itemId) {
            if (confirm('Deseja excluir este registro?')) {
                db[modKey] = db[modKey].filter(x => x.id !== itemId);
                salvarDados(db); renderApp();
            }
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // =====================================
        // MAPEAMENTO EXPLICITO NO ESCOPO GLOBAL (WINDOW)
        // (Resolve o Uncaught ReferenceError de chamadas HTML)
        // =====================================
        window.openModalPasta = function(id = null) { renderModalCategoria(id); };
        window.openModalCategoria = function(id = null) { renderModalCategoria(id); };
        window.openModalNovoTitulo = function(id = null) { renderModalNovoTitulo(id); };
        window.openModalMorador = function(id = null) { renderModalMorador(id); };
        window.openModalContaBancaria = function(id = null) { renderModalContaBancaria(id); };
        window.openModalFormaMonetaria = function(id = null) { renderModalFormaMonetaria(id); };
        window.openModalEstoque = function(id = null) { renderModalEstoque(id); };
        window.openModalDocumento = function(id = null) { renderModalDocumento(id); };
        window.openModalUsuario = function(id = null) { renderModalUsuario(id); };

        window.renderModalCategoria = renderModalCategoria;
        window.renderModalNovoTitulo = renderModalNovoTitulo;
        window.renderModalMorador = renderModalMorador;
        window.renderModalContaBancaria = renderModalContaBancaria;
        window.renderModalFormaMonetaria = renderModalFormaMonetaria;
        window.renderModalEstoque = renderModalEstoque;
        window.renderModalDocumento = renderModalDocumento;
        window.renderModalUsuario = renderModalUsuario;
        window.renderModalDRELinha = renderModalDRELinha;

        function iniciarAplicacao() { renderApp(); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarAplicacao);
        else iniciarAplicacao();
    </script>
</body>
</html>
