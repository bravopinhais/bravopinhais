<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões do Bravo - Gestão Condominial Segura</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Pako (Compressão Gzip para economizar localStorage) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>
    <div id="modal-container"></div>

    <script>
        let tempArquivoNome = ''; 
        let tempArquivoGzip = ''; 
        let activeCharts = {};

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        const DEFAULT_DATA = {
            usuarios: [
                { id: 'usr_admin', usuario: 'admin', nome: 'Administrador Principal', email: 'admin@guardioes.com', perfil: 'Admin', status: 'Ativo', primeiroAcesso: false, senhaHash: 'Admin@12345' }
            ],
            financeiro: [
                { id: 'fin_1', tipo: 'Receber', historico: 'Taxa Condominial Ordinária - Ap 137', valor: 2500.00, vencimento: '2026-10-15', competencia: '10/2026', formaMonetariaId: 'fm_1', fornecedor: 'Alan Reis', status: 'Aberto' }
            ],
            formas_monetarias: [
                { id: 'fm_1', nome: 'MOVIMENTO BANCARIO', contaId: 'cb_1', multaPct: 2.0, jurosDiaPct: 0.033, baixaAutomatica: true, status: 'Ativo' }
            ],
            contas_bancarias: [
                { id: 'cb_1', banco: 'CAIXA BARAO', agencia: '1234-5', conta: '98765-4', saldo: 45800.00 }
            ],
            moradores: [
                { id: 'mor_1', bloco: '1', apartamento: '137', nome: 'Alan Reis', email: 'alan@email.com', telefone: '(41) 99999-9999', tipo: 'Proprietário', observacoes: 'Proprietário residente' }
            ],
            fornecedores: [],
            empregados: [],
            categorias: [
                { id: 'cat_1', nome: 'Atas de Assembleia', modulo: 'Documentos' },
                { id: 'cat_2', nome: 'Contratos', modulo: 'Documentos' },
                { id: 'cat_3', nome: 'Prestação de Contas', modulo: 'Documentos' }
            ],
            estoque: [],
            documentos: [],
            logs: []
        };

        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (data) {
                    const parsed = JSON.parse(data);
                    return {
                        usuarios: parsed.usuarios || DEFAULT_DATA.usuarios,
                        financeiro: parsed.financeiro || DEFAULT_DATA.financeiro,
                        formas_monetarias: parsed.formas_monetarias || DEFAULT_DATA.formas_monetarias,
                        contas_bancarias: parsed.contas_bancarias || DEFAULT_DATA.contas_bancarias,
                        moradores: parsed.moradores && parsed.moradores.length > 0 ? parsed.moradores : DEFAULT_DATA.moradores,
                        fornecedores: parsed.fornecedores || DEFAULT_DATA.fornecedores,
                        empregados: parsed.empregados || DEFAULT_DATA.empregados,
                        categorias: parsed.categorias || DEFAULT_DATA.categorias,
                        estoque: parsed.estoque || DEFAULT_DATA.estoque,
                        documentos: parsed.documentos || DEFAULT_DATA.documentos,
                        logs: parsed.logs || DEFAULT_DATA.logs
                    };
                }

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.includes('guardioes')) {
                        const altData = localStorage.getItem(key);
                        if (altData) {
                            const parsedAlt = JSON.parse(altData);
                            if (parsedAlt.moradores && parsedAlt.moradores.length > 1) {
                                return parsedAlt;
                            }
                        }
                    }
                }

                return JSON.parse(JSON.stringify(DEFAULT_DATA));
            } catch (e) {
                console.error('Erro ao carregar dados:', e);
                return JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
        }

        function salvarDados(data) {
            try { 
                localStorage.setItem('guardioes_bravo_db', JSON.stringify(data)); 
            } catch (e) { 
                alert('Aviso: Armazenamento local cheio. Tente remover alguns arquivos.'); 
            }
        }

        function fazerBackupCompleto() {
            const dadosStr = JSON.stringify(db, null, 2);
            const blob = new Blob([dadosStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_guardioes_bravo_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function restaurarBackupCompleto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dadosImportados = JSON.parse(e.target.result);
                    if (dadosImportados && dadosImportados.moradores) {
                        db = dadosImportados;
                        salvarDados(db);
                        alert('Backup restaurado com sucesso! Todos os dados e moradores foram recuperados.');
                        renderApp();
                    } else {
                        alert('Arquivo de backup inválido.');
                    }
                } catch (err) {
                    alert('Erro ao ler o arquivo JSON de backup.');
                }
            };
            reader.readAsDataURL(file);
        }

        let db = carregarDados();
        let sessao = { usuarioLogado: null };

        try {
            const sessaoData = sessionStorage.getItem('guardioes_sessao');
            if (sessaoData) sessao.usuarioLogado = JSON.parse(sessaoData);
        } catch (e) { sessao.usuarioLogado = null; }

        let tabsState = { openTabs: ['dashboard'], activeTab: 'dashboard' };
        let morFiltros = { busca: '', blocoApFiltro: 'Todos', ordenacao: 'bloco', direcao: 'asc' };

        const MODULE_NAMES = {
            dashboard: 'Dashboard',
            financeiro: 'Contas Pagar/Receber',
            formas_monetarias: 'Formas Monetárias',
            contas_bancarias: 'Contas Bancárias / Caixa',
            moradores: 'Moradores / Unidades',
            fornecedores: 'Fornecedores',
            empregados: 'Empregados',
            categorias: 'Pastas & Categorias',
            estoque: 'Estoque & Bens / Inventário',
            documentos: 'Gestão de Documentos',
            relatorios: 'Central de Relatórios & DRE',
            usuarios: 'Gestão de Usuários'
        };

        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) tabsState.openTabs.push(moduloId);
            tabsState.activeTab = moduloId;
            fecharMenuMobile();
            renderApp();
            if (moduloId === 'dashboard') {
                setTimeout(inicializarGraficosDashboard, 50);
            }
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            renderApp();
            if (tabsState.activeTab === 'dashboard') {
                setTimeout(inicializarGraficosDashboard, 50);
            }
        }

        function toggleMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        function fecharMenuMobile() {
            const sidebar = document.getElementById('sidebar-menu');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function exportarParaExcel(dados, nomeArquivo = 'relatorio.csv') {
            if (!dados || dados.length === 0) {
                alert('Não há dados disponíveis para exportação.');
                return;
            }
            const sanitizeData = dados.map(item => {
                let obj = { ...item };
                delete obj.fotoBase64;
                delete obj.arquivoBase64;
                delete obj.arquivoCompactadoGzip;
                return obj;
            });

            const keys = Object.keys(sanitizeData[0]);
            let csvContent = '\uFEFF' + keys.join(';') + '\n';
            sanitizeData.forEach(row => {
                const values = keys.map(k => {
                    let val = row[k] === null || row[k] === undefined ? '' : row[k];
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csvContent += values.join(';') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeArquivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportarParaPDF() { window.print(); }

        function realizarLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const userFound = (db.usuarios || []).find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                sessao.usuarioLogado = userFound;
                try { sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound)); } catch (err) {}
                renderApp();
                setTimeout(inicializarGraficosDashboard, 50);
            } else {
                alert('Credenciais incorretas!');
            }
        }

        function encerrarSessao() {
            sessao.usuarioLogado = null;
            try { sessionStorage.removeItem('guardioes_sessao'); } catch (e) {}
            renderApp();
        }

        function renderTelaLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold mx-auto shadow-lg">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <h2 class="text-2xl font-black text-slate-800">Guardiões do Bravo</h2>
                            <p class="text-xs text-slate-500 font-bold uppercase">Acesso ao Sistema Condominial</p>
                        </div>
                        <form onsubmit="realizarLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Usuário / E-mail</label>
                                <input type="text" id="login_user" required value="admin" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Senha</label>
                                <input type="password" id="login_pass" required value="Admin@12345" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                            </div>
                            <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-lg shadow-teal-600/30 transition text-sm">
                                Entrar no Sistema
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderMainOnly() {
            const mainEl = document.querySelector('main');
            if (mainEl) {
                mainEl.innerHTML = renderModuleContent(tabsState.activeTab);
                if (tabsState.activeTab === 'dashboard') {
                    setTimeout(inicializarGraficosDashboard, 50);
                }
            }
        }

        function renderApp() {
            const container = document.getElementById('app');
            if (!container) return;

            if (!sessao.usuarioLogado) {
                container.innerHTML = renderTelaLogin();
                return;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col md:flex-row min-h-screen">
                    <div id="sidebar-backdrop" onclick="fecharMenuMobile()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden"></div>

                    <aside id="sidebar-menu" class="fixed md:sticky top-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col sidebar-full border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
                        <div class="p-4 bg-slate-950 flex items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-teal-600 flex items-center justify-center text-white font-bold text-xl shadow"><i class="fa-solid fa-shield-halved"></i></div>
                                <div><h1 class="font-bold text-white text-base leading-tight">Guardiões</h1><p class="text-xs text-teal-400">Gestão Condominial</p></div>

                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>

                        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos Principais</p>
                            <button onclick="abrirModulo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</button>
                            <button onclick="abrirModulo('financeiro')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'financeiro' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-receipt w-5 text-center"></i> Pagar/Receber</button>

                            <button onclick="abrirModulo('moradores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'moradores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-users w-5 text-center"></i> Moradores</button>
                            <button onclick="abrirModulo('fornecedores')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'fornecedores' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-truck-fast w-5 text-center"></i> Fornecedores</button>
                            <button onclick="abrirModulo('empregados')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'empregados' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-tie w-5 text-center"></i> Empregados</button>
                            
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Estoque & Documentos</p>
                            <button onclick="abrirModulo('categorias')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'categorias' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-tree w-5 text-center"></i> Pastas & Categorias</button>
                            <button onclick="abrirModulo('estoque')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'estoque' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Estoque & Bens</button>
                            <button onclick="abrirModulo('documentos')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'documentos' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-folder-open w-5 text-center"></i> Documentos</button>
                            
                            <p class="px-3 pt-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Gestão & Configurações</p>
                            <button onclick="abrirModulo('relatorios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'relatorios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Central de Relatórios</button>
                            <button onclick="abrirModulo('usuarios')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${tabsState.activeTab === 'usuarios' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-gear w-5 text-center"></i> Gestão de Usuários</button>

                            <!-- BOTÕES DE BACKUP E SEGURANÇA -->
                            <div class="pt-4 mt-4 border-t border-slate-800 space-y-2 px-1">
                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Segurança de Dados</p>
                                <button onclick="fazerBackupCompleto()" class="w-full py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-600/30 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition">

                        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">

                    </aside>

                    <div class="flex-1 flex flex-col min-h-screen overflow-hidden">

                                    <i class="fa-solid fa-bars text-lg"></i>
                                </button>

        function renderModuleContent(moduloId) {
            let btnNovoHtml = '';
            let btnExportHtml = `
                <button onclick="exportarParaPDF()" class="px-3 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-bold text-xs shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-pdf"></i> Exportar PDF
                </button>
                <button onclick="exportarModuloExcel('${moduloId}')" class="px-3 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-bold text-xs shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-excel"></i> Exportar Excel
                </button>
            `;

            // Botões de inserção únicos por módulo
            if (moduloId === 'moradores') btnNovoHtml = `<button onclick="window.renderModalMorador()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            else if (moduloId === 'fornecedores') btnNovoHtml = `<button onclick="window.renderModalFornecedor()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Novo Fornecedor</button>`;

        function inicializarGraficosDashboard() {
            if (tabsState.activeTab !== 'dashboard') return;

            if (activeCharts.moradores) activeCharts.moradores.destroy();
            if (activeCharts.financeiro) activeCharts.financeiro.destroy();

        // =====================================
        // MORADORES / UNIDADES
        // =====================================
        function ordenarMoradores(campo) {
            if (morFiltros.ordenacao === campo) {
                morFiltros.direcao = morFiltros.direcao === 'asc' ? 'desc' : 'asc';
            } else {
                morFiltros.ordenacao = campo;
                morFiltros.direcao = 'asc';
            }
            renderMainOnly();
        }

        function renderMoradoresView() {
            if (!db.moradores) db.moradores = [];
            let list = [...db.moradores];
            
            const blocosUnicos = [...new Set(list.map(m => `Bloco ${m.bloco} - Ap ${m.apartamento}`))].sort();

            if (morFiltros.busca.trim() !== '') {
                const b = morFiltros.busca.toLowerCase();
                list = list.filter(m => (m.nome || '').toLowerCase().includes(b) || (m.apartamento || '').includes(b) || (m.bloco || '').toLowerCase().includes(b) || (m.observacoes || '').toLowerCase().includes(b));
            }

            if (morFiltros.blocoApFiltro && morFiltros.blocoApFiltro !== 'Todos') {
                list = list.filter(m => `Bloco ${m.bloco} - Ap ${m.apartamento}` === morFiltros.blocoApFiltro);
            }

            list.sort((a, b) => {
                let valA = a[morFiltros.ordenacao];
                let valB = b[morFiltros.ordenacao];

                if (morFiltros.ordenacao === 'apartamento') {
                    valA = Number(a.apartamento) || 0;
                    valB = Number(b.apartamento) || 0;
                    return morFiltros.direcao === 'asc' ? valA - valB : valB - valA;
                }

                valA = (valA || '').toString().toLowerCase();
                valB = (valB || '').toString().toLowerCase();

                if (valA < valB) return morFiltros.direcao === 'asc' ? -1 : 1;
                if (valA > valB) return morFiltros.direcao === 'asc' ? 1 : -1;
                return 0;
            });

            const iconeSeta = (campo) => {
                if (morFiltros.ordenacao !== campo) return '<i class="fa-solid fa-sort text-slate-400 ml-1"></i>';
                return morFiltros.direcao === 'asc' ? '<i class="fa-solid fa-sort-up text-teal-400 ml-1"></i>' : '<i class="fa-solid fa-sort-down text-teal-400 ml-1"></i>';
            };

            return `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center no-print">
                        <input type="text" value="${escapeHTML(morFiltros.busca)}" oninput="morFiltros.busca = this.value; renderMainOnly();" placeholder="Buscar por Nome, Bloco, Unidade ou Observação..." class="flex-1 p-2 border rounded-lg text-xs">
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-800 text-white font-bold uppercase tracking-wider text-[11px]">
                                    <th class="p-3">
                                        <div class="flex items-center gap-2">
                                            <span onclick="ordenarMoradores('bloco')" class="cursor-pointer hover:underline select-none">Bloco/Ap ${iconeSeta('bloco')}</span>
                                            <select onchange="morFiltros.blocoApFiltro = this.value; renderMainOnly();" class="bg-slate-700 text-white text-[10px] rounded px-1.5 py-0.5 border border-slate-600 outline-none cursor-pointer">
                                                <option value="Todos">Filtrar Bloco/Ap (Todos)</option>
                                                ${blocosUnicos.map(ba => `<option value="${ba}" ${morFiltros.blocoApFiltro === ba ? 'selected' : ''}>${ba}</option>`).join('')}
                                            </select>
                                        </div>
                                    </th>
                                    <th onclick="ordenarMoradores('nome')" class="p-3 cursor-pointer hover:bg-slate-700 transition select-none">Nome Completo ${iconeSeta('nome')}</th>
                                    <th onclick="ordenarMoradores('email')" class="p-3 cursor-pointer hover:bg-slate-700 transition select-none">E-mail ${iconeSeta('email')}</th>
                                    <th onclick="ordenarMoradores('telefone')" class="p-3 cursor-pointer hover:bg-slate-700 transition select-none">Telefone ${iconeSeta('telefone')}</th>
                                    <th onclick="ordenarMoradores('tipo')" class="p-3 cursor-pointer hover:bg-slate-700 transition select-none">Tipo ${iconeSeta('tipo')}</th>
                                    <th class="p-3">Observações</th>
                                    <th class="p-3 text-center actions-col">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 font-medium text-slate-700">
                                ${list.length === 0 ? `<tr><td colspan="7" class="p-6 text-center text-slate-400 font-semibold">Nenhum morador encontrado com este filtro.</td></tr>` : list.map(m => `
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="p-3 font-bold text-teal-700">Bloco ${escapeHTML(m.bloco)} - Ap ${escapeHTML(m.apartamento)}</td>
                                        <td class="p-3 font-bold text-slate-900">${escapeHTML(m.nome)}</td>
                                        <td class="p-3">${escapeHTML(m.email)}</td>
                                        <td class="p-3">${escapeHTML(m.telefone)}</td>
                                        <td class="p-3">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${m.tipo === 'Inquilino' ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-teal-100 text-teal-800 border border-teal-200'}">
                                                ${escapeHTML(m.tipo || 'Proprietário')}
                                            </span>
                                        </td>
                                        <td class="p-3 text-slate-500">${escapeHTML(m.observacoes || 'Nenhuma')}</td>
                                        <td class="p-3 text-center actions-col">
                                            <div class="flex items-center justify-center gap-1">
                                                <button onclick="window.renderModalMorador('${m.id}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition"><i class="fa-solid fa-pen"></i></button>
                                                <button onclick="excluirMorador('${m.id}')" class="p-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md transition"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Observações</label>

                            <div class="flex justify-end gap-2 pt-3 border-t">

                        </form>
                    </div>
                </div>
            `);
        };

        function salvarModalMorador(e, id) {
            e.preventDefault();
            if (!db.moradores) db.moradores = [];

            const newItem = {
                id: id && id !== 'null' && id !== 'undefined' && id !== '' ? id : 'mor_' + Date.now(),
                bloco: document.getElementById('m_mor_bloco').value.trim(),
                apartamento: document.getElementById('m_mor_ap').value.trim(),
                nome: document.getElementById('m_mor_nome').value.trim(),
                email: document.getElementById('m_mor_email').value.trim(),
                telefone: document.getElementById('m_mor_tel').value.trim(),
                tipo: document.getElementById('m_mor_tipo').value,
                observacoes: document.getElementById('m_mor_obs').value.trim()
            };

            const idx = db.moradores.findIndex(m => m.id === newItem.id);
            if (idx !== -1) {
                db.moradores[idx] = newItem;
            } else {
                db.moradores.push(newItem);
            }

            salvarDados(db);
            fecharModalContainer();
            renderMainOnly();
        }

        function excluirMorador(id) {
            if (!confirm('Deseja realmente remover este morador?')) return;
            db.moradores = db.moradores.filter(m => m.id !== id);
            salvarDados(db);
            renderMainOnly();
        }

        function processarUploadDocumentoComprimido(event) {
            const file = event.target.files[0];
            if (!file) return;
            tempArquivoNome = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Original = e.target.result;
                try {
                    const dataCompressed = pako.deflate(base64Original, { to: 'string' });
                    tempArquivoGzip = btoa(dataCompressed);
                    const infoEl = document.getElementById('info_compressao');
                    if (infoEl) {
                        infoEl.innerHTML = `✅ Compactado com sucesso (${(tempArquivoGzip.length / 1024).toFixed(1)} KB)!`;
                        infoEl.classList.remove('hidden');
                    }
                } catch (err) {
                    tempArquivoGzip = base64Original;
                }
            };
            reader.readAsDataURL(file);
        }

        function salvarModalDocumento(e) {
            e.preventDefault();
            if (!db.documentos) db.documentos = [];
            db.documentos.push({

                pasta: document.getElementById('m_doc_pasta').value.trim(),
                nomeArquivo: tempArquivoNome,
                arquivoCompactadoGzip: tempArquivoGzip

            salvarDados(db);
            tempArquivoGzip = '';
            tempArquivoNome = '';
            fecharModalContainer();
            renderMainOnly();
        }
