        // ==========================================

        function escapeHTML(str) {
            if (typeof str !== 'string') return str || '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function validarSenhaForte(senha) {
            return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&*!_\-]).{8,}$/.test(senha);
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                if (!file) return resolve('');
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 800;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = () => resolve(e.target.result);
                };
                reader.readAsDataURL(file);
            });
        }

        function carregarDados() {
            try {
                const data = localStorage.getItem('guardioes_bravo_db');
                if (!data) return DEFAULT_DATA;
                const parsed = JSON.parse(data);
                // Garantir fallback da DRE caso inexistente no localStorage antigo
                if (!parsed.dre_config || parsed.dre_config.length === 0) {
                    parsed.dre_config = DEFAULT_DATA.dre_config;
                }
                return parsed;
            } catch (e) {
                return DEFAULT_DATA;
            }
        }

        function salvarDados(data) {
            try {
                localStorage.setItem('guardioes_bravo_db', JSON.stringify(data));
            } catch (e) {

        function registrarLog(modulo, acao, detalhe) {
            const user = sessao.usuarioLogado ? sessao.usuarioLogado.usuario : 'Sistema';
            db.logs.unshift({
                id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                dataHora: new Date().toLocaleString('pt-BR'),
                modulo: modulo,
                acao: acao,
                usuario: user,
                detalhe: detalhe
            });
            if (db.logs.length > 500) db.logs.pop();
            salvarDados(db);
        }

        // 3. CONTROLE DE ABAS E NAVEGAÇÃO
        // ==========================================
        function abrirModulo(moduloId) {
            if (!tabsState.openTabs.includes(moduloId)) {
                tabsState.openTabs.push(moduloId);
            }
            tabsState.activeTab = moduloId;
            renderApp();
        }

        function fecharAba(e, moduloId) {
            e.stopPropagation();
            if (tabsState.openTabs.length === 1) return;
            tabsState.openTabs = tabsState.openTabs.filter(id => id !== moduloId);
            if (tabsState.activeTab === moduloId) {
                tabsState.activeTab = tabsState.openTabs[tabsState.openTabs.length - 1];
            }
            renderApp();
        }

        // ==========================================
        // 4. AUTENTICAÇÃO E SESSÃO
        // ==========================================
        function realizarLogin(e) {
            e.preventDefault();
            const now = Date.now();
            if (sessao.bloqueadoAte && now < sessao.bloqueadoAte) {
                const resta = Math.ceil((sessao.bloqueadoAte - now) / 1000);
                alert(`Sistema bloqueado por segurança. Aguarde ${resta} segundos.`);
                return;
            }

            const userInput = document.getElementById('login_user').value.trim();
            const senhaInput = document.getElementById('login_pass').value;
            const lembrar = document.getElementById('login_remember').checked;

            const userFound = db.usuarios.find(u => u.usuario === userInput || u.email === userInput);

            if (userFound && userFound.senhaHash === senhaInput) {
                if (userFound.status !== 'Ativo') {
                    alert('Utilizador inativo. Contacte o administrador.');
                    return;
                }

                sessao.tentativasFalhas = 0;
                sessao.usuarioLogado = userFound;
                sessionStorage.setItem('guardioes_sessao', JSON.stringify(userFound));

                if (lembrar) {
                    localStorage.setItem('guardioes_remember_user', userInput);
                } else {
                    localStorage.removeItem('guardioes_remember_user');
                }

                registrarLog('Segurança', 'Login Sucesso', `Usuário ${userFound.usuario} efetuou login.`);

                if (userFound.primeiroAcesso) {
                    renderModalTrocaSenhaObrigatoria();
                } else {
                    iniciarMonitorInatividade();
                    renderApp();

                    // Disparar tour guiado se for a primeira vez no dispositivo
                    if (!localStorage.getItem('guardioes_tour_concluido')) {
                        setTimeout(iniciarTourGuiado, 500);
                    }
                }
            } else {
                sessao.tentativasFalhas++;
                registrarLog('Segurança', 'Login Falhado', `Tentativa para o usuário: ${userInput}`);
                if (sessao.tentativasFalhas >= 5) {
                    sessao.bloqueadoAte = Date.now() + (5 * 60 * 1000);
                    alert('Bloqueio de Segurança: 5 tentativas incorretas. Tente novamente em 5 minutos.');
                } else {
                    alert(`Credenciais incorretas! Tentativa ${sessao.tentativasFalhas} de 5.`);
                }
            }
        }

        function encerrarSessao() {
            if (sessao.usuarioLogado) {
                registrarLog('Segurança', 'Logout', `Usuário ${sessao.usuarioLogado.usuario} saiu.`);
            }
            sessao.usuarioLogado = null;
            sessionStorage.removeItem('guardioes_sessao');
            if (sessao.timerInatividade) clearTimeout(sessao.timerInatividade);
            renderApp();
        }

        function iniciarMonitorInatividade() {
            if (sessao.timerInatividade) clearTimeout(sessao.timerInatividade);

                if (!sessao.usuarioLogado) return;
                clearTimeout(sessao.timerInatividade);
                sessao.timerInatividade = setTimeout(() => {
                    alert('Sessão encerrada por inatividade (15 minutos).');

                }, 15 * 60 * 1000);
            };
            window.onload = reset;
            document.onmousemove = reset;
            document.onkeypress = reset;
            document.onclick = reset;
            document.ontouchstart = reset;
        }

                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </aside>

                    <!-- ÁREA PRINCIPAL -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <header class="bg-slate-900 text-white p-3 flex md:hidden items-center justify-between border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleMobileSidebar()" class="p-2 rounded-lg bg-slate-800 text-slate-200">
                                    <i class="fa-solid fa-bars text-lg"></i>
                                </button>
                                <span class="font-bold text-sm">Guardiões do Bravo</span>
                            </div>
                            <button onclick="encerrarSessao()" class="text-xs bg-red-600/20 text-red-400 px-2.5 py-1.5 rounded-md">Sair</button>
                        </header>

                        <!-- BARRA DE ABAS SIMULTÂNEAS -->
                        <div class="bg-slate-200 border-b border-slate-300 flex items-center overflow-x-auto px-2 pt-2 gap-1 no-print">
                            ${tabsState.openTabs.map(tabId => `
                                <div onclick="abrirModulo('${tabId}')" class="flex items-center gap-2 px-3 py-2 rounded-t-lg text-xs font-semibold cursor-pointer transition select-none ${tabsState.activeTab === tabId ? 'tab-active shadow-sm' : 'bg-slate-300 text-slate-600 hover:bg-slate-300/80'}">
                                    <span>${MODULE_NAMES[tabId] || tabId}</span>
                                    ${tabsState.openTabs.length > 1 ? `
                                        <button onclick="fecharAba(event, '${tabId}')" class="text-slate-400 hover:text-red-600 rounded-full w-4 h-4 flex items-center justify-center">
                                            <i class="fa-solid fa-xmark text-[10px]"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100">
                            ${renderModuleContent(tabsState.activeTab)}
                        </main>
                    </div>
                </div>
            `;

            if (tabsState.activeTab === 'dashboard') {
                setTimeout(renderDashboardCharts, 100);
            }

            if (tourState.ativo) {
                renderTourOverlay();
            }
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar-menu').classList.toggle('-translate-x-full');
            document.getElementById('mobile-sidebar-backdrop').classList.toggle('hidden');
        }

        // ==========================================
        // 6. TOUR GUIADO DE PRIMEIRO ACESSO
        // ==========================================
        function iniciarTourGuiado() {
            tourState.ativo = true;
            tourState.passoAtual = 0;
            abrirModulo(TOUR_STEPS[0].modulo);
        }

        function proximoPassoTour() {
            if (tourState.passoAtual < TOUR_STEPS.length - 1) {
                tourState.passoAtual++;
                abrirModulo(TOUR_STEPS[tourState.passoAtual].modulo);
            } else {
                encerrarTourGuiado();
            }
        }

        function passoAnteriorTour() {
            if (tourState.passoAtual > 0) {
                tourState.passoAtual--;
                abrirModulo(TOUR_STEPS[tourState.passoAtual].modulo);
            }
        }

        function encerrarTourGuiado() {
            tourState.ativo = false;
            localStorage.setItem('guardioes_tour_concluido', 'true');
            fecharModal('modal_tour');
            renderApp();
        }

        function renderTourOverlay() {
            fecharModal('modal_tour');
            const step = TOUR_STEPS[tourState.passoAtual];

            const html = `
                <div id="modal_tour" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-4 no-print">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border-2 border-teal-500 animate-fade-in">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-teal-600 text-white flex items-center justify-center text-xs font-bold">${tourState.passoAtual + 1}</span>
                                <h3 class="font-bold text-sm">${step.titulo}</h3>
                            </div>
                            <button onclick="encerrarTourGuiado()" title="Encerrar Tour" class="text-slate-400 hover:text-white text-lg">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="p-6 space-y-4">
                            <p class="text-xs text-slate-700 leading-relaxed font-semibold">${step.texto}</p>
                            
                            <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                                <button onclick="encerrarTourGuiado()" class="text-xs font-bold text-slate-400 hover:text-slate-600 underline">
                                    Pular Tour
                                </button>
                                <div class="flex items-center gap-2">
                                    ${tourState.passoAtual > 0 ? `
                                        <button onclick="passoAnteriorTour()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded text-xs font-bold text-slate-800">
                                            Anterior
                                        </button>
                                    ` : ''}
                                    <button onclick="proximoPassoTour()" class="px-4 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded text-xs font-bold shadow-md">
                                        ${tourState.passoAtual === TOUR_STEPS.length - 1 ? 'Concluir e Começar' : 'Próximo'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        // ==========================================
        // 7. RENDERIZAÇÃO DE MÓDULOS E BOTÕES "NOVO"
        // ==========================================
        function getCamposConfigModulo(id) {
            switch(id) {
                case 'plano_contas': return { nome: "Plano de Contas", campos: [{key:"codigo", label:"Código"}, {key:"nome", label:"Nome da Conta"}, {key:"tipo", label:"Tipo (Receita/Despesa)"}] };
                case 'contas_bancarias': return { nome: "Conta Bancária", campos: [{key:"banco", label:"Banco / Caixinha"}, {key:"agencia", label:"Agência"}, {key:"conta", label:"Número da Conta"}, {key:"saldo", label:"Saldo Inicial (R$)"}] };
                case 'fornecedores': return { nome: "Fornecedor", campos: [{key:"nome", label:"Razão Social / Nome"}, {key:"cnpj", label:"CNPJ / CPF"}, {key:"telefone", label:"Telefone"}, {key:"servico", label:"Serviço Prestado"}] };
                case 'patrimonio': return { nome: "Patrimônio", campos: [{key:"codigo", label:"Código / Placa"}, {key:"item", label:"Descrição do Item"}, {key:"local", label:"Localização"}, {key:"valor", label:"Valor Estimado (R$)"}, {key:"estado", label:"Estado de Conservação"}] };
                case 'documentos': return { nome: "Documento", campos: [{key:"titulo", label:"Título do Documento"}, {key:"categoria", label:"Categoria"}, {key:"data", label:"Data (AAAA-MM-DD)"}] };
                default: return null;
            }
        }

        function renderModuleContent(moduloId) {
            const camposCfg = getCamposConfigModulo(moduloId);

            let btnNovoHtml = '';
            if (moduloId === 'financeiro') {
                btnNovoHtml = `<button onclick="renderModalNovoTitulo()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition"><i class="fa-solid fa-plus"></i> Novo Título Financeiro</button>`;
            } else if (moduloId === 'moradores') {
                btnNovoHtml = `<button onclick="renderModalMorador()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition"><i class="fa-solid fa-plus"></i> Novo Morador</button>`;
            } else if (moduloId === 'estoque') {
                btnNovoHtml = `<button onclick="renderModalEstoque()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition"><i class="fa-solid fa-plus"></i> Novo Item no Estoque</button>`;
            } else if (moduloId === 'usuarios') {
                btnNovoHtml = `<button onclick="renderModalUsuario()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition"><i class="fa-solid fa-plus"></i> Novo Usuário</button>`;
            } else if (camposCfg) {
                btnNovoHtml = `<button onclick="renderModalGen('${moduloId}', null)" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition"><i class="fa-solid fa-plus"></i> Novo ${camposCfg.nome}</button>`;
            }

            const headerGlobal = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">${MODULE_NAMES[moduloId]}</h2>
                        <p class="text-xs text-slate-500">Gestão Condominial - Sistema Ativo</p>
                    </div>
                    <div class="flex items-center gap-2 no-print">
                        ${btnNovoHtml}
                        <button onclick="renderModalAuditLog('${moduloId}')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3.5 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2 transition">
                            <i class="fa-solid fa-shield-halved text-teal-400"></i> Rastrear Modificações
                        </button>
                    </div>
                </div>
            `;

            switch (moduloId) {
                case 'dashboard': return headerGlobal + renderDashboardView();
                case 'financeiro': return headerGlobal + renderFinanceiroView();
                case 'moradores': return headerGlobal + renderMoradoresView();
                case 'estoque': return headerGlobal + renderEstoqueView();
                case 'relatorios': return headerGlobal + renderRelatoriosView();
                case 'usuarios': return headerGlobal + renderUsuariosView();
                case 'audit_log': return headerGlobal + renderAuditLogView();
                default: return headerGlobal + renderGenericDataList(moduloId);
            }
        }

        // ==========================================
        // 8. DASHBOARD COM GRÁFICOS (CHART.JS)
        // ==========================================
        function renderDashboardView() {
            const recTotal = db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0);
            const pagTotal = db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase">A Receber (Aberto)</p>
                                <h3 class="text-xl font-extrabold text-emerald-600">R$ ${recTotal.toFixed(2)}</h3>
                            </div>
                            <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-arrow-down-left"></i></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase">A Pagar (Aberto)</p>
                                <h3 class="text-xl font-extrabold text-rose-600">R$ ${pagTotal.toFixed(2)}</h3>
                            </div>
                            <div class="w-10 h-10 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fa-solid fa-arrow-up-right"></i></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase">Moradores</p>
                                <h3 class="text-xl font-extrabold text-slate-800">${db.moradores.length}</h3>
                            </div>
                            <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-users"></i></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold text-slate-500 uppercase">Usuários Ativos</p>
                                <h3 class="text-xl font-extrabold text-teal-600">${db.usuarios.filter(u=>u.status==='Ativo').length}</h3>
                            </div>
                            <div class="w-10 h-10 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center text-lg"><i class="fa-solid fa-user-shield"></i></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-chart-column text-teal-600"></i> Receitas vs. Despesas (Aberto x Baixado)</h4>
                            <div class="h-64 relative"><canvas id="chartReceitasDespesas"></canvas></div>
                        </div>
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
                            <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-chart-pie text-teal-600"></i> Censo de Ocupação (Moradores)</h4>
                            <div class="h-64 relative"><canvas id="chartMoradores"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboardCharts() {
            const ctx1 = document.getElementById('chartReceitasDespesas');
            const ctx2 = document.getElementById('chartMoradores');

            if (!ctx1 || !ctx2) return;

            const recAberto = db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0);
            const recBaixado = db.financeiro.filter(f=>f.tipo==='Receber' && f.status==='Baixado').reduce((a,b)=>a+b.valor,0);
            const pagAberto = db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Aberto').reduce((a,b)=>a+b.valor,0);
            const pagBaixado = db.financeiro.filter(f=>f.tipo==='Pagar' && f.status==='Baixado').reduce((a,b)=>a+b.valor,0);

            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['A Receber', 'Recebido (Baixado)', 'A Pagar', 'Pago (Baixado)'],
                    datasets: [{
                        label: 'Valor Total (R$)',
                        data: [recAberto, recBaixado, pagAberto, pagBaixado],
                        backgroundColor: ['#10b981', '#059669', '#f43f5e', '#e11d48']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const props = db.moradores.filter(m=>m.tipo==='Proprietário').length;
            const inqs = db.moradores.filter(m=>m.tipo==='Inquilino').length;

            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Proprietários', 'Inquilinos'],
                    datasets: [{
                        data: [props, inqs],
                        backgroundColor: ['#2563eb', '#9333ea']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // ==========================================
        // 9. MÓDULO FINANCEIRO
        // ==========================================
        function renderFinanceiroView() {
            let lista = db.financeiro || [];

            if (finFiltros.competencia.trim() !== '') {
                lista = lista.filter(f => (f.competencia || '').toLowerCase().includes(finFiltros.competencia.trim().toLowerCase()));
            }
            if (finFiltros.status !== 'Todos') {
                lista = lista.filter(f => f.status === finFiltros.status);
            }
            if (finFiltros.tipo !== 'Todos') {
                lista = lista.filter(f => f.tipo === finFiltros.tipo);
            }
            if (finFiltros.busca.trim() !== '') {
                const b = finFiltros.busca.toLowerCase();
                lista = lista.filter(f => (f.historico || '').toLowerCase().includes(b) || (f.fornecedor || '').toLowerCase().includes(b));
            }

            return `
                <div class="space-y-4">
                    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-center">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Competência (MM/AAAA)</label>
                            <input type="text" id="flt_comp" value="${escapeHTML(finFiltros.competencia)}" placeholder="Ex: 11/2026" oninput="atualizarFiltrosFinanceiros()" class="w-full p-2 border border-slate-300 rounded text-xs text-slate-900 font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Status do Título</label>
                            <select id="flt_status" onchange="atualizarFiltrosFinanceiros()" class="w-full p-2 border border-slate-300 rounded text-xs text-slate-900 font-bold">
                                <option value="Todos" ${finFiltros.status === 'Todos' ? 'selected' : ''}>Todos os Status</option>
                                <option value="Aberto" ${finFiltros.status === 'Aberto' ? 'selected' : ''}>Aberto</option>
                                <option value="Baixado" ${finFiltros.status === 'Baixado' ? 'selected' : ''}>Baixado (Compensado)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tipo de Operação</label>
                            <select id="flt_tipo" onchange="atualizarFiltrosFinanceiros()" class="w-full p-2 border border-slate-300 rounded text-xs text-slate-900 font-bold">
                                <option value="Todos" ${finFiltros.tipo === 'Todos' ? 'selected' : ''}>Todos os Tipos</option>
                                <option value="Receber" ${finFiltros.tipo === 'Receber' ? 'selected' : ''}>A Receber</option>
                                <option value="Pagar" ${finFiltros.tipo === 'Pagar' ? 'selected' : ''}>A Pagar</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Buscar por Descrição</label>
                            <input type="text" id="flt_busca" value="${escapeHTML(finFiltros.busca)}" placeholder="Digite para filtrar..." oninput="atualizarFiltrosFinanceiros()" class="w-full p-2 border border-slate-300 rounded text-xs text-slate-900 font-bold">
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 text-slate-600 font-bold uppercase border-b">
                                    <tr>
                                        <th class="p-3">Tipo</th>
                                        <th class="p-3">Descrição / Histórico</th>
                                        <th class="p-3">Competência</th>
                                        <th class="p-3">Vencimento</th>
                                        <th class="p-3">Valor</th>
                                        <th class="p-3">Status</th>
                                        <th class="p-3 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${lista.length === 0 ? `
                                        <tr><td colspan="7" class="p-6 text-center text-slate-400 font-medium">Nenhum título financeiro encontrado para os filtros selecionados.</td></tr>
                                    ` : lista.map(f => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${f.tipo === 'Receber' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${escapeHTML(f.tipo)}</span></td>
                                            <td class="p-3 font-semibold text-slate-900">
                                                <p class="font-bold text-slate-800">${escapeHTML(f.historico)}</p>
                                                <p class="text-[10px] text-slate-500">${escapeHTML(f.fornecedor || '')}</p>
                                            </td>
                                            <td class="p-3 font-semibold text-slate-700">${escapeHTML(f.competencia || 'N/A')}</td>
                                            <td class="p-3 text-slate-700">${escapeHTML(f.vencimento)}</td>
                                            <td class="p-3 font-bold text-slate-900">R$ ${Number(f.valor).toFixed(2)}</td>
                                            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${f.status === 'Baixado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${escapeHTML(f.status)}</span></td>
                                            <td class="p-3 text-right space-x-1">
                                                <button onclick="alternarBaixaTitulo('${f.id}')" title="${f.status === 'Baixado' ? 'Reabrir Título' : 'Marcar como Baixado/Compensado'}" class="p-1.5 ${f.status === 'Baixado' ? 'text-amber-600 hover:bg-amber-50' : 'text-emerald-600 hover:bg-emerald-50'} rounded">
                                                    <i class="fa-solid ${f.status === 'Baixado' ? 'fa-rotate-left' : 'fa-circle-check'}"></i>
                                                </button>
                                                <button onclick="renderModalNovoTitulo('${f.id}')" title="Editar Título" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded">
                                                    <i class="fa-solid fa-pen-to-square"></i>
                                                </button>
                                                <button onclick="excluirItemGenerico('financeiro', '${f.id}')" title="Excluir" class="p-1.5 text-red-600 hover:bg-red-50 rounded"><i class="fa-solid fa-trash-can"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function atualizarFiltrosFinanceiros() {
            finFiltros.competencia = document.getElementById('flt_comp').value;
            finFiltros.status = document.getElementById('flt_status').value;
            finFiltros.tipo = document.getElementById('flt_tipo').value;
            finFiltros.busca = document.getElementById('flt_busca').value;
            renderApp();
        }

        function alternarBaixaTitulo(id) {
            const f = db.financeiro.find(x => x.id === id);
            if (f) {
                f.status = f.status === 'Baixado' ? 'Aberto' : 'Baixado';
                registrarLog('Financeiro', 'Status Alterado', `Título "${f.historico}" alterado para ${f.status}`);
                salvarDados(db);
                renderApp();
            }
        }

        function renderModalNovoTitulo(tituloId = null) {
            const item = tituloId ? db.financeiro.find(x => x.id === tituloId) : null;

            const html = `
                <div id="modal_fin" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">${item ? 'Editar Título Financeiro' : 'Novo Título Financeiro'}</h3>
                            <button onclick="fecharModal('modal_fin')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>

        function gerarPreviewParcelas() {
            const val = parseFloat(document.getElementById('fin_valor').value) || 0;
            const dataInic = document.getElementById('fin_vencimento').value;
            const qtd = parseInt(document.getElementById('rec_qtd').value) || 1;

            if (!dataInic) { alert('Informe a data do 1º vencimento.'); return; }

            let html = `
                <div class="p-3 bg-teal-50 border border-teal-200 rounded-lg space-y-2">
                    <p class="text-xs font-bold text-teal-900">Edite as Datas/Valores das Parcelas antes de salvar:</p>
                    <div class="max-h-40 overflow-y-auto space-y-2 pr-1">
            `;

            let baseDate = new Date(dataInic + 'T00:00:00');

            for(let i = 1; i <= qtd; i++) {
                let current = new Date(baseDate);
                current.setMonth(current.getMonth() + (i - 1));
                let dateStr = current.toISOString().split('T')[0];
                let compStr = `${String(current.getMonth()+1).padStart(2,'0')}/${current.getFullYear()}`;

                html += `
                    <div class="grid grid-cols-3 gap-2 items-center bg-white p-2 rounded border border-slate-200">
                        <span class="text-xs font-bold text-slate-700">Parcela ${i}/${qtd}</span>
                        <input type="date" value="${dateStr}" class="rec_item_venc p-1 border rounded text-xs text-slate-900 font-bold">
                        <input type="text" value="${compStr}" class="rec_item_comp p-1 border rounded text-xs text-slate-900 font-bold" placeholder="MM/AAAA">
                    </div>
                `;
            }

            html += `</div></div>`;
            document.getElementById('area_preview_parcelas').innerHTML = html;
        }

        function salvarTituloFinanceiroCompleto(tituloId = '') {
            const tipo = document.getElementById('fin_tipo').value;
            const valor = parseFloat(document.getElementById('fin_valor').value) || 0;
            const historico = document.getElementById('fin_historico').value.trim();
            const fornecedor = document.getElementById('fin_fornecedor').value.trim();
            const comp = document.getElementById('fin_competencia') ? document.getElementById('fin_competencia').value.trim() : '';
            const venc = document.getElementById('fin_vencimento').value;

            if (!historico || !valor || !venc) {
                alert('Preencha os campos obrigatórios!');
                return;
            }

            if (tituloId) {
                const item = db.financeiro.find(x => x.id === tituloId);
                if (item) {
                    item.tipo = tipo;
                    item.valor = valor;
                    item.historico = historico;
                    item.fornecedor = fornecedor;
                    item.competencia = comp || venc.substr(0,7).split('-').reverse().join('/');
                    item.vencimento = venc;
                    registrarLog('Financeiro', 'Edição', `Título "${historico}" modificado.`);
                }
            } else {
                const chk = document.getElementById('chk_recorrencia');
                const isRec = chk ? chk.checked : false;

                if (isRec && document.querySelectorAll('.rec_item_venc').length > 0) {
                    const vencs = document.querySelectorAll('.rec_item_venc');
                    const comps = document.querySelectorAll('.rec_item_comp');

                    vencs.forEach((el, idx) => {
                        db.financeiro.push({
                            id: 'fin_' + Date.now() + '_' + idx,
                            tipo: tipo,
                            historico: `${historico} (${idx+1}/${vencs.length})`,
                            valor: valor,
                            vencimento: el.value,
                            competencia: comps[idx].value,
                            fornecedor: fornecedor,
                            status: 'Aberto'
                        });
                    });
                    registrarLog('Financeiro', 'Recorrência Gerada', `${vencs.length} parcelas de "${historico}" criadas.`);
                } else {
                    db.financeiro.push({
                        id: 'fin_' + Date.now(),
                        tipo: tipo,
                        historico: historico,
                        valor: valor,
                        vencimento: venc,
                        competencia: comp || venc.substr(0,7).split('-').reverse().join('/'),
                        fornecedor: fornecedor,
                        status: 'Aberto'
                    });
                    registrarLog('Financeiro', 'Título Criado', `Título "${historico}" gravado.`);
                }
            }

            salvarDados(db);
            fecharModal('modal_fin');
            renderApp();
        }

        function salvarEstoqueForm(ev, itemId = '') {
            ev.preventDefault();
            const item = document.getElementById('est_item').value.trim();
            const cat = document.getElementById('est_categoria').value.trim();
            const qtd = parseInt(document.getElementById('est_qtd').value) || 0;
            const min = parseInt(document.getElementById('est_min').value) || 0;
            const max = parseInt(document.getElementById('est_max').value) || 0;
            const local = document.getElementById('est_local').value.trim();

            if (itemId) {
                const e = db.estoque.find(x => x.id === itemId);
                if (e) {
                    e.item = item;
                    e.categoria = cat;
                    e.qtd = qtd;
                    e.minimo = min;
                    e.maximo = max;
                    e.localizacao = local;
                    registrarLog('Estoque', 'Edição', `Produto ${item} atualizado.`);
                }
            } else {
                db.estoque.push({
                    id: 'est_' + Date.now(),
                    item: item,
                    categoria: cat,
                    qtd: qtd,
                    minimo: min,
                    maximo: max,
                    localizacao: local
                });
                registrarLog('Estoque', 'Criação', `Produto ${item} criado no estoque.`);

            salvarDados(db);
            fecharModal('modal_est');
            renderApp();

        function renderRelatoriosView() {
            const recTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pagTotal = db.financeiro.filter(f => f.tipo === 'Pagar' && f.status === 'Baixado').reduce((a, b) => a + b.valor, 0);
            const pendTotal = db.financeiro.filter(f => f.tipo === 'Receber' && f.status === 'Aberto').reduce((a, b) => a + b.valor, 0);

            // Lista DRE com fallback garantido
            const listDRE = (db.dre_config && db.dre_config.length > 0) ? db.dre_config : DEFAULT_DATA.dre_config;

            const calculosDRE = {};
            listDRE.forEach(item => {
                if (item.tipo === 'direto') {
                    if (item.operacao === 'somar_receitas') calculosDRE[item.id] = recTotal;
                    else if (item.operacao === 'somar_pendencias') calculosDRE[item.id] = pendTotal;
                    else if (item.operacao === 'somar_despesas') calculosDRE[item.id] = pagTotal;
                } else if (item.tipo === 'formula') {
                    let val = 0;
                    if (item.formula === 'A - B') val = (calculosDRE['A'] || 0) - (calculosDRE['B'] || 0);
                    else if (item.formula === 'C - D') val = (calculosDRE['C'] || 0) - (calculosDRE['D'] || 0);
                    calculosDRE[item.id] = val;
                }
            });

            return `
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 no-print">

                            <button onclick="setPeriodoRelatorio('ano')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold">Ano Atual</button>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="renderModalConfigDRE()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3.5 py-2.5 rounded-lg font-bold shadow-sm transition">
                                <i class="fa-solid fa-gears"></i> Personalizar DRE / Fórmulas
                            </button>

                                <i class="fa-solid fa-print"></i> Imprimir / PDF
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <div>
                                <h3 class="font-bold text-base text-slate-800">Demonstração do Resultado do Exercício (DRE)</h3>
                                <p class="text-xs text-slate-500">Apuração com estrutura e fórmulas configuráveis</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-extrabold ${(calculosDRE['E'] || 0) >= 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${(calculosDRE['E'] || 0) >= 0 ? 'SUPERÁVIT' : 'DEFICIT'}: R$ ${Math.abs(calculosDRE['E'] || 0).toFixed(2)}
                            </span>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 text-slate-600 font-bold uppercase border-b">
                                    <tr>
                                        <th class="p-3">Ref</th>
                                        <th class="p-3">Descrição da Conta DRE</th>
                                        <th class="p-3">Tipo / Indicação de Fórmula</th>

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

        function salvarConfigDRE() {
            const labels = document.querySelectorAll('.dre_label_input');
            const formulas = document.querySelectorAll('.dre_formula_input');

            if (!db.dre_config) db.dre_config = DEFAULT_DATA.dre_config;

            labels.forEach(input => {
                const id = input.getAttribute('data-id');
                const item = db.dre_config.find(x => x.id === id);
                if (item) item.label = input.value.trim();
            });

            formulas.forEach(input => {
                const id = input.getAttribute('data-id');
                const item = db.dre_config.find(x => x.id === id);
                if (item) item.formula = input.value.trim();
            });

            salvarDados(db);
            registrarLog('DRE', 'Fórmulas Atualizadas', 'Estrutura da DRE reconfigurada.');

        async function processarFotoModalGen(e) {
            const file = e.target.files[0];
            if (file) {
                window.imagemAnexadaBase64 = await compressImage(file);
                const lbl = document.getElementById('lbl_foto_gen');
                if (lbl) lbl.classList.remove('hidden');
            }
        }

        window.salvarItemGenerico = function(e, modKey, itemId = '') {
            e.preventDefault();
            const inputs = document.querySelectorAll('.input_gen_field');

            if (!db[modKey]) db[modKey] = [];

            if (itemId) {
                const idx = db[modKey].findIndex(x => x.id === itemId);
                if (idx !== -1) {
                    inputs.forEach(input => {
                        const key = input.getAttribute('data-key');
                        let val = input.value.trim();
                        if (key === 'saldo' || key === 'valor' || key === 'qtd') val = parseFloat(val) || 0;
                        db[modKey][idx][key] = val;
                    });
                    if (window.imagemAnexadaBase64) db[modKey][idx].foto = window.imagemAnexadaBase64;
                    registrarLog(MODULE_NAMES[modKey] || modKey, 'Edição', `Registro ${itemId} atualizado.`);
                }
            } else {
                const novoObjeto = { id: modKey.substr(0, 3) + '_' + Date.now() };
                inputs.forEach(input => {
                    const key = input.getAttribute('data-key');
                    let val = input.value.trim();
                    if (key === 'saldo' || key === 'valor' || key === 'qtd') val = parseFloat(val) || 0;
                    novoObjeto[key] = val;
                });
                if (window.imagemAnexadaBase64) novoObjeto.foto = window.imagemAnexadaBase64;
                db[modKey].push(novoObjeto);
                registrarLog(MODULE_NAMES[modKey] || modKey, 'Criação', `Novo registro salvo.`);
            }

            salvarDados(db);
            fecharModal('modal_gen');
            renderApp();
        };

        function excluirItemGenerico(modKey, itemId) {
            if (confirm('Tem certeza de que deseja excluir este registo?')) {
                db[modKey] = db[modKey].filter(x => x.id !== itemId);
                registrarLog(MODULE_NAMES[modKey] || modKey, 'Exclusão', `Registro ${itemId} removido.`);
                salvarDados(db);
                renderApp();
            }
        }

                                    <th class="p-3">Status</th>
                                    <th class="p-3 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${db.usuarios.map(u => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3 font-bold text-slate-900">${escapeHTML(u.usuario)}</td>
                                        <td class="p-3">
                                            <p class="font-bold text-slate-800">${escapeHTML(u.nome)}</p>
                                            <p class="text-slate-500">${escapeHTML(u.email)}</p>
                                        </td>
                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-800">${escapeHTML(u.perfil)}</span></td>
                                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${u.status === 'Ativo' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${escapeHTML(u.status)}</span></td>
                                        <td class="p-3 text-right space-x-1">
                                            <button onclick="renderModalUsuario('${u.id}')" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                                            <button onclick="toggleStatusUsuario('${u.id}')" class="p-1.5 text-amber-600 hover:bg-amber-50 rounded" title="Status"><i class="fa-solid fa-user-slash"></i></button>
                                            <button onclick="excluirUsuario('${u.id}')" class="p-1.5 text-red-600 hover:bg-red-50 rounded" title="Excluir"><i class="fa-solid fa-trash-can"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderModalUsuario(userId = null) {
            const u = userId ? db.usuarios.find(x => x.id === userId) : null;
            const html = `
                <div id="modal_usr" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">${u ? 'Editar Usuário' : 'Novo Usuário'}</h3>
                            <button onclick="fecharModal('modal_usr')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="salvarUsuarioForm(event, '${userId || ''}')" class="p-6 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuário</label>
                                <input type="text" id="usr_login" required value="${u ? escapeHTML(u.usuario) : ''}" ${u ? 'readonly bg-slate-100' : ''} class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome Completo</label>
                                <input type="text" id="usr_nome" required value="${u ? escapeHTML(u.nome) : ''}" class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail</label>
                                <input type="email" id="usr_email" required value="${u ? escapeHTML(u.email) : ''}" class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Perfil</label>
                                <select id="usr_perfil" class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                                    <option value="Admin" ${u && u.perfil === 'Admin' ? 'selected' : ''}>Admin</option>
                                    <option value="Operador" ${u && u.perfil === 'Operador' ? 'selected' : ''}>Operador</option>
                                    <option value="Leitura" ${u && u.perfil === 'Leitura' ? 'selected' : ''}>Leitura</option>
                                </select>
                            </div>
                            ${!u ? `
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Senha Inicial</label>
                                <input type="password" id="usr_senha" required class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                            </div>
                            ` : ''}
                            <div class="flex items-center justify-end gap-2 pt-3 border-t">
                                <button type="button" onclick="fecharModal('modal_usr')" class="px-3 py-1.5 bg-slate-200 rounded text-xs font-bold">Cancelar</button>
                                <button type="submit" class="px-3 py-1.5 bg-teal-600 text-white rounded text-xs font-bold">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarUsuarioForm(e, userId) {
            e.preventDefault();
            const login = document.getElementById('usr_login').value.trim();
            const nome = document.getElementById('usr_nome').value.trim();
            const email = document.getElementById('usr_email').value.trim();
            const perfil = document.getElementById('usr_perfil').value;

            if (userId) {
                const u = db.usuarios.find(x => x.id === userId);
                if (u) {
                    u.nome = nome;
                    u.email = email;
                    u.perfil = perfil;
                    registrarLog('Usuários', 'Edição', `Usuário ${u.usuario} modificado.`);
                }
            } else {
                const senha = document.getElementById('usr_senha').value;
                if (!validarSenhaForte(senha)) {
                    alert('A senha exige no mínimo 8 caracteres (A-Z, a-z, 0-9 e caractere especial)!');
                    return;
                }
                db.usuarios.push({
                    id: 'usr_' + Date.now(),
                    usuario: login,
                    nome: nome,
                    email: email,
                    perfil: perfil,
                    status: 'Ativo',
                    primeiroAcesso: true,
                    senhaHash: senha
                });
                registrarLog('Usuários', 'Criação', `Usuário ${login} criado.`);
            }

            salvarDados(db);
            fecharModal('modal_usr');
            renderApp();
        }

        function toggleStatusUsuario(userId) {
            const u = db.usuarios.find(x => x.id === userId);
            if (u) {
                if (u.id === sessao.usuarioLogado.id) { alert('Não pode inativar o próprio usuário conectado.'); return; }
                u.status = u.status === 'Ativo' ? 'Inativo' : 'Ativo';
                registrarLog('Usuários', 'Status', `Usuário ${u.usuario} alterado para ${u.status}`);
                salvarDados(db);
                renderApp();
            }
        }

        function excluirUsuario(userId) {
            const u = db.usuarios.find(x => x.id === userId);
            if (u) {
                if (u.id === sessao.usuarioLogado.id) { alert('Não pode excluir seu próprio usuário logado.'); return; }
                if (confirm(`Excluir o usuário "${u.usuario}"?`)) {
                    db.usuarios = db.usuarios.filter(x => x.id !== userId);
                    registrarLog('Usuários', 'Exclusão', `Usuário ${u.usuario} removido.`);
                    salvarDados(db);
                    renderApp();
                }
            }
        }

        function renderModalTrocaSenhaObrigatoria() {
            const html = `
                <div id="modal_first" class="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-sm rounded-2xl p-6 text-center space-y-4">
                        <h3 class="font-bold text-slate-800 text-base">Primeiro Acesso Detectado</h3>
                        <p class="text-xs text-slate-500">Cadastre uma nova senha pessoal forte para continuar.</p>
                        <form onsubmit="salvarNovaSenhaPrimeiroAcesso(event)" class="space-y-3 text-left">
                            <input type="password" id="p1" required placeholder="Nova Senha" class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                            <input type="password" id="p2" required placeholder="Confirme a Senha" class="w-full p-2 border rounded text-xs text-slate-900 font-bold">
                            <button type="submit" class="w-full py-2 bg-teal-600 text-white font-bold rounded text-xs">Atualizar e Entrar</button>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function salvarNovaSenhaPrimeiroAcesso(e) {
            e.preventDefault();
            const p1 = document.getElementById('p1').value;
            const p2 = document.getElementById('p2').value;
            if (p1 !== p2) { alert('Senhas não coincidem!'); return; }
            if (!validarSenhaForte(p1)) { alert('Senha fraca! Use 8+ caracteres, maiúscula, número e símbolo.'); return; }

            const u = db.usuarios.find(x => x.id === sessao.usuarioLogado.id);
            if (u) {
                u.senhaHash = p1;
                u.primeiroAcesso = false;
                sessao.usuarioLogado.primeiroAcesso = false;
                salvarDados(db);
                fecharModal('modal_first');
                iniciarMonitorInatividade();
                renderApp();
                setTimeout(iniciarTourGuiado, 500);
            }
        }

        function renderModalAuditLog(moduloKey = '') {
            const logs = moduloKey ? db.logs.filter(l => l.modulo.toLowerCase() === moduloKey.toLowerCase()) : db.logs;
            const html = `
                <div id="modal_audit" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[80vh]">
                        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 class="font-bold text-sm">Histórico de Auditoria ${moduloKey ? `- ${MODULE_NAMES[moduloKey] || moduloKey}` : ''}</h3>
                            <button onclick="fecharModal('modal_audit')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-4 overflow-y-auto flex-1">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 font-bold border-b">
                                    <tr>
                                        <th class="p-2">Data/Hora</th>
                                        <th class="p-2">Módulo</th>
                                        <th class="p-2">Ação</th>
                                        <th class="p-2">Usuário</th>
                                        <th class="p-2">Detalhes</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${logs.map(l => `
                                        <tr>
                                            <td class="p-2 text-slate-500">${escapeHTML(l.dataHora)}</td>
                                            <td class="p-2 font-bold">${escapeHTML(l.modulo)}</td>
                                            <td class="p-2 font-bold text-teal-700">${escapeHTML(l.acao)}</td>
                                            <td class="p-2 font-semibold">${escapeHTML(l.usuario)}</td>
                                            <td class="p-2 text-slate-600">${escapeHTML(l.detalhe)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function renderAuditLogView() {
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 font-bold border-b">
                            <tr>
                                <th class="p-3">Data/Hora</th>
                                <th class="p-3">Módulo</th>
                                <th class="p-3">Ação</th>
                                <th class="p-3">Usuário</th>
                                <th class="p-3">Descrição</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${db.logs.map(l => `
                                <tr>
                                    <td class="p-3 text-slate-500">${escapeHTML(l.dataHora)}</td>
                                    <td class="p-3 font-bold">${escapeHTML(l.modulo)}</td>
                                    <td class="p-3 font-bold text-teal-700">${escapeHTML(l.acao)}</td>
                                    <td class="p-3 font-semibold">${escapeHTML(l.usuario)}</td>
                                    <td class="p-3 text-slate-600">${escapeHTML(l.detalhe)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function fecharModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessao.usuarioLogado) iniciarMonitorInatividade();
            renderApp();
        });
    </script>
</body>
</html>
